openapi: 3.1.0
info:
  title: Fluxion REST API
  version: 1.0.0
  summary: REST API for the Fluxion building energy modeling engine
  description: |
    Issue #1342 — REST deployment surface for Fluxion. Mirrors the canonical
    `SimulationSchema` contract documented in `src/api/schema.rs`. All endpoints
    are versioned under `/v1` and use plain JSON or YAML; no streaming, no
    websockets, no auth in this MVP (deferred).

    Complementary to the MCP server closed in #1185 — REST is the
    CI/webhook/multi-user surface, MCP remains the in-agent surface.
  contact:
    name: Fluxion Maintainers
    url: https://github.com/anchapin/fluxion
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local default (FLUXION_REST_BIND=0.0.0.0, FLUXION_REST_PORT=8080)

tags:
  - name: health
    description: Liveness probe
  - name: observability
    description: Operational telemetry (Issue #1447) — Prometheus metrics
  - name: spec
    description: OpenAPI metadata
  - name: simulate
    description: Run a Fluxion simulation against a schema
  - name: schema
    description: Retrieve previously imported or stored schemas
  - name: import
    description: Convert external model files into a Fluxion SimulationSchemaV1

paths:
  /v1/healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 with a static JSON payload. Does not ping downstream services.
      operationId: healthz
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: 1.0.0

  /v1/openapi.json:
    get:
      tags: [spec]
      summary: OpenAPI document (envelope)
      description: |
        Returns a JSON envelope `{ "openapi": "3.1.0", "spec": "<yaml>" }`.
        Prefer `/v1/openapi.yaml` for direct swagger-cli consumption.
      operationId: getOpenapiJson
      responses:
        "200":
          description: OpenAPI 3.1 document (envelope)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/openapi.yaml:
    get:
      tags: [spec]
      summary: OpenAPI 3.1 document (raw YAML)
      description: |
        Hand-authored YAML mirror of `src/api/openapi.yaml`. Suitable for
        `npx @apidevtools/swagger-cli validate`.
      operationId: getOpenapiYaml
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string

  /v1/metrics:
    get:
      tags: [observability]
      summary: Prometheus exposition for `/v1/metrics` scraping
      description: |
        Returns the in-process Prometheus metrics counter and histogram
        snapshots in text exposition format. Designed to be scraped on a
        regular interval by Prometheus or a drop-in scraper.

        Records per Issue #1447:

        - `fluxion_rest_requests_total{route,method,status}` (counter)
        - `fluxion_rest_request_duration_seconds{route,method}` (histogram)
        - `fluxion_rest_errors_total{route,method,status}` (counter,
          emitted when the response status is 4xx or 5xx)

        The `route` label is the matched route pattern (for example
        `/v1/simulate` or `/v1/schema/:id`), not the literal request path,
        so traffic is not fragmented across label values.

        This endpoint is exempt from `x-request-id` propagation (it is the
        scraper itself and there is no client to correlate). It still emits
        the request-id header for symmetric downstream tooling.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - |
                    # HELP fluxion_rest_requests_total Total number of HTTP requests handled by the Fluxion REST API.
                    # TYPE fluxion_rest_requests_total counter
                    fluxion_rest_requests_total{method="GET",route="/v1/healthz",status="200"} 42
                    # HELP fluxion_rest_request_duration_seconds Wall-clock duration of HTTP requests served by the Fluxion REST API.
                    # TYPE fluxion_rest_request_duration_seconds histogram
                    fluxion_rest_request_duration_seconds_bucket{method="GET",route="/v1/healthz",le="0.005"} 42

  /v1/simulate:
    post:
      tags: [simulate]
      summary: Run a Fluxion simulation
      description: |
        Accepts a `SimulationSchemaV1` (either bare or wrapped in the
        versioned `SimulationSchema` envelope) and returns heating and
        cooling energy plus the standard `SimulationOutput` block.

        The simulation result is guaranteed to match an in-process Rust call
        against the same schema within floating-point noise (<0.1% on
        heating_energy_kwh + cooling_energy_kwh). The schema is auto-stored
        and the returned `schema_id` can be used with `GET /v1/schema/{id}`
        for retrieval.
      operationId: simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
            examples:
              default_one_zone:
                summary: 1-zone, 1-year analytical run
                value:
                  version: "V1"
                  metadata:
                    name: "single-zone-demo"
                    description: "Demo"
                    schema_version: "V1"
                  geometry:
                    zones:
                      - name: "Zone 1"
                        floor_area: 48.0
                        volume: 129.6
                        height: 2.7
                    total_floor_area: 48.0
                    total_volume: 129.6
                    number_of_floors: 1
                    floor_height: 2.7
                  constructions:
                    wall:
                      name: "Default Wall"
                      layers:
                        - name: "Plasterboard"
                          conductivity: 0.16
                          density: 950.0
                          specific_heat: 840.0
                          thickness: 0.012
                        - name: "Fiberglass"
                          conductivity: 0.04
                          density: 12.0
                          specific_heat: 840.0
                          thickness: 0.066
                        - name: "Wood siding"
                          conductivity: 0.14
                          density: 500.0
                          specific_heat: 1300.0
                          thickness: 0.009
                      window:
                        window_area: 12.0
                        window_u_value: 1.5
                        window_shgc: 0.3
                    roof:
                      name: "Default Roof"
                      layers:
                        - name: "Plasterboard"
                          conductivity: 0.16
                          density: 950.0
                          specific_heat: 840.0
                          thickness: 0.012
                      window: null
                    floor:
                      name: "Default Floor"
                      layers:
                        - name: "Wood siding"
                          conductivity: 0.14
                          density: 500.0
                          specific_heat: 1300.0
                          thickness: 0.009
                      window: null
                  schedules:
                    occupancy:
                      kind: weekly
                      name: "Occupancy"
                    lighting:
                      kind: weekly
                      name: "Lighting"
                    hvac:
                      kind: constant
                      heating_setpoint: 20.0
                      cooling_setpoint: 24.0
                    infiltration: null
                  weather:
                    type: tmy
                    location: "Denver, CO"
                  controls:
                    zone_control:
                      heating_setpoint: 20.0
                      cooling_setpoint: 24.0
                      deadband_tolerance: 0.5
                      heating_capacity: 100000.0
                      cooling_capacity: 100000.0
                  output:
                    eui: 0.0
                    total_energy: 0.0
                    peak_heating_load: 3500.0
                    peak_cooling_load: 1200.0
                    heating_energy: 0.0
                    cooling_energy: 0.0
                    zone_temperatures: null
                    hourly_zone_temperatures: null
                  options:
                    years: 1
                    use_surrogates: false
      responses:
        "200":
          description: Simulation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResponse"
        "400":
          $ref: "#/components/responses/InvalidSchema"
        "500":
          $ref: "#/components/responses/SimulationFailed"

  /v1/simulate/stream:
    post:
      tags: [simulate]
      summary: Run a Fluxion simulation with streaming results
      description: |
        Accepts a `SimulationSchemaV1` (either bare or wrapped in the
        versioned `SimulationSchema` envelope) and streams hourly zone
        temperatures as SSE events as the simulation progresses.

        Each SSE event contains one timestep's zone temperatures.
        The simulation runs asynchronously and the stream closes when complete.
      operationId: simulateStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: SSE stream of timestep results
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidSchema"
        "500":
          $ref: "#/components/responses/SimulationFailed"

  /v1/batch:
    post:
      tags: [simulate]
      summary: Run multiple Fluxion simulations concurrently
      description: |
        Accepts an array of `SimulateRequest` bodies and runs them
        concurrently using rayon. Returns all results in a single response.

        A batch of 10 simulations should complete within 2x the wall-clock
        time of a single simulation.
      operationId: batchSimulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: All batch simulations completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "400":
          $ref: "#/components/responses/InvalidSchema"
        "500":
          $ref: "#/components/responses/SimulationFailed"

  /v1/simulation/{id}/status:
    get:
      tags: [simulate]
      summary: Poll for async simulation completion
      description: |
        Returns the current state of an async simulation identified by `id`.
        States: `pending`, `running`, `completed`, `failed`.

        Clients should poll this endpoint to check when a streaming simulation
        has completed. The status is updated within 5 seconds of state changes.
      operationId: getSimulationStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Simulation identifier, e.g. `sim-0`, `sim-42`
          schema:
            type: string
      responses:
        "200":
          description: Simulation status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationStatus"
        "404":
          $ref: "#/components/responses/SimulationNotFound"

  /v1/schema/{id}:
    get:
      tags: [schema]
      summary: Retrieve a previously stored schema
      description: |
        Returns the `SimulationSchemaV1` stored under the given id. Schemas
        are stored by `POST /v1/simulate` (auto-store) or `POST /v1/import/*`.
        Storage is process-local; restarting the server clears the store.
      operationId: getSchema
      parameters:
        - name: id
          in: path
          required: true
          description: Schema identifier, e.g. `sch-0`, `sch-42`
          schema:
            type: string
      responses:
        "200":
          description: Schema found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationSchemaV1"
        "404":
          $ref: "#/components/responses/SchemaNotFound"

  /v1/import/{fmt}:
    post:
      tags: [import]
      summary: Import an external model file
      description: |
        Body is the raw file bytes (no multipart envelope). The `{fmt}` path
        parameter selects the decoder:

        - `osm` — OpenStudio Model (delegates to `crate::interop::osm::import_osm`)
        - `gbxml` — gbXML (delegates to `crate::interop::gbxml::import_gbxml`)
        - `ifc` — IFC4 STEP physical file (delegates to `crate::interop::ifc::import_ifc`)
        - `idf` — EnergyPlus IDF text (delegates to `crate::io::idf::IdfParser::from_str`)
        - `epjson` — EnergyPlus epJSON (JSON representation of IDF; delegates to
          `crate::io::idf::IdfParser::from_epjson_str`)

        On success, the schema is stored under an auto-generated id and the
        id + schema are returned. Callers can fetch the schema later via
        `GET /v1/schema/{id}` or re-run it via `POST /v1/simulate`.
      operationId: importFormat
      parameters:
        - name: fmt
          in: path
          required: true
          description: Source format (`osm`, `gbxml`, `ifc`, `idf`, or `epjson`)
          schema:
            type: string
            enum: [osm, gbxml, ifc, idf, epjson]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Schema imported and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/UnsupportedFormat"
        "422":
          $ref: "#/components/responses/ImportFailed"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  responses:
    InvalidSchema:
      description: Schema failed validation (missing fields, bad ranges, ...)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SchemaNotFound:
      description: No schema under the given id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedFormat:
      description: The `{fmt}` path parameter was not a recognized format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ImportFailed:
      description: The import reader rejected the file
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotImplemented:
      description: The requested operation is not yet implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SimulationFailed:
      description: Internal simulation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SimulationNotFound:
      description: No simulation under the given id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              enum:
                - invalid_schema
                - schema_not_found
                - simulation_not_found
                - unsupported_format
                - not_implemented
                - import_failed
                - simulation_failed
                - empty_batch
            message:
              type: string
            diagnostics:
              description: |
                Machine-readable divergence diagnostics. Present only when
                `kind == simulation_failed` and the failure was a divergence
                (NaN, infinite temperature, energy-balance violation). Issue #2547.
              allOf:
                - $ref: "#/components/schemas/SimulationDiagnostics"

    SimulationDiagnostics:
      type: object
      description: |
        Divergence attribution populated from the per-timestep temperature
        trace and energy-balance residual the simulation already computes.
        Issue #2547.
      properties:
        failing_timestep:
          type: integer
          format: int64
          minimum: 0
          description: First 0-based hourly timestep at which divergence was detected.
        failing_zone:
          type: [string, "null"]
          description: |
            0-based zone label (e.g. `zone_0`) attributed with the divergence,
            or `null` for whole-system residuals / single-zone models.
        max_residual_pct:
          type: number
          format: double
          minimum: 0
          description: |
            Worst energy-balance residual across the run, as a percentage of
            the tolerance window. `0.0` when divergence was detected by
            NaN/inf scan rather than the residual check.
        last_known_good_timestep:
          type: integer
          format: int64
          minimum: 0
          description: Last timestep for which the simulation was finite and balanced.

    SimulateOptions:
      type: object
      properties:
        years:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        use_surrogates:
          type: boolean
          default: false
        store_as:
          type: [string, "null"]
          description: |
            Optional explicit id under which to store the schema. If absent,
            the server auto-assigns an id and returns it in the response.

    SimulateRequest:
      type: object
      description: |
        Accepts either a bare `SimulationSchemaV1` or the version-tagged
        `SimulationSchema` envelope. The `options` field is optional.
      required: [geometry, constructions, schedules, weather, controls]
      properties:
        version:
          type: string
          enum: [V1]
        metadata:
          $ref: "#/components/schemas/SchemaMetadata"
        geometry:
          $ref: "#/components/schemas/Geometry"
        constructions:
          $ref: "#/components/schemas/ConstructionSet"
        schedules:
          $ref: "#/components/schemas/ScheduleSet"
        weather:
          $ref: "#/components/schemas/WeatherData"
        controls:
          $ref: "#/components/schemas/ControlSet"
        output:
          $ref: "#/components/schemas/SimulationOutput"
        options:
          $ref: "#/components/schemas/SimulateOptions"

    SimulateResponse:
      type: object
      required: [output]
      properties:
        schema_id:
          oneOf:
            - type: string
            - type: "null"
          description: |
            id of the stored schema. Always non-null because `POST /v1/simulate`
            auto-stores the schema so callers can retrieve it via `GET /v1/schema/{id}`.
        output:
          $ref: "#/components/schemas/SimulationOutput"

    ImportResponse:
      type: object
      required: [schema_id, schema]
      properties:
        schema_id:
          type: string
        schema:
          $ref: "#/components/schemas/SimulationSchemaV1"

    BatchRequest:
      type: object
      required: [simulations]
      properties:
        simulations:
          type: array
          items:
            $ref: "#/components/schemas/SimulateRequest"
          minItems: 1

    BatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SimulateResponse"
              - type: object
                description: Error message for failed simulation
                required: [error]
                properties:
                  error:
                    type: string

    SimulationStatus:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          oneOf:
            - type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [pending]
            - type: object
              required: [state, progress]
              properties:
                state:
                  type: string
                  enum: [running]
                progress:
                  type: number
                  format: float
            - type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [completed]
            - type: object
              required: [state, error]
              properties:
                state:
                  type: string
                  enum: [failed]
                error:
                  type: string
        progress:
          type: number
          format: float
        result:
          oneOf:
            - $ref: "#/components/schemas/SimulateResponse"
            - type: "null"

    TimestepEvent:
      type: object
      required: [timestep, zone_temperatures]
      properties:
        timestep:
          type: integer
        zone_temperatures:
          type: array
          items:
            type: number
            format: double

    # -------------------------------------------------------------------
    # Below: schemas are mirrored from `src/api/schema.rs`. They are kept
    # here verbatim so `swagger-cli validate` can resolve every $ref.
    # Any change to the Rust types MUST be reflected here.
    # -------------------------------------------------------------------

    SchemaVersion:
      type: string
      enum: [V1]

    SchemaMetadata:
      type: object
      required: [name, description, schema_version]
      properties:
        name:
          type: string
        description:
          type: string
        author:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
        schema_version:
          $ref: "#/components/schemas/SchemaVersion"

    ZoneGeometry:
      type: object
      required: [name, floor_area, volume, height]
      properties:
        name:
          type: string
        floor_area:
          type: number
          format: double
        volume:
          type: number
          format: double
        height:
          type: number
          format: double

    Geometry:
      type: object
      required: [zones, total_floor_area, total_volume, number_of_floors, floor_height]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneGeometry"
        total_floor_area:
          type: number
          format: double
        total_volume:
          type: number
          format: double
        number_of_floors:
          type: integer
          minimum: 0
        floor_height:
          type: number
          format: double

    WindowSpec:
      type: object
      required: [window_area, window_u_value, window_shgc]
      properties:
        window_area:
          type: number
          format: double
        window_u_value:
          type: number
          format: double
        window_shgc:
          type: number
          format: double

    ConstructionLayer:
      type: object
      required: [name, conductivity, density, specific_heat, thickness]
      properties:
        name:
          type: string
        conductivity:
          type: number
          format: double
        density:
          type: number
          format: double
        specific_heat:
          type: number
          format: double
        thickness:
          type: number
          format: double

    SurfaceConstruction:
      type: object
      required: [name, layers]
      properties:
        name:
          type: string
        layers:
          type: array
          items:
            $ref: "#/components/schemas/ConstructionLayer"
        window:
          oneOf:
            - $ref: "#/components/schemas/WindowSpec"
            - type: "null"

    ConstructionSet:
      type: object
      required: [wall, roof, floor]
      properties:
        wall:
          $ref: "#/components/schemas/SurfaceConstruction"
        roof:
          $ref: "#/components/schemas/SurfaceConstruction"
        floor:
          $ref: "#/components/schemas/SurfaceConstruction"
        interzone:
          oneOf:
            - $ref: "#/components/schemas/SurfaceConstruction"
            - type: "null"

    DailySchedule:
      type: object
      description: Free-form; see `src/sim/schedule.rs` for full schema
      additionalProperties: true

    HVACSchedule:
      type: object
      description: Free-form; see `src/sim/schedule.rs` for full schema
      additionalProperties: true

    ScheduleSet:
      type: object
      required: [occupancy, lighting, hvac]
      properties:
        occupancy:
          $ref: "#/components/schemas/DailySchedule"
        lighting:
          $ref: "#/components/schemas/DailySchedule"
        hvac:
          $ref: "#/components/schemas/HVACSchedule"
        infiltration:
          oneOf:
            - $ref: "#/components/schemas/DailySchedule"
            - type: "null"

    WeatherData:
      oneOf:
        - type: object
          required: [type, path]
          properties:
            type:
              type: string
              enum: [epw]
            path:
              type: string
          additionalProperties: false
        - type: object
          required: [type, location]
          properties:
            type:
              type: string
              enum: [tmy]
            location:
              type: string
          additionalProperties: false
        - type: object
          required: [type, hourly_data]
          properties:
            type:
              type: string
              enum: [inline]
            hourly_data:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: false

    ControlConfig:
      type: object
      required:
        - heating_setpoint
        - cooling_setpoint
        - deadband_tolerance
        - heating_capacity
        - cooling_capacity
      properties:
        heating_setpoint:
          type: number
          format: double
        cooling_setpoint:
          type: number
          format: double
        deadband_tolerance:
          type: number
          format: double
        heating_capacity:
          type: number
          format: double
        cooling_capacity:
          type: number
          format: double

    ControlSet:
      type: object
      required: [zone_control]
      properties:
        zone_control:
          $ref: "#/components/schemas/ControlConfig"
        global_control:
          oneOf:
            - $ref: "#/components/schemas/ControlConfig"
            - type: "null"

    SimulationOutput:
      type: object
      required:
        - eui
        - total_energy
        - peak_heating_load
        - peak_cooling_load
        - heating_energy
        - cooling_energy
      properties:
        eui:
          type: number
          format: double
        total_energy:
          type: number
          format: double
        peak_heating_load:
          type: number
          format: double
          minimum: 0
          description: Peak heating demand observed during the run, in Watts. Defaults to 0.0 when no heating demand occurs.
        peak_cooling_load:
          type: number
          format: double
          minimum: 0
          description: Peak cooling demand observed during the run, in Watts. Defaults to 0.0 when no cooling demand occurs.
        heating_energy:
          type: number
          format: double
        cooling_energy:
          type: number
          format: double
        zone_temperatures:
          type: [array, "null"]
          items:
            type: number
            format: double
        hourly_zone_temperatures:
          type: [array, "null"]
