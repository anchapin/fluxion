[package]
name = "fluxion-city"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "Urban radiation modeling with Nusselt analog view factor computation for building energy modeling"
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[dependencies]
thiserror.workspace = true
serde.workspace = true
approx = "0.5"
faer = { workspace = true, features = ["default"] }
num-traits = "0.2"
rand = "0.9"
rayon = { workspace = true, optional = true }
petgraph = { version = "0.8", features = ["serde-1"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
default = []
parallel = ["rayon"]

[dev-dependencies]
criterion = "0.8"
sysinfo = "0.39"

[[bench]]
name = "parallel_harness"
harness = false
required-features = ["parallel"]

[[bench]]
name = "view_factor_perf"
harness = false

[[bench]]
name = "city_benches"
harness = false
