# Issue #2690 / #2757 — supply-chain: rumqttc was previously redirected via a
# `[patch.crates-io]` entry to a fork on a *personal* GitHub account
# (anchapin/rumqtt, branch `fix/rustsec-2026-webpki`). A floating branch on a
# personal account bypasses crates.io provenance entirely and is an
# unacceptable supply-chain exposure, so the patch has been removed.
# `fluxion-twin` now consumes the official crates.io release (`rumqttc = "0.25"`
# → 0.25.1) like the rest of the workspace.
#
# Trade-off (tracked): the official rumqttc 0.25.1 still declares
# `rustls-webpki = "^0.102.8"` under its `use-rustls` feature, so four
# CRL / name-constraint advisories on that copy (RUSTSEC-2026-0049, -0098,
# -0099, -0104; fixed in rustls-webpki >= 0.103.10 / 0.103.12 / 0.103.13)
# re-surface transiently until upstream publishes a fixed release. No patched
# 0.102.x exists on crates.io (0.102.8 is the last 0.102 release), so they
# cannot be cleared without an upstream rumqttc release. The
# `[advisories].ignore` entries in `.cargo/audit.toml` and `deny.toml`
# carry this temporarily with explicit removal conditions (depth, scope,
# upstream tracking, `>>> REMOVE` conditions — see #2757 / PR #2847
# pattern). The same root cause surfaces the RUSTSEC-2025-0134
# (rustls-pemfile unmaintained) ignore above (#2797); both clusters clear
# together when upstream publishes a rumqttc release that drops the 0.102.x
# webpki and the rustls-pemfile transitive.
#
# Upstream tracking:
#   - https://github.com/bytebeamio/rumqtt/issues/1067  (advisory report)
#   - https://github.com/bytebeamio/rumqtt/pull/1037     (open PR: bump
#     rustls-webpki + tokio-rustls)
# When a fixed rumqttc is published on crates.io, bump `rumqttc = "0.25"` to
# that version in `crates/fluxion-twin/Cargo.toml` and remove the matching
# `.cargo/audit.toml` and `deny.toml` ignore entries + this comment.
