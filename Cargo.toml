[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
split-debuginfo = "packed"
strip = true

# Optimize for CI: reduce memory usage during release builds
# Use thin LTO and more codegen units to prevent OOM/SIGSEGV

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profile-Guided Optimization build (issue #2563).
# The actual instrumentation flags (-Cprofile-generate / -Cprofile-use)
# are passed via RUSTFLAGS by scripts/build_pgo.sh — Cargo profiles
# cannot express PGO directly. The settings below are the
# profile-use-friendly defaults: same opt-level as release, but with
# full LTO + 1 codegen-unit so the optimiser sees the whole program
# after it has been tuned by the merged profile data.
[profile.release-pgo]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# PGO only works when debug assertions are stripped — the PGO
# instrumentation hooks themselves depend on it.
debug = false

# Fast CI build profile — use with `cargo test --profile ci`
# Balances compile speed against runtime speed:
#   opt-level=1   — significantly faster to compile than release (3), yet exercises
#                   more code paths than pure debug (0); avoids misoptimisation bugs
#   debug=0       — no debug info → smaller artifacts, faster linker invocation
#   codegen-units — maximum parallelism to saturate CI runner cores
#   incremental   — disabled: clean CI builds don't reuse incremental state
[profile.ci]
inherits = "dev"
opt-level = 1
debug = 0
codegen-units = 256
incremental = false

# Compile proc-macro crates (serde, clap, pyo3-derive, etc.) at opt-level=3
# even in dev/ci builds. Proc-macros run at compile time, so optimising them
# speeds up every downstream incremental build.
[profile.dev.build-override]
opt-level = 3

