[package]
name = "fluxion"
version = "1.0.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "A differentiable, AI-accelerated Building Energy Modeling engine with multi-zone support."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

# =============================================================================
# Workspace (#1255 — crate split to enable cargo-mutants in CI)
# =============================================================================
# The workspace root is also the main `fluxion` package (src/ lives here).
# `fluxion-core` holds the dependency-light *leaf* modules (currently `weather`)
# that cargo-mutants can build once and cache while mutating only `fluxion`.
[workspace]
resolver = "2"
members = ["fluxion-core", "fluxion-city", "fluxion-fluid", "fluxion-grid", "fluxion-behavior", "fluxion-mcp", "fluxion-wasm", "crates/fluxion-toon", "crates/fluxion-twin"]
# Default to the root package so bare `cargo build`/`cargo test` build `fluxion`.
default-members = ["."]

# Locate the shared workspace lockfile at the workspace root.
[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"

# Exclude large files/dirs from crate distribution - only src/ is needed
# This reduces package from 79MB to ~4MB (well under 10MB crates.io limit)
exclude = [
    "fluxion-core/",
    "refdata/",
    "assets/",
    "tests/",
    "docs/",
    ".github/",
    ".githooks/",
    ".planning/",
    "tools/",
    "benches/",
    "examples/",
    "Dockerfile",
    "docker-compose.yml",
    "delta_config.yaml",
    "*.md",
    "Cargo.lock",
]

[lib]
name = "fluxion"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Feature flag to enable Python bindings (disabled by default for pure Rust testing)
python-bindings = ["dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]
# Feature flag to enable Node.js/NAPI bindings (disabled by default for pure Rust testing)
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# ONNX Runtime support (issue #1294). When disabled (the default), the crate does
# not compile `ort` and src/ai/surrogate exposes only the mock / analytical fallback.
# Opt in for AI surrogate inference, the ASHRAE ONNX tests, or mutation testing.
ort = ["dep:ort"]
# Alias for `ort` (issue #1294 requested feature naming).
onnx = ["ort"]
# CUDA / TensorRT execution providers for `ort` (issue #1294). Implies `ort`.
cuda = ["ort", "ort/cuda", "ort/tensorrt"]
# Feature flag for wiring tracing in integration tests (Plan 21-10)
wiring-tracing = []
# Feature flag for multi-zone support
multi-zone = []
# Feature flag for ASHRAE 140 v2021 support
ashrae_140_v2021 = []
# Feature flag for PR #821 diagnostics (writes hourly CSVs for 600FF/650FF debugging)
pr821-diag = []
# Feature flag for loom concurrency testing (Issue #1065)
# Run with: LOOM=1 cargo test --features loom --test loom_concurrency_tests
loom = []
# Feature flag for D-Wave quantum annealer integration (Phase 2c — issue #1609).
# Requires DWAVE_API_TOKEN environment variable at runtime.
# Uses the D-Wave SAPI REST API (the same API underlying the Python dimod library).
# Run with: cargo test --features dwave -p fluxion quantum::dwave_client
dwave = []
# Feature flag to gate unconditional debug eprintln! calls in physics hot loops (issue #1967)
debug-physics = []
# Feature flag for Kafka telemetry consumer (issue #2056).
# Enables rdkafka-based Kafka consumer for enterprise-scale telemetry ingestion.
# Run with: cargo test --features kafka -p fluxion twin::kafka_telemetry_consumer
kafka = ["dep:rdkafka"]
# Feature flag for acausal HVAC / fluid network modeling (Issue #1980 / ADR-005).
# Gates the `fluxion-fluid` crate which provides port-based fluid circuit traits.
fluid = ["dep:fluxion-fluid"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(docsrs,test)", "cfg(gil_refs)"] }

[dependencies]
# Workspace sibling crate (#1255): leaf modules built once & cached by cargo-mutants.
fluxion-core = { path = "fluxion-core", version = "1.0.0" }

# Optional acausal HVAC / fluid network crate (Issue #1980 / ADR-005).
# Compile with --features fluid to enable fluid port types and network topology.
fluxion-fluid = { path = "fluxion-fluid", version = "1.0.0", optional = true }

# Core Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"

# Logging
log = "0.4"
tracing = "0.1"  # TDQS decision hooks (Issue #708)
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Date/time handling for reports
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for LiveTwin (Issue #2025)
uuid = { version = "1.10", features = ["serde", "v4"] }

# HTTP client and caching for weather downloads
directories = "5.0"
sha2 = "0.10"

# Numerical & Math
faer = { version = "0.23.2", default-features = false, features = ["std"] }
nalgebra = "0.34"  # Linear algebra - matrix operations
uom = "0.35"  # Units of measurement - dimensional analysis
# ndarray 0.16 uses pulp 0.21+ which has fixed the size assertion issue with num-complex
ndarray = { version = "0.16", default-features = false, features = ["std", "serde"] }
num-complex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parallelism
rayon = "1.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
parking_lot = "0.12"
once_cell = "1.21"
lazy_static = "1.4.0"
num_cpus = "1.16"

# Plotting for validation reports
plotters = "0.3.5"

# Random number generation for uncertainty quantification
rand = "0.8"
rand_distr = "0.4"

# Mathematical special functions (erf) for inverse CDF computation
libm = "0.2"

# Statistical computing for validation metrics
statrs = "0.18.0"

# AI / Machine Learning Integration
# Using 2.0.0-rc.10 (prerelease) as stable 1.20 is not available on crates.io.
# Gated behind the `ort` feature (issue #1294) so the default build (no features)
# does not pull in the ONNX runtime. The mutation-testing workflow opts in via
# `--features ort`; default Rust builds stay small and fast.
ort = { version = "2.0.0-rc.10", features = ["download-binaries"], optional = true }

# Python Interop
pyo3 = { version = "0.22", features = ["extension-module", "auto-initialize", "abi3-py310"], optional = true }
numpy = { version = "0.22", optional = true }

# Node.js/NAPI Interop
napi = { version = "3", features = ["napi8", "serde-json", "async"], optional = true }
napi-derive = { version = "3", optional = true }
napi-build = { version = "2", optional = true }

crossbeam = "0.8.4"
num-traits = "0.2.19"

# HTTP client for multi-reference updates
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# OpenStudio OSM file parsing/serialization
# XML parsing for gbXML import/export
quick-xml = "0.41"

# REST API server (Issue #1342). Async HTTP server with typed extractors
# and ergonomic routing. Stays on tokio 1.x — already in our dep tree above.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
native-tls = "0.2"
async-trait = "0.1"

# Observability for fluxion-rest (Issue #1447):
#   - `tower-http` brings `TraceLayer` and `RequestId`/`PropagateRequestId`
#     middleware so every response carries an `x-request-id` header and every
#     request emits a structured log line via `tracing`.
#   - `metrics` is the facade; counters and histograms go through the macros
#     and the global recorder (set up in `src/api/server.rs`).
#   - `metrics-exporter-prometheus` with `default-features = false` keeps the
#     dependency surface narrow — we only need the encoder and the in-process
#     `PrometheusHandle` (no HTTP listener, no push-gateway, no protobuf), and
#     we serve `/v1/metrics` from the axum router using `handle.render()`.
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ZIP archive writer for FMI 2.0 FMU packaging (#1339)
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# JSON Patch (RFC 6902) — Issue #1811 / Phase 1 (Declarative Deltas)
# of the Hybrid Measure Approach. Used by `fluxion::measures::json_patch`
# to apply declarative Deltas to a `FluxionModel` without invoking Python.
# `default-features = false` drops the `diff` feature (we don't generate
# patches, only consume them). License: MIT/Apache-2.0.
json-patch = { version = "4.2", default-features = false }

# WebSocket support for LiveTwin (Issue #2025)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = "0.26"

# MessagePack binary serialization for LiveTwin (Issue #2025)
rmp-serde = "1.3"

# Kafka telemetry consumer for enterprise-scale telemetry ingestion (issue #2056).
# Uses rdkafka with dynamic library linking. Enable the `kafka` feature to compile.
rdkafka = { version = "0.36", features = ["dynamic-linking"], optional = true }

# SQLite for reporting output (issue #1904)
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
pyo3-build-config = { version = "0.22", optional = true }
napi-build = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
approx = "0.5"
rstest = "0.25"
dhat = "0.3"
proptest = "1.5"
noisy_float = "0.2"

# TOON serialization for round-trip testing (Issue #2071)
fluxion-toon = { path = "crates/fluxion-toon" }

# Mock HTTP server for tests
mockito = "1.7"

# Loom for concurrency and race condition testing (Issue #1065)
# Run with: LOOM=1 cargo test --features loom --test loom_concurrency_tests
loom = "0.1"

# SQLite for reproducer tests (Issue #1790)
# Demonstrates the "database is locked" race condition in distributed array jobs
rusqlite = { version = "0.31", features = ["bundled"] }

# Memory stats for LiveTwin memory leak test (Issue #2064)
memory-stats = "1.0"

