[package]
name = "fluxion"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "A differentiable, AI-accelerated Building Energy Modeling engine with multi-zone support."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

# =============================================================================
# Workspace (#1255 — crate split to enable cargo-mutants in CI)
# =============================================================================
# The workspace root is also the main `fluxion` package (src/ lives here).
# `fluxion-core` holds the dependency-light *leaf* modules (currently `weather`)
# that cargo-mutants can build once and cache while mutating only `fluxion`.
[workspace]
resolver = "2"
members = ["fluxion-core", "fluxion-city", "fluxion-fluid", "fluxion-grid", "fluxion-behavior", "fluxion-mcp", "fluxion-wasm", "crates/fluxion-toon", "crates/fluxion-twin", "fluxion-cfd", "fluxion-tauri/src-tauri"]
# Default to the root package so bare `cargo build`/`cargo test` build `fluxion`.
default-members = ["."]

# Locate the shared workspace lockfile at the workspace root.
[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"

# Exclude large files/dirs from crate distribution - only src/ is needed
# This reduces package from 79MB to ~4MB (well under 10MB crates.io limit)
exclude = [
    "fluxion-core/",
    "refdata/",
    "assets/",
    "tests/",
    "docs/",
    ".github/",
    ".githooks/",
    ".planning/",
    "tools/",
    "benches/",
    "examples/",
    "Dockerfile",
    "docker-compose.yml",
    "delta_config.yaml",
    "*.md",
    "Cargo.lock",
]

# =============================================================================
# Workspace dependencies (#2775 — centralize shared dep versions to stop
# cross-crate version drift producing duplicate-crate resolutions).
# =============================================================================
# Versions are declared ONCE here; every member consumes them via
# `dep.workspace = true`. This stops the drift that produced duplicate-crate
# resolutions (notably ndarray 0.16/0.17 between fluxion-cfd and the root crate)
# and inconsistent floors (uuid pinned anywhere from "1.0" to "1.10"; faer "0.23"
# vs "0.23.2"). Members RETAIN their own `features` / `default-features`, so
# per-crate feature sets are unchanged — only the version floor is unified.
# Drifting deps beyond the issue's required list (faer/ndarray/nalgebra/uuid/
# tokio/serde/thiserror/reqwest/tracing/metrics) are also covered: rayon
# (1.8 in fluxion-city vs 1.10 elsewhere).
[workspace.dependencies]
# faer: the minimal floor is `std` + `default-features = false` (root & fluxion-cfd
# use only basic `Mat` ops). fluxion-city additionally needs the `sparse`/`linalg`
# feature groups, so it re-enables faer's `default` feature group at its call site.
faer = { version = "0.24.4", default-features = false, features = ["std"] }
# ndarray: every consumer disables default features; members add `std`/`serde`.
ndarray = { version = "0.17", default-features = false }
nalgebra = "0.35"
uuid = "1.10"
tokio = "1.40"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tracing = "0.1"
metrics = "0.24"
rayon = "1.10"

[lib]
name = "fluxion"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Feature flag to enable Python bindings (disabled by default for pure Rust testing).
# Links libpython so the resulting binary can initialize a Python interpreter
# (needed for `cargo test --features python-bindings`).
python-bindings = ["dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]
# Build the crate as a Python extension module (no libpython link; the host
# interpreter provides the CPython symbols at load time). Enable this in
# addition to `python-bindings` when building the wheel with maturin. Issue #2532.
python-extension = ["python-bindings", "pyo3/extension-module"]
# Feature flag to enable Node.js/NAPI bindings (disabled by default for pure Rust testing)
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# ONNX Runtime support (issue #1294). When disabled (the default), the crate does
# not compile `ort` and src/ai/surrogate exposes only the mock / analytical fallback.
# Opt in for AI surrogate inference, the ASHRAE ONNX tests, or mutation testing.
ort = ["dep:ort"]
# Alias for `ort` (issue #1294 requested feature naming).
onnx = ["ort"]
# CUDA / TensorRT execution providers for `ort` (issue #1294). Implies `ort`.
cuda = ["ort", "ort/cuda", "ort/tensorrt"]
# CoreML execution provider for `ort` (issue #3313). Implies `ort`. Only
# meaningful on macOS targets, where the prebuilt ONNX Runtime binaries ship
# CoreML support. Runtime validation runbook: docs/ORT_EP_VALIDATION.md.
coreml = ["ort", "ort/coreml"]
# DirectML execution provider for `ort` (issue #3313). Implies `ort`. Only
# meaningful on Windows targets. Runtime validation runbook:
# docs/ORT_EP_VALIDATION.md.
directml = ["ort", "ort/directml"]
# Feature flag for wiring tracing in integration tests (Plan 21-10)
wiring-tracing = []
# Feature flag for multi-zone support
multi-zone = []
# Feature flag for ASHRAE 140 v2021 support
ashrae_140_v2021 = []
# Feature flag for PR #821 diagnostics (writes hourly CSVs for 600FF/650FF debugging)
pr821-diag = []
# Feature flag for loom concurrency testing (Issue #1065)
# Run with: LOOM=1 cargo test --features loom --test loom_concurrency_tests
loom = []
# Feature flag for D-Wave quantum annealer integration (Phase 2c — issue #1609).
# Requires DWAVE_API_TOKEN environment variable at runtime.
# Uses the D-Wave SAPI REST API (the same API underlying the Python dimod library).
# Run with: cargo test --features dwave -p fluxion quantum::dwave_client
dwave = []
# Feature flag to gate unconditional debug eprintln! calls in physics hot loops (issue #1967)
debug-physics = []
# Feature flag to emit structured JSON tracing output from the validation
# module, suitable for ingestion by Loki/Elastic. Enables tracing-subscriber's
# JSON formatter so `cargo test --test ashrae_140_validation --features
# tracing-subscriber-json` produces machine-parseable per-case pass/fail
# events. (Issue #2500)
tracing-subscriber-json = ["tracing-subscriber/json"]
# Feature flag for Kafka telemetry consumer (issue #2056).
# Enables rdkafka-based Kafka consumer for enterprise-scale telemetry ingestion.
# Run with: cargo test --features kafka -p fluxion twin::kafka_telemetry_consumer
kafka = ["dep:rdkafka"]
# Feature flag for acausal HVAC / fluid network modeling (Issue #1980 / ADR-005).
# Gates the `fluxion-fluid` crate which provides port-based fluid circuit traits.
fluid = ["dep:fluxion-fluid"]
# Feature flag for the experimental GaugeZoneSolver zone-level scaffolding
# (Issue #2304). OFF by default.
#
# STATUS (Issue #2686, 2026-08-11): this flag is OPT-IN / EXPERIMENTAL and does
# NOT change the active solver. The `gauge_zone_solver` field on
# `ThermalModelData` is feature-gated but always initialized to `None`, and no
# construction path sets it to `Some`. Even with `--features gauge-solver` the
# routing branch in `step_physics` is unreachable, so the 5R1C / 9R4C
# lumped-capacitance networks remain the primary zone solver in ALL builds. The
# live gauge-theory research path is the per-surface `GaugeSolver` run in shadow
# mode via `PhysicsAdapter` (ARCHITECTURE.md Module 6, #1465 / #1462) — a
# separate struct from this zone-level `GaugeZoneSolver` wrapper.
# Run with: cargo test --features gauge-solver --test ashrae_140_case_600_series
gauge-solver = []
# Feature flag for fluxion-city urban radiation integration (Issue #2344).
# Wires UrbanRadiationSolver into PhysicsSurfaceFluxProvider via
# FluxionCitySurfaceFluxProvider. Requires fluxion-city crate.
fluxion-city = ["dep:fluxion-city"]
# Feature flag for dhat heap profiling (Issue #2384).
# Enables dhat allocation tracking for memory profiling of large simulations.
# Run with: cargo build --features dhat
dhat = ["dep:dhat"]
# Feature flag for fluxion-cfd FFD/CFD co-simulation (Issue #2460).
# Wires `fluxion_cfd::FfdCfdSolver` into `crate::sim::loose_coupling::FfdSolver`
# via `crate::sim::ffd_cfd_adapter::FfdCfdAdapter`. The adapter is the
# production bring-up for the BES-FFD loose-coupling path (ARCHITECTURE.md
# §"Module N+2"). The default CPU solver path in `fluxion-cfd/src/cpu/` is
# sufficient for the regression test; CUDA is not required.
fluxion-cfd = ["dep:fluxion-cfd"]
# Stub feature to allow fluxion-grid to depend on this crate with a fluxion feature.
# fluxion-grid uses dep:fluxion to reference this crate, and this feature exists
# to satisfy the feature resolution when --features fluxion is used at workspace level.
fluxion = []
# Issue #2877 — gates the long-deprecated `MultiNodeHvacRunner` (now
# `DeprecatedMultiNodeHvacRunner`) at `src/sim/multi_node_hvac_runner.rs`.
# The default build does NOT compile this 58.8K dead-code path; opt in
# only when migrating a downstream consumer off the deprecated API.
# See ADR-002 for the canonical 9R4C replacement (`ThermalModel::step_physics`
# → `step_physics_9r4c`).
deprecated-multinode-runner = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(docsrs,test)", "cfg(gil_refs)"] }

[dependencies]
# Workspace sibling crate (#1255): leaf modules built once & cached by cargo-mutants.
fluxion-core = { path = "fluxion-core", version = "1.0.0" }
fluxion-twin = { path = "crates/fluxion-twin", version = "0.1.0" }

# Optional acausal HVAC / fluid network crate (Issue #1980 / ADR-005).
# Compile with --features fluid to enable fluid port types and network topology.
fluxion-fluid = { path = "fluxion-fluid", version = "1.0.0", optional = true }

# Optional fluxion-city urban radiation integration (Issue #2344).
# Compile with --features fluxion-city to enable FluxionCitySurfaceFluxProvider.
fluxion-city = { path = "fluxion-city", version = "0.1.0", optional = true }

# Optional fluxion-cfd FFD/CFD adapter (Issue #2460).
# Compile with --features fluxion-cfd to enable the FfdCfdAdapter that wires
# `fluxion_cfd::FfdCfdSolver` into the loose-coupling FfdSolver trait.
fluxion-cfd = { path = "fluxion-cfd", version = "0.1.0", optional = true }

# Core Logic
serde.workspace = true
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror.workspace = true
csv = "1.3"

# Logging
log = "0.4"
tracing.workspace = true  # TDQS decision hooks (Issue #708)
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Date/time handling for reports
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for LiveTwin (Issue #2025)
uuid = { workspace = true, features = ["serde", "v4"] }

# Weather-download HTTP caching lives in fluxion-core (tmy3.rs), which owns
# the `directories` dependency; the root package carried an unused copy of
# `directories = "5.0"` until #3310 removed it (was a duplicate-version
# offender vs fluxion-core's `directories = "6.0"`).
sha2 = "0.10"

# Numerical & Math
faer = { workspace = true, default-features = false, features = ["std"] }
nalgebra.workspace = true  # Linear algebra - matrix operations
# Aligned with fluxion-fluid's `uom = "0.38"` (#3310) so only one uom version
# resolves across the workspace graph.
uom = "0.38"  # Units of measurement - dimensional analysis
# Inline storage for small collections — backs VectorField's SmallVec<[f64; 4]>
# so the per-timestep hot loop (Issue #2687) stops heap-allocating for ≤4-zone
# models (clone/map/zip_with/constant_like become stack ops). Already a
# transitive dep; pinned to the workspace version (see Cargo.lock).
smallvec = "1.15"
# ndarray 0.16 uses pulp 0.21+ which has fixed the size assertion issue with num-complex
ndarray = { workspace = true, default-features = false, features = ["std", "serde"] }
num-complex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parallelism
rayon.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
parking_lot = "0.12"
once_cell = "1.21"
lazy_static = "1.4.0"
num_cpus = "1.16"

# Plotting for validation reports
plotters = "0.3.5"

# Random number generation for uncertainty quantification
rand = "0.8"
rand_distr = "0.4"

# Mathematical special functions (erf) for inverse CDF computation
libm = "0.2"

# Statistical computing for validation metrics
statrs = "0.18.0"

# AI / Machine Learning Integration
# `ort` (ONNX Runtime bindings, pykeio/ort) has NO stable 2.0 release on crates.io
# yet — we track the RC exactly (currently rc.13, issue #2691). rc.13 renamed the
# execution-provider structs (e.g. `CUDAExecutionProvider` → `CUDA`) and moved them
# to `ort::ep`; the `--features cuda` call sites were ported accordingly
# (src/ai/surrogate.rs, src/ai/rl_policy.rs). The pin stays behind the `ort`
# feature (issue #1294) so the default build does not pull in the ONNX runtime;
# `fluxion-behavior` also makes `ort` opt-in (issue #2691) so the RC is not
# pulled into every consumer. When `ort` 2.0 stable ships, bump this pin and
# drop the RC note in docs/KNOWN_ISSUES.md (CI-03).
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"], optional = true }

# Python Interop
# Issue #2585: PyO3 0.22 → 0.29 to remediate RUSTSEC-2026-0177
# (PyCFunction::new_closure missing Sync bound, fixed in 0.29.0).
pyo3 = { version = "0.29", features = ["auto-initialize", "abi3-py310"], optional = true }
numpy = { version = "0.29", optional = true }

# Node.js/NAPI Interop
napi = { version = "3", features = ["napi8", "serde-json", "async"], optional = true }
napi-derive = { version = "3", optional = true }
napi-build = { version = "2", optional = true }

crossbeam = "0.8.4"
num-traits = "0.2.19"

# HTTP client for multi-reference updates
reqwest.workspace = true

# OpenStudio OSM file parsing/serialization
# XML parsing for gbXML import/export
quick-xml = "0.41"

# REST API server (Issue #1342). Async HTTP server with typed extractors
# and ergonomic routing. Stays on tokio 1.x — already in our dep tree above.

# Secure temp-file creation for /v1/import (Issue #2556). Promoted from
# [dev-dependencies] to a runtime dep: `tempfile::Builder` performs an
# atomic `O_EXCL` open with randomised suffix, eliminating the predictable
# `fluxion-import-{nanos}.{ext}` filename that previously enabled a
# TOCTOU + symlink race against any unprivileged co-tenant on a shared
# host (CWE-377, CWE-367).
tempfile = "3.27"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
# `timeout` is needed for `tower::timeout::TimeoutLayer`, the per-request
# 60 s budget that bounds `/v1/simulate` CPU usage (Issue #2530 DoS hardening).
tower = { version = "0.5", features = ["util", "timeout"] }
http-body-util = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
native-tls = "0.2"
async-trait = "0.1"

# Observability for fluxion-rest (Issue #1447):
#   - `tower-http` brings `TraceLayer` and `RequestId`/`PropagateRequestId`
#     middleware so every response carries an `x-request-id` header and every
#     request emits a structured log line via `tracing`.
#   - `cors` feature enables `CorsLayer` (Issue #2505 hardening) with an
#     explicit origin allow-list — never `permissive()`.
#   - `metrics` is the facade; counters and histograms go through the macros
#     and the global recorder (set up in `src/api/server.rs`).
#   - `metrics-exporter-prometheus` with `default-features = false` keeps the
#     dependency surface narrow — we only need the encoder and the in-process
#     `PrometheusHandle` (no HTTP listener, no push-gateway, no protobuf), and
#     we serve `/v1/metrics` from the axum router using `handle.render()`.
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "cors"] }
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ZIP archive writer for FMI 2.0 FMU packaging (#1339)
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# JSON Patch (RFC 6902) — Issue #1811 / Phase 1 (Declarative Deltas)
# of the Hybrid Measure Approach. Used by `fluxion::measures::json_patch`
# to apply declarative Deltas to a `FluxionModel` without invoking Python.
# `default-features = false` drops the `diff` feature (we don't generate
# patches, only consume them). License: MIT/Apache-2.0.
json-patch = { version = "4.2", default-features = false }

# WebSocket support for LiveTwin (Issue #2025)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = "0.26"

# MessagePack binary serialization for LiveTwin (Issue #2025)
rmp-serde = "1.3"

# Kafka telemetry consumer for enterprise-scale telemetry ingestion (issue #2056).
# Uses rdkafka with dynamic library linking. Enable the `kafka` feature to compile.
rdkafka = { version = "0.36", features = ["dynamic-linking"], optional = true }

# SQLite for reporting output (issue #1904)
rusqlite = { version = "0.36", features = ["bundled"] }

# dhat heap profiler for memory profiling of large simulations (Issue #2384).
# Enable with --features dhat and use #[global_allocator] = dhat::Allocator.
dhat = { version = "0.3", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29", optional = true }
napi-build = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
rstest = "0.25"
proptest = "1.5"
noisy_float = "0.2"

# TOON serialization for round-trip testing (Issue #2071)
fluxion-toon = { path = "crates/fluxion-toon" }

# Mock HTTP server for tests
mockito = "1.7"

# Loom for concurrency and race condition testing (Issue #1065)
# Run with: LOOM=1 cargo test --features loom --test loom_concurrency_tests
loom = "0.1"

# SQLite for reproducer tests (Issue #1790)
# Demonstrates the "database is locked" race condition in distributed array jobs
rusqlite = { version = "0.36", features = ["bundled"] }

# Memory stats for LiveTwin memory leak test (Issue #2064)
memory-stats = "1.0"

# Metric capture for unit tests asserting metric emission (Issue #2498).
# `DebuggingRecorder` + `metrics::with_local_recorder` lets tests assert on
# emitted observations without polluting the process-global Prometheus recorder.
metrics-util = "0.20"

