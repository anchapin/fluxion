[package]
name = "fluxion"
version = "1.0.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "A differentiable, AI-accelerated Building Energy Modeling engine with multi-zone support."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

# Exclude large files/dirs from crate distribution - only src/ is needed
# This reduces package from 79MB to ~4MB (well under 10MB crates.io limit)
exclude = [
    "refdata/",
    "assets/",
    "tests/",
    "docs/",
    ".github/",
    ".githooks/",
    ".planning/",
    "tools/",
    "benches/",
    "examples/",
    "Dockerfile",
    "docker-compose.yml",
    "delta_config.yaml",
    "*.md",
    "Cargo.lock",
]

[lib]
name = "fluxion"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Feature flag to enable Python bindings (disabled by default for pure Rust testing)
python-bindings = ["dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]
# Feature flag to enable Node.js/NAPI bindings (disabled by default for pure Rust testing)
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# Feature flag for CUDA support (enables GPU-accelerated ONNX inference)
cuda = ["ort/cuda", "ort/tensorrt"]
# Feature flag for wiring tracing in integration tests (Plan 21-10)
wiring-tracing = []
# Feature flag for multi-zone support
multi-zone = []
# Feature flag for ASHRAE 140 v2021 support
ashrae_140_v2021 = []
# Feature flag for PR #821 diagnostics (writes hourly CSVs for 600FF/650FF debugging)
pr821-diag = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(docsrs,test)", "cfg(gil_refs)"] }

[dependencies]
# Core Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"

# Logging
log = "0.4"
tracing = "0.1"  # TDQS decision hooks (Issue #708)
env_logger = "0.11"

# Date/time handling for reports
chrono = { version = "0.4", features = ["serde"] }

# HTTP client and caching for weather downloads
directories = "5.0"
sha2 = "0.10"

# Numerical & Math
faer = { version = "0.23.2", default-features = false, features = ["std"] }
nalgebra = "0.33"  # Linear algebra - matrix operations
uom = "0.35"  # Units of measurement - dimensional analysis
# ndarray 0.16 uses pulp 0.21+ which has fixed the size assertion issue with num-complex
ndarray = { version = "0.16", default-features = false, features = ["std", "serde"] }
num-complex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parallelism
rayon = "1.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
once_cell = "1.21"
lazy_static = "1.4.0"
num_cpus = "1.16"

# Plotting for validation reports
plotters = "0.3.5"

# Random number generation for uncertainty quantification
rand = "0.8"
rand_distr = "0.4"

# Statistical computing for validation metrics
statrs = "0.18.0"

# AI / Machine Learning Integration
# Using 2.0.0-rc.10 (prerelease) as stable 1.20 is not available on crates.io
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Python Interop
pyo3 = { version = "0.22", features = ["extension-module", "auto-initialize", "abi3-py310"], optional = true }
numpy = { version = "0.22", optional = true }

# Node.js/NAPI Interop
napi = { version = "3", features = ["napi8", "serde-json", "async"], optional = true }
napi-derive = { version = "3", optional = true }
napi-build = { version = "2", optional = true }

crossbeam = "0.8.4"
num-traits = "0.2.19"

# HTTP client for multi-reference updates
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[build-dependencies]
pyo3-build-config = { version = "0.22", optional = true }
napi-build = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
approx = "0.5"
rstest = "0.25"
dhat = "0.3"
proptest = "1.5"
noisy_float = "0.2"

# Mock HTTP server for tests
mockito = "1.7"

[[bench]]
name = "cta_bench"
harness = false

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "cta_perf_comparison"
harness = false

[[bench]]
name = "batch_oracle_bench"
harness = false

[[bench]]
name = "benchmark_8760_timesteps"
harness = false

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "performance_regression"
harness = false

[[bench]]
name = "validation_performance"
harness = false

[[bench]]
name = "parallel_validation"
harness = false

[[bench]]
name = "orchestration_decisions"
path = "benches/orchestration_decisions/benchmark_runner.rs"
harness = false

[[bin]]
name = "fluxion-delta"
path = "tools/fluxion_delta.rs"

[[bin]]
name = "export_csv"
path = "src/bin/export_csv.rs"

[[bin]]
name = "run_multi_zone_validation"
path = "src/bin/run_multi_zone_validation.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
split-debuginfo = "packed"
strip = true

# Optimize for CI: reduce memory usage during release builds
# Use thin LTO and more codegen units to prevent OOM/SIGSEGV

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fast CI build profile — use with `cargo test --profile ci`
# Balances compile speed against runtime speed:
#   opt-level=1   — significantly faster to compile than release (3), yet exercises
#                   more code paths than pure debug (0); avoids misoptimisation bugs
#   debug=0       — no debug info → smaller artifacts, faster linker invocation
#   codegen-units — maximum parallelism to saturate CI runner cores
#   incremental   — disabled: clean CI builds don't reuse incremental state
[profile.ci]
inherits = "dev"
opt-level = 1
debug = 0
codegen-units = 256
incremental = false

# Compile proc-macro crates (serde, clap, pyo3-derive, etc.) at opt-level=3
# even in dev/ci builds. Proc-macros run at compile time, so optimising them
# speeds up every downstream incremental build.
[profile.dev.build-override]
opt-level = 3

# Explicitly include Phase 6 performance optimization test targets
