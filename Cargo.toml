[package]
name = "fluxion"
version = "1.0.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "A differentiable, AI-accelerated Building Energy Modeling engine with multi-zone support."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

# Exclude large files/dirs from crate distribution - only src/ is needed
# This reduces package from 79MB to ~4MB (well under 10MB crates.io limit)
exclude = [
    "refdata/",
    "assets/",
    "tests/",
    "docs/",
    ".github/",
    ".githooks/",
    ".planning/",
    "tools/",
    "benches/",
    "examples/",
    "Dockerfile",
    "docker-compose.yml",
    "delta_config.yaml",
    "*.md",
    "Cargo.lock",
]

[lib]
name = "fluxion"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Feature flag to enable Python bindings (disabled by default for pure Rust testing)
python-bindings = ["dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]
# Feature flag for CUDA support
cuda = []
# Feature flag for wiring tracing in integration tests (Plan 21-10)
wiring-tracing = []
# Feature flag for multi-zone support
multi-zone = []

[dependencies]
# Core Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"
once_cell = "1.19"

        # GitHub Automation
        octocrab = "0.30"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/time handling for reports
chrono = { version = "0.4", features = ["serde"] }

# HTTP client and caching for weather downloads
directories = "5.0"
sha2 = "0.10"

# Numerical & Math
faer = { version = "0.23.2", default-features = false, features = ["std"] }
# ndarray 0.16 uses pulp 0.21+ which has fixed the size assertion issue with num-complex
ndarray = { version = "0.16", default-features = false, features = ["std", "serde"] }
num-complex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parallelism
rayon = "1.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
lazy_static = "1.4.0"
num_cpus = "1.16"

# Random number generation for uncertainty quantification
rand = "0.8"
rand_distr = "0.4"

# Statistical computing for validation metrics
statrs = "0.18.0"

# AI / Machine Learning Integration
# Using 2.0.0-rc.10 (prerelease) as stable 1.20 is not available on crates.io
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Python Interop
pyo3 = { version = "0.22", features = ["extension-module", "auto-initialize", "abi3-py310"], optional = true }
numpy = { version = "0.22", optional = true }
crossbeam = "0.8.4"
num-traits = "0.2.19"

# HTTP client for multi-reference updates
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[build-dependencies]
pyo3-build-config = { version = "0.22", optional = true }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
rstest = "0.25"
dhat = "0.3"
proptest = "1.5"

# Mock HTTP server for tests
mockito = "1.7"

[dependencies.tempfile]
version = "3.10"

[[bench]]
name = "cta_bench"
harness = true

[[bench]]
name = "engine_bench"
harness = true

[[bench]]
name = "cta_perf_comparison"
harness = true

[[bench]]
name = "batch_oracle_bench"
harness = true

[[bench]]
name = "performance_regression"
harness = true

[[bin]]
name = "fluxion-delta"
path = "tools/fluxion_delta.rs"

[[bin]]
name = "export_csv"
path = "src/bin/export_csv.rs"

[[bin]]
name = "run_multi_zone_validation"
path = "src/bin/run_multi_zone_validation.rs"

[[bin]]
name = "run_cross_validation"
path = "src/bin/run_cross_validation.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
split-debuginfo = "packed"
strip = true

# Explicitly include Phase 6 performance optimization test targets
[[test]]
name = "test_parallel_validation"
path = "tests/test_parallel_validation.rs"
harness = true

[[test]]
name = "test_result_aggregation"
path = "tests/test_result_aggregation.rs"
harness = true

[[test]]
name = "test_validation_report"
path = "tests/test_validation_report.rs"
harness = true

[[test]]
name = "test_modular_surrogates"
path = "tests/test_modular_surrogates.rs"
harness = true

[[test]]
name = "validation-multi_reference_integration"
path = "tests/validation/multi_reference_integration.rs"
harness = true

[[test]]
name = "integration"
path = "tests/integration/test_ashrae_140_regression.rs"
harness = true

[[test]]
name = "integration-wiring"
path = "tests/integration/test_wiring.rs"
harness = true

[[test]]
name = "integration-e2e-scenarios"
path = "tests/integration/test_e2e_scenarios.rs"
harness = true

[[test]]
name = "integration-batch-oracle"
path = "tests/integration/test_batch_oracle.rs"
harness = true

[[test]]
name = "integration-cli"
path = "tests/integration/test_cli.rs"
harness = true

[[test]]
name = "solar_gain_unit_tests"
path = "tests/solar_gain_unit_tests.rs"
harness = true

[[test]]
name = "solar_distribution_tests"
path = "tests/solar_distribution_tests.rs"
harness = true

[[test]]
name = "thermal_mass_coupling_tests"
path = "tests/thermal_mass_coupling_tests.rs"
harness = true
