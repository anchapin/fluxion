name: Setup Rust Environment
description: Install Rust toolchain with caching

inputs:
  components:
    description: 'Rust components to install (e.g., rustfmt,clippy)'
    required: false
    default: ''
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'

runs:
  using: composite
  steps:
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux' && inputs.components != ''
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Install Rust (${{ inputs.toolchain }})
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
