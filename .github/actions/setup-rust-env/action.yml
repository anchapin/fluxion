name: Setup Rust Environment
description: |
  Install Rust toolchain with unified cargo caching and optional sccache.
  Use `extra-apt-packages` to inject additional Linux apt packages into the
  same install invocation as the base deps (avoids an extra apt-get update).

inputs:
  toolchain:
    description: 'Rust toolchain version (e.g., 1.85.0, stable)'
    required: false
    default: ''
  components:
    description: 'Rust components to install (e.g., rustfmt,clippy)'
    required: false
    default: ''
  sccache:
    description: |
      Enable sccache compiler caching via GHA cache backend.
      Sets RUSTC_WRAPPER=sccache and SCCACHE_GHA_ENABLED=true.
      When true, the target/ directory is NOT cached separately
      (sccache provides finer-grained content-addressed caching).
    required: false
    default: 'true'
  extra-apt-packages:
    description: 'Additional Linux apt packages to install alongside base deps'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig ${{ inputs.extra-apt-packages }}
      env:
        DEBIAN_FRONTEND: noninteractive

    # dtolnay/rust-toolchain installs the toolchain via rustup, whose download
    # hits transient network failures (socket hang up / HTTP 503 / DNS) on
    # GitHub Actions runners ~10-15% of the time (issue #2813). Retry the
    # action up to 3 attempts: attempts 1 & 2 use continue-on-error so a
    # transient blip doesn't fail the job; attempt 3 hard-fails if still
    # broken. Behavior is otherwise identical to a single invocation.
    - name: Install Rust (attempt 1/3)
      id: install_rust_1
      uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839  # 1.85.0
      with:
        targets: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
      continue-on-error: true

    - name: Install Rust (attempt 2/3)
      id: install_rust_2
      if: steps.install_rust_1.outcome == 'failure'
      uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839  # 1.85.0
      with:
        targets: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
      continue-on-error: true

    - name: Install Rust (attempt 3/3)
      if: steps.install_rust_2.outcome == 'failure'
      uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839  # 1.85.0
      with:
        targets: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    # sccache: content-addressed compiler cache backed by GHA cache API.
    # Caches individual compilation units; no stale-cache issues on Cargo.lock changes.
    # mozilla-actions/sccache-action downloads the sccache binary, which is
    # likewise subject to transient download failures (#2813). Retry up to 3x.
    - name: Set up sccache (attempt 1/3)
      id: sccache_1
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      continue-on-error: true

    - name: Set up sccache (attempt 2/3)
      id: sccache_2
      if: inputs.sccache == 'true' && steps.sccache_1.outcome == 'failure'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      continue-on-error: true

    - name: Set up sccache (attempt 3/3)
      if: inputs.sccache == 'true' && steps.sccache_2.outcome == 'failure'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

    - name: Enable sccache as rustc wrapper
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

    # Cargo registry/git cache — covers downloaded crate source and metadata.
    # target/ caching is intentionally omitted when sccache is enabled because
    # sccache replaces it with finer-grained content-addressed caching.
    - name: Cache cargo registry and git
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # Fallback target/ cache for jobs that disable sccache
    - name: Cache cargo build target
      if: inputs.sccache == 'false'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-
