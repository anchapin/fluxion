name: Setup Rust Environment
description: |
  Install Rust toolchain with unified cargo caching and optional sccache.
  Use `extra-apt-packages` to inject additional Linux apt packages into the
  same install invocation as the base deps (avoids an extra apt-get update).

inputs:
  toolchain:
    description: 'Rust toolchain version (e.g., 1.85.0, stable). Forwarded to dtolnay/rust-toolchain `toolchain`, which takes VERSIONS, not target triples. Empty = fall back to the repo rust-toolchain file.'
    required: false
    default: ''
  targets:
    description: 'Rust target triple(s) to install (e.g., wasm32-unknown-unknown). Forwarded to dtolnay/rust-toolchain `targets`, which takes TRIPLES, not versions — the exact input-semantics confusion that broke msrv.yml in #3949.'
    required: false
    default: ''
  components:
    description: 'Rust components to install (e.g., rustfmt,clippy)'
    required: false
    default: ''
  sccache:
    description: |
      Enable sccache compiler caching via ONE rotating GitHub Actions cache
      entry per day+OS (the local disk store archived by actions/cache —
      round-153 redesign of the per-object GHA backend; design and measured
      churn in docs/investigations/2026-11-17-sccache-prime-churn-redesign-scoping.md
      §4.2, released by Alex 2026-11-17). Sets RUSTC_WRAPPER=sccache.
      When true, the target/ directory is NOT cached separately (sccache
      still provides content-addressed caching — one bulk archive instead
      of ~2.8k per-object store entries per day).
    required: false
    default: 'true'
  nextest:
    description: |
      Install `cargo-nextest` (Issue #3366 / ADR-0014). When 'true', installs
      the pinned cargo-nextest release via `taiki-e/install-action`. The
      `Rust Tests & Linting` workflow passes this through to enable
      `cargo nextest run --workspace --all-targets --test-threads=2` (the
      replacement for the 7-line `cargo test ...` block). The setup-rust-env
      composite is also reused by other workflows (rustfmt, clippy, workspace
      check); default 'true' so a single consumer opting out (e.g. an
      ad-hoc local debug workflow) can pass `nextest: 'false'`.
    required: false
    default: 'true'
  extra-apt-packages:
    description: 'Additional Linux apt packages to install alongside base deps'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig ${{ inputs.extra-apt-packages }}
      env:
        DEBIAN_FRONTEND: noninteractive

    # dtolnay/rust-toolchain installs the toolchain via rustup, whose download
    # hits transient network failures (socket hang up / HTTP 503 / DNS) on
    # GitHub Actions runners ~10-15% of the time (issue #2813). Retry the
    # action up to 3 attempts: attempts 1 & 2 use continue-on-error so a
    # transient blip doesn't fail the job; attempt 3 hard-fails if still
    # broken. Behavior is otherwise identical to a single invocation.
    - name: Install Rust (attempt 1/3)
      id: install_rust_1
      uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0  # 1.98.0
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
      continue-on-error: true

    - name: Install Rust (attempt 2/3)
      id: install_rust_2
      if: steps.install_rust_1.outcome == 'failure'
      uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0  # 1.98.0
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
      continue-on-error: true

    - name: Install Rust (attempt 3/3)
      if: steps.install_rust_2.outcome == 'failure'
      uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0  # 1.98.0
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    # sccache: content-addressed compiler cache backed by ONE rotating GHA
    # cache entry per day+OS (the local disk store archived below — the
    # round-153 redesign; the per-object GHA backend minted ~2.8k store
    # entries/day and rewrote them nightly while over cap).
    # mozilla-actions/sccache-action downloads the sccache binary, which is
    # likewise subject to transient download failures (#2813). Retry up to 3x.
    - name: Set up sccache (attempt 1/3)
      id: sccache_1
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      continue-on-error: true

    - name: Set up sccache (attempt 2/3)
      id: sccache_2
      if: inputs.sccache == 'true' && steps.sccache_1.outcome == 'failure'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      continue-on-error: true

    - name: Set up sccache (attempt 3/3)
      if: inputs.sccache == 'true' && steps.sccache_2.outcome == 'failure'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

    - name: Compute the sccache archive rotation key (daily)
      id: sccache_rotation
      if: inputs.sccache == 'true'
      shell: bash
      run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    - name: Enable sccache as rustc wrapper (local archive backend)
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        # Local disk store, archived as one rotating entry by the actions/cache
        # step below. The per-object GHA backend (SCCACHE_GHA_ENABLED) is
        # deliberately NOT set — see the round-153 redesign note above.
        echo "SCCACHE_DIR=${{ runner.temp }}/sccache-local-store" >> "$GITHUB_ENV"
        # Bound the local store (and therefore the saved archive) so the
        # entry stays ~pile-sized (the old per-object pile measured
        # ~1.3 GiB; the cap admits headroom for a day's new compilations
        # before sccache's own LRU trims the coldest objects).
        echo "SCCACHE_CACHE_SIZE=3G" >> "$GITHUB_ENV"

    # Restore the newest sccache archive (prefix match — yesterday's entry
    # when today's exact key misses) and register today's save in this
    # action's post phase (job end), exactly like the cargo-registry cache
    # step below. One entry per day+OS replaces the per-object pile:
    # a restored archive re-warms every compilation it contains in a single
    # lookup, and same-day saves by later jobs deduplicate (first finisher
    # wins; the content converges day over day through the prefix restore).
    - name: Restore + save sccache local archive (one rotating entry per day+OS)
      if: inputs.sccache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ${{ runner.temp }}/sccache-local-store
        key: sccache-archive-${{ runner.os }}-${{ steps.sccache_rotation.outputs.date }}
        restore-keys: |
          sccache-archive-${{ runner.os }}-

    # cargo-nextest: the canonical Rust next-generation test runner
    # (Issue #3366 / ADR-0014). Replaces the 7-line `cargo test` block in
    # `.github/workflows/rust-tests.yml::test` with a single
    # `cargo nextest run --workspace --all-targets --test-threads=2 --no-fail-fast`.
    # Each test binary runs in its own process; `.config/nextest.toml`
    # controls per-binary concurrency overrides.
    #
    # The download is subject to the same transient failures as sccache
    # (#2813). Retry up to 3x using the same pattern as `dtolnay/rust-toolchain`
    # and `mozilla-actions/sccache-action` above.
    #
    # Version pin (#4540, loop round 88): `tool: cargo-nextest` unpinned
    # resolved to @latest (0.9.143 on 2026-10-22). Pinned so every lane —
    # and any future exit-code-semantics debugging — runs a known runner.
    # 0.9.143 is the version the nightly lane's failure was reproduced on
    # locally (see the #4540 PR description), i.e. the pin deliberately does
    # NOT change the version the failing lane already ran; the lane's exit
    # 104 (TEST_LIST_CREATION_FAILED) is addressed by the workflow-side
    # target-set fix, not by this pin.
    - name: Install cargo-nextest (attempt 1/3)
      id: nextest_1
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
      with:
        tool: cargo-nextest@0.9.143
      continue-on-error: true

    - name: Install cargo-nextest (attempt 2/3)
      id: nextest_2
      if: inputs.nextest == 'true' && steps.nextest_1.outcome == 'failure'
      uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
      with:
        tool: cargo-nextest@0.9.143
      continue-on-error: true

    - name: Install cargo-nextest (attempt 3/3)
      id: nextest_3
      if: inputs.nextest == 'true' && steps.nextest_2.outcome == 'failure'
      uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2
      with:
        tool: cargo-nextest@0.9.143

    # Cargo registry/git cache — covers downloaded crate source and metadata.
    # target/ caching is intentionally omitted when sccache is enabled because
    # sccache replaces it with finer-grained content-addressed caching.
    - name: Cache cargo registry and git
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # Fallback target/ cache for jobs that disable sccache
    - name: Cache cargo build target
      if: inputs.sccache == 'false'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-
