name: Install System Dependencies
description: Consolidated system dependency installation for Linux/macOS/Windows

inputs:
  packages:
    description: 'Comma-separated list of apt packages (Linux only)'
    required: false
    default: 'libssl-dev,pkg-config,libfontconfig1-dev'
  update:
    description: 'Run apt-get update before install'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Refresh apt lists (Linux)
      # Issue #4341: the runner image's apt lists can reference versions the
      # apt mirror has already replaced (404 mid-install during an Ubuntu
      # point release), and the cache-apt action below does not reliably
      # refresh them first. Refresh explicitly, with retries.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if sudo apt-get update; then
            exit 0
          fi
          echo "apt-get update failed (attempt $attempt); retrying in 15s"
          sleep 15
        done
        exit 1

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # Issue #4341 follow-up (round 14): the awalsh128/cache-apt-pkgs-action
      # path is retired. Its cache can be created incomplete while the apt
      # mirror is mid point-release (run 38191732988: cache saved without
      # libssl-dev/pkg-config/fontconfig tarballs, restored as CACHE_HIT, and
      # the #4341 verify failed on all performance_dashboard jobs), it
      # silently ignores this composite's `retry`/`update` inputs, and
      # restored tarballs are not registered in dpkg's database so `dpkg -s`
      # cannot see them. Install directly instead — the update step above has
      # already refreshed the lists — with retries around the install itself.
      run: |
        pkgs=$(echo '${{ inputs.packages }}' | tr ',' ' ')
        for attempt in 1 2 3; do
          if sudo apt-get install -y $pkgs; then
            exit 0
          fi
          echo "apt-get install failed (attempt $attempt); retrying in 15s"
          sleep 15
        done
        exit 1

    - name: Verify system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -eu
        missing=0
        for pkg in $(echo '${{ inputs.packages }}' | tr ',' ' '); do
          if ! dpkg -s "$pkg" >/dev/null 2>&1; then
            echo "::error::apt package '$pkg' did not install; the install step above can mask an apt failure (e.g. a mirror 404 during a point release). Re-run the job, or apt-get update first. See issue #4341."
            missing=1
          fi
        done
        exit $missing

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ${{ inputs.packages }}

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Windows dependencies typically handled via chocolatey or manual
        # This is a placeholder for Windows-specific logic
        Write-Host "Windows dependency installation may require additional configuration"
