name: Benchmark Band Provenance Gate

# Issue #4168 acceptance criterion #3: fail when the scorecard bands in
# `src/validation/benchmark.rs` lose their per-metric source citation,
# when two distinct case IDs carry byte-identical peak-band tuples
# without written justification, when the strict ±15% baseline's
# `published_range_mwh` drifts away from the benchmark.rs entries, or
# when synthetic quarantined series are cited as provenance.
#
# Read-only check; no auto-regen, no auto-commit. A failure means one of
# the cited sources moved independently and the band must be reconciled
# by hand against the authoritative transcription
# (`data/reference/ashrae140/annex_b8_section7_statistics.json`).

on:
  pull_request:
    paths:
      - "src/validation/benchmark.rs"
      - "tests/reference_data/zone_balance/strict_energy_gate_baseline.json"
      - "data/reference/ashrae140/**"
      - "data/synthetic/ashrae140/**"
      - "scripts/check_benchmark_band_provenance.py"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  benchmark-band-provenance:
    name: "Benchmark Band Provenance (Issue #4168 AC3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run benchmark band provenance check
        run: python3 scripts/check_benchmark_band_provenance.py
