# PyPI Release Workflow
# Implements Issue #168: Configure PyPI package distribution
# Release gates implemented per Issue #505

name: PyPI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN default (Issue #2526). The gate-check job only
# runs validation + benchmarks and needs read access. The publish / publish-test
# jobs escalate ONLY to `id-token: write` (OIDC trusted publishing) via their own
# job-level permissions blocks — they never need contents: write because PyPI
# trusted publishing does not push tags or commits.
permissions:
  contents: read

jobs:
  # Gate check job - must pass before publish
  gate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run ASHRAE 140 Validation
        run: |
          cargo test --test ashrae_140_validation --release -- --nocapture 2>&1 | tee validation_output.txt
        continue-on-error: true

      - name: Extract Validation Results
        run: |
          python3 << 'EOF'
          import re
          import json

          with open('validation_output.txt', 'r') as f:
              output = f.read()

          # Extract case results
          cases = {}
          def parse_numeric(s):
              """Parse numeric string that may contain inf."""
              s = s.strip().lower()
              if s in ('inf', '+inf'):
                  return float('inf')
              elif s == '-inf':
                  return float('-inf')
              return float(s)

          case_pattern = r"Case\s+(\d+[A-Z]*)\s*[:\-]\s*Heating\s*=\s*([+-]?(?:inf|\d+\.?\d*))\s*\(Ref:\s*([+-]?(?:inf|\d+\.?\d*))\s*-\s*([+-]?(?:inf|\d+\.?\d*))\),\s*Cooling\s*=\s*([+-]?(?:inf|\d+\.?\d*))\s*\(Ref:\s*([+-]?(?:inf|\d+\.?\d*))\s*-\s*([+-]?(?:inf|\d+\.?\d*))\)"
          for match in re.finditer(case_pattern, output):
              case_id, heating, heating_min, heating_max, cooling, cooling_min, cooling_max = match.groups()
              cases[case_id] = {
                  'heating': parse_numeric(heating),
                  'heating_min': parse_numeric(heating_min),
                  'heating_max': parse_numeric(heating_max),
                  'cooling': parse_numeric(cooling),
                  'cooling_min': parse_numeric(cooling_min),
                  'cooling_max': parse_numeric(cooling_max)
              }

          # Extract summary - handles inf% and leading whitespace
          summary_pattern = r"^\s*Validation\s+Report\s+Summary:.*?Pass\s+Rate:\s*([\d.]+|inf)%\s*Passed:\s*(\d+).*?Failed:\s*(\d+).*?Mean\s+Absolute\s+Error:\s*([\d.]+|inf)%"
          summary_match = re.search(summary_pattern, output, re.DOTALL | re.MULTILINE)

          summary = {}
          if summary_match:
              pass_rate, passed, failed, mae = summary_match.groups()
              summary = {
                  'pass_rate': parse_numeric(pass_rate),
                  'passed': int(passed),
                  'failed': int(failed),
                  'mae': parse_numeric(mae)
              }

          with open('validation_results.json', 'w') as f:
              json.dump({'cases': cases, 'summary': summary}, f, indent=2)
          EOF

      - name: Run Performance Benchmarks
        run: |
          cargo test --test performance_regression_test --release -- --nocapture 2>&1 | tee perf_output.txt

      - name: Extract Benchmark Results
        run: |
          python3 << 'EOF'
          import re
          import json

          with open('perf_output.txt', 'r') as f:
              output = f.read()

          throughput_match = re.search(r'Throughput:\s*([\d.]+)\s*configs/sec', output)
          latency_match = re.search(r'Latency per config:\s*([\d.]+)ms', output)

          results = {
              "metrics": {
                  "throughput_configs_per_sec": float(throughput_match.group(1)) if throughput_match else 0,
                  "latency_ms_per_config": float(latency_match.group(1)) if latency_match else 0
              }
          }

          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          EOF

      - name: Run Release Gate Checker
        run: |
          python3 scripts/release_gate_checker.py \
            --validation-results validation_results.json \
            --benchmark-results benchmark_results.json \
            --json --output gate_status.json

      - name: Display Gate Status
        run: |
          echo "# Release Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            python3 -c "
            import json
            with open('gate_status.json') as f:
              data = json.load(f)
            status = '✅ PASSED' if data['overall_passed'] else '❌ FAILED'
            print(f'**Overall:** {status}')
            print(f'**Gates:** {data[\"summary\"][\"passed\"]}/{data[\"summary\"][\"total\"]} passed')
            print()
            for gate in data['gates']:
              icon = '✅' if gate['passed'] else '❌'
              print(f'{icon} **{gate[\"category\"]}/{gate[\"name\"]}**: {gate[\"message\"]}')
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if gates not passed
        if: failure()
        run: |
          echo "❌ Release gates failed - cannot proceed with release"
          echo ""
          if [ -f gate_status.json ]; then
            python3 -c "
            import json
            with open('gate_status.json') as f:
              data = json.load(f)
            print('Failed gates:')
            for gate in data['gates']:
              if not gate['passed']:
                print(f\"  ❌ {gate['category']}/{gate['name']}: {gate['message']}\")
            "
          fi
          echo ""
          echo "Fix the issues above or update baseline if changes are intentional:"
          echo "  python scripts/release_gate_checker.py --update-baseline"
          exit 1

      - name: Upload Gate Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gate-results
          path: |
            validation_results.json
            benchmark_results.json
            gate_status.json
          retention-days: 30

  # Build and publish to PyPI - depends on gate-check
  publish:
    runs-on: ubuntu-latest
    needs: gate-check
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        if: startsWith(github.ref, 'refs/tags/')

  # Build and publish to Test PyPI
  publish-test:
    runs-on: ubuntu-latest
    needs: gate-check
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
