# ci-gates.yml — Phase-gated CI.
#
# Why this file exists
# --------------------
# GitHub Actions has no repository-wide runner priority: every workflow that
# triggers on `pull_request` queues its jobs immediately, so a single PR
# fans out to 100+ jobs and starves parallel PRs of the limited GH-hosted
# runner pool. This workflow splits PR CI into two phases in a single DAG:
#
#   Phase 1 — (empty after the Issue #4007 required-check cut.)
#             `Surrogate Drift Tolerance Gate (Issue #1784)` moved to
#             `surrogate-drift.yml` and `Cargo Deny` moved to
#             `cargo-deny.yml`, both as path-filtered required checks
#             (required only when their paths change; no longer in the
#             always-run branch-protection set). The seven physics-path
#             required checks (Workspace Check, Energy Conservation,
#             Rustfmt, Clippy, Ashrae Cases Cycle, Physics-Sim-Cycle,
#             Cycle Downward Trend) moved to `physics-pr.yml` in Issue
#             #4007 (Ashrae Cases Cycle and Cycle Downward Trend were
#             later demoted to advisory in the #4007 follow-up cut).
#   Phase 2 — heavy advisory jobs. `test` is the ~38-min `cargo nextest`
#             matrix; it runs unconditionally on PRs (no phase-1 gating
#             remains in this workflow).
#
# Why move jobs instead of `workflow_call` / `workflow_run`
# ----------------------------------------------------------
# Moving keeps every job's `github.event.pull_request` context and
# `if: github.event_name == 'pull_request'` conditions working
# byte-for-byte. `workflow_call` would resolve reusable workflows from a
# different ref and change `github.event_name`; `workflow_run` always uses
# the *default branch's* workflow files, so CI-infra PRs could not test
# advisory workflow changes through the normal PR flow.
#
# Phase-1 provenance
# ------------------
# `surrogate-drift-gate` moved verbatim from `surrogate_drift_gate.yml`
# (that file had no other jobs and is deleted), then to
# `surrogate-drift.yml` in the Issue #4007 required-check cut (16 -> 9).
# `deny` (Cargo Deny) moved verbatim from `security.yml`, then to
# `cargo-deny.yml` in the same cut. The seven `*-listener` jobs (Workspace
# Check, Energy Conservation, Rustfmt, Clippy, Ashrae Cases Cycle,
# Physics-Sim-Cycle, Cycle Downward Trend) moved to `physics-pr.yml` in
# Issue #4007 (same `name:`, same steps).
#
# Phase-2 provenance
# ------------------
# `test` is the ~38-min `cargo nextest` matrix, moved verbatim from
# `rust-tests.yml`. It is the single heaviest per-PR job; gating it behind
# phase 1 is the 80/20 of runner contention. `determinism_check.yml` was
# gated in the follow-up PR (second half of the two-PR `workflow_run`
# rollout; `fluxion-determinism-gate` observes that workflow by name and
# already accepted both event kinds). `ashrae_validation.yml` and
# `performance_dashboard.yml` were gated in #4018 itself.
#
# Branch protection contract
# --------------------------
# Do NOT rename any phase-1 job's `name:`. Branch protection matches the
# emitted `name:` byte-for-byte (Issue #3116). Job *ids* are free to
# change; names are not.

name: CI Gates

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

# ADR-0015 per-`head_sha` concurrency block (Issue #3366 / #3444).
# Re-run `python3 scripts/check_concurrency_keys.py` after edits.
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

# Least-privilege GITHUB_TOKEN default (Issue #2526): phase-1 jobs only
# check out code and run scripts / cargo subcommands. No repo write-back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ================================================================
  # Advisory full nextest matrix (Issue #4007 follow-up cut, 2026-09-27):
  # the required checks moved to physics-pr.yml (always-run) and the
  # new cargo-deny.yml / surrogate-drift.yml (path-filtered). This
  # workflow now hosts only the non-blocking matrix; nothing declares
  # `needs:` on the removed phase-1 jobs.
  # ================================================================

  # -- Always: fast gate (both PR and main) ----------------------------------
  # PRs: single-platform (ubuntu only) for fast signal.
  # Main: full 3-platform matrix for cross-platform validation.

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_set.name }})
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: |
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-24.04"]')
              || fromJSON('["ubuntu-24.04", "macos-latest", "windows-latest"]') }}
        rust: [stable]
        feature_set:
          - {name: "no-default",       flags: "--no-default-features"}
          - {name: "wiring-tracing",   flags: "--features wiring-tracing"}
          - {name: "multi-zone",       flags: "--features wiring-tracing,multi-zone"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'

      - name: Cache ONNX Runtime binaries
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      # Issue #3398: cargo cache for the PR-blocking test matrix. Every
      # sibling workflow (performance_dashboard.yml, msrv.yml,
      # crate-size.yml, security.yml) already wires Swatinem/rust-cache;
      # this matrix was the only PR-blocking pipeline without it, paying
      # 15-30 cold-cache CI minutes per code-changing PR. rust-cache
      # keys entries on the rustc invocation (feature flags included),
      # so the three feature_set matrix entries get distinct caches and
      # cannot poison each other. Workspace list mirrors the actual
      # `[workspace] members` in Cargo.toml (crates/fluxion-evaluator
      # included; fluxion-tauri lives at fluxion-tauri/src-tauri).
      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            .
            fluxion-core -> target
            fluxion-city -> target
            fluxion-fluid -> target
            fluxion-grid -> target
            fluxion-behavior -> target
            fluxion-mcp -> target
            fluxion-wasm -> target
            crates/fluxion-toon -> target
            crates/fluxion-twin -> target
            crates/fluxion-evaluator -> target
            fluxion-cfd -> target
            fluxion-tauri/src-tauri -> target

      # Issue #3366 / ADR-0014: consolidated the 7-line `cargo test` block
      # into a single `cargo nextest run` invocation. Each test binary
      # runs in its own process; per-binary concurrency overrides live
      # in `.config/nextest.toml` (audit findings). `--no-fail-fast`
      # keeps the matrix honest — a single failing binary does not
      # abort the whole run.
      #
      # Issue #3952: this step previously passed POSITIONAL filters
      # (`surface_flux_provider_isolation::`, then
      # `regression_exterior_film_unification::`) that nextest applies
      # globally across EVERY selected target. As a result `--lib`
      # (3,853 tests), `--test validation_empirical_harness`,
      # `--test hvac_bestest`, and the fluxion-behavior / fluxion-twin
      # selections each ran ~zero tests — the root lib suite executed
      # in NO per-PR required check, which is how #3935's five broken
      # lib tests shipped green (#3948). The two invocations below
      # restore the original 7-line block's scope:
      #
      #   1. Unfiltered multi-target: root lib + the standalone keeper
      #      integration tests + the workspace-package tests called
      #      out by Issues #2909 / #2904.
      #   2. The two all_tests regression modules (standalone test
      #      binaries before the #3764 consolidation), scoped with an
      #      explicit nextest filterset (`-E`). A filterset applies
      #      only within its own invocation, so it cannot silently
      #      zero out the other targets the way a positional filter
      #      does.
      #
      # Everything else inside `--test all_tests` (2,704 run / 76
      # skipped tests across 251 modules; 107 failures across 39
      # modules) is deliberately NOT in per-PR scope: those suites
      # never ran in the original 7-line block and carry documented
      # physics gaps (SCORECARD / KNOWN_ISSUES §LIMIT-*), CLI EPW
      # fixture-path breakage, timing-threshold tests, and
      # working-tree-mutating report writers. Full per-suite triage
      # and dispositions: issue #3952. Do NOT re-add positional
      # filters to this step.
      #
      # Matrix `flags` carries the per-entry nextest args verbatim (e.g.
      # `--no-default-features` for the "no-default" entry, `--features
      # wiring-tracing` for the "wiring-tracing" entry, `--features
      # wiring-tracing,multi-zone` for the "multi-zone" entry). The
      # earlier `--features ${{ matrix.feature_set.nextest_flags }}`
      # template was broken: `nextest_flags` does not exist on the
      # matrix object, so the interpolation produced an empty string
      # and cargo-nextest rejected every matrix entry with
      # `error: a value is required for '--features <FEATURES>'`. The
      # interpolation below yields the full flag string and bash's
      # word-splitting parses it correctly per matrix entry.
      - name: Run tests
        run: |
          cargo nextest run \
            -p fluxion \
            --lib \
            --test validation_empirical_harness \
            --test hvac_bestest \
            -p fluxion-behavior --test lighting_occupancy_integration \
            -p fluxion-twin --test mqtt_ukf_integration --test ukf_covariance_stability --test ukf_van_der_pol --test websocket_memory_leak \
            --test-threads=2 \
            --no-fail-fast \
            ${{ matrix.feature_set.flags }} && \
          cargo nextest run \
            -p fluxion \
            --test all_tests \
            -E 'test(/^surface_flux_provider_isolation::/) | test(/^regression_exterior_film_unification::/)' \
            --test-threads=2 \
            --no-fail-fast \
            ${{ matrix.feature_set.flags }}
        env:
          PYO3_PYTHON: /usr/bin/python3

      # Issue #3755: the `python-bindings` feature set was invisible to the
      # PR path — nothing in this workflow compiled `--features
      # python-bindings`, so 10 compile errors from API drift (the #1773
      # annealer-trait addition and an `hvac` field path change in the model
      # bindings) accumulated silently on develop until the #3720 wave-1
      # sub-agent tripped over them. PR #3782 (issue #3749) fixed the call
      # sites mechanically; this step compiles the feature set and runs the
      # `python::` lib tests (~161 tests) on every PR so the blind spot
      # cannot reopen. The full OS x Python wheel + pytest matrices stay in
      # python-bindings.yml (nightly + main, issue #3567 moved them off the
      # PR path). Pinned to ONE matrix leg (Linux + "no-default") so the
      # extra cargo build is paid once per PR, not three times; the
      # lib-test compile covers every `#[cfg(feature = "python-bindings")]`
      # module in src/python/ regardless of which tests the filter selects.
      # Env mirrors the established python-bindings.yml pattern:
      # PYO3_USE_ABI3_FORWARD_COMPATIBILITY is already workflow-level above;
      # RUST_MIN_STACK enlarges the build thread stack (32 MiB) for the
      # PyO3 link step, as in .github/workflows/python-bindings.yml.
      - name: Python bindings feature tests (Issue #3755)
        if: runner.os == 'Linux' && matrix.feature_set.name == 'no-default'
        env:
          RUST_MIN_STACK: 33554432
        run: |
          cargo nextest run \
            -p fluxion \
            --lib \
            --features python-bindings \
            python:: \
            --test-threads=2 \
            --no-fail-fast
