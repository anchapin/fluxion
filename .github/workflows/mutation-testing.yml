name: Mutation Testing

# NOTE: Mutation testing is DISABLED on CI due to cargo-mutants OOM.
# cargo-mutants 27.x requires ~28GB RAM to analyze fluxion's type hierarchies.
# Standard CI runners have 7GB RAM. Mutation testing must be run manually
# on a machine with at least 32GB RAM using:
#   cargo mutants
#
# See Issue #1244 for details.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Rust toolchain'
        required: false
        default: 'stable'
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TOOLCHAIN: ${{ inputs.toolchain || 'stable' }}

jobs:
  mutation-testing:
    name: Mutation Testing
    # NOTE: Only runs via workflow_dispatch due to OOM on standard CI runners.
    # cargo-mutants requires ~28GB RAM to analyze fluxion's complex type hierarchies.
    # GitHub Actions ubuntu-latest runners only have 7GB RAM.
    runs-on: ubuntu-latest-8-cores  # 32GB RAM machine for mutation testing
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation testing
        run: |
          cargo mutants --baseline skip --no-default-features -- \
            --test-threads=4

      - name: Generate HTML report
        if: always()
        run: |
          mkdir -p mutation_testing_results/reports
          if [ -f mutation_testing_results/outcomes.json ]; then
            cargo mutants show -o mutation_testing_results --format html > mutation_testing_results/reports/index.html 2>&1 || true
          fi

      - name: Upload mutation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation_testing_results/
          retention-days: 30
