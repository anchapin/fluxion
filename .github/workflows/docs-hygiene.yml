name: Docs Hygiene Gate

# Issue #2466: Enforce root `.md` policy and 7-line-summary coverage via CI gates.
# Issue #2765: Also enforce that docs/doc-inventory.md is fresh.
#
# Runs four Python scripts that together close the docs-hygiene gap:
#   1. scripts/check_root_md_policy.py — fails if any `.md` file at the
#      repo root is not in the AGENTS.md allow-list (CLAUDE.md is warned,
#      never failed — it's auto-generated per-session).
#   2. scripts/check_docs_summaries.py — fails if any `docs/**/*.md`
#      file lacks a 7-line summary at lines 2-8.
#   3. scripts/doc_inventory_check.py — verifies the canonical root-docs
#      table in docs/doc-inventory.md (paths + summaries).
#   4. scripts/check_doc_inventory_fresh.py — fails if the auto-generated
#      inventory block in docs/doc-inventory.md has drifted from what
#      scripts/generate_doc_inventory.py would produce (issue #2765).
#   5. Stale MQTT escape-hatch doc check — fails if the insecure-transport
#      opt-in flag removed in #3162 reappears in tracked docs (issue #3462).
#
# All four are wired into `.pre-commit-config.yaml` as `manual`-stage
# hooks (so they run via `pre-commit run --all-files` but not on every
# commit) and are required-check listeners for the docs-hygiene job
# listed in `release_gates.yaml`.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - "scripts/check_root_md_policy.py"
      - "scripts/check_docs_summaries.py"
      - "scripts/doc_inventory_check.py"
      - "scripts/doc_inventory_check.sh"
      - "scripts/generate_doc_inventory.py"
      - "scripts/check_doc_inventory_fresh.py"
      - "scripts/check_doc_link_integrity.py"
      - "scripts/check_known_issues_summary.py"
      - "scripts/check_npm_readme_codeblocks.mjs"
      - "npm/README.md"
      - "docs/doc-inventory.md"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "CODEBASE_MAP.md"
      - "CONTRIBUTING.md"
      - "RULES.md"
      - "CHANGELOG.md"
      - "README.md"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  docs-hygiene:
    name: Docs Hygiene Gate (Issue #2466)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Run root `.md` policy check
        id: root_md
        run: |
          python3 scripts/check_root_md_policy.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Root .md policy check failed (issue #2466 acceptance criterion #1)"
          fi

      - name: Run docs 7-line summary coverage check
        id: docs_summaries
        run: |
          python3 scripts/check_docs_summaries.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Docs summary coverage check failed (issue #2466 acceptance criterion #2)"
          fi

      - name: Run canonical doc-inventory check
        id: doc_inventory
        run: |
          python3 scripts/doc_inventory_check.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Doc inventory check failed"
          fi

      - name: Run doc-inventory freshness check
        id: doc_inventory_fresh
        run: |
          python3 scripts/check_doc_inventory_fresh.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Doc inventory is stale — run \`python3 scripts/generate_doc_inventory.py\` and commit the result (issue #2765)"
          fi

      - name: Run npm/README.md code-block drift check
        id: npm_readme
        run: |
          node scripts/check_npm_readme_codeblocks.mjs
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::npm/README.md code-block drift check failed (issue #2511)"
          fi

      - name: Run doc-link-integrity check
        id: doc_link_integrity
        run: |
          python3 scripts/check_doc_link_integrity.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Doc link-integrity check found broken references (issue #2885)"
          fi

      - name: Run known-issues summary table drift check
        id: known_issues_summary
        run: |
          # Issue #3513: drift gate for the `## Summary` table in
          # docs/KNOWN_ISSUES.md. The table MUST match the actual
          # `### CATEGORY-NN:` section counts; status columns derive
          # from each section's first `**Status:**` line. Regenerate
          # via `python3 scripts/check_known_issues_summary.py --regen |
          # sponge docs/KNOWN_ISSUES.md`.
          python3 scripts/check_known_issues_summary.py --check
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Known-issues summary table drift (issue #3513 acceptance criterion #1); re-run \`python3 scripts/check_known_issues_summary.py --regen | sponge docs/KNOWN_ISSUES.md\`"
          fi

      - name: Run stale MQTT escape-hatch doc check
        id: mqtt_escape_hatch_docs
        run: |
          # Issue #3462: the MQTT insecure-transport opt-in flag was removed
          # in #3162 (the telemetry consumer is always TLS with validated
          # certificates — no runtime bypass). Fail if the dead flag name
          # reappears in tracked markdown/config docs. The flag name is built
          # from two concatenated strings so this guard does not match itself.
          FLAG="FLUXION_MQTT_ALLOW""_INSECURE"
          MATCHES=$(grep -rn "$FLAG" \
            --include="*.md" --include="*.toml" --include="*.yml" \
            .github crates docs .planning CODEBASE_MAP.md AGENTS.md README.md 2>/dev/null || true)
          if [[ -n "$MATCHES" ]]; then
            echo "$MATCHES"
            echo "::error::Stale $FLAG documentation found — the flag was removed in #3162 (MQTT telemetry is always TLS with validated certificates, no runtime bypass); purge it (issues #3462 / #3162)"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggregate results
        if: steps.root_md.outputs.exit_code != '0' || steps.docs_summaries.outputs.exit_code != '0' || steps.doc_inventory.outputs.exit_code != '0' || steps.doc_inventory_fresh.outputs.exit_code != '0' || steps.npm_readme.outputs.exit_code != '0' || steps.doc_link_integrity.outputs.exit_code != '0' || steps.known_issues_summary.outputs.exit_code != '0' || steps.mqtt_escape_hatch_docs.outputs.exit_code != '0'
        run: |
          echo "One or more docs-hygiene checks failed. See logs above."
          exit 1
