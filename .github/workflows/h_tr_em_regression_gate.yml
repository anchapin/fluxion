# h_tr_em Wind-Dependent Recompute Regression Gate (Issue #3549 / LIMIT-13)
#
# CI gate that asserts the integrity of the h_tr_em (envelope-to-mass
# conductance) regression baseline at
# ``tests/reference_data/h_tr_em_baseline/``. The verifier loads the
# shipped ``baseline_manifest.json``, recomputes the SHA-256 of each
# per-case JSON, and compares against the manifest's stamp so a silent
# hand-edit to a case file cannot pass the gate.
#
# What it runs
# ------------
# This gate is the regression fence for the h_tr_em wind-dependent
# per-step recompute (Issue #3063 / Issue #3265 / LIMIT-13 / ADR-0009).
# Until the recompute lands, this gate is the bit-identical baseline
# integrity check: it fails closed (exit 2) when the manifest is a
# placeholder (any per-case ``sha256`` is null or manifest
# ``captured_at`` is null) so a future implementer cannot silently
# compare against an empty baseline.
#
# Usage
# -----
# The verifier is invoked with:
#   python3 scripts/verify_h_tr_em_regression.py \
#       --manifest tests/reference_data/h_tr_em_baseline/baseline_manifest.json \
#       [--strict] [--json] [--tolerance <float>]
#
# Exit codes:
#   0 — All per-case SHA-256 stamps match the recomputed digests (and
#       the manifest is not flagged as placeholder).
#   1 — ``--strict`` AND at least one per-case SHA-256 stamp mismatches
#       the recomputed digest (regression).
#   2 — Baseline is a placeholder (any per-case ``sha256`` is null OR
#       manifest ``captured_at`` is null).
#   3 — Usage / IO error (bad path, malformed JSON, missing manifest,
#       schema drift).
#
# Baseline requirement
# -------------------
# The baseline at `tests/reference_data/h_tr_em_baseline/` must contain
# a populated `baseline_manifest.json` (captured_at != null AND every
# per-case `sha256` != null). If the baseline is a placeholder, this
# gate exits 2 (fail closed) per ADR-0009.
#
# Status check name
# -----------------
# Job id is `h-tr-em-regression-gate`; the human-readable name is
# "h_tr_em Regression Gate (LIMIT-13)". This string is already wired
# into ``release_gates.yaml -> ci.required_checks`` (line ~628) so
# branch protection references the exact emitted name.

name: h_tr_em Regression Gate

on:
  push:
    branches: [main, develop]
  # Issue #4018: phase-gated behind CI Gates. The docs-only skip
  # (ADR-0016 lane 2) is preserved via the docs-only-gate check job.
  workflow_run:
    workflows: ["CI Gates"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: >-
    h-tr-em-regression-gate-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  # Issue #4018: phase-gate precheck (see fast_math_check.yml for docs).
  precheck:
    name: Phase-gate precheck
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
    steps:
      - name: Checkout (precheck needs the local docs-only-gate action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$UPSTREAM_EVENT" != "pull_request" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "upstream_ok=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docs-only-gate
        id: docs
        if: steps.upstream.outputs.upstream_ok == 'true' && github.event_name == 'workflow_run'
      - id: final
        run: |
          if [ "${{ steps.upstream.outputs.upstream_ok }}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ steps.docs.outputs.docs_only }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
  h-tr-em-regression-gate:
    name: "h_tr_em Regression Gate (LIMIT-13)"
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: >-
      ${{
        github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && vars.FLUXION_LINUX_RUNNER
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            .
            fluxion-core -> target
            fluxion-city -> target
            fluxion-fluid -> target
            fluxion-grid -> target
            fluxion-behavior -> target
            fluxion-mcp -> target
            fluxion-wasm -> target
            crates/fluxion-toon -> target
            crates/fluxion-twin -> target
            crates/fluxion-evaluator -> target
            fluxion-cfd -> target
            fluxion-tauri/src-tauri -> target          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: h-tr-em-regression-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            h-tr-em-regression-gate-${{ runner.os }}-

      - name: Check baseline snapshot directory exists
        id: check-baseline
        run: |
          BASELINE_DIR="tests/reference_data/h_tr_em_baseline"
          if [ ! -d "$BASELINE_DIR" ]; then
            echo "::error::Baseline snapshot directory $BASELINE_DIR does not exist."
            echo "::error::The h_tr_em recompute (Issue #3063) must capture baseline snapshots before this gate can run."
            exit 2
          fi
          if [ ! -f "$BASELINE_DIR/baseline_manifest.json" ]; then
            echo "::error::Baseline manifest $BASELINE_DIR/baseline_manifest.json does not exist."
            exit 2
          fi
          echo "Baseline directory exists: $BASELINE_DIR"
          echo "baseline_exists=true" >> $GITHUB_OUTPUT

      - name: Run h_tr_em regression verifier
        if: steps.check-baseline.outputs.baseline_exists == 'true'
        run: |
          set -e
          echo "=== h_tr_em Regression Gate ==="
          echo ""
          echo "Baseline: tests/reference_data/h_tr_em_baseline/baseline_manifest.json"
          echo ""

          # The baseline exists but may be a placeholder (any per-case
          # `sha256` is null OR manifest `captured_at` is null). The
          # verifier fails closed (exit 2) until every per-case
          # SHA-256 fingerprint is populated (per ADR-0009).
          #
          # --strict also trips exit 1 on any fingerprint drift so
          # silent edits to the case files cannot pass the gate.
          python3 scripts/verify_h_tr_em_regression.py \
            --manifest tests/reference_data/h_tr_em_baseline/baseline_manifest.json \
            --strict \
            --json

      - name: Upload verifier output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: h-tr-em-regression-gate-output
          path: |
            h_tr_em_verifier_output.json
          retention-days: 14

  # Issue #3810: GH-listener pattern for the path-filtered `h_tr_em`
  # gate (Issue #3154 / LIMIT-13 / ADR-0009). The upstream
  # `h-tr-em-regression-gate` job only fires for non-docs-only PRs
  # (`paths-ignore: ['docs/**', ...]`), so on a docs-only / scripts-
  # only PR the workflow is skipped and the required-check context is
  # never reported — branch protection's expected-vs-actual gap that
  # #3805 documented.
  #
  # The `h-tr-em-listener` job is unconditional (`if: always()`) and
  # observes the upstream result: PASS on `success` / `skipped`
  # (path-filter neutral-success); FAIL on `failure` / `cancelled` /
  # `timed_out`. Listener's `name:` is the exact required-check
  # string so GitHub branch protection can reference it verbatim
  # (Issue #3116). The job id is suffixed `-listener` to avoid
  # colliding with the upstream `h-tr-em-regression-gate` id.
  h-tr-em-listener:
    name: "h_tr_em Regression Gate (LIMIT-13)"
    needs: [h-tr-em-regression-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Verify upstream result
        run: |
          set -uo pipefail
          RESULT="${{ needs.h-tr-em-regression-gate.result }}"
          echo "h-tr-em-regression-gate upstream result: ${RESULT}"
          if [[ "${RESULT}" != "success" && "${RESULT}" != "skipped" ]]; then
            echo "::error::h_tr_em regression gate upstream did not succeed: ${RESULT}"
            exit 1
          fi
          echo "h_tr_em Regression Gate (LIMIT-13) PASS"
