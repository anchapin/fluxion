# Nightly Profile-Guided Optimization (PGO) build
#
# Implements the pipeline accepted in issue #2563:
#   1. Build the workspace with `-Cprofile-generate` so the resulting
#      binary drops `.profraw` files into target/pgo/raw/ as it runs.
#   2. Run the ASHRAE 140 validation suite as the training workload so
#      the 5R1C/9R4C solver hot paths and the conduction transfer
#      functions receive representative edge/branch counts.
#   3. Merge the raw profile data with `llvm-profdata merge`.
#   4. Rebuild with `-Cprofile-use` to produce a PGO-optimized binary.
#
# The pipeline is orchestrated by scripts/build_pgo.sh so the same
# command runs locally and in CI. The resulting binary is uploaded as
# an artifact for manual inspection.

name: PGO Nightly Build

on:
  schedule:
    # 02:30 UTC, 30 minutes after the nightly_validation job so we
    # benefit from any cached Cargo artifacts it produced.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: pgo-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pgo-build:
    name: PGO build & profile-use artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - name: Free disk space (precaution)
        # PGO doubles disk usage (generate build + use build) and
        # additional artifacts can push runners past the 14 GB cap.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust (stable)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default --component rustfmt,clippy,llvm-tools-preview

      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pgo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pgo-
            ${{ runner.os }}-cargo-

      - name: Disk space check
        run: ./scripts/disk-space-check.sh --cleanup || true

      - name: Run PGO pipeline
        id: pgo
        # The PGO script returns non-zero on build failure (exit 2),
        # profile-merge failure (exit 3), or bad arguments (exit 1).
        run: |
          set -o pipefail
          ./scripts/build_pgo.sh --clean 2>&1 | tee pgo_pipeline.log
        continue-on-error: true

      - name: Smoke-test PGO binary
        if: steps.pgo.outcome == 'success'
        # Run the optimized binary in --help mode to verify the link
        # succeeded and the resulting executable actually launches.
        run: |
          set -e
          BINARY=./target/release/fluxion
          if [[ ! -x "$BINARY" ]]; then
            echo "::error::PGO binary missing at $BINARY"
            exit 1
          fi
          "$BINARY" --help >/dev/null || true
          echo "PGO binary launched OK"

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pgo-pipeline-log
          path: |
            pgo_pipeline.log
            target/pgo/logs/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload PGO profile data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pgo-profile-data
          path: |
            target/pgo/merged/profdata
            target/pgo/raw/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload PGO-optimized binary
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pgo-optimized-fluxion
          path: |
            target/release/fluxion
            target/release/fluxion-rest
            target/release/run_ashrae_validation
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if pipeline returned non-zero
        if: steps.pgo.outcome == 'failure'
        run: |
          echo "::error::PGO pipeline failed — see uploaded log artifact"
          exit 1