name: Architecture Drift Detection

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'src/**/*.rs'
      - 'fluxion-core/**/*.rs'
      - 'ARCHITECTURE.md'
      - 'scripts/check_architecture_drift.py'
      - 'scripts/check_doc_drift.py'
      - 'scripts/check_stub_modules.py'
      - 'scripts/check_orphan_modules.py'
      - 'fluxion-core/src/**/*.rs'
      - 'fluxion-grid/src/**/*.rs'
      - 'fluxion-behavior/src/**/*.rs'
      - 'fluxion-wasm/src/**/*.rs'
      - 'fluxion-cfd/src/**/*.rs'
      - 'fluxion-city/src/**/*.rs'
      - 'fluxion-fluid/src/**/*.rs'
      - 'fluxion-mcp/src/**/*.rs'
      - 'crates/fluxion-twin/**/*.rs'
      - 'crates/fluxion-toon/**/*.rs'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN grants (Issue #2526). The check-drift job
# escalates to issues/pull-requests write only where posting a comment needs it.
permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    # Job name must match `release_gates.yaml::ci.required_checks` and
    # `ci.workflow_index` exactly (GitHub branch protection matches the
    # emitted `jobs.<id>.name` verbatim; the sync script
    # `scripts/check_required_checks_sync.py` enforces this invariant).
    # Issue #3116 closes the canonical-vs-suffix drift where this
    # previously read "Check ARCHITECTURE.md drift" and was matched only
    # via the sync script's `len(jobs) == 1 and workflow_name == job_name`
    # fallback (which never satisfied GitHub's exact-string contexts).
    name: Architecture Drift Detection
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run architecture drift detection
        run: python3 scripts/check_architecture_drift.py

      # Issue #2895: doc-comments can claim a cycle "remains" even after
      # the cycle participants have become one-line `pub use` re-export
      # shims. `check_architecture_drift.py` reads the *code*, not the
      # doc-comments; this companion script closes that gap.
      - name: Run doc-comment cycle drift detection (issue #2895)
        run: python3 scripts/check_doc_drift.py

      - name: Run stub-module detector (Issue #2896)
        run: python3 scripts/check_stub_modules.py

      - name: Run orphan-modules detector (Issue #2875, #3073)
        run: python3 scripts/check_orphan_modules.py

      - name: Comment on PR if drift detected (on PR trigger only)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Architecture Drift Detected\n\nThe drift detection script found inconsistencies between ARCHITECTURE.md and the source code.\n\n**Either:**\n1. Update ARCHITECTURE.md to document the new trait/module\n2. Fix the code to match the documented architecture\n3. Add false-positive names to \`skip_traits\` in \`scripts/check_architecture_drift.py\`\n\nRun \`python3 scripts/check_architecture_drift.py\` locally to see details.`
            })
