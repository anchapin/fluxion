name: Performance Dashboard

# Issue #2550: split the dashboard workflow so the PR-blocking benchmark job
# builds with default features only (~3 min cold-cache) instead of
# `--all-features` (~25 min cold-cache). The slow `--all-features` build
# pulls in `ort` (CUDA, TensorRT), `pyo3`, `napi`, `rdkafka`, `fluxion-city`,
# `fluxion-cfd`, and `gauge-solver`, and only runs on the nightly schedule
# plus manual workflow_dispatch — never as a PR blocker.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly at 02:00 UTC, well before the mutation-nightly job at 07:00 UTC
    # so the heavy `--all-features` build does not contend for self-hosted
    # runner disk / RAM with mutation testing.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_regression_check:
        description: 'Skip regression threshold check'
        required: false
        default: 'false'
        type: boolean
      compare_sha1:
        description: 'First SHA for manual comparison (leave empty to use current)'
        required: false
        default: ''
        type: string
      compare_sha2:
        description: 'Second SHA for manual comparison (leave empty to use current)'
        required: false
        default: ''
        type: string

concurrency:
  group: perf-dashboard-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN default (Issue #2526). The publish-dashboard job
# pushes the regenerated dashboard to the gh-pages branch and therefore escalates
# via its own job-level `permissions: contents: write` block.
permissions:
  contents: read

jobs:
  # =========================================================================
  # bench-default — REQUIRED PR check.
  # Builds with default features only (matches what a user gets from
  # `cargo install fluxion`). Cold-cache compile time: ~3 min. Warm-cache:
  # <1 min. This is the fast path the dashboard regression check consumes.
  # =========================================================================
  bench-default:
    name: Bench (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      # Swatinem/rust-cache@v2 automatically differentiates cache entries
      # by the rustc invocation (feature flags included), so the
      # `--all-features` cache from `bench-all-features` cannot poison
      # the default-features cache and vice versa.
      - name: Cache cargo (default features)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      - name: Build release (default features)
        run: cargo build --release

      - name: Run benchmarks (default features)
        run: cargo bench --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Generate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          # Parse criterion JSON output from benchmark_output.txt
          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          # Extract all JSON blocks from criterion output
          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          # Find the benchmark results
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          # Build summary
          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "default",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          # Save summary
          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          # Save full output for artifact
          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Upload benchmark artifacts (default features)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bench-default-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            target/criterion/**/*
          retention-days: 30

  # =========================================================================
  # published-crate-bench — main push only.
  # Tracks the user-facing performance budget by re-running the default-
  # features benchmark on every main commit. Produces a distinct artifact
  # (`published-crate-bench-results-…`) so the dashboard can isolate the
  # "what users actually get via cargo install" perf signal from PR-noise
  # `bench-default` runs. NOT a PR blocker; runs only on push to main.
  # =========================================================================
  published-crate-bench:
    name: Published Crate Bench
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    needs: bench-default

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Cache cargo (default features)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      - name: Build release (default features, published-crate scenario)
        run: cargo build --release

      - name: Run benchmarks (published-crate, default features)
        run: cargo bench --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Generate published-crate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "default-published-crate",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Upload published-crate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: published-crate-bench-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            target/criterion/**/*
          retention-days: 90

  # =========================================================================
  # bench-all-features — nightly schedule + manual dispatch only.
  # NOT a PR blocker. This is the only job that compiles the full optional
  # dependency surface (CUDA, TensorRT, pyo3, napi, rdkafka, fluxion-city,
  # fluxion-cfd, gauge-solver, dhat). The `dhat` allocation-tracking test
  # requires the `dhat` feature, so it lives here too. Cold-cache compile
  # time: ~25 min. Warm-cache: ~5 min.
  # =========================================================================
  bench-all-features:
    name: Bench (all features)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      # Separate cache namespace so the heavy `--all-features` build does
      # not evict or get evicted by the default-features cache.
      - name: Cache cargo (all features)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: perf-dashboard-all-features
          cache-on-failure: true

      - name: Build release (--all-features)
        run: cargo build --release --all-features

      - name: Run all-feature benchmarks
        run: cargo bench --all-features --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Run allocation tracking (dhat, requires dhat feature from --all-features)
        run: cargo test test_allocation_tracking --release --all-features -- --nocapture 2>&1 | tee dhat_output.txt

      - name: Generate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "all-features",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Parse dhat output
        run: |
          python3 << 'EOF'
          import re
          import json
          import os

          with open('dhat_output.txt', 'r') as f:
              content = f.read()

          # Extract dhat heap summary
          # Looking for patterns like: "Total:     3,488,752 bytes"
          total_match = re.search(r'Total:\s+([\d,]+)\s+bytes', content)
          allocated_match = re.search(r'Allocated:\s+([\d,]+)\s+bytes', content)

          dhat_summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "total_bytes": int(total_match.group(1).replace(',', '')) if total_match else 0,
              "allocated_bytes": int(allocated_match.group(1).replace(',', '')) if allocated_match else 0,
          }

          with open('dhat_summary.json', 'w') as f:
              json.dump(dhat_summary, f, indent=2)

          if total_match:
              print(f"Total heap: {total_match.group(1)} bytes")
          if allocated_match:
              print(f"Allocated: {allocated_match.group(1)} bytes")
          EOF

      - name: Upload benchmark artifacts (all features)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bench-all-features-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            dhat_summary.json
            dhat_output.txt
            target/criterion/**/*
          retention-days: 30

  # =========================================================================
  # Regression Check — PR + push to main.
  # Depends on `bench-default` only (NOT `bench-all-features`). The
  # regression check consumes the current `bench-default-results-*`
  # artifact, downloads the previous successful run's stable
  # `benchmark-results` artifact (uploaded by `publish-dashboard`), and
  # diffs the two. Skips on first PR with no baseline.
  # =========================================================================
  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bench-default
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download current benchmark data (default features)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bench-default-results-${{ github.run_id }}
          path: current_results
        continue-on-error: true

      - name: Download previous benchmark data (default features, from main)
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11  # v6
        with:
          workflow: performance_dashboard.yml
          name: benchmark-results
          path: previous_results
          workflow_conclusion_filter: success
        continue-on-error: true

      - name: Generate current benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          current_path = Path('current_results/benchmark_summary.json')
          if not current_path.exists():
              print('No current benchmark results found; skipping regression check.')
              with open('current_benchmark.json', 'w') as f:
                  json.dump({}, f)
              sys_exit_0 = True
              if sys_exit_0:
                  raise SystemExit(0)

          with open(current_path, 'r') as f:
              data = json.load(f)

          current = {}
          for b in data.get('benchmarks', []):
              if isinstance(b, dict) and 'name' in b and 'value' in b:
                  current[b['name']] = b['value']

          with open('current_benchmark.json', 'w') as f:
              json.dump(current, f, indent=2)
          print(f"Current: {len(current)} benchmarks")
          EOF

      - name: Run regression check
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          # Load current results
          with open('current_benchmark.json', 'r') as f:
              current = json.load(f)

          # Load previous results if available
          previous = {}
          prev_path = 'previous_results/benchmark_summary.json'
          skip_check = False

          if os.path.exists(prev_path):
              with open(prev_path, 'r') as f:
                  prev_data = json.load(f)
                  for b in prev_data.get('benchmarks', []):
                      if 'name' in b and 'value' in b:
                          previous[b['name']] = b['value']
              print(f"Previous: {len(previous)} benchmarks")
          else:
              print("⚠️  No previous benchmark results found on main branch.")
              print("   This is expected for the first PR to a new branch.")
              print("   Skipping regression check with exit 0.")
              skip_check = True

          # If skipping, write empty result and exit 0
          if skip_check:
              result = {
                  "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
                  "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
                  "skipped": True,
                  "reason": "no_main_branch_baseline",
              }
              with open('regression_check.json', 'w') as f:
                  json.dump(result, f, indent=2)
              sys.exit(0)

          # Check for regressions (5% threshold)
          REGRESSION_THRESHOLD = 5.0  # percentage
          regressions = []
          improvements = []

          for name, value in current.items():
              if name in previous and previous[name] > 0:
                  change_pct = ((value - previous[name]) / previous[name]) * 100
                  if change_pct > REGRESSION_THRESHOLD:
                      regressions.append({
                          "name": name,
                          "previous": previous[name],
                          "current": value,
                          "change_pct": change_pct,
                      })
                  elif change_pct < -REGRESSION_THRESHOLD:
                      improvements.append({
                          "name": name,
                          "previous": previous[name],
                          "current": value,
                          "change_pct": change_pct,
                      })

          result = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "threshold_pct": REGRESSION_THRESHOLD,
              "regressions": regressions,
              "improvements": improvements,
              "has_regressions": len(regressions) > 0,
          }

          with open('regression_check.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"\nRegression Check Results:")
          print(f"  Threshold: {REGRESSION_THRESHOLD}%")
          print(f"  Regressions: {len(regressions)}")
          print(f"  Improvements: {len(improvements)}")

          if regressions:
              print(f"\nRegressions detected:")
              for r in regressions[:10]:
                  print(f"  {r['name']}: {r['previous']:.2f} -> {r['current']:.2f} ({r['change_pct']:+.1f}%)")
              sys.exit(1)
          else:
              print("\nNo significant regressions detected")
          EOF

      - name: Display regression results
        run: |
          if [ -f regression_check.json ]; then
            echo "## Performance Regression Check" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat regression_check.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on regression
        if: failure() && github.event_name != 'workflow_dispatch'
        run: |
          echo "❌ Performance regression detected (>5% slowdown)"
          echo "Please investigate the regressions before merging."
          exit 1

      - name: Allow workflow dispatch override
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          echo "⚠️ Performance regression detected but workflow was manually dispatched"
          echo "Skipping failure due to manual trigger"
          exit 0

  # =========================================================================
  # dhat-alloc-budget — PR-gated allocation-budget gate for the BatchOracle
  # hot loop (Issue #2709).
  # Runs the feature-gated `dhat_alloc_budget` integration test, which installs
  # `dhat::Alloc` as the global allocator and asserts a hard ceiling on the heap
  # allocations produced by one reduced `BatchOracle::evaluate_population` run
  # (10 configs × 8 760 timesteps). The budget is a ceiling on current
  # behaviour; #2687 will ratchet it down. This is the PR-level allocation-count
  # gate that was missing per #2709 — previously dhat only ran in
  # `bench-all-features` (nightly + manual dispatch), so the ~22 M-alloc/yr
  # BatchOracle hot loop had no PR-time regression guard.
  # Runs on PRs, main pushes, and manual dispatch (not nightly schedule, which
  # already covers dhat via `bench-all-features`).
  # =========================================================================
  dhat-alloc-budget:
    name: dhat Alloc Budget (BatchOracle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Cache cargo (dhat)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: perf-dhat-alloc-budget
          cache-on-failure: true

      - name: Run dhat allocation-budget test
        # `--features dhat` only (no ort/pyo3/napi) keeps the build light. The
        # test is #[ignore]'d so it only runs under --include-ignored; measured
        # at ~2.2 M blocks / ~17.8 MB over ~4 s of runtime. Allocation count is
        # structurally determined (identical across --release and --profile ci).
        run: |
          cargo test --release -p fluxion --features dhat --test dhat_alloc_budget -- --nocapture --include-ignored

      - name: Summary
        if: always()
        run: |
          echo "## dhat Alloc Budget (BatchOracle, #2709)" >> $GITHUB_STEP_SUMMARY
          echo "Ceiling: 2,650,000 blocks / 21,500,000 bytes over 10 configs × 8760 timesteps." >> $GITHUB_STEP_SUMMARY
          echo "Measured baseline: 2,191,396 blocks (≈219K/config), 17,782,528 bytes." >> $GITHUB_STEP_SUMMARY
          echo "See \`tests/dhat_alloc_budget.rs\` for how to ratchet the budget down after #2687." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Publish Dashboard — main push only.
  # Depends on `bench-default` + `published-crate-bench` (and consumes any
  # `bench-all-features-results-*` artifact that happens to be in the same
  # run, when nightly + main push overlap).
  # =========================================================================
  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [bench-default, published-crate-bench]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d  # v4

      - name: Download default-feature benchmark artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: default_benchmark_data
          pattern: bench-default-results-*
          merge-multiple: true

      - name: Download published-crate benchmark artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: published_crate_data
          pattern: published-crate-bench-results-*
          merge-multiple: true

      - name: Generate dashboard data
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          benchmark_files = list(Path('default_benchmark_data').glob('**/benchmark_summary.json')) \
                          + list(Path('published_crate_data').glob('**/benchmark_summary.json'))
          dhat_files = list(Path('default_benchmark_data').glob('**/dhat_summary.json'))

          all_benchmarks = []
          all_dhat = []

          for f in benchmark_files:
              with open(f) as fp:
                  data = json.load(fp)
                  if isinstance(data, dict) and 'benchmarks' in data:
                      all_benchmarks.append(data)

          for f in dhat_files:
              with open(f) as fp:
                  data = json.load(fp)
                  all_dhat.append(data)

          # Build dashboard data
          dashboard_data = {
              "last_updated": datetime.now().isoformat(),
              "total_runs": len(all_benchmarks),
              "benchmarks": all_benchmarks,
              "dhat": all_dhat,
          }

          os.makedirs('benchmark_data', exist_ok=True)
          with open('benchmark_data/dashboard_data.json', 'w') as f:
              json.dump(dashboard_data, f, indent=2)

          print(f"Processed {len(all_benchmarks)} benchmark runs")
          print(f"Processed {len(all_dhat)} dhat runs")
          EOF

      - name: Generate HTML dashboard
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          # Load dashboard data
          with open('benchmark_data/dashboard_data.json', 'r') as f:
              data = json.load(f)

          benchmarks = data.get('benchmarks', [])
          dhat_data = data.get('dhat', [])

          # Generate benchmark history by name
          benchmark_history = {}
          for run in benchmarks:
              commit = run.get('commit', 'unknown')
              profile = run.get('feature_profile', 'unknown')
              for b in run.get('benchmarks', []):
                  name = b.get('name', 'unknown')
                  if name not in benchmark_history:
                      benchmark_history[name] = []
                  benchmark_history[name].append({
                      'commit': commit,
                      'profile': profile,
                      'value': b.get('value', 0),
                      'unit': b.get('unit', 'ns'),
                  })

          # Generate HTML
          html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Fluxion Performance Dashboard</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .header { max-width: 1200px; margin: 0 auto 30px; }
                  h1 { color: #58a6ff; margin-bottom: 10px; }
                  .subtitle { color: #8b949e; }
                  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
                  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
                  h2 { color: #58a6ff; font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
                  table { width: 100%; border-collapse: collapse; }
                  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; }
                  th { color: #8b949e; font-weight: 500; }
                  .metric { font-family: 'SF Mono', Monaco, monospace; }
                  .regression { color: #f85149; }
                  .improvement { color: #3fb950; }
                  .chart { height: 200px; background: #0d1117; margin-top: 10px; }
                  .chart-bar { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
                  .bar { background: #58a6ff; min-width: 4px; flex: 1; border-radius: 2px 2px 0 0; }
                  .bar.worse { background: #f85149; }
                  .bar.better { background: #3fb950; }
                  .dhat-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
                  .dhat-metric { background: #0d1117; padding: 15px; border-radius: 6px; text-align: center; }
                  .dhat-value { font-size: 1.5em; font-weight: bold; color: #58a6ff; }
                  .dhat-label { color: #8b949e; font-size: 0.9em; margin-top: 5px; }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>Fluxion Performance Dashboard</h1>
                  <p class="subtitle">Last updated: ''' + data['last_updated'] + ''' | Total runs: ''' + str(data['total_runs']) + '''</p>
              </div>
              <div class="grid">
                  <div class="card">
                      <h2>Benchmark Results</h2>
                      <table>
                          <thead>
                              <tr><th>Benchmark</th><th>Latest</th><th>Unit</th></tr>
                          </thead>
                          <tbody>
          '''

          for name, history in sorted(benchmark_history.items()):
              if history:
                  latest = history[-1]
                  html += f'''<tr>
                      <td>{name}</td>
                      <td class="metric">{latest['value']:.2f}</td>
                      <td>{latest['unit']}</td>
                  </tr>
          '''

          html += '''</tbody></table></div>'''

          if dhat_data:
              latest_dhat = dhat_data[-1]
              html += f'''<div class="card">
                  <h2>Memory Usage (dhat)</h2>
                  <div class="dhat-summary">
                      <div class="dhat-metric">
                          <div class="dhat-value">{latest_dhat.get('total_bytes', 0) / 1024 / 1024:.2f}</div>
                          <div class="dhat-label">Total Heap (MB)</div>
                      </div>
                      <div class="dhat-metric">
                          <div class="dhat-value">{latest_dhat.get('allocated_bytes', 0) / 1024 / 1024:.2f}</div>
                          <div class="dhat-label">Allocated (MB)</div>
                      </div>
                  </div>
              </div>'''

          html += '''</div></body></html>'''

          with open('benchmark_data/index.html', 'w') as f:
              f.write(html)

          print("Generated benchmark_data/index.html")
          EOF

      - name: Upload to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./benchmark_data
          publish_branch: gh-pages
          destination_dir: perf

      - name: Deploy benchmark data JSON
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./benchmark_data
          publish_branch: gh-pages
          destination_dir: perf/data
          only_commit_hash: false

      # Stable artifact name (no run_id suffix) so the next run's
      # regression-check can download the previous baseline via
      # dawidd6/action-download-artifact with name: benchmark-results.
      - name: Upload latest benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results
          path: |
            benchmark_data/benchmark_summary.json
            benchmark_data/dhat_summary.json
          retention-days: 90

      - name: Display dashboard URL
        run: |
          echo "## Performance Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard published to: https://anchapin.github.io/fluxion/perf/" >> $GITHUB_STEP_SUMMARY