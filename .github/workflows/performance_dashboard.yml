name: Performance Dashboard

# Issue #2550: split the dashboard workflow so the PR-blocking benchmark job
# builds with default features only (~3 min cold-cache) instead of
# `--all-features` (~25 min cold-cache). The slow `--all-features` build
# pulls in `ort` (CUDA, TensorRT), `pyo3`, `napi`, `rdkafka`, `fluxion-city`,
# `fluxion-cfd`, and `gauge-solver`, and only runs on the nightly schedule
# plus manual workflow_dispatch — never as a PR blocker.

# Issue #3355: expand upstream scope to `develop` so the Fluxion Performance
# Gate listener job (`fluxion-performance-gate` in `ashrae_validation.yml`)
# and the PR-blocking perf gates (Absolute / Multi-Zone / Hybrid / Cold Start,
# jobs `absolute-perf-gate`, `multi-zone-perf-gate`, `hybrid-perf-gate`,
# `multi-zone-cold-start-gate`) fire for PRs targeting `develop`. These
# were previously main-only, leaving develop with zero perf coverage and
# forcing every merge through `gh pr merge --admin`.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly at 02:00 UTC, well before the mutation-nightly job at 07:00 UTC
    # so the heavy `--all-features` build does not contend for self-hosted
    # runner disk / RAM with mutation testing.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_regression_check:
        description: 'Skip regression threshold check'
        required: false
        default: 'false'
        type: boolean
      compare_sha1:
        description: 'First SHA for manual comparison (leave empty to use current)'
        required: false
        default: ''
        type: string
      compare_sha2:
        description: 'Second SHA for manual comparison (leave empty to use current)'
        required: false
        default: ''
        type: string

concurrency:
  group: perf-dashboard-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN default (Issue #2526). The publish-dashboard job
# pushes the regenerated dashboard to the gh-pages branch and therefore escalates
# via its own job-level `permissions: contents: write` block.
permissions:
  contents: read

jobs:
  # =========================================================================
  # bench-default — REQUIRED PR check.
  # Builds with default features only (matches what a user gets from
  # `cargo install fluxion`). Cold-cache compile time: ~3 min. Warm-cache:
  # <1 min. This is the fast path the dashboard regression check consumes.
  # =========================================================================
  bench-default:
    name: Bench (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      # Swatinem/rust-cache@v2 automatically differentiates cache entries
      # by the rustc invocation (feature flags included), so the
      # `--all-features` cache from `bench-all-features` cannot poison
      # the default-features cache and vice versa.
      - name: Cache cargo (default features)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      - name: Build release (default features)
        run: cargo build --release

      - name: Run benchmarks (default features)
        run: cargo bench --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Generate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          # Parse criterion JSON output from benchmark_output.txt
          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          # Extract all JSON blocks from criterion output
          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          # Find the benchmark results
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          # Build summary
          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "default",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          # Save summary
          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          # Save full output for artifact
          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Upload benchmark artifacts (default features)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-default-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            target/criterion/**/*
          retention-days: 30

  # =========================================================================
  # published-crate-bench — main push only.
  # Tracks the user-facing performance budget by re-running the default-
  # features benchmark on every main commit. Produces a distinct artifact
  # (`published-crate-bench-results-…`) so the dashboard can isolate the
  # "what users actually get via cargo install" perf signal from PR-noise
  # `bench-default` runs. NOT a PR blocker; runs only on push to main.
  # =========================================================================
  published-crate-bench:
    name: Published Crate Bench
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    needs: bench-default

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo (default features)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      - name: Build release (default features, published-crate scenario)
        run: cargo build --release

      - name: Run benchmarks (published-crate, default features)
        run: cargo bench --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Generate published-crate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "default-published-crate",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Upload published-crate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: published-crate-bench-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            target/criterion/**/*
          retention-days: 90

  # =========================================================================
  # bench-all-features — nightly schedule + manual dispatch only.
  # NOT a PR blocker. This is the only job that compiles the full optional
  # dependency surface (CUDA, TensorRT, pyo3, napi, rdkafka, fluxion-city,
  # fluxion-cfd, gauge-solver, dhat). The `dhat` allocation-tracking test
  # requires the `dhat` feature, so it lives here too. Cold-cache compile
  # time: ~25 min. Warm-cache: ~5 min.
  # =========================================================================
  bench-all-features:
    name: Bench (all features)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      # Separate cache namespace so the heavy `--all-features` build does
      # not evict or get evicted by the default-features cache.
      - name: Cache cargo (all features)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-all-features
          cache-on-failure: true

      - name: Build release (--all-features)
        run: cargo build --release --all-features

      - name: Run all-feature benchmarks
        run: cargo bench --all-features --no-fail-fast -- --output-format=json 2>&1 | tee benchmark_output.txt

      - name: Run allocation tracking (dhat, requires dhat feature from --all-features)
        run: cargo test test_allocation_tracking --release --all-features -- --nocapture 2>&1 | tee dhat_output.txt

      - name: Generate benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          with open('benchmark_output.txt', 'r') as f:
              content = f.read()

          benchmarks = []
          current_benchmark = []
          in_json = False
          json_depth = 0

          for line in content.split('\n'):
              if '"benchmarks"' in line:
                  in_json = True
              if in_json:
                  current_benchmark.append(line)
                  json_depth += line.count('{') - line.count('}')
                  if json_depth == 0 and current_benchmark:
                      try:
                          json_str = '\n'.join(current_benchmark)
                          data = json.loads(json_str)
                          if 'benchmarks' in data:
                              benchmarks.extend(data['benchmarks'])
                      except:
                          pass
                      current_benchmark = []
                      in_json = '"benchmarks"' in '\n'.join(current_benchmark + [line])

          summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "feature_profile": "all-features",
              "benchmarks": []
          }

          for b in benchmarks:
              if isinstance(b, dict):
                  summary["benchmarks"].append({
                      "name": b.get("name", "unknown"),
                      "value": b.get("median", {}).get("value", 0) if isinstance(b.get("median"), dict) else b.get("median", 0),
                      "unit": b.get("unit", "ns"),
                  })

          with open('benchmark_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          with open('benchmark_full_output.txt', 'w') as f:
              f.write(content)

          print(f"Extracted {len(summary['benchmarks'])} benchmark results")
          for b in summary["benchmarks"][:5]:
              print(f"  {b['name']}: {b['value']:.2f} {b['unit']}")
          EOF

      - name: Parse dhat output
        run: |
          python3 << 'EOF'
          import re
          import json
          import os

          with open('dhat_output.txt', 'r') as f:
              content = f.read()

          # Extract dhat heap summary
          # Looking for patterns like: "Total:     3,488,752 bytes"
          total_match = re.search(r'Total:\s+([\d,]+)\s+bytes', content)
          allocated_match = re.search(r'Allocated:\s+([\d,]+)\s+bytes', content)

          dhat_summary = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "total_bytes": int(total_match.group(1).replace(',', '')) if total_match else 0,
              "allocated_bytes": int(allocated_match.group(1).replace(',', '')) if allocated_match else 0,
          }

          with open('dhat_summary.json', 'w') as f:
              json.dump(dhat_summary, f, indent=2)

          if total_match:
              print(f"Total heap: {total_match.group(1)} bytes")
          if allocated_match:
              print(f"Allocated: {allocated_match.group(1)} bytes")
          EOF

      - name: Upload benchmark artifacts (all features)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-all-features-results-${{ github.run_id }}
          path: |
            benchmark_summary.json
            benchmark_full_output.txt
            dhat_summary.json
            dhat_output.txt
            target/criterion/**/*
          retention-days: 30

  # =========================================================================
  # Regression Check — PR + push to main.
  # Depends on `bench-default` only (NOT `bench-all-features`). The
  # regression check consumes the current `bench-default-results-*`
  # artifact, downloads the previous successful run's stable
  # `benchmark-results` artifact (uploaded by `publish-dashboard`), and
  # diffs the two. Skips on first PR with no baseline.
  # =========================================================================
  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: bench-default
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download current benchmark data (default features)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bench-default-results-${{ github.run_id }}
          path: current_results
        continue-on-error: true

      - name: Download previous benchmark data (default features, from main)
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7  # v24
        with:
          workflow: performance_dashboard.yml
          name: benchmark-results
          path: previous_results
          workflow_conclusion_filter: success
        continue-on-error: true

      - name: Generate current benchmark summary
        run: |
          python3 << 'EOF'
          import json
          import re
          import os
          from pathlib import Path

          current_path = Path('current_results/benchmark_summary.json')
          if not current_path.exists():
              print('No current benchmark results found; skipping regression check.')
              with open('current_benchmark.json', 'w') as f:
                  json.dump({}, f)
              sys_exit_0 = True
              if sys_exit_0:
                  raise SystemExit(0)

          with open(current_path, 'r') as f:
              data = json.load(f)

          current = {}
          for b in data.get('benchmarks', []):
              if isinstance(b, dict) and 'name' in b and 'value' in b:
                  current[b['name']] = b['value']

          with open('current_benchmark.json', 'w') as f:
              json.dump(current, f, indent=2)
          print(f"Current: {len(current)} benchmarks")
          EOF

      - name: Run regression check
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          # Load current results
          with open('current_benchmark.json', 'r') as f:
              current = json.load(f)

          # Load previous results if available
          previous = {}
          prev_path = 'previous_results/benchmark_summary.json'
          skip_check = False

          if os.path.exists(prev_path):
              with open(prev_path, 'r') as f:
                  prev_data = json.load(f)
                  for b in prev_data.get('benchmarks', []):
                      if 'name' in b and 'value' in b:
                          previous[b['name']] = b['value']
              print(f"Previous: {len(previous)} benchmarks")
          else:
              print("⚠️  No previous benchmark results found on main branch.")
              print("   This is expected for the first PR to a new branch.")
              print("   Skipping regression check with exit 0.")
              skip_check = True

          # If skipping, write empty result and exit 0
          if skip_check:
              result = {
                  "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
                  "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
                  "skipped": True,
                  "reason": "no_main_branch_baseline",
              }
              with open('regression_check.json', 'w') as f:
                  json.dump(result, f, indent=2)
              sys.exit(0)

          # Check for regressions (5% threshold)
          REGRESSION_THRESHOLD = 5.0  # percentage
          regressions = []
          improvements = []

          for name, value in current.items():
              if name in previous and previous[name] > 0:
                  change_pct = ((value - previous[name]) / previous[name]) * 100
                  if change_pct > REGRESSION_THRESHOLD:
                      regressions.append({
                          "name": name,
                          "previous": previous[name],
                          "current": value,
                          "change_pct": change_pct,
                      })
                  elif change_pct < -REGRESSION_THRESHOLD:
                      improvements.append({
                          "name": name,
                          "previous": previous[name],
                          "current": value,
                          "change_pct": change_pct,
                      })

          result = {
              "timestamp": os.environ.get('GITHUB_RUN_ID', 'local'),
              "commit": os.environ.get('GITHUB_SHA', 'unknown')[:8],
              "threshold_pct": REGRESSION_THRESHOLD,
              "regressions": regressions,
              "improvements": improvements,
              "has_regressions": len(regressions) > 0,
          }

          with open('regression_check.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"\nRegression Check Results:")
          print(f"  Threshold: {REGRESSION_THRESHOLD}%")
          print(f"  Regressions: {len(regressions)}")
          print(f"  Improvements: {len(improvements)}")

          if regressions:
              print(f"\nRegressions detected:")
              for r in regressions[:10]:
                  print(f"  {r['name']}: {r['previous']:.2f} -> {r['current']:.2f} ({r['change_pct']:+.1f}%)")
              sys.exit(1)
          else:
              print("\nNo significant regressions detected")
          EOF

      - name: Display regression results
        run: |
          if [ -f regression_check.json ]; then
            echo "## Performance Regression Check" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat regression_check.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on regression
        if: failure() && github.event_name != 'workflow_dispatch'
        run: |
          echo "❌ Performance regression detected (>5% slowdown)"
          echo "Please investigate the regressions before merging."
          exit 1

      - name: Allow workflow dispatch override
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          echo "⚠️ Performance regression detected but workflow was manually dispatched"
          echo "Skipping failure due to manual trigger"
          exit 0

  # =========================================================================
  # absolute-perf-gate — PR-blocking ABSOLUTE performance floor (Issue #2693).
  #
  # `release_gates.yaml` defines absolute thresholds — throughput ≥ 150
  # configs/sec, latency ≤ 10 ms/config — but before #2693 these were only
  # evaluated by `performance.yml` on push to main/dev (and by the release
  # checker), never on PRs. The `regression-check` job above is a RELATIVE
  # 5% gate with no absolute floor, so a PR could drop throughput 200→120
  # cfg/s (below the 150 floor yet within 5% of a noisy baseline) and merge.
  #
  # This job closes that gap: it runs the same `performance_regression_test`
  # the release check uses, takes the MEDIAN of 3 runs to suppress shared-
  # runner noise, writes `benchmark_results.json`, and feeds it to
  # `scripts/release_gate_checker.py --benchmark-gates throughput,latency`
  # (the filter restricts evaluation to the two absolute floors this job
  # measures — multi-zone / cross-validation stay with the heavy sweep).
  # The job FAILS if throughput < 150 OR latency > 10.
  #
  # Runner: `ubuntu-latest` (NOT `vars.FLUXION_LINUX_RUNNER`) because the
  # 150 cfg/s floor was calibrated on GitHub-hosted ubuntu-latest (see the
  # comment at `release_gates.yaml` → `benchmark.throughput`). A self-hosted
  # runner would measure a different absolute throughput and make the floor
  # incomparable. `bench-default` / `regression-check` use the same runner
  # for the same reason.
  # =========================================================================
  absolute-perf-gate:
    name: Absolute Perf Gate (Issue #2693)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOTE: intentionally no `needs: bench-default` — this job builds its own
    # release test binary and does not consume any bench-default artifact, so
    # it runs in parallel for a faster PR signal.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo (absolute-perf-gate)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      # Build the release test binary once (shared across all 3 measurement
      # runs). Default features only — matches `bench-default` and what a
      # user gets from `cargo install fluxion`.
      - name: Build release (default features)
        run: cargo build --release

      # Median-of-3 noise suppression. Each run invokes the single
      # `test_performance_regression` test (population = 100), which prints
      # exactly one `Throughput:` and one `Latency per config:` line. We
      # tolerate a nonzero test exit (e.g. a baseline-regression panic that
      # does not reflect an absolute-gate breach) with `|| true`; the
      # throughput/latency lines are printed before the baseline check.
      - name: Run benchmark (median of 3)
        run: |
          rm -f run_*.txt
          for i in 1 2 3; do
            echo "=== measurement run ${i}/3 ==="
            cargo test --test performance_regression_test --release test_performance_regression -- --nocapture > "run_${i}.txt" 2>&1 || true
          done

          python3 << 'EOF'
          import glob
          import json
          import re
          import statistics
          import sys

          throughput_re = re.compile(r'Throughput:\s*([\d.]+)\s*configs/sec')
          latency_re = re.compile(r'Latency per config:\s*([\d.]+)ms')

          throughputs, latencies = [], []
          for path in sorted(glob.glob('run_*.txt')):
              txt = open(path, errors='replace').read()
              t = throughput_re.findall(txt)
              l = latency_re.findall(txt)
              if t and l:
                  throughputs.append(float(t[-1]))
                  latencies.append(float(l[-1]))
                  print(f"{path}: throughput={t[-1]} cfg/s, latency={l[-1]} ms")
              else:
                  print(f"WARNING: {path} produced no parseable metrics")

          if len(throughputs) < 2:
              print("ERROR: fewer than 2 successful measurement runs; cannot compute a stable median.")
              print("This usually means a compile error or a runtime panic before measurement.")
              for path in sorted(glob.glob('run_*.txt')):
                  print(f"\n--- {path} (first 2000 chars) ---")
                  print(open(path, errors='replace').read()[:2000])
              sys.exit(2)

          med_throughput = statistics.median(throughputs)
          med_latency = statistics.median(latencies)

          print(f"\nSamples: throughput={throughputs}")
          print(f"         latency={latencies}")
          print(f"Median throughput: {med_throughput:.1f} configs/sec")
          print(f"Median latency:    {med_latency:.3f} ms/config")

          results = {
              "metrics": {
                  "throughput_configs_per_sec": med_throughput,
                  "latency_ms_per_config": med_latency,
              },
              "samples": {
                  "throughput": throughputs,
                  "latency": latencies,
                  "runs": len(throughputs),
                  "strategy": "median-of-3",
              },
          }
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          print("\nWrote benchmark_results.json")
          EOF

      # Evaluate the ABSOLUTE floors from release_gates.yaml (throughput ≥ 150
      # cfg/s, latency ≤ 10 ms). --benchmark-gates restricts evaluation to
      # these two gates (issue #2693); the checker exits 1 on any failure.
      # --crate-size-gates 'skip' suppresses the crate_size gate (issue #2930)
      # — this job does not run `cargo package`, so the crate-size measurement
      # is unavailable and the gate would otherwise spuriously fail. The
      # `crate_size` workflow (`.github/workflows/crate-size.yml`) owns that
      # check separately.
      - name: Evaluate absolute gates (150 cfg/s + 10 ms)
        run: |
          python3 scripts/release_gate_checker.py \
            --benchmark-results benchmark_results.json \
            --benchmark-gates throughput,latency \
            --crate-size-gates skip \
            --json --output gate_status.json

      - name: Summary
        if: always()
        run: |
          echo "## Absolute Perf Gate (Issue #2693)" >> $GITHUB_STEP_SUMMARY
          echo "Enforces \`release_gates.yaml\` absolute floors on every PR:" >> $GITHUB_STEP_SUMMARY
          echo "- throughput ≥ 150 configs/sec" >> $GITHUB_STEP_SUMMARY
          echo "- latency ≤ 10 ms/config" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Noise suppression:** median of 3 \`performance_regression_test\` runs (population = 100, release build, default features)." >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`ubuntu-latest\` (the 150 cfg/s floor was calibrated here; self-hosted runners measure a different absolute throughput)." >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: absolute-perf-gate-${{ github.run_id }}
          path: |
            benchmark_results.json
            gate_status.json
            run_*.txt
          retention-days: 30

  # =========================================================================
  # multi-zone-perf-gate — PR-blocking ABSOLUTE multi-zone floor (Issue #2772).
  #
  # The Absolute Perf Gate (#2693) measures against the 150 cfg/s floor on
  # the SINGLE-ZONE analytical path — a much easier target than the
  # multi-zone gate (`release_gates.yaml` →
  # `benchmark.multi_zone.min_configs_per_sec: 10` for a 10-zone model).
  # `benches/multi_zone_throughput.rs:17` documents that population_10k
  # runs at ~28 cfg/sec — only 2.8× margin over the 10 cfg/s floor — yet
  # before this job the slowest regime (pop_10k / pop_1000) was only
  # gated by manual `cargo bench` (and `performance_ci_test.rs` only
  # exercised population=100). A change adding per-zone cost could pass
  # the #2693 absolute gate while blowing the multi-zone margin.
  #
  # This job closes that gap (issue #2772). It runs the
  # `test_multi_zone_performance_regression` test x3, takes the MEDIAN of
  # the parsed `Multi-zone throughput:` lines, writes
  # `benchmark_results.json` with the `multi_zone_throughput` metric, and
  # feeds it to `scripts/release_gate_checker.py --benchmark-gates
  # multi_zone_throughput`. The job FAILS if throughput < 10 cfg/s on the
  # 10-zone pop_1000 workload.
  #
  # Runner: `ubuntu-latest` (NOT `vars.FLUXION_LINUX_RUNNER`) — parity
  # with `absolute-perf-gate`, whose 150 cfg/s floor was calibrated on
  # ubuntu-latest. The multi-zone floor (10 cfg/s) was likewise set on
  # GitHub-hosted ubuntu-latest, so a self-hosted runner would measure a
  # different absolute throughput and make the floor incomparable.
  # =========================================================================
  multi-zone-perf-gate:
    name: Multi-Zone Perf Gate (Issue #2772)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOTE: intentionally no `needs: bench-default` — this job builds its
    # own release test binary and runs in parallel with `absolute-perf-gate`
    # / `bench-default` for a faster PR signal.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo (multi-zone-perf-gate)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      # Build the release test binary once (shared across all 3 measurement
      # runs). Default features only — matches `bench-default` and what a
      # user gets from `cargo install fluxion`.
      - name: Build release (default features)
        run: cargo build --release

      # Median-of-3 noise suppression. Each run invokes the single
      # `test_multi_zone_performance_regression` test (population = 1000 on
      # a 10-zone model), which prints exactly one `Multi-zone throughput:`
      # line. We tolerate a nonzero test exit (e.g. a baseline-regression
      # warning from a `report-only` baseline, which is NOT a failure) with
      # `|| true`; the throughput line is printed before any baseline check.
      #
      # Runtime budget: each pop_1000 / 10-zone run measures ~30-60s on
      # ubuntu-latest; median-of-3 + ~3 min cold-cache build fits inside
      # the 20-min job timeout with margin.
      - name: Run multi-zone benchmark (median of 3)
        run: |
          rm -f run_*.txt
          for i in 1 2 3; do
            echo "=== measurement run ${i}/3 ==="
            cargo test --test performance_regression_test --release test_multi_zone_performance_regression -- --nocapture > "run_${i}.txt" 2>&1 || true
          done

          python3 << 'EOF'
          import glob
          import json
          import re
          import statistics
          import sys

          throughput_re = re.compile(r'Multi-zone throughput:\s*([\d.]+)\s*configs/sec')
          latency_re = re.compile(r'Latency per config:\s*([\d.]+)ms')

          throughputs, latencies = [], []
          for path in sorted(glob.glob('run_*.txt')):
              txt = open(path, errors='replace').read()
              t = throughput_re.findall(txt)
              l = latency_re.findall(txt)
              if t and l:
                  throughputs.append(float(t[-1]))
                  latencies.append(float(l[-1]))
                  print(f"{path}: throughput={t[-1]} cfg/s, latency={l[-1]} ms")
              else:
                  print(f"WARNING: {path} produced no parseable metrics")

          if len(throughputs) < 2:
              print("ERROR: fewer than 2 successful multi-zone measurement runs; cannot compute a stable median.")
              print("This usually means a compile error or a runtime panic before measurement.")
              for path in sorted(glob.glob('run_*.txt')):
                  print(f"\n--- {path} (first 2000 chars) ---")
                  print(open(path, errors='replace').read()[:2000])
              sys.exit(2)

          med_throughput = statistics.median(throughputs)
          med_latency = statistics.median(latencies)

          print(f"\nSamples: throughput={throughputs}")
          print(f"         latency={latencies}")
          print(f"Median multi-zone throughput: {med_throughput:.1f} configs/sec")
          print(f"Median multi-zone latency:    {med_latency:.3f} ms/config")

          results = {
              "metrics": {
                  # `multi_zone_throughput` is the gate name expected by
                  # scripts/release_gate_checker.py (mirrors how it reads
                  # `benchmark.multi_zone.min_configs_per_sec` from
                  # release_gates.yaml). Throughput + latency are also
                  # populated so a future --benchmark-gates filter expansion
                  # picks them up without re-running the job.
                  "multi_zone_throughput": med_throughput,
                  "throughput_configs_per_sec": med_throughput,
                  "latency_ms_per_config": med_latency,
              },
              "samples": {
                  "throughput": throughputs,
                  "latency": latencies,
                  "runs": len(throughputs),
                  "strategy": "median-of-3",
                  "workload": "10-zone ThermalModel, pop_1000, analytical mode",
              },
          }
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          print("\nWrote benchmark_results.json")
          EOF

      # Evaluate the ABSOLUTE multi-zone floor from release_gates.yaml
      # (≥ 10 cfg/s on 10-zone pop_1000). --benchmark-gates restricts
      # evaluation to the `multi_zone_throughput` gate (issue #2772); the
      # checker exits 1 on any failure. --crate-size-gates 'skip' suppresses
      # the crate_size gate (issue #2930) — see the absolute-perf-gate job
      # above for the rationale (this job does not run `cargo package`).
      - name: Evaluate multi-zone gate (≥ 10 cfg/s)
        run: |
          python3 scripts/release_gate_checker.py \
            --benchmark-results benchmark_results.json \
            --benchmark-gates multi_zone_throughput \
            --crate-size-gates skip \
            --json --output gate_status.json

      - name: Summary
        if: always()
        run: |
          echo "## Multi-Zone Perf Gate (Issue #2772)" >> $GITHUB_STEP_SUMMARY
          echo "Enforces \`release_gates.yaml\` multi-zone absolute floor on every PR:" >> $GITHUB_STEP_SUMMARY
          echo "- multi-zone throughput ≥ 10 configs/sec (10-zone, pop_1000, analytical mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Why:** the #2693 Absolute Perf Gate measures the *single-zone* analytical path against the 150 cfg/s floor — a much easier target than the 10 cfg/s multi-zone floor. \`benches/multi_zone_throughput.rs:17\` documents only 2.8× margin at pop_10k; without this gate a per-zone-cost regression could merge and blow that margin silently." >> $GITHUB_STEP_SUMMARY
          echo "**Noise suppression:** median of 3 \`test_multi_zone_performance_regression\` runs (pop_1000, release build, default features)." >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`ubuntu-latest\` (the 10 cfg/s floor was calibrated here; self-hosted runners measure a different absolute throughput — parity with \`absolute-perf-gate\`)." >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: multi-zone-perf-gate-${{ github.run_id }}
          path: |
            benchmark_results.json
            gate_status.json
            run_*.txt
          retention-days: 30

  # =========================================================================
  # hybrid-perf-gate — PR-blocking ABSOLUTE HybridThermalModel floor
  # (Issue #2922).
  #
  # The Absolute Perf Gate (#2693) and Multi-Zone Perf Gate (#2772) both
  # measure `BatchOracle::evaluate_population` over the pure-physics
  # `ThermalModel<VectorField>` path. Neither exercises the production-
  # default HybridThermalModel routing (`HybridRouting::default()` —
  # surrogate loads, physics everything else). A regression adding per-
  # timestep dispatch overhead to the surrogate-load branch fires only
  # in Hybrid mode and would slip through both gates.
  #
  # This job closes that gap. It runs the new
  # `tests/hybrid_perf_regression.rs::test_hybrid_performance_regression`
  # (single-zone, pop_100) and
  # `test_hybrid_multi_zone_performance_regression` (10-zone, pop_1000) x3,
  # takes the MEDIAN of the parsed `Hybrid throughput:` /
  # `Hybrid multi-zone throughput:` lines, writes `benchmark_results.json`
  # with the `hybrid_throughput` and `hybrid_multi_zone_throughput`
  # metrics, and feeds it to
  # `scripts/release_gate_checker.py --benchmark-gates
  #  hybrid_throughput,hybrid_multi_zone_throughput`. The job FAILS if
  # single-zone throughput < 80 cfg/s OR 10-zone throughput < 8 cfg/s.
  #
  # Runner: `ubuntu-latest` (NOT `vars.FLUXION_LINUX_RUNNER`) — parity with
  # `absolute-perf-gate` and `multi-zone-perf-gate`, whose floors were
  # calibrated on GitHub-hosted ubuntu-latest. A self-hosted runner would
  # measure a different absolute throughput and make the floors
  # incomparable.
  # =========================================================================
  hybrid-perf-gate:
    name: Hybrid Perf Gate (Issue #2922)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # NOTE: intentionally no `needs: bench-default` — this job builds its
    # own release test binary and runs in parallel with `absolute-perf-gate`
    # / `multi-zone-perf-gate` / `bench-default` for a faster PR signal.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo (hybrid-perf-gate)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-default
          cache-on-failure: true

      # Build the release test binary once (shared across all 3 measurement
      # runs). Default features only — matches `absolute-perf-gate` and
      # what a user gets from `cargo install fluxion`.
      - name: Build release (default features)
        run: cargo build --release

      # Median-of-3 noise suppression. Each run invokes BOTH hybrid tests
      # (single-zone + 10-zone), which print exactly one
      # `Hybrid throughput:` line and one `Hybrid multi-zone throughput:`
      # line respectively. We tolerate a nonzero test exit (the Rust
      # floor assertion will panic on a real breach but we still want the
      # throughput line for partial-success diagnostics) with `|| true`;
      # the throughput lines are printed BEFORE any assertion failure.
      #
      # `--test-threads=1` forces SEQUENTIAL test execution. Without it,
      # the test harness schedules both hybrid tests concurrently — the
      # short single-zone run (~150 ms pop_100 standalone) gets crushed
      # to ~25 cfg/s when it shares cores with the long multi-zone run,
      # tripping the 80 cfg/s floor spuriously. Sequential execution
      # matches the #2693 / #2772 gate pattern (those jobs each run a
      # single test) and keeps each test's measurement stable.
      #
      # Runtime budget: each pop_100 single-zone run measures ~1.5s and
      # each pop_1000 / 10-zone run measures ~125s on ubuntu-latest.
      # 2 tests × 3 runs × worst-case timing + ~3 min cold-cache build
      # fits inside the 25-min job timeout with margin.
      - name: Run hybrid benchmark (median of 3, both regimes, sequential)
        run: |
          rm -f run_*.txt
          for i in 1 2 3; do
            echo "=== measurement run ${i}/3 ==="
            cargo test --test hybrid_perf_regression --release -- --nocapture --test-threads=1 > "run_${i}.txt" 2>&1 || true
          done

          python3 << 'EOF'
          import glob
          import json
          import re
          import statistics
          import sys

          # Match the metric lines the Rust test prints — keep these in
          # sync with `tests/hybrid_perf_regression.rs`.
          single_re = re.compile(r'Hybrid throughput:\s*([\d.]+)\s*configs/sec')
          multi_re = re.compile(r'Hybrid multi-zone throughput:\s*([\d.]+)\s*configs/sec')
          single_latency_re = re.compile(r'Latency per config:\s*([\d.]+)ms')

          single_throughputs, multi_throughputs, latencies = [], [], []
          for path in sorted(glob.glob('run_*.txt')):
              txt = open(path, errors='replace').read()
              s = single_re.findall(txt)
              m = multi_re.findall(txt)
              l = single_latency_re.findall(txt)
              if s and m:
                  single_throughputs.append(float(s[-1]))
                  multi_throughputs.append(float(m[-1]))
                  # Use the single-zone latency (last line in the run);
                  # multi-zone latency is reported separately by the test
                  # but only one latency is needed for the checker.
                  if l:
                      latencies.append(float(l[-1]))
                  print(f"{path}: single={s[-1]} cfg/s, multi={m[-1]} cfg/s, latency={l[-1] if l else 'n/a'} ms")
              else:
                  print(f"WARNING: {path} produced no parseable hybrid metrics (single={s}, multi={m})")

          if len(single_throughputs) < 2 or len(multi_throughputs) < 2:
              print("ERROR: fewer than 2 successful hybrid measurement runs; cannot compute a stable median.")
              print("This usually means a compile error or a runtime panic before measurement.")
              for path in sorted(glob.glob('run_*.txt')):
                  print(f"\n--- {path} (first 2000 chars) ---")
                  print(open(path, errors='replace').read()[:2000])
              sys.exit(2)

          med_single = statistics.median(single_throughputs)
          med_multi = statistics.median(multi_throughputs)
          med_latency = statistics.median(latencies) if latencies else 0.0

          print(f"\nSamples: single-zone throughput={single_throughputs}")
          print(f"         multi-zone throughput={multi_throughputs}")
          print(f"Median single-zone throughput: {med_single:.1f} configs/sec")
          print(f"Median multi-zone throughput:  {med_multi:.1f} configs/sec")
          print(f"Median latency (single-zone):  {med_latency:.3f} ms/config")

          results = {
              "metrics": {
                  # `hybrid_throughput` / `hybrid_multi_zone_throughput` are
                  # the gate names expected by
                  # scripts/release_gate_checker.py (mirrors how it reads
                  # `benchmark.hybrid.min_configs_per_sec` /
                  # `benchmark.hybrid_multi_zone.min_configs_per_sec` from
                  # release_gates.yaml). Latency is also populated so a
                  # future --benchmark-gates filter expansion picks it up
                  # without re-running the job.
                  "hybrid_throughput": med_single,
                  "hybrid_multi_zone_throughput": med_multi,
                  "throughput_configs_per_sec": med_single,
                  "latency_ms_per_config": med_latency,
              },
              "samples": {
                  "single_zone_throughput": single_throughputs,
                  "multi_zone_throughput": multi_throughputs,
                  "latency": latencies,
                  "runs": len(single_throughputs),
                  "strategy": "median-of-3",
                  "workload": "HybridThermalModel with HybridRouting::default() (loads→surrogate, everything else→physics)",
                  "regimes": {
                      "single_zone": "1 zone, pop_100, default routing",
                      "multi_zone": "10 zones, pop_1000, default routing",
                  },
              },
          }
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          print("\nWrote benchmark_results.json")
          EOF

      # Evaluate the ABSOLUTE hybrid floors from release_gates.yaml
      # (≥ 80 cfg/s single-zone, ≥ 8 cfg/s 10-zone). --benchmark-gates
      # restricts evaluation to the two new gates (issue #2922); the
      # checker exits 1 on any failure. --crate-size-gates 'skip' suppresses
      # the crate_size gate (issue #2930) — see the absolute-perf-gate job
      # above for the rationale.
      - name: Evaluate hybrid gates (≥ 80 cfg/s + ≥ 8 cfg/s)
        run: |
          python3 scripts/release_gate_checker.py \
            --benchmark-results benchmark_results.json \
            --benchmark-gates hybrid_throughput,hybrid_multi_zone_throughput \
            --crate-size-gates skip \
            --json --output gate_status.json

      - name: Summary
        if: always()
        run: |
          echo "## Hybrid Perf Gate (Issue #2922)" >> $GITHUB_STEP_SUMMARY
          echo "Enforces \`release_gates.yaml\` HybridThermalModel absolute floors on every PR:" >> $GITHUB_STEP_SUMMARY
          echo "- single-zone throughput ≥ 80 configs/sec (HybridThermalModel, \`HybridRouting::default()\`, pop_100)" >> $GITHUB_STEP_SUMMARY
          echo "- multi-zone throughput ≥ 8 configs/sec (10-zone HybridThermalModel, \`HybridRouting::default()\`, pop_1000)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Why:** the #2693 Absolute Perf Gate and #2772 Multi-Zone Perf Gate both measure the pure-physics path (\`ThermalModel<VectorField>\` / \`BatchOracle::evaluate_population\`); neither exercises HybridThermalModel with \`HybridRouting::default()\` — the production-recommended default routing. A regression adding per-timestep overhead in the surrogate-load branch fires only in Hybrid mode and would slip through both gates silently." >> $GITHUB_STEP_SUMMARY
          echo "**Noise suppression:** median of 3 \`hybrid_perf_regression\` runs (release build, default features)." >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`ubuntu-latest\` (parity with \`absolute-perf-gate\` / \`multi-zone-perf-gate\`; the 80 + 8 cfg/s floors were calibrated here)." >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hybrid-perf-gate-${{ github.run_id }}
          path: |
            benchmark_results.json
            gate_status.json
            run_*.txt
          retention-days: 30

  # =========================================================================
  # multi-zone-cold-start-gate — PR-blocking cold-start latency gate for the
  # ONNX surrogate (Issue #2919).
  #
  # The Absolute Perf Gate (#2693) and Multi-Zone Perf Gate (#2772) measure
  # `BatchOracle::evaluate_population` over a populated, warmed-up
  # `ThermalModel` — neither constructs a fresh `SurrogateManager` per
  # cycle, so neither exercises the FIRST `predict_loads_onnx` call against
  # a cold session pool. That first call pays the full cost of
  # `SessionPool::get_or_create_session` (`src/ai/surrogate.rs:1247` — ort
  # env init + model parse + session allocation) plus per-call scratch
  # tensors, and is invisible to the warm-path gate. At the API layer the
  # first `/v1/simulate` request after a fresh process pays this cost —
  # easy > 500 ms on a 256 MiB shipped model.
  #
  # This job closes that gap. It runs the new
  # `tests/surrogate_cold_start_test.rs::test_surrogate_cold_start_under_100ms_or_2_5x_warm_median`
  # test (which itself asserts the lenient Issue #2919 acceptance criterion
  # "100 ms OR 2.5× warm median") x3, takes the MEDIAN of the parsed
  # `Cold start:` / `Warm steady-state:` / `Cold/warm ratio:` lines,
  # writes `benchmark_results.json` with the `cold_start_ms`,
  # `warm_steady_state_ms`, and `cold_warm_ratio` metrics, and feeds it to
  # `scripts/release_gate_checker.py --benchmark-gates cold_start`. The
  # checker enforces the STRICTER 1.5× ratio threshold from
  # `release_gates.yaml → benchmark.cold_start.max_cold_warm_ratio` and
  # the 25% baseline-regression tolerance from
  # `tests/reference_data/surrogate/cold_start_baseline.json`. The job
  # FAILS if cold/warm ratio > 1.5 OR cold-start regresses > 25% relative
  # to the stored baseline.
  #
  # Runner: `ubuntu-latest` (parity with `absolute-perf-gate` /
  # `multi-zone-perf-gate` / `hybrid-perf-gate`). The cold-start floors
  # were calibrated on GitHub-hosted ubuntu-latest against the
  # `assets/dummy_surrogate.onnx` fixture.
  #
  # `--features ort` is REQUIRED — `tests/surrogate_cold_start_test.rs`
  # is `#[cfg(feature = "ort")]` because `SurrogateManager::load_onnx` /
  # `predict_loads_onnx` only compile under that feature. Without it the
  # test would compile but skip everything, silently green-gating the PR.
  # =========================================================================
  multi-zone-cold-start-gate:
    name: Multi-Zone Cold Start Gate (Issue #2919)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # NOTE: intentionally no `needs` — builds its own release test binary
    # and runs in parallel with `absolute-perf-gate` /
    # `multi-zone-perf-gate` / `hybrid-perf-gate` for a faster PR signal.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      # Separate cache namespace so the `--features ort` build of the cold-
      # start test does not evict / get evicted by the default-features
      # cache used by `absolute-perf-gate` / `multi-zone-perf-gate` /
      # `hybrid-perf-gate`. The ort runtime pulls in a ~30 MB transitive
      # dependency tree (libonnxruntime + protobuf + ureq) that is not
      # needed by those jobs.
      - name: Cache cargo (cold-start-gate, ort feature)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dashboard-cold-start-ort
          cache-on-failure: true

      # Build the release test binary once (shared across all 3 measurement
      # runs). The `--features ort` flag activates the
      # `predict_loads_onnx` symbol that the new test exercises; on a
      # default-features build the test compiles to a no-op stub and the
      # gate would silently green.
      - name: Build release (--features ort)
        run: cargo build --release --features ort --tests

      # Median-of-3 noise suppression. Each run invokes the single
      # `test_surrogate_cold_start_under_100ms_or_2_5x_warm_median` test,
      # which prints exactly one `Cold start:`, `Warm steady-state:`, and
      # `Cold/warm ratio:` line (with a `[surrogate-cold-start-diag]`
      # prefix). We tolerate a nonzero test exit with `|| true`; the
      # metrics are printed BEFORE any assertion failure so partial
      # diagnostics still surface in the gate output.
      #
      # `--test-threads=1` forces SEQUENTIAL execution — without it the
      # test harness can spawn parallel `run_cold_warm_cycle` calls that
      # share the page cache and the CPU thermal envelope, dragging warm
      # latency up and compressing the cold/warm ratio. Sequential
      # execution matches the #2922 hybrid-gate pattern.
      #
      # Runtime budget: each cold/warm cycle builds a fresh
      # `SurrogateManager` and runs 4 `predict_loads_onnx` calls. On
      # ubuntu-latest the dummy fixture is ~1 ms per call. 1 test × 3
      # runs × worst-case timing + ~5 min cold-cache ort build fits inside
      # the 25-min job timeout with margin.
      - name: Run cold-start benchmark (median of 3, sequential)
        run: |
          rm -f run_*.txt
          for i in 1 2 3; do
            echo "=== measurement run ${i}/3 ==="
            cargo test --test surrogate_cold_start_test --release --features ort -- --nocapture --test-threads=1 > "run_${i}.txt" 2>&1 || true
          done

          python3 << 'EOF'
          import glob
          import json
          import re
          import statistics
          import sys

          # Match the metric lines the Rust test prints — keep these in
          # sync with `tests/surrogate_cold_start_test.rs`. The Python
          # regex looks for the line AFTER the
          # `[surrogate-cold-start-diag]` prefix to keep the parser robust
          # to additional log lines around them.
          cold_re = re.compile(r'Cold start:\s*([\d.]+)ms')
          warm_re = re.compile(r'Warm steady-state:\s*([\d.]+)ms')
          ratio_re = re.compile(r'Cold/warm ratio:\s*([\d.]+)')

          cold_samples, warm_samples, ratio_samples = [], [], []
          for path in sorted(glob.glob('run_*.txt')):
              txt = open(path, errors='replace').read()
              c = cold_re.findall(txt)
              w = warm_re.findall(txt)
              r = ratio_re.findall(txt)
              if c and w and r:
                  cold_samples.append(float(c[-1]))
                  warm_samples.append(float(w[-1]))
                  ratio_samples.append(float(r[-1]))
                  print(f"{path}: cold={c[-1]} ms, warm={w[-1]} ms, ratio={r[-1]}")
              else:
                  print(f"WARNING: {path} produced no parseable cold-start metrics (cold={c}, warm={w}, ratio={r})")

          if len(cold_samples) < 2 or len(warm_samples) < 2 or len(ratio_samples) < 2:
              print("ERROR: fewer than 2 successful cold-start measurement runs; cannot compute a stable median.")
              print("This usually means a compile error or a runtime panic before measurement.")
              for path in sorted(glob.glob('run_*.txt')):
                  print(f"\n--- {path} (first 2000 chars) ---")
                  print(open(path, errors='replace').read()[:2000])
              sys.exit(2)

          med_cold = statistics.median(cold_samples)
          med_warm = statistics.median(warm_samples)
          med_ratio = statistics.median(ratio_samples)

          print(f"\nSamples: cold_ms={cold_samples}")
          print(f"         warm_ms={warm_samples}")
          print(f"         ratio={ratio_samples}")
          print(f"Median cold-start:    {med_cold:.3f} ms")
          print(f"Median warm steady-state: {med_warm:.3f} ms")
          print(f"Median cold/warm ratio:   {med_ratio:.3f}")

          results = {
              "metrics": {
                  # `cold_start_ms` / `warm_steady_state_ms` /
                  # `cold_warm_ratio` are the gate names expected by
                  # `scripts/release_gate_checker.py` (mirrors how it reads
                  # `benchmark.cold_start.{max_ms,warm_max_ms,
                  # max_cold_warm_ratio}` from `release_gates.yaml`).
                  # Throughput / latency are also populated so a future
                  # `--benchmark-gates` filter expansion picks them up
                  # without re-running the job.
                  "cold_start_ms": med_cold,
                  "warm_steady_state_ms": med_warm,
                  "cold_warm_ratio": med_ratio,
              },
              "samples": {
                  "cold_ms": cold_samples,
                  "warm_ms": warm_samples,
                  "ratio": ratio_samples,
                  "runs": len(cold_samples),
                  "strategy": "median-of-3",
                  "fixture": "assets/dummy_surrogate.onnx",
                  "feature": "ort",
              },
          }
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          print("\nWrote benchmark_results.json")
          EOF

      # Evaluate the cold-start gate from release_gates.yaml:
      # - absolute cold ≤ 100 ms (Issue #2919 acceptance criterion)
      # - cold/warm ratio ≤ 1.5 (CI gate, stricter than the test's lenient 2.5× bound)
      # - cold-start regression ≤ 25% relative to the stored baseline at
      #   `tests/reference_data/surrogate/cold_start_baseline.json`
      # `--benchmark-gates cold_start` restricts evaluation to this single
      # gate (Issue #2919); the checker exits 1 on any failure.
      # `--crate-size-gates 'skip'` suppresses the crate_size gate (issue #2930)
      # — see the absolute-perf-gate job above for the rationale.
      - name: Evaluate cold-start gate (≤100 ms + ratio ≤1.5 + ≤25% baseline regression)
        run: |
          python3 scripts/release_gate_checker.py \
            --benchmark-results benchmark_results.json \
            --benchmark-gates cold_start \
            --crate-size-gates skip \
            --json --output gate_status.json

      - name: Summary
        if: always()
        run: |
          echo "## Multi-Zone Cold Start Gate (Issue #2919)" >> $GITHUB_STEP_SUMMARY
          echo "Enforces \`release_gates.yaml\` cold-start floors on every PR:" >> $GITHUB_STEP_SUMMARY
          echo "- cold-start latency ≤ 100 ms (absolute, Issue #2919 acceptance)" >> $GITHUB_STEP_SUMMARY
          echo "- cold/warm ratio ≤ 1.5 (Issue #2919 CI gate; stricter than the test's lenient 2.5× bound)" >> $GITHUB_STEP_SUMMARY
          echo "- cold-start regression ≤ 25% relative to \`tests/reference_data/surrogate/cold_start_baseline.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Why:** the #2693 Absolute Perf Gate measures the warm steady-state path of \`BatchOracle::evaluate_population\`, which constructs its own models and never exercises the FIRST \`predict_loads_onnx\` call against a freshly constructed \`SurrogateManager\`. That first call pays the full cost of \`SessionPool::get_or_create_session\` (ort env init + model parse + session allocation), and at the API layer the first \`/v1/simulate\` request after a fresh process pays the same cost — easy > 500 ms on a 256 MiB shipped model. Before #2919 this regression was invisible to CI." >> $GITHUB_STEP_SUMMARY
          echo "**Noise suppression:** median of 3 cold/warm cycles (\`surrogate_cold_start_test\` x3, release build, \`--features ort\`)." >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`ubuntu-latest\` (parity with \`absolute-perf-gate\` / \`multi-zone-perf-gate\` / \`hybrid-perf-gate\`; the 100 ms + 1.5× ratio floors were calibrated here)." >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cold-start-gate-${{ github.run_id }}
          path: |
            benchmark_results.json
            gate_status.json
            run_*.txt
          retention-days: 30

  # =========================================================================
  # dhat-alloc-budget — PR-gated allocation-budget gate for the BatchOracle
  # hot loop (Issue #2709).
  # Runs the feature-gated `dhat_alloc_budget` integration test, which installs
  # `dhat::Alloc` as the global allocator and asserts a hard ceiling on the heap
  # allocations produced by one reduced `BatchOracle::evaluate_population` run
  # (10 configs × 8 760 timesteps). The budget is a ceiling on current
  # behaviour; #2687 will ratchet it down. This is the PR-level allocation-count
  # gate that was missing per #2709 — previously dhat only ran in
  # `bench-all-features` (nightly + manual dispatch), so the ~22 M-alloc/yr
  # BatchOracle hot loop had no PR-time regression guard.
  # Runs on PRs, main pushes, and manual dispatch (not nightly schedule, which
  # already covers dhat via `bench-all-features`).
  # =========================================================================
  dhat-alloc-budget:
    name: dhat Alloc Budget (BatchOracle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo (dhat)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: perf-dhat-alloc-budget
          cache-on-failure: true

      - name: Run dhat allocation-budget test
        # `--features dhat` only (no ort/pyo3/napi) keeps the build light. The
        # test is #[ignore]'d so it only runs under --include-ignored; measured
        # at ~2.2 M blocks / ~17.8 MB over ~4 s of runtime. Allocation count is
        # structurally determined (identical across --release and --profile ci).
        run: |
          cargo test --release -p fluxion --features dhat --test dhat_alloc_budget -- --nocapture --include-ignored

      - name: Summary
        if: always()
        run: |
          echo "## dhat Alloc Budget (BatchOracle, #2709)" >> $GITHUB_STEP_SUMMARY
          echo "Ceiling: 2,650,000 blocks / 21,500,000 bytes over 10 configs × 8760 timesteps." >> $GITHUB_STEP_SUMMARY
          echo "Measured baseline: 2,191,396 blocks (≈219K/config), 17,782,528 bytes." >> $GITHUB_STEP_SUMMARY
          echo "See \`tests/dhat_alloc_budget.rs\` for how to ratchet the budget down after #2687." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Publish Dashboard — main push only.
  # Depends on `bench-default` + `published-crate-bench` (and consumes any
  # `bench-all-features-results-*` artifact that happens to be in the same
  # run, when nightly + main push overlap).
  # =========================================================================
  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [bench-default, published-crate-bench]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Download default-feature benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: default_benchmark_data
          pattern: bench-default-results-*
          merge-multiple: true

      - name: Download published-crate benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: published_crate_data
          pattern: published-crate-bench-results-*
          merge-multiple: true

      - name: Generate dashboard data
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          benchmark_files = list(Path('default_benchmark_data').glob('**/benchmark_summary.json')) \
                          + list(Path('published_crate_data').glob('**/benchmark_summary.json'))
          dhat_files = list(Path('default_benchmark_data').glob('**/dhat_summary.json'))

          all_benchmarks = []
          all_dhat = []

          for f in benchmark_files:
              with open(f) as fp:
                  data = json.load(fp)
                  if isinstance(data, dict) and 'benchmarks' in data:
                      all_benchmarks.append(data)

          for f in dhat_files:
              with open(f) as fp:
                  data = json.load(fp)
                  all_dhat.append(data)

          # Build dashboard data
          dashboard_data = {
              "last_updated": datetime.now().isoformat(),
              "total_runs": len(all_benchmarks),
              "benchmarks": all_benchmarks,
              "dhat": all_dhat,
          }

          os.makedirs('benchmark_data', exist_ok=True)
          with open('benchmark_data/dashboard_data.json', 'w') as f:
              json.dump(dashboard_data, f, indent=2)

          print(f"Processed {len(all_benchmarks)} benchmark runs")
          print(f"Processed {len(all_dhat)} dhat runs")
          EOF

      - name: Generate HTML dashboard
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          # Load dashboard data
          with open('benchmark_data/dashboard_data.json', 'r') as f:
              data = json.load(f)

          benchmarks = data.get('benchmarks', [])
          dhat_data = data.get('dhat', [])

          # Generate benchmark history by name
          benchmark_history = {}
          for run in benchmarks:
              commit = run.get('commit', 'unknown')
              profile = run.get('feature_profile', 'unknown')
              for b in run.get('benchmarks', []):
                  name = b.get('name', 'unknown')
                  if name not in benchmark_history:
                      benchmark_history[name] = []
                  benchmark_history[name].append({
                      'commit': commit,
                      'profile': profile,
                      'value': b.get('value', 0),
                      'unit': b.get('unit', 'ns'),
                  })

          # Generate HTML
          html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Fluxion Performance Dashboard</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
                  .header { max-width: 1200px; margin: 0 auto 30px; }
                  h1 { color: #58a6ff; margin-bottom: 10px; }
                  .subtitle { color: #8b949e; }
                  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
                  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
                  h2 { color: #58a6ff; font-size: 1.2em; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
                  table { width: 100%; border-collapse: collapse; }
                  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; }
                  th { color: #8b949e; font-weight: 500; }
                  .metric { font-family: 'SF Mono', Monaco, monospace; }
                  .regression { color: #f85149; }
                  .improvement { color: #3fb950; }
                  .chart { height: 200px; background: #0d1117; margin-top: 10px; }
                  .chart-bar { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
                  .bar { background: #58a6ff; min-width: 4px; flex: 1; border-radius: 2px 2px 0 0; }
                  .bar.worse { background: #f85149; }
                  .bar.better { background: #3fb950; }
                  .dhat-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
                  .dhat-metric { background: #0d1117; padding: 15px; border-radius: 6px; text-align: center; }
                  .dhat-value { font-size: 1.5em; font-weight: bold; color: #58a6ff; }
                  .dhat-label { color: #8b949e; font-size: 0.9em; margin-top: 5px; }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>Fluxion Performance Dashboard</h1>
                  <p class="subtitle">Last updated: ''' + data['last_updated'] + ''' | Total runs: ''' + str(data['total_runs']) + '''</p>
              </div>
              <div class="grid">
                  <div class="card">
                      <h2>Benchmark Results</h2>
                      <table>
                          <thead>
                              <tr><th>Benchmark</th><th>Latest</th><th>Unit</th></tr>
                          </thead>
                          <tbody>
          '''

          for name, history in sorted(benchmark_history.items()):
              if history:
                  latest = history[-1]
                  html += f'''<tr>
                      <td>{name}</td>
                      <td class="metric">{latest['value']:.2f}</td>
                      <td>{latest['unit']}</td>
                  </tr>
          '''

          html += '''</tbody></table></div>'''

          if dhat_data:
              latest_dhat = dhat_data[-1]
              html += f'''<div class="card">
                  <h2>Memory Usage (dhat)</h2>
                  <div class="dhat-summary">
                      <div class="dhat-metric">
                          <div class="dhat-value">{latest_dhat.get('total_bytes', 0) / 1024 / 1024:.2f}</div>
                          <div class="dhat-label">Total Heap (MB)</div>
                      </div>
                      <div class="dhat-metric">
                          <div class="dhat-value">{latest_dhat.get('allocated_bytes', 0) / 1024 / 1024:.2f}</div>
                          <div class="dhat-label">Allocated (MB)</div>
                      </div>
                  </div>
              </div>'''

          html += '''</div></body></html>'''

          with open('benchmark_data/index.html', 'w') as f:
              f.write(html)

          print("Generated benchmark_data/index.html")
          EOF

      - name: Upload to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./benchmark_data
          publish_branch: gh-pages
          destination_dir: perf

      - name: Deploy benchmark data JSON
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./benchmark_data
          publish_branch: gh-pages
          destination_dir: perf/data
          only_commit_hash: false

      # Stable artifact name (no run_id suffix) so the next run's
      # regression-check can download the previous baseline via
      # dawidd6/action-download-artifact with name: benchmark-results.
      - name: Upload latest benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark_data/benchmark_summary.json
            benchmark_data/dhat_summary.json
          retention-days: 90

      - name: Display dashboard URL
        run: |
          echo "## Performance Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard published to: https://anchapin.github.io/fluxion/perf/" >> $GITHUB_STEP_SUMMARY