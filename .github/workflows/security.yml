name: Security Audit

on:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN grants (Issue #2526): cargo audit is read-only.
permissions:
  contents: read

jobs:
  audit-config-unique:
    # Issue #2773: enforce a single canonical cargo-audit config at
    # `.cargo/audit.toml`. A stray root-level `audit.toml` is dead weight
    # (cargo-audit reads `.cargo/audit.toml` by default) that misleads
    # reviewers and can mislabel ignored advisories or place directives
    # under the wrong table where they silently no-op.
    name: Audit Config Unique
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check for stray audit.toml
        run: python3 scripts/check_audit_config_unique.py

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-env
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0  # v3
        with:
          crate: cargo-audit
      - name: Run cargo audit
        # Issue #2750: `--deny warnings` makes informational advisories
        # (unmaintained, unsound, yanked) fail the gate with a non-zero exit,
        # closing the leniency where plain `cargo audit` exits 0 on unmaintained
        # warnings. Combined with removing `informational_warnings` suppression
        # in .cargo/audit.toml, the cargo-audit gate now blocks on advisories
        # it previously allowed through as soft warnings.
        run: cargo audit --deny warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-env
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0  # v3
        with:
          crate: cargo-deny
          version: 0.20.2
      # Supply-chain gate (issue #2699): licenses (no copyleft), duplicate
      # crates (warn), banned crates (denylist), advisory DB scan, and source
      # registry validation. Config lives in deny.toml at the repo root.
      # Mirrors .cargo/audit.toml ignores so the two tools agree.
      - name: Run cargo deny check
        run: cargo deny check
