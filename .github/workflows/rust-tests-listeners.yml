# rust-tests-listeners.yml — advisory listeners (demoted gates)
#
# History
# -------
# This file previously held the Issue #3810 GH-listener pattern (Option B):
# nine unfiltered listener jobs emitting branch-protection required-check
# names on every PR class. The seven *required* listeners
# (`workspace-check`, `energy-conservation`, `fmt`, `clippy`,
# `ashrae-cases-cycle`, `physics-sim-cycle`, `cycle-trend`) moved to
# `ci-gates.yml` phase 1, where they run before the heavy advisory jobs.
#
# What remains here are the three *demoted* (advisory-only) listeners:
# `known-issues-stale`, `tauri-csp`, and `fluxion-grid-integration`.
# They still run unfiltered on every PR class, but nothing in branch
# protection requires their names.

name: Rust Tests Listeners (Issue #3810)

on:
  pull_request:
    # NO `paths-ignore:` — this workflow is the Option B
    # unfiltered listener (Issue #3810 rationale in the header).
    # Every PR class must trigger the workflow so the listeners
    # emit the required-check names regardless of changed files.
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

# ADR-0015 per-`head_sha` concurrency block (Issue #3366 / #3444).
# Re-run `python3 scripts/check_concurrency_keys.py` after edits.
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

# Least-privilege GITHUB_TOKEN default (Issue #2526): the listener
# jobs only check out code and run scripts / cargo subcommands.
# No repo write-back.
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Known Issues Stale Check (GH) — Issue #1723
  # ----------------------------------------------------------------
  # The original `known-issues-stale-gh` listener in `rust-tests.yml`
  # is path-filtered; the dedicated `known-issues-stale.yml`
  # workflow is ALSO path-filtered (`paths:
  # ['docs/KNOWN_ISSUES.md', 'scripts/check_known_issues_stale.py']`).
  # So the only way to get a "Known Issues Stale Check (GH)" check
  # reported on every PR class (e.g. a CI-infra PR that touches
  # neither KNOWN_ISSUES.md nor the script) is THIS listener. The
  # script is pure stdlib (no Rust toolchain) so the listener is
  # cheap.
  known-issues-stale-listener:
    name: "Known Issues Stale Check (GH)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run stale check
        run: python3 scripts/check_known_issues_stale.py

  # ----------------------------------------------------------------
  # Tauri CSP Gate (Issue #3727)
  # ----------------------------------------------------------------
  # `fluxion-tauri/src-tauri/tauri.conf.json` previously declared
  # `"csp": null`, which disables Tauri's Content-Security-Policy
  # injection for the webview. A DOM-XSS-class compromise then chains
  # directly to the Rust-side IPC surface
  # (`load_geometry`, `update_simulation_parameters`, ... in
  # `fluxion-tauri/src-tauri/src/commands.rs`). The check reads the
  # release conf, asserts `app.security.csp` is a non-null string, and
  # verifies the strict directive set required by Issue #3727
  # (`default-src 'self'`, `script-src 'self'`, `object-src 'none'`,
  # `base-uri 'self'`, `frame-ancestors 'none'`); Vite HMR
  # relaxations (`'unsafe-inline'`, `'unsafe-eval'`, `ws://localhost:*`)
  # are accepted in `devCsp` but NOT in the production `csp`.
  # This listener emits the required-check name on every PR class so
  # the Issue #3367 docs-only carve-out can't silently drop the
  # security gate.
  tauri-csp-listener:
    name: "Tauri CSP Gate (Issue #3727)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: "Run Tauri CSP gate (Issue #3727)"
        run: python3 scripts/check_tauri_csp.py

  # ----------------------------------------------------------------
  # fluxion-grid Integration Tests (GH) — Issue #2908 / #3127
  # ----------------------------------------------------------------
  fluxion-grid-integration-listener:
    name: "fluxion-grid Integration Tests (GH)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run fluxion-grid integration tests
        run: |
