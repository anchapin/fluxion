name: rumqttc Upstream Watch

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}


# Issue #2853: schedule a weekly poll of bytebeamio/rumqtt#1037 + crates.io
# so the rumqttc security cluster (RUSTSEC-2025-0134, 2026-0049/0098/0099/0104)
# surfaces a fix within 7 days of upstream publishing one.
#
# The default invocation is offline — exits 0 unconditionally. The
# weekly ``--online`` run calls the crates.io / GitHub APIs with a
# permissive timeout and surfaces a fix in two ways:
#
#   * non-zero exit (visible in the workflow run summary); and
#   * a JSON artefact uploaded as ``rumqttc-upstream-<date>.json`` so a
#     future dashboard can plot the cluster's upstream signal.
#
# The ``rumqttc-upstream-watch`` label is applied to issues opened by
# the workflow so the tracking issue #2853 can be linked. The job runs
# at most once a week to stay within GitHub Actions' free-tier minutes;
# a manual ``workflow_dispatch`` trigger is exposed for ad-hoc operator
# runs (e.g. immediately after bytebeamio/rumqtt#1037 is reported merged).
#
# The PR-time gate stays handled by
# ``scripts/check_audit_ignores_fresh.py`` (issue #2912); this workflow
# is the *scheduled* signal that complements it.

'on':
  schedule:
    # Mondays at 10:00 UTC — after the weekly ``Security Audit`` job so
    # the audit results can be cross-referenced if a fix lands.
    - cron: '0 10 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_rumqttc_upstream.py'
      - 'scripts/ci/test_check_rumqttc_upstream.py'
      - 'crates/fluxion-twin/Cargo.toml'
      - 'Cargo.lock'

# Least-privilege default (Issue #2526): the watch reads public
# registries and writes only artefacts / labels / issues.
permissions:
  contents: read
  issues: write

jobs:
  rumqttc-upstream-watch:
    name: rumqttc Upstream Watch (Issue #2853)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Poll upstream + emit JSON
        id: poll
        # The script exits 1 when a fix is detected so the failure
        # surfaces in the workflow summary. We capture stdout into
        # ``$STATUS_JSON`` regardless of exit code (the script's --json
        # output is the single source of truth).
        run: |
          set -uo pipefail
          python3 scripts/check_rumqttc_upstream.py --online --json \
            > rumqttc-upstream.json || EXIT=$?
          EXIT=${EXIT:-0}
          echo "exit=${EXIT}" >> "$GITHUB_OUTPUT"
          cat rumqttc-upstream.json
          echo "exit=${EXIT}"

      - name: Upload JSON artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rumqttc-upstream
          path: rumqttc-upstream.json
          if-no-files-found: ignore

      - name: Comment on tracking issue when fix is available
        if: steps.poll.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "rumqttc-upstream-watch" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          BODY=$(cat rumqttc-upstream.json)
          if [ -z "${ISSUE_NUMBER}" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "rumqttc upstream fix available — bump fluxion-twin" \
              --label "rumqttc-upstream-watch" \
              --label "security" \
              --label "P1" \
              --body "<!-- rumqttc-upstream workflow -->

          :rocket: **Upstream fix is available** for the rumqttc security
          cluster tracked by #2853. Run the verification steps from that
          issue and remove the five \`>>> REMOVE\` blocks.

          \`\`\`json
          ${BODY}
          \`\`\`"
          else
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${{ github.repository }}" \
              --body "<!-- rumqttc-upstream workflow -->

          :rocket: **Upstream fix is available** (re-poll). Run the
          verification steps from #2853 and remove the five
          \`>>> REMOVE\` blocks.

          \`\`\`json
          ${BODY}
          \`\`\`"
          fi
