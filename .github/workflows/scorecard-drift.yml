name: Scorecard Drift Gate

# Issue #2496: Fail when SCORECARD.md is stale.
# Issue #3128: Auto-regenerate SCORECARD.md on PR drift.
#
# SCORECARD.md is generated by scripts/generate_scorecard.py from committed
# sources (docs/ASHRAE140_RESULTS.md, release_gates.yaml, README.md). The
# `--check` flag regenerates the scorecard to memory and diffs it against the
# committed copy; any drift (a source metric changed but the scorecard was not
# regenerated) fails the build. This is the acceptance criterion: "CI can fail
# when any metric regresses."
#
# Issue #3128 — Auto-regenerate on pull_request:
# When a PR source changes (`release_gates.yaml`, `docs/ASHRAE140_RESULTS.md`,
# `README.md`, etc.) but the author forgets to re-run
# `python3 scripts/generate_scorecard.py` and commit the result, the gate
# would fail with an opaque "SCORECARD.md is stale" error. To remove that
# hidden coupling, on `pull_request` events we regenerate first; if the
# regenerated copy differs from the committed one, push it back to the PR
# branch so the author sees the auto-update in their PR diff. `--check`
# then validates the just-regenerated copy.
#
# On `push` to develop/main we deliberately do NOT auto-commit: those
# branches must land only via PR review. If drift exists there, the gate
# fails so an operator can fix it manually.

on:
  pull_request:
    paths:
      - "SCORECARD.md"
      - "scripts/generate_scorecard.py"
      - "docs/ASHRAE140_RESULTS.md"
      - "docs/archive/ASHRAE140_RESULTS_v0.8.0.md"
      - "release_gates.yaml"
      - "README.md"
      - "AGENTS.md"
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard-drift:
    name: Scorecard Drift Gate (Issue #2496)
    runs-on: ubuntu-latest
    # Issue #3128: `contents: write` is required so the auto-regen step can
    # push the regenerated SCORECARD.md back to the PR branch. The job-level
    # scope overrides the workflow-level `contents: read` default.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Issue #3128: auto-regenerate SCORECARD.md before the --check diff.
      # Capture the pre-regen blob hash so we can detect drift after the
      # script has overwritten SCORECARD.md on disk.
      - name: Auto-regenerate SCORECARD.md (issue #3128)
        id: regen
        run: |
          echo "Pre-step: regenerating SCORECARD.md from committed sources..."
          OLD_HASH=$(git hash-object SCORECARD.md 2>/dev/null || echo "missing")
          python3 scripts/generate_scorecard.py
          NEW_HASH=$(git hash-object SCORECARD.md)
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "## SCORECARD.md was stale and has been auto-regenerated"
              echo ""
              echo "Pre-regeneration hash: \`${OLD_HASH}\`"
              echo ""
              echo "Post-regeneration hash: \`${NEW_HASH}\`"
              echo ""
              echo "If this is unexpected, regenerate locally with \`python3 scripts/generate_scorecard.py\` and amend the commit."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "SCORECARD.md is already in sync; no regeneration needed." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Issue #3128: if the regenerated copy differs from the committed one,
      # push it back to the PR branch so the PR diff shows the auto-update.
      # Pushes made by the default GITHUB_TOKEN do NOT re-trigger this
      # workflow (recursion-safe by GitHub Actions design — GITHUB_TOKEN
      # commits skip workflow_run triggers).
      - name: Auto-commit regenerated SCORECARD.md back to PR (issue #3128)
        if: steps.regen.outputs.drift == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "fluxion-bot"
          git config user.email "fluxion-bot@users.noreply.github.com"
          git add SCORECARD.md
          if git diff --cached --quiet; then
            echo "::error::No staged changes after git add (unexpected — drift=true but nothing to commit)."
            exit 1
          fi
          git commit -m "chore(scorecard): auto-regenerate SCORECARD.md for #3128"
          git push origin "HEAD:${{ github.head_ref }}"

      # Always runs --check. On pull_request this validates the
      # just-regenerated copy (always passes). On push to develop/main
      # this is the only defense against drift leaking through (no
      # auto-commit on protected branches).
      - name: Verify SCORECARD.md is in sync with its sources
        run: |
          echo "Verifying SCORECARD.md is up to date..."
          python3 scripts/generate_scorecard.py --check
