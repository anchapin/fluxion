name: Performance Benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal  # Minimal profile for faster CI builds

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot libssl-dev pkg-config libfontconfig1-dev  # For Criterion plots

      - name: Build release version
        run: cargo build --release --bench performance_regression

      - name: Fetch main branch for baseline comparison
        run: |
          git fetch origin main
          git checkout origin/main -- benches/baseline/phase10/
          git checkout -

      - name: Run benchmarks with baseline comparison
        run: |
          cargo bench --bench performance_regression -- --baseline phase10 --threshold 5.0
        continue-on-error: false  # Fail on regression

      - name: Check for performance regressions
        run: |
          # Criterion will exit with non-zero status if regression >5% detected
          echo "Checking for performance regressions..."
          # The previous step will fail if regression detected
          echo "No performance regressions detected"

      - name: Generate benchmark report
        if: always()
        run: |
          echo "# Performance Benchmark Report" > benchmark_report.md
          echo "" >> benchmark_report.md
          echo "## Benchmark Results" >> benchmark_report.md
          echo "" >> benchmark_report.md
          echo "Benchmarks run against Phase 10 baseline with 5% regression threshold." >> benchmark_report.md
          echo "" >> benchmark_report.md
          echo "## Baseline Comparison" >> benchmark_report.md
          cat target/criterion/report/index.html 2>/dev/null || echo "No report generated"

      - name: Upload Criterion HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30

      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmark_report.md
          retention-days: 30

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Performance Benchmark Results\n\n';

            // Check if benchmarks passed
            const benchmarkFailed = process.env.CI_EXIT_CODE !== '0';

            if (benchmarkFailed) {
              comment += '⚠️ **Performance regression detected!** (>5% threshold)\n\n';
            } else {
              comment += '✅ **No performance regressions detected** (within 5% threshold)\n\n';
            }

            comment += '### Benchmarks Tested\n';
            comment += '- Thermal model solve performance (1, 10, 50, 100 zones)\n';
            comment += '- BatchOracle throughput (100, 1k, 10k configs)\n';
            comment += '- VectorField operations (add, sub, mul, div)\n\n';

            comment += '### Regression Threshold\n';
            comment += '- **5%** - Any benchmark showing >5% degradation will fail CI\n\n';

            comment += '### Artifacts\n';
            comment += '- Full Criterion HTML report available in workflow artifacts\n';
            comment += '- Baseline data: `benches/baseline/phase10/`\n\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
