name: Performance Benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal  # Minimal profile for faster CI builds

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot libssl-dev pkg-config libfontconfig1-dev  # For Criterion plots

      - name: Build release version
        run: cargo build --release --bench performance_regression

      - name: Run benchmarks
        run: cargo bench --bench performance_regression
        continue-on-error: false

      - name: Generate benchmark report
        if: always()
        run: |
          echo "# Performance Benchmark Report" > benchmark_report.md
          echo "" >> benchmark_report.md
          echo "## Benchmark Results" >> benchmark_report.md
          echo "" >> benchmark_report.md
          echo "Benchmarks completed." >> benchmark_report.md

      - name: Upload Criterion HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30

      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmark_report.md
          retention-days: 30

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## Performance Benchmark Results\n\n';
            comment += '✅ Benchmarks completed.\n\n';

            comment += '### Benchmarks Tested\n';
            comment += '- Thermal model solve performance (1, 10, 50, 100 zones)\n';
            comment += '- BatchOracle throughput (100, 1k, 10k configs)\n';
            comment += '- VectorField operations (add, sub, mul, div)\n\n';

            comment += '### Artifacts\n';
            comment += '- Full Criterion HTML report available in workflow artifacts\n\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
