name: ESP-r Cross-Validation

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  esp-r-cross-validation:
    name: Run ESP-r Cross-Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.94.0
      with:
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build project
      run: cargo build --release --verbose

    - name: Run ESP-r cross-validation tests
      run: cargo test --lib esp_r::test_automation -- --nocapture

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: esp-r-cross-validation-reports
        path: |
          **/test-reports/
          **/*.json
          **/*.md
        retention-days: 30

    - name: Slack notification on failure
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_COLOR: danger
        SLACK_TITLE: "ESP-r Cross-Validation Failed"
        SLACK_MESSAGE: "ESP-r cross-validation tests failed. Check the workflow run for details."

    - name: Email summary report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "ESP-r Cross-Validation Results: ${{ job.status }}"
        body: "ESP-r cross-validation completed with status: ${{ job.status }}. See attached artifacts for details."
        to: team@fluxion.com
        from: ci@fluxion.com
        attachments: esp-r-cross-validation-reports.zip
