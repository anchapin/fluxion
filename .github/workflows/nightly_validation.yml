# Nightly Validation Suite
#
# Combines the ASHRAE 140 comprehensive regression and HVAC BESTEST validation
# into a single nightly workflow with parallel jobs.
#
# Jobs:
#   ashrae-regression  — test_ashrae_140_comprehensive_regression (integration)
#   hvac-bestest      — hvac_bestest + hvac_bestest_validation test targets
#
# Both jobs share the same trigger policy (schedule + workflow_dispatch).
# On push/pull_request, use ashrae_140_validation.yml / hvac_bestest_validation.yml
# for per-PR correctness checks.

name: Nightly Validation Suite

on:
  schedule:
    # Run both jobs at midnight UTC in parallel
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ashrae-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-ashrae-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-ashrae-
            ${{ runner.os }}-cargo-

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements-dev.txt

      - name: Build Fluxion with release profile
        run: cargo build --release --features python-bindings

      - name: Install Python bindings
        run: maturin develop --release

      - name: Run comprehensive regression test
        id: regression
        run: |
          cargo test --test integration test_ashrae_140_comprehensive_regression --release 2>&1 | tee regression_output.txt
          TEST_EXIT=$?
          echo "test_exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ashrae-regression-results
          path: regression_output.txt
          retention-days: 30

      - name: Create GitHub issue on failure
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REGRESSION_OUTPUT_FILE: regression_output.txt
        with:
          script-path: .github/workflows/scripts/post_nightly_regression_issue.js

      - name: Fail if regression test failed
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          echo "❌ Nightly ASHRAE 140 regression test failed"
          exit 1

  hvac-bestest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-hvac-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-hvac-
            ${{ runner.os }}-cargo-

      - name: Run HVAC BESTEST scaffold
        run: cargo test --test hvac_bestest

      - name: Run HVAC BESTEST Validation Tests
        id: validation
        run: |
          cargo test --test hvac_bestest_validation --release 2>&1 | tee hvac_output.txt
          TEST_EXIT=$?
          echo "test_exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Upload HVAC BESTEST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-hvac-bestest-results
          path: hvac_output.txt
          retention-days: 30

      - name: Fail if HVAC BESTEST failed
        if: failure() && steps.validation.outcome == 'failure'
        run: |
          echo "❌ HVAC BESTEST validation failed"
          exit 1
