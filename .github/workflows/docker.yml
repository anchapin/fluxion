# Docker Build, Test, and Push Workflow
# Implements Issue #167: Docker image build, test, and registry setup

name: Docker Build & Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
      - 'pyproject.toml'
      - 'Cargo.toml'
  release:
    types: [published]


concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fail-closed base-image digest pins (Issue #3580, Goal #5). Both
  # digests are content-addressed; pulling by @sha256:DIGEST refuses
  # any image whose registry manifest has a different digest than the
  # pin, so a tag rotation upstream cannot silently swap the base
  # layer that lands inside the published `fluxion-rest` image.
  # Refresh with `scripts/pin_docker_base_images.sh` (quarterly).
  # RUST_BUILDER_IMAGE must satisfy the workspace MSRV in Cargo.toml
  # (`rust-version`); it lagged behind the 1.98.0 bump and broke the
  # image build (Issue #4138).
  RUST_BUILDER_IMAGE: rust:1.98.0-bookworm
  RUST_BUILDER_DIGEST: sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
  DEBIAN_RUNTIME_IMAGE: debian:bookworm-slim
  DEBIAN_RUNTIME_DIGEST: sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251

# Least-privilege GITHUB_TOKEN default (Issue #2526). Each job that pushes to
# ghcr.io or uploads SARIF escalates via its own job-level permissions block
# (packages: write / security-events: write).
permissions:
  contents: read

jobs:
  # Smoke test: build amd64 image, run basic container checks
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      # Issue #3580 — pull each Dockerfile `FROM` base image by its
      # pinned `@sha256:DIGEST` so a tag rotation upstream (or a
      # compromised mirror serving a different manifest) cannot
      # silently substitute the base layer. `docker pull --quiet` is
      # fail-closed: a digest mismatch produces a non-zero exit and
      # halts the workflow before any build runs.
      - name: Verify base image digest pins (Issue #3580)
        run: |
          set -euo pipefail
          echo "Pulling ${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          docker pull --quiet "${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          echo "Pulling ${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          docker pull --quiet "${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          # Defence-in-depth: confirm the local image matches the pinned
          # digest. Issue #3815 — pull-by-digest does NOT populate
          # `.RepoDigests` on the `:tag` reference (only on the
          # `@digest` reference), so inspecting the `:tag` reference
          # returns `<unset>` even on a successful pull. Inspect by
          # the `@digest` reference and compare `.Id` (which IS
          # populated post pull-by-digest) against the manifest digest
          # pulled from the registry — this catches both "registry
          # digest change" and "stale local cache" cases without the
          # `docker pull --quiet` exit-code-only check missing them.
          for pair in \
              "${{ env.RUST_BUILDER_IMAGE }}|${{ env.RUST_BUILDER_DIGEST }}" \
              "${{ env.DEBIAN_RUNTIME_IMAGE }}|${{ env.DEBIAN_RUNTIME_DIGEST }}"; do
            image="${pair%%|*}"
            expected="${pair##*|}"
            # Inspect by `@digest` reference so `.RepoDigests[0]` is
            # populated (`.RepoDigests` is empty on `:tag` after
            # pull-by-digest).
            #
            # Issue #3815 follow-up — Docker normalises the repository
            # in `.RepoDigests` to `name` with the **tag stripped**, so
            # for `rust:1.98.0-bookworm@sha256:…` this returns
            # `rust@sha256:…`. Comparing it against the full
            # `${image}@${expected}` could therefore never succeed for
            # a tagged image, and this step false-failed every push to
            # `main`/`develop` (the gate was structurally
            # unsatisfiable, not a real digest mismatch — the digests
            # matched byte-for-byte). Compare the digest and the
            # untagged repository as two separate invariants instead.
            actual_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}@${expected}" 2>/dev/null || true)"
            actual_digest="${actual_ref##*@}"
            actual_repo="${actual_ref%@*}"
            expected_repo="${image%:*}"
            if [[ -z "${actual_ref}" || "${actual_digest}" != "${expected}" || "${actual_repo}" != "${expected_repo}" ]]; then
                echo "::error::Base image digest mismatch for $image: expected ${expected_repo}@${expected}, got ${actual_ref:-<unset>}" >&2
                exit 1
              fi
          done

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-test-v3
          cache-to: type=gha,scope=build-test-v3,mode=max

      - name: Run container smoke test
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker run -d --name fluxion-test --pull=never "$IMAGE" sleep 30
          sleep 5
          docker ps | grep fluxion-test
          docker stop fluxion-test
          docker rm fluxion-test

      # Issue #4141: the image defaults to `FLUXION_REST_BIND=0.0.0.0`
      # with auth off, and a release build REFUSES to boot that
      # combination -- it exits non-zero ("refusing to boot") instead of
      # serving an unauthenticated endpoint on every interface. This step
      # set no auth flag, so the container died instantly and `curl`
      # failed with exit 7 (couldn't connect). The step had never run
      # before: every earlier build-and-test failure aborted the job
      # upstream, so it stayed dormant.
      #
      # `FLUXION_REST_AUTH=token` is the cheapest flag that satisfies the
      # guard. `/v1/healthz` is `RouteTier::Public`
      # (src/api/server/router.rs), so the health check needs no token.
      # `FLUXION_REST_ALLOW_INSECURE=1` is deliberately NOT used here --
      # the whole point of the guard is that CI does not get a bypass.
      - name: Run integration tests
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker run -d --name fluxion-int --pull=never -p 8080:8080 \
            -e FLUXION_REST_AUTH=token \
            -e FLUXION_REST_AUTH_TOKEN=ci-integration-token \
            "$IMAGE"
          sleep 5
          curl -fsS http://localhost:8080/v1/healthz
          docker stop fluxion-int
          docker rm fluxion-int

  # Per-platform native builds — no QEMU, native runners for each arch
  build-platform:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `tags:` here on purpose. The per-arch build step pushes by
      # digest against a bare repository name (Issue #4145), so it must
      # not be handed a tagged ref from metadata-action. Only `labels`
      # are consumed from this step in this job; `merge-manifests` runs
      # its own metadata-action to produce the tag list for the final
      # manifest.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Issue #3580 — see the matching step in `build-and-test`.
      # `docker pull --quiet` by digest is fail-closed: any upstream
      # tag rotation that changes the manifest digest produces a
      # non-zero exit and halts the build before the (expensive)
      # multi-arch build starts.
      - name: Verify base image digest pins (Issue #3580)
        run: |
          set -euo pipefail
          echo "Pulling ${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          docker pull --quiet "${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          echo "Pulling ${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          docker pull --quiet "${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          for pair in \
              "${{ env.RUST_BUILDER_IMAGE }}|${{ env.RUST_BUILDER_DIGEST }}" \
              "${{ env.DEBIAN_RUNTIME_IMAGE }}|${{ env.DEBIAN_RUNTIME_DIGEST }}"; do
            image="${pair%%|*}"
            expected="${pair##*|}"
            # Issue #3815 — same fix as build-and-test: inspect by
            # `@digest` reference so `.RepoDigests[0]` is populated,
            # and compare digest + untagged repository separately
            # because Docker strips the tag from `.RepoDigests`.
            actual_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}@${expected}" 2>/dev/null || true)"
            actual_digest="${actual_ref##*@}"
            actual_repo="${actual_ref%@*}"
            expected_repo="${image%:*}"
            if [[ -z "${actual_ref}" || "${actual_digest}" != "${expected}" || "${actual_repo}" != "${expected_repo}" ]]; then
                echo "::error::Base image digest mismatch for $image: expected ${expected_repo}@${expected}, got ${actual_ref:-<unset>}" >&2
                exit 1
              fi
          done

      # Issue #4145: `name-canonical=true` makes buildx add `name@<digest>`,
      # and `push-by-digest=true` pushes the image WITHOUT a name. Both
      # halves need a reference, but the reference must be a BARE
      # repository name:
      #
      #   * no reference at all  -> "tag is needed when pushing to registry"
      #   * a TAGGED ref (`:develop`) -> "can't push tagged ref
      #     ghcr.io/anchapin/fluxion:develop by digest"
      #
      # So `tags:` carries `ghcr.io/anchapin/fluxion` with no tag
      # component, not `steps.meta.outputs.tags`. The per-arch digest is
      # collected by "Export digest" and the real tag list is applied to
      # the assembled manifest list in `merge-manifests`.
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}-v3
          cache-to: type=gha,scope=build-${{ matrix.slug }}-v3,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a single multi-arch manifest list
  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-24.04
    needs: build-platform
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Security scan
  security:
    runs-on: ubuntu-24.04
    needs: build-and-test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy vulnerability scanner
        # Pinned to commit SHA for supply-chain security (master as of 2026-05-12)
        # To update: get latest SHA from https://github.com/aquasecurity/trivy-action/commits/master
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v3
        with:
          sarif_file: 'trivy-results.sarif'
