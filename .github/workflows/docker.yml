# Docker Build, Test, and Push Workflow
# Implements Issue #167: Docker image build, test, and registry setup

name: Docker Build & Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
      - 'pyproject.toml'
      - 'Cargo.toml'
  release:
    types: [published]


concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fail-closed base-image digest pins (Issue #3580, Goal #5). Both
  # digests are content-addressed; pulling by @sha256:DIGEST refuses
  # any image whose registry manifest has a different digest than the
  # pin, so a tag rotation upstream cannot silently swap the base
  # layer that lands inside the published `fluxion-rest` image.
  # Refresh with `scripts/pin_docker_base_images.sh` (quarterly).
  RUST_BUILDER_IMAGE: rust:1.87-bookworm
  RUST_BUILDER_DIGEST: sha256:251cec8da4689d180f124ef00024c2f83f79d9bf984e43c180a598119e326b84
  DEBIAN_RUNTIME_IMAGE: debian:bookworm-slim
  DEBIAN_RUNTIME_DIGEST: sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171

# Least-privilege GITHUB_TOKEN default (Issue #2526). Each job that pushes to
# ghcr.io or uploads SARIF escalates via its own job-level permissions block
# (packages: write / security-events: write).
permissions:
  contents: read

jobs:
  # Smoke test: build amd64 image, run basic container checks
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      # Issue #3580 — pull each Dockerfile `FROM` base image by its
      # pinned `@sha256:DIGEST` so a tag rotation upstream (or a
      # compromised mirror serving a different manifest) cannot
      # silently substitute the base layer. `docker pull --quiet` is
      # fail-closed: a digest mismatch produces a non-zero exit and
      # halts the workflow before any build runs.
      - name: Verify base image digest pins (Issue #3580)
        run: |
          set -euo pipefail
          echo "Pulling ${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          docker pull --quiet "${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          echo "Pulling ${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          docker pull --quiet "${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          # Defence-in-depth: confirm the local image ID matches the
          # pinned digest. Pull-by-digest alone would catch a registry
          # digest change, but a stale local cache or a re-tagged
          # upstream mirror can still surface as an ID drift; this
          # check catches that case explicitly.
          for pair in \
              "${{ env.RUST_BUILDER_IMAGE }}|${{ env.RUST_BUILDER_DIGEST }}" \
              "${{ env.DEBIAN_RUNTIME_IMAGE }}|${{ env.DEBIAN_RUNTIME_DIGEST }}"; do
            image="${pair%%|*}"
            expected="${pair##*|}"
            actual="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || true)"
            actual_id="$(docker inspect --format='{{.Id}}' "$image")"
            echo "$image -> RepoDigest=${actual:-<unset>}  Id=${actual_id}"
            if [[ "${actual##*@}" != "$expected" ]]; then
                echo "::error::Base image digest mismatch for $image: expected @$expected, got ${actual:-<unset>}" >&2
                exit 1
              fi
          done

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-test-v3
          cache-to: type=gha,scope=build-test-v3,mode=max

      - name: Run container smoke test
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker run -d --name fluxion-test --pull=never "$IMAGE" sleep 30
          sleep 5
          docker ps | grep fluxion-test
          docker stop fluxion-test
          docker rm fluxion-test

      - name: Run integration tests
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker run -d --name fluxion-int --pull=never -p 8080:8080 "$IMAGE"
          sleep 5
          curl -fsS http://localhost:8080/v1/healthz
          docker stop fluxion-int
          docker rm fluxion-int

  # Per-platform native builds — no QEMU, native runners for each arch
  build-platform:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Issue #3580 — see the matching step in `build-and-test`.
      # `docker pull --quiet` by digest is fail-closed: any upstream
      # tag rotation that changes the manifest digest produces a
      # non-zero exit and halts the build before the (expensive)
      # multi-arch build starts.
      - name: Verify base image digest pins (Issue #3580)
        run: |
          set -euo pipefail
          echo "Pulling ${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          docker pull --quiet "${{ env.RUST_BUILDER_IMAGE }}@${{ env.RUST_BUILDER_DIGEST }}"
          echo "Pulling ${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          docker pull --quiet "${{ env.DEBIAN_RUNTIME_IMAGE }}@${{ env.DEBIAN_RUNTIME_DIGEST }}"
          for pair in \
              "${{ env.RUST_BUILDER_IMAGE }}|${{ env.RUST_BUILDER_DIGEST }}" \
              "${{ env.DEBIAN_RUNTIME_IMAGE }}|${{ env.DEBIAN_RUNTIME_DIGEST }}"; do
            image="${pair%%|*}"
            expected="${pair##*|}"
            actual="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || true)"
            echo "$image -> RepoDigest=${actual:-<unset>}"
            if [[ "${actual##*@}" != "$expected" ]]; then
                echo "::error::Base image digest mismatch for $image: expected @$expected, got ${actual:-<unset>}" >&2
                exit 1
              fi
          done

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}-v3
          cache-to: type=gha,scope=build-${{ matrix.slug }}-v3,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch digests into a single multi-arch manifest list
  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build-platform
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Security scan
  security:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy vulnerability scanner
        # Pinned to commit SHA for supply-chain security (master as of 2026-05-12)
        # To update: get latest SHA from https://github.com/aquasecurity/trivy-action/commits/master
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3
        with:
          sarif_file: 'trivy-results.sarif'
