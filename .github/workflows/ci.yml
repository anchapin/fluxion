name: CI

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  python-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment and install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install maturin
      - name: Build and install Python bindings
        env:
          RUST_MIN_STACK: 33554432
          CARGO_BUILD_JOBS: 2
        run: |
          source venv/bin/activate
          maturin develop --release --jobs 2
      - name: Run pytest
        env:
          RUST_MIN_STACK: 33554432
        run: |
          source venv/bin/activate
          pytest -q

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run integration tests
        run: |
          cargo test --test integration-wiring --features wiring-tracing
          cargo test --test integration-e2e-scenarios --features wiring-tracing
          cargo test --test integration-batch-oracle --features wiring-tracing
          cargo test --test integration-cli
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/debug/
          retention-days: 30

  rust-tests:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
          cache: 'false'
      - name: Run tests
        run: cargo test --lib --verbose --no-default-features
        env:
          PYO3_PYTHON: /usr/bin/python3

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-env
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
          cache: 'false'
      - run: cargo clippy --lib -- -D warnings
