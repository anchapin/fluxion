name: CI

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run cargo test
        run: cargo test --lib --quiet --no-default-features

  python-examples:
    runs-on: ubuntu-latest
    needs: rust-tests
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment and install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install maturin
      - name: Build and install Python bindings
        run: |
          source venv/bin/activate
          maturin develop --release
      - name: Run pytest
        run: |
          source venv/bin/activate
          pytest -q

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run integration tests
        run: |
          cargo test --test integration-wiring --features wiring-tracing
          cargo test --test integration-e2e-scenarios --features wiring-tracing
          cargo test --test integration-batch-oracle --features wiring-tracing
          cargo test --test integration-cli
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            target/debug/
          retention-days: 30

  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot  # For Criterion plots
      - name: Run benchmarks
        run: |
          cargo bench --bench performance_regression --no-fail-fast
      - name: Upload Criterion HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30

  performance-regression:
    name: Check Performance Regressions
    runs-on: ubuntu-latest
    needs: benchmarks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch main branch for baseline comparison
        run: |
          git fetch origin main
      - name: Run benchmarks with baseline comparison
        run: |
          cargo bench --bench performance_regression -- --save-baseline baseline
        continue-on-error: false
      - name: Comment PR with performance metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Performance Benchmark Results\n\n';

            // Check if benchmarks passed
            const benchmarkFailed = process.env.CI_EXIT_CODE !== '0';

            if (benchmarkFailed) {
              comment += '⚠️ **Performance regression detected!** (>10% threshold)\n\n';
            } else {
              comment += '✅ **No performance regressions detected** (within 10% threshold)\n\n';
            }

            comment += '### Benchmarks Tested\n';
            comment += '- Thermal model solve performance\n';
            comment += '- BatchOracle throughput (100, 1k, 10k configs)\n';
            comment += '- VectorField operations\n\n';

            comment += '### Regression Threshold\n';
            comment += '- **10%** - Any benchmark showing >10% degradation will fail CI\n\n';

            comment += '### Artifacts\n';
            comment += '- Full Criterion HTML report available in workflow artifacts\n';
            comment += '- Baseline data: `benches/baseline/`\n\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
