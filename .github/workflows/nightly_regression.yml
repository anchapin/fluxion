name: Nightly ASHRAE 140 Regression Test

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements-dev.txt

      - name: Build Fluxion with release profile
        run: |
          cargo build --release --features python-bindings

      - name: Install Python bindings
        run: |
          maturin develop --release

      - name: Run comprehensive regression test
        id: regression
        run: |
          cargo test --test integration test_ashrae_140_comprehensive_regression --release 2>&1 | tee regression_output.txt
          TEST_EXIT=$?
          echo "test_exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          exit 0  # Always continue to generate report
        continue-on-error: true

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-results
          path: |
            regression_output.txt
          retention-days: 30

      - name: Create GitHub issue on failure
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('regression_output.txt', 'utf8');

            const title = 'Nightly ASHRAE 140 Regression Test Failed';
            const body = `## Nightly Regression Test Failure

            The comprehensive ASHRAE 140 regression test failed in the nightly workflow.

            ### Test Output
            \`\`\`
            ${output}
            \`\`\`

            ### Actions Required
            - Investigate the failing case(s)
            - Check for recent changes that may have affected validation
            - Run \`cargo test --test integration test_ashrae_140_comprehensive_regression --release\` locally
            - Fix the regression or update baseline if appropriate

            ---
            **Workflow:** ${{ github.workflow }}
            **Run:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Timestamp:** ${{ github.event.head_commit.timestamp }}`;

            // Check if an open issue already exists for this
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'regression,ashrae-140'
            });

            if (issues.length > 0) {
              console.log(`Found ${issues.length} existing regression issues, skipping issue creation`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['regression', 'ashrae-140']
              });
              console.log('Created regression issue');
            }

      - name: Run flux-diff numerical regression check
        if: always()
        run: |
          if [ -f tools/flux_diff.py ]; then
            echo "Running flux-diff numerical regression check..."
            python3 tools/flux_diff.py --help || echo "flux-diff help shown"
            # Note: Provide baseline and current output files for comparison
            # Example: python3 tools/flux_diff.py baseline.csv current.csv --format json --output flux_diff_report.json
          fi

      - name: Upload flux-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-diff-report
          path: flux_diff_report.json
          retention-days: 30
        continue-on-error: true

      - name: Fail if regression test failed
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          echo "❌ Nightly ASHRAE 140 regression test failed"
          exit 1
