name: ASHRAE 140 Validation
# Trigger CI to verify fix for PR #396
on:
  push:
    branches: [ main, develop ]
  # Issue #4018: phase-gated behind CI Gates.
  workflow_run:
    workflows: ["CI Gates"]
    types: [completed]
  schedule:
    # Run nightly validation at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

# Least-privilege GITHUB_TOKEN grants (Issue #2526): validation is read-only.
permissions:
  contents: read

jobs:
  precheck:
    name: Phase-gate precheck
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
    steps:
      - id: final
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$UPSTREAM_EVENT" != "pull_request" ] || [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
  validate:
    # Issue #4018: phase-gated behind CI Gates.
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            .
            fluxion-core -> target
            fluxion-city -> target
            fluxion-fluid -> target
            fluxion-grid -> target
            fluxion-behavior -> target
            fluxion-mcp -> target
            fluxion-wasm -> target
            crates/fluxion-toon -> target
            crates/fluxion-twin -> target
            crates/fluxion-evaluator -> target
            fluxion-cfd -> target
            fluxion-tauri/src-tauri -> target          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run ASHRAE 140 Validation Tests
        id: validation
        env:
          # The comprehensive validation test writes its machine-readable
          # BenchmarkReport JSON here (see
          # tests/all_tests/ashrae_140_validation.rs); the Extract step
          # below transforms it into the release-gate checker's shape.
          FLUXION_VALIDATION_JSON_OUT: ${{ github.workspace }}/validation_report.json
        run: |
          cargo test --test all_tests ashrae_140_validation:: --release -- --nocapture 2>&1 | tee validation_output.txt
          TEST_EXIT=$?
          echo "test_exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          exit 0  # Always continue to generate report
        # Issue #3763 audit (known-red validation site): masks the raw test
        # exit of the ASHRAE 140 suite, which is structurally red at the
        # metric level (§LIMIT-* cohort in docs/KNOWN_ISSUES.md, routed to
        # GaugeSolver #1465/#1462/#3297). The report/gate steps below must
        # still run to produce artifacts and the advisory/hard gate. No
        # validation baseline or tolerance change is made by this mask.
        continue-on-error: true

      - name: Extract Validation Results
        id: extract
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          # The comprehensive validation test writes the machine-readable
          # BenchmarkReport JSON to FLUXION_VALIDATION_JSON_OUT (see
          # tests/all_tests/ashrae_140_validation.rs). Transform it into
          # the release-gate checker's shape:
          #   {'cases': {case_id: {heating, heating_min, heating_max,
          #                       cooling, cooling_min, cooling_max}},
          #    'summary': {pass_rate, passed, failed, mae}}
          #
          # History: this step used to regex-parse the test's stdout for
          # `Case NNN: Heating = ...` / `Validation Report Summary:`
          # lines. That println format was removed when the summary moved
          # to structured tracing (Issue #2500), so the regexes silently
          # matched nothing -> 0 cases / 0.0% pass rate -> red gate on
          # every push/workflow_run even though the Rust suite passed.
          report_path = os.environ.get(
              "FLUXION_VALIDATION_JSON_OUT", "validation_report.json"
          )
          if not os.path.isfile(report_path):
              print(f"::error::validation report JSON missing: {report_path}")
              sys.exit(1)

          with open(report_path) as f:
              report = json.load(f)

          results = report.get("results", [])
          if not results:
              print("::error::validation report contains no results")
              sys.exit(1)

          def metric_name(m):
              # MetricType unit variants serialize as their name;
              # struct variants (e.g. IncidentSolar) as {"Variant": {...}}.
              if isinstance(m, str):
                  return m
              if isinstance(m, dict) and m:
                  return next(iter(m))
              return ""

          total = len(results)
          passed = sum(1 for r in results if r.get("status") == "Pass")
          failed = sum(1 for r in results if r.get("status") == "Fail")
          # Mirrors BenchmarkReport::pass_rate / ::mae (benchmark.rs).
          pass_rate = (100.0 * passed / total) if total else 0.0
          mae = sum(abs(r.get("percent_error", 0.0)) for r in results) / total

          cases = {}
          for r in results:
              cid = str(r.get("case_id", ""))
              entry = cases.setdefault(cid, {
                  "heating": 0.0, "heating_min": 0.0, "heating_max": 0.0,
                  "cooling": 0.0, "cooling_min": 0.0, "cooling_max": 0.0,
              })
              mname = metric_name(r.get("metric"))
              if mname == "AnnualHeating":
                  entry["heating"] = r.get("fluxion_value", 0.0)
                  entry["heating_min"] = r.get("ref_min", 0.0)
                  entry["heating_max"] = r.get("ref_max", 0.0)
              elif mname == "AnnualCooling":
                  entry["cooling"] = r.get("fluxion_value", 0.0)
                  entry["cooling_min"] = r.get("ref_min", 0.0)
                  entry["cooling_max"] = r.get("ref_max", 0.0)

          summary = {
              "pass_rate": pass_rate,
              "passed": passed,
              "failed": failed,
              "mae": mae,
          }

          with open("validation_results.json", "w") as f:
              json.dump({"cases": cases, "summary": summary}, f, indent=2)

          print("::notice::ASHRAE 140 Validation Summary")
          print(f"Results: {total}, Cases: {len(cases)}")
          print(f"Pass Rate: {pass_rate:.1f}%")
          print(f"Passed: {passed}, Failed: {failed}")
          print(f"Mean Absolute Error: {mae:.2f}%")
          EOF

      - name: Generate Markdown Report
        run: |
          python3 << 'EOF'
          import json

          with open('validation_results.json', 'r') as f:
              data = json.load(f)

          cases = data.get('cases', {})
          summary = data.get('summary', {})

          report_lines = [
              "# ASHRAE 140 Validation Report",
              "",
              "## Summary",
              f"- **Pass Rate**: {summary.get('pass_rate', 0):.1f}%",
              f"- **Cases Passed**: {summary.get('passed', 0)}",
              f"- **Cases Failed**: {summary.get('failed', 0)}",
              f"- **Mean Absolute Error**: {summary.get('mae', 0):.2f}%",
              "",
              "## Case Results",
              "",
              "| Case | Heating (MWh) | Ref Min | Ref Max | Status | Cooling (MWh) | Ref Min | Ref Max | Status |",
              "|------|------|---------|---------|--------|---------|---------|---------|--------|",
          ]

          for case_id in sorted(cases.keys(), key=lambda x: (x[0] if x[0].isdigit() else '9', x)):
              case = cases[case_id]
              h = case['heating']
              h_min = case['heating_min']
              h_max = case['heating_max']
              c = case['cooling']
              c_min = case['cooling_min']
              c_max = case['cooling_max']

              h_status = "✓" if h_min <= h <= h_max else "✗"
              c_status = "✓" if c_min <= c <= c_max else "✗"

              report_lines.append(f"| {case_id} | {h:.2f} | {h_min:.2f} | {h_max:.2f} | {h_status} | {c:.2f} | {c_min:.2f} | {c_max:.2f} | {c_status} |")

          report_lines.extend([
              "",
              "## Legend",
              "- ✓ = Within acceptable range",
              "- ✗ = Outside acceptable range",
              "",
              "## Details",
              "- Denver TMY2 weather data",
              "- Annual simulation (8760 hours)",
              "- Low-mass and high-mass construction variants",
              "- Free-floating and controlled HVAC modes",
              "- Multi-zone and shading cases",
              "",
              "---",
              "Generated by ASHRAE 140 CI Validation",
          ])

          with open('ASHRAE_140_VALIDATION_REPORT.md', 'w') as f:
              f.write('\n'.join(report_lines))
          EOF

      - name: Package crate for size gate
        # The release-gate checker's crate_size gate auto-detects
        # target/package/fluxion-*.crate; without a measurement it
        # fails with "No crate-size measurement supplied".
        run: cargo package --allow-dirty --no-verify

      - name: Check Validation Results
        id: check
        # Issue #3763 audit (known-red validation site): the release-gate
        # check is expected-red until the §LIMIT-* cohort in
        # docs/KNOWN_ISSUES.md closes (GaugeSolver routing #1465/#1462/#3297),
        # so on pull_request events this is advisory only. It is NOT
        # best-effort: the terminal "Fail if validation gate failed" step
        # re-raises steps.check.outcome == 'failure' on push/schedule events.
        continue-on-error: true
        run: |
          # Run centralized release gate checker for validation gates
          python3 scripts/release_gate_checker.py \
            --validation-results validation_results.json \
            --json --output gate_status.json

      - name: Display Gate Status
        run: |
          echo "## Release Gate Status" >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ashrae-140-results
          path: |
            validation_output.txt
            validation_report.json
            validation_results.json
            ASHRAE_140_VALIDATION_REPORT.md
            gate_status.json
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import os

          with open('ASHRAE_140_VALIDATION_REPORT.md', 'r') as f:
              report = f.read()

          import subprocess
          pr_number = os.getenv('GITHUB_EVENT_PATH')
          if pr_number:
              result = subprocess.run(
                  ['gh', 'pr', 'comment', '--body', report],
                  capture_output=True,
                  text=True
              )
              print("PR comment result:", result.returncode)
          EOF
        # Issue #3763 audit: cosmetic best-effort — masks only a failed
        # `gh pr comment` post. The durable signal is the report artifact
        # uploaded above (if: always()); a comment-posting failure must
        # not fail the workflow.
        continue-on-error: true

      - name: Fail if validation gate failed
        if: (failure() || steps.check.outcome == 'failure') && github.event_name != 'pull_request'
        run: |
          echo "❌ Release gate check failed"
          echo ""
          echo "## Gate Failure Summary"
          if [ -f gate_status.json ]; then
            python3 scripts/display_gate_status.py
          fi
          exit 1
