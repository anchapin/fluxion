name: Known Issues Staleness

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/KNOWN_ISSUES.md'
      - 'scripts/check_known_issues_stale.py'

# Least-privilege GITHUB_TOKEN default (Issue #2526). The check-stale job opens
# / comments on a tracking issue and escalates via its own job-level permissions
# block (issues: write).

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  check-stale:
    runs-on: ubuntu-latest
    name: Check KNOWN_ISSUES.md staleness
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Check staleness
        id: stale_check
        run: |
          python3 scripts/check_known_issues_stale.py
          EXIT_CODE=$?
          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "status=fresh" >> "$GITHUB_OUTPUT"
          else
            echo "status=stale" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing staleness issue
        if: steps.stale_check.outputs.status == 'stale'
        id: find_issue
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "known-issues-refresh" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          echo "issue_number=${ISSUE_NUMBER:-}" >> "$GITHUB_OUTPUT"

      - name: Create issue if stale and no open issue exists
        if: steps.stale_check.outputs.status == 'stale' && steps.find_issue.outputs.issue_number == ''
        # Issue #3117 — the previous inline body heredoc (`<<'ISSUE_BODY'`)
        # terminated the YAML literal block scalar prematurely (the heredoc
        # body was deindented below the YAML minimum). The literal block
        # ended at line 69, after which the line beginning with a backtick
        # (`docs/KNOWN_ISSUES.md`) was invalid YAML at column 1, causing the
        # workflow to fail at parse time and produce 0 jobs in 0 seconds on
        # every push event. The body now lives in a dedicated script under
        # `.github/workflows/scripts/`, mirroring the
        # `post_determinism_gate_comment.py` pattern fixed in #1397.
        env:
          ISSUE_BODY_FILE: ${{ runner.temp }}/known-issues-stale-body.md
        run: |
          OUTPUT_FILE="${ISSUE_BODY_FILE}" \
            python3 .github/workflows/scripts/post_staleness_issue_body.py
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "KNOWN_ISSUES.md Refresh Required — stale >45 days" \
            --label "documentation" \
            --label "known-issues-refresh" \
            --label "P2" \
            --assignee "@me" \
            --body-file "${ISSUE_BODY_FILE}"
          rm -f "${ISSUE_BODY_FILE}"

      - name: Comment on existing issue if stale and already open
        if: steps.stale_check.outputs.status == 'stale' && steps.find_issue.outputs.issue_number != ''
        run: |
          gh issue comment \
            "${{ steps.find_issue.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "<!-- known-issues-stale workflow -->\n\n:warning: **Still stale** — `docs/KNOWN_ISSUES.md` is still >45 days old. Please refresh or close this issue if no updates are needed."
