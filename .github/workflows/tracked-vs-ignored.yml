name: Tracked-vs-Ignored Gate

# Issue #3356: audit unanchored ``.gitignore`` patterns and prevent the
# silent-data-loss class of bug where a tracked file is matched by a
# ``.gitignore`` rule (PR #3342 reconstructed 5 silently-dropped React
# frontend modules because an unanchored ``lib/`` pattern in the root
# ``.gitignore`` matched ``fluxion-tauri/frontend/src/lib/``).
#
# The check runs ``scripts/check_no_ignored_tracked_files.py``, which
# uses ``git check-ignore --no-index`` on every tracked file and fails
# the gate when any newly-tracked file is matched by a ``.gitignore``
# pattern. Pre-existing tracked-but-ignored entries are tolerated via
# ``KNOWN_TRACKED_BUT_IGNORED`` baseline inside the script.
#
# This workflow is intentionally minimal: pure-Python, single-job, no
# runner probes, no caching — the gate must run on every PR class to
# satisfy the listener pattern (Issue #3810, 6th invariant) so that
# `Tracked-vs-Ignored Gate (Issue #3356)` reports as a required status
# check on docs-only / scripts-only / physics PRs alike. The
# `paths-ignore` filter excludes only doc-only changes to stay within
# the per-PR feedback budget.

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.mdx"
      - "LICENSE"
      - "**/LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  tracked-vs-ignored:
    name: "Tracked-vs-Ignored Gate (Issue #3356)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run tracked-vs-ignored gate
        run: python3 scripts/check_no_ignored_tracked_files.py

  # Issue #3810: GH-listener pattern for the path-filtered
  # `tracked-vs-ignored` gate. The upstream `tracked-vs-ignored` job only
  # fires when a `.gitignore` file or the script itself changes
  # (`paths:` filter), so on docs-only / scripts-only PRs that touch
  # other files (release_gates.yaml, AGENTS.md, etc.) the workflow is
  # skipped and the required-check context is never reported. The
  # `tracked-vs-ignored-listener` job is unconditional (`if: always()`)
  # and observes the upstream's result:
  #
  #   * `success` / `skipped` -> PASS (skipped is the path-filtered
  #     neutral-success: the gate isn't triggered for this PR class, so
  #     it cannot fail).
  #   * `failure` / `cancelled` / `timed_out` -> FAIL.
  #
  # The listener's `name:` is the exact required-check string so
  # GitHub branch protection's contexts array can reference it
  # verbatim (Issue #3116). Job id is suffixed `-listener` to avoid a
  # name collision with the upstream `tracked-vs-ignored` id.
  tracked-vs-ignored-listener:
    name: "Tracked-vs-Ignored Gate (Issue #3356)"
    needs: [tracked-vs-ignored]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Verify upstream result
        run: |
          set -uo pipefail
          RESULT="${{ needs.tracked-vs-ignored.result }}"
          echo "tracked-vs-ignored upstream result: ${RESULT}"
          if [[ "${RESULT}" != "success" && "${RESULT}" != "skipped" ]]; then
            echo "::error::tracked-vs-ignored upstream did not succeed: ${RESULT}"
            exit 1
          fi
          echo "Tracked-vs-Ignored Gate (Issue #3356) PASS"
