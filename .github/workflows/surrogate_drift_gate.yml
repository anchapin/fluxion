# Surrogate Drift Tolerance Gate (Issue #1784 — T6.4)
#
# CI gate that asserts surrogate output does not drift >1% from the 9R4C
# physics baseline on the benchmark building (Case 900 high-mass).
#
# What it runs
# ------------
# Five tests across two binaries (4 from `surrogate_drift_gate` + 1 from
# `surrogate_drift_fallback_regression`). All five are enumerated in the
# coverage check below so a rename/removal is caught (Issue #1866: CI
# gate coverage checks must use cargo test filters that match ALL expected
# tests). The two heavy simulations run in their own steps so the per-test
# `mode=`/`max_drift=` diagnostics (printed under `--nocapture`, Issue
# #1865) stay deterministic; the three light unit tests run in separate
# steps with precise one-test filters that do not collide with the heavy
# test names (mirrors the ashrae_140_strict_energy_gate pattern).
#
#   1. test_surrogate_drift_gate_case_900_9r4c  (surrogate_drift_gate)
#      filter: _surrogate_drift_gate_case_900_9r4c
#      168-timestep (1-week) simulation to verify drift tracking
#
#   2. test_surrogate_drift_gate_annual_simulation  (surrogate_drift_gate)
#      filter: _surrogate_drift_gate_annual_simulation
#      8760-timestep (annual) simulation for full-year drift gate
#
#   3. test_surrogate_drift_metric_definition  (surrogate_drift_gate)
#      filter: _surrogate_drift_metric_definition
#      Pure unit test on the drift metric formula (no simulation).
#      Runs in its OWN `cargo test` step (Issue #2582) and captures to
#      /tmp/surrogate_drift_metric.txt so the verify-step coverage grep is
#      deterministic (no interleaving with sibling-test eprintln output).
#
#   4. test_surrogate_drift_gate_lenient_fallback_contract  (surrogate_drift_gate)
#      filter: _lenient_fallback_contract
#      Issue #1865 regression guard: locks the two-mode lenient-fallback
#      contract (50% drift must not trip the gate when no model is loaded).
#      Also runs in its OWN step (Issue #2582); captures to
#      /tmp/surrogate_drift_lenient.txt.
#
#   5. fallback_annual_hvac_within_10pct_of_9r4c_baseline
#      (surrogate_drift_fallback_regression)
#      Issue #2923 fallback-mode floor: locks the analytical surrogate's
#      annual HVAC (heating + cooling, ASHRAE 140 Case 900) drift against
#      the 9R4C physics baseline at ±10%. Active in mode=fallback so
#      Goal #1 (ASHRAE 140 ≥60%) has an enforced surrogate-layer gate
#      even when no ONNX model is registered. Runs in its OWN step and
#      captures to /tmp/surrogate_drift_fallback_hvac.txt.
#
# Drift metric defined as:
#   drift_pct = |T_surrogate - T_physics| / max(|T_physics|, ε) × 100
# Where ε = 0.1°C prevents division by zero.
#
# Two-mode gate (Issue #1865, hardened Issue #2923):
#   - ONNX mode    — a trained model is resolvable (FLUXION_ONNX_MODEL or
#                    models/surrogate_zone_thermal.onnx). The strict ±1%
#                    per-timestep tolerance is enforced; any breach fails
#                    the gate.
#   - FALLBACK mode — no trained model is registered. The surrogate runs
#                    the analytical predictor. Issue #2923: this branch
#                    FAILS CLOSED unless
#                    models/surrogate_zone_thermal.onnx.sha256 is present
#                    (the operator's explicit acknowledgement that
#                    fallback mode is acceptable for this milestone). With
#                    the manifest present, the analytical fallback's
#                    annual HVAC must sit within ±10% of the 9R4C
#                    baseline (test 5 above) — this is the fallback-mode
#                    floor that replaces the prior ≤100% advisory ceiling.
#                    Without the manifest the workflow exits 1 with the
#                    Goal #1 enforcement message.
#
# The active mode is resolved by the "Resolve surrogate gate mode" step,
# which mirrors SurrogateManager::new_with_auto_load() in
# src/ai/surrogate.rs. The verify step branches its success/error message
# on that mode so the CI summary always reports whether the strict 1% gate
# was actually active (rather than unconditionally claiming "<1% drift").
#
# Why --release
# --------------
# Release mode matches the production binary and avoids debug-mode overhead.
# Same reasoning as other strict gates in the CI pipeline.
#
# Why --features ort
# ------------------
# The 9R4C thermal network lives behind the `ort` feature gate (per issue #1294).
# Without `--features ort`, Case 900 would compile without the multi-node solver
# and the gate would not exercise the correct physics baseline.
#
# Status check name
# -----------------
# Job id is `surrogate-drift-gate`; the human-readable name is
# "Surrogate Drift Tolerance Gate (Issue #1784)". Add this job name to the
# branch protection "Required status checks" list.

name: Surrogate Drift Tolerance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: surrogate-drift-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  surrogate-drift-gate:
    name: Surrogate Drift Tolerance Gate (Issue #1784)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
          sccache: 'false'

      - name: Cache cargo registry + build artifacts

        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: surrogate-drift-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            surrogate-drift-gate-${{ runner.os }}-

      - name: Resolve surrogate gate mode
        # Mirror SurrogateManager::new_with_auto_load() (src/ai/surrogate.rs):
        #   1. FLUXION_ONNX_MODEL env var (if it points at an existing file)
        #   2. models/surrogate_zone_thermal.onnx (built-in default)
        #   3. otherwise → fallback (analytical predictor, lenient gate)
        # The resolved mode drives the success/error messaging in the verify
        # step below so the CI summary reflects whether the strict 1% gate
        # was actually active (Issue #1865).
        #
        # Issue #2923: in mode=fallback, the manifest at
        # `models/surrogate_zone_thermal.onnx.sha256` MUST be present — its
        # existence is the operator's explicit acknowledgement that fallback
        # mode is acceptable for this milestone. Without it the gate silently
        # downgrades to advisory and Goal #1 (ASHRAE 140 ≥60%) has no enforced
        # surrogate-layer gate. Fail closed in that case so the regression
        # cannot ship silently.
        id: gate-mode
        run: |
          model=""
          if [ -n "${FLUXION_ONNX_MODEL:-}" ] && [ -f "${FLUXION_ONNX_MODEL}" ]; then
            model="${FLUXION_ONNX_MODEL}"
          elif [ -f "models/surrogate_zone_thermal.onnx" ]; then
            model="models/surrogate_zone_thermal.onnx"
          fi
          if [ -n "$model" ]; then
            echo "mode=onnx" >> "$GITHUB_OUTPUT"
            echo "model=$model" >> "$GITHUB_OUTPUT"
            echo "Gate mode: ONNX (strict 1% tolerance) — model: $model"
          else
            # Issue #2923: fail-closed fallback precondition. The manifest at
            # models/surrogate_zone_thermal.onnx.sha256 is the operator's
            # explicit acknowledgement that fallback mode is acceptable for
            # this milestone. Without it the gate would silently downgrade
            # to advisory and Goal #1 (ASHRAE 140 ≥60%) would have no
            # enforced surrogate-layer gate. Either ship the official
            # `.onnx` + `.sha256` or open an ADR waiving the surrogate gate.
            if [ ! -f "models/surrogate_zone_thermal.onnx.sha256" ]; then
              echo "::error::No surrogate model registered — surrogate drift gate cannot enforce Goal #1 (ASHRAE 140 ≥60%). Either ship the official .onnx + .sha256 or open an ADR waiving the surrogate gate for this milestone. (Issue #2923)"
              echo "Expected manifest at: models/surrogate_zone_thermal.onnx.sha256 (see file header for format)"
              exit 1
            fi
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "Gate mode: FALLBACK (manifest present at models/surrogate_zone_thermal.onnx.sha256 — Issue #2923 fail-closed precondition satisfied; analytical fallback, fallback-mode floor: ±10% annual HVAC vs 9R4C baseline)"
          fi

      - name: Regex tolerance self-test (Issue #2487)
        # Fast-fail guard: prove the verify-step test-summary regexes still
        # match libtest's `test <name> ... ok|FAILED` line when unbuffered
        # eprintln! output interleaves onto the same captured line (the race
        # documented in #2487, observed in PR #2473 run 31300498830). Runs
        # before the heavy simulations so a regex regression fails the gate
        # in seconds, not minutes.
        run: |
          set -euo pipefail
          # Synthetic interleaved lines mirroring the PR #2473 capture:
          #   `[drift-gate-diag] ... tolerance=test <name> ... ok`
          ok_interleaved='[drift-gate-diag] context=Issue #1865 tolerance=test test_surrogate_drift_metric_definition ... ok'
          ok_plain='test test_surrogate_drift_metric_definition ... ok'
          fail_interleaved='some eprintln noise test surrogate_drift_gate_case_900_9r4c ... FAILED'
          printf '%s\n%s\n%s\n' "$ok_interleaved" "$ok_plain" "$fail_interleaved" > /tmp/regex_selftest.txt

          # check_coverage-style regex must find the specific test name even
          # behind an eprintln! prefix.
          grep -qE '(^|[^[:alnum:]_])test test_surrogate_drift_metric_definition \.\.\. (ok|ignored|FAILED)' /tmp/regex_selftest.txt \
            || { echo "::error::coverage regex did not match interleaved ok line (#2487)"; exit 1; }

          # PASSED extractor must count BOTH ok lines (plain + interleaved).
          passed=$(grep -cE '(^|[^[:alnum:]_])test test_surrogate_drift_(gate|metric).* \.\.\. ok' /tmp/regex_selftest.txt)
          [ "$passed" -eq 2 ] || { echo "::error::PASSED regex counted $passed (expected 2) for interleaved ok lines (#2487)"; exit 1; }

          # FAILED extractor must count the interleaved FAILED line.
          failed=$(grep -cE '(^|[^[:alnum:]_])test .* \.\.\. FAILED' /tmp/regex_selftest.txt)
          [ "$failed" -eq 1 ] || { echo "::error::FAILED regex counted $failed (expected 1) for interleaved FAILED line (#2487)"; exit 1; }

          # No false positive: `latest` (contains the substring `test`) must
          # NOT be counted as a test FAILED line — the leading word boundary
          # guard rejects it.
          printf 'latest scenario ... FAILED\n' >> /tmp/regex_selftest.txt
          failed2=$(grep -cE '(^|[^[:alnum:]_])test .* \.\.\. FAILED' /tmp/regex_selftest.txt)
          [ "$failed2" -eq 1 ] || { echo "::error::FAILED regex false-positive on 'latest scenario ... FAILED' (#2487)"; exit 1; }

          echo "Regex tolerance self-test passed (#2487): interleaved ok/FAILED lines matched, no false positives."

      - name: Case 900 9R4C 1-week drift check
        # Test 1/4: 168-timestep (1-week) drift gate
        # Filter `_surrogate_drift_gate_case_900_9r4c` is precise — no other
        # test in the workspace shares this suffix.
        # `--nocapture` surfaces the per-test `mode=` / `max_drift=` diagnostic
        # line so the verify step can report the actual drift and operating mode.
        run: |
          cargo test --release --features ort --verbose \
            --test surrogate_drift_gate \
            _surrogate_drift_gate_case_900_9r4c \
            -- --nocapture \
            2>&1 | tee -a /tmp/surrogate_drift_output.txt
          echo "---"
          echo "exit_code=$?"

      - name: Case 900 Annual simulation drift check
        # Test 2/4: 8760-timestep (annual) drift gate
        run: |
          cargo test --release --features ort --verbose \
            --test surrogate_drift_gate \
            _surrogate_drift_gate_annual_simulation \
            -- --nocapture \
            2>&1 | tee -a /tmp/surrogate_drift_output.txt
          echo "---"
          echo "exit_code=$?"

      - name: Drift metric definition test
        # Test 3/4: pure unit test on the drift metric formula (no
        # simulation). Runs in its OWN `cargo test` invocation and captures
        # to a dedicated file (`/tmp/surrogate_drift_metric.txt`) so the
        # verify step can grep its summary line deterministically — the ONLY
        # `test <name> ... ok` line in that file is this test's.
        #
        # Issue #2582: previously this was OR-grouped with the
        # lenient-fallback test in a single invocation
        # (`-- _surrogate_drift_metric_definition _lenient_fallback_contract`).
        # The sibling test's `eprintln!` context output interleaved with (and
        # sometimes masked) this test's summary line, making the coverage
        # regex flake and randomly report `DROPPED FROM GATE` on PRs that
        # touched neither file. Splitting the invocations guarantees each
        # test's summary line is the only one in its captured output.
        #
        # Issue #2487: splitting steps was not enough — a test's OWN
        # unbuffered eprintln! can still interleave mid-line with its libtest
        # `test ... ok` summary (PR #2473 run 31300498830 @ line 2122). The
        # coverage/result regexes in the verify step below are therefore
        # UNANCHORED with a leading word boundary so they survive such
        # interleaving, and a self-test step guards against regressions.
        run: |
          cargo test --release --features ort --verbose \
            --test surrogate_drift_gate \
            _surrogate_drift_metric_definition \
            -- --nocapture \
            2>&1 | tee /tmp/surrogate_drift_metric.txt | tee -a /tmp/surrogate_drift_output.txt
          echo "---"
          echo "exit_code=$?"

      - name: Lenient-fallback contract test
        # Test 4/4: Issue #1865 regression guard — locks the two-mode lenient
        # fallback contract (50% drift must not trip the gate when no model is
        # loaded). `test_surrogate_drift_gate_lenient_fallback_contract` was
        # silently unrun by the gate before PR #1874. Runs in its OWN
        # invocation for the same deterministic-capture reason as the metric
        # test above (Issue #2582); captures to
        # `/tmp/surrogate_drift_lenient.txt`.
        run: |
          cargo test --release --features ort --verbose \
            --test surrogate_drift_gate \
            _lenient_fallback_contract \
            -- --nocapture \
            2>&1 | tee /tmp/surrogate_drift_lenient.txt | tee -a /tmp/surrogate_drift_output.txt
          echo "---"
          echo "exit_code=$?"

      - name: Analytical-fallback annual HVAC regression (Issue #2923)
        # Test 5/5: Issue #2923 fallback-mode floor — locks the analytical
        # surrogate's annual HVAC drift against the 9R4C physics baseline
        # (ASHRAE 140 Case 900, ±10% envelope). Runs in its OWN invocation so
        # its `eprintln!` diagnostic doesn't interleave with the lenient
        # contract test's; captures to
        # `/tmp/surrogate_drift_fallback_hvac.txt`. This test is the active
        # surrogate-layer gate in mode=fallback; in mode=onnx the analytical
        # predictor is dormant in production but the assertions still hold
        # (the trained model diverges more than the analytical sine cycle),
        # so the test stays in the workflow unconditionally — it just isn't
        # the active Goal #1 enforcement in ONNX mode (that role belongs to
        # the strict ±1% per-timestep tests 1/2 above).
        run: |
          cargo test --release --features ort --verbose \
            --test surrogate_drift_fallback_regression \
            -- --nocapture \
            2>&1 | tee /tmp/surrogate_drift_fallback_hvac.txt | tee -a /tmp/surrogate_drift_output.txt
          echo "---"
          echo "exit_code=$?"

      - name: Verify gate coverage and extract results
        run: |
          echo "=== Surrogate drift gate coverage check ==="
          # All four tests in `tests/surrogate_drift_gate.rs` must appear in
          # the cargo output. A name missing means a filter silently dropped
          # it (Issue #1866) — fail honestly rather than report a false PASS.
          #
          # Issue #2582: the two light unit tests now run in dedicated
          # `cargo test` invocations, each capturing to its OWN file, so each
          # test's summary line is the ONLY `test <name> ... ok` line in that
          # file and the coverage grep is deterministic (no interleaving with
          # a sibling test's eprintln! context output). The two heavy
          # simulations still append to the aggregate file; their precise
          # one-test filters mean each contributes exactly one summary line.
          check_coverage() {
            local name="$1" file="$2"
            # Issue #2487: drop the `^` line anchor and require a word
            # boundary before `test` so the match survives mid-line
            # interleaving (an unbuffered eprintln! glued onto the start of
            # libtest's `test <name> ... ok` summary line under --nocapture).
            if grep -qE "(^|[^[:alnum:]_])test $name \\.\\.\\. (ok|ignored|FAILED)" "$file"; then
              echo "  COVERED: $name (from $(basename "$file"))"
            else
              echo "  DROPPED FROM GATE: $name"
              echo "  This test name was not found in $file."
              echo "  Either the test was renamed/removed, or the workflow"
              echo "  filter needs updating. Failing the build."
              exit 1
            fi
          }
          check_coverage test_surrogate_drift_gate_case_900_9r4c             /tmp/surrogate_drift_output.txt
          check_coverage test_surrogate_drift_gate_annual_simulation         /tmp/surrogate_drift_output.txt
          check_coverage test_surrogate_drift_metric_definition              /tmp/surrogate_drift_metric.txt
          check_coverage test_surrogate_drift_gate_lenient_fallback_contract /tmp/surrogate_drift_lenient.txt
          check_coverage fallback_annual_hvac_within_10pct_of_9r4c_baseline   /tmp/surrogate_drift_fallback_hvac.txt

          echo
          echo "=== Surrogate drift gate result extraction ==="
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/surrogate_drift_output.txt

          # Issue #2487: the test-summary regexes are deliberately UNANCHORED
          # (no `^`/`$`) and require a leading word boundary so they still
          # match libtest's `test <name> ... ok|FAILED` line when an
          # unbuffered eprintln! diagnostic interleaves onto the same captured
          # line (e.g. `[drift-gate-diag] ... tolerance=test <name> ... ok`).
          # The word boundary prevents false positives like `latest ... FAILED`.
          FAILED=$(grep -cE '(^|[^[:alnum:]_])test .* \.\.\. FAILED' /tmp/surrogate_drift_output.txt || true)
          PANICS=$(grep -cE 'panicked at' /tmp/surrogate_drift_output.txt || true)
          PASSED=$(grep -cE '(^|[^[:alnum:]_])test (test_surrogate_drift_(gate|metric)|fallback_annual_hvac).* \.\.\. ok' /tmp/surrogate_drift_output.txt || true)

          # Test self-reported mode + peak drift (printed via eprintln! under
          # --nocapture). Used to cross-check the independently resolved mode.
          TEST_MODE=$(grep -oE 'mode=(onnx|fallback)' /tmp/surrogate_drift_output.txt | tail -1 | cut -d= -f2 || true)
          PEAK_DRIFT=$(grep -oE 'max_drift=[0-9.]+%' /tmp/surrogate_drift_output.txt | tail -1 | cut -d= -f2 || true)
          RESOLVED_MODE="${{ steps.gate-mode.outputs.mode }}"

          echo "  Passed        : $PASSED"
          echo "  Failed        : $FAILED"
          echo "  Panics        : $PANICS"
          echo "  Resolved mode : $RESOLVED_MODE"
          echo "  Test mode     : ${TEST_MODE:-n/a}"
          echo "  Peak drift    : ${PEAK_DRIFT:-n/a}"

          if [ -n "$TEST_MODE" ] && [ "$TEST_MODE" != "$RESOLVED_MODE" ]; then
            echo "::warning::Gate mode mismatch — workflow resolved '$RESOLVED_MODE' but the test reported '$TEST_MODE'. Verify SurrogateManager::new_with_auto_load() resolution (Issue #1865)."
          fi

          if [ "$FAILED" -gt 0 ] || [ "$PANICS" -gt 0 ]; then
            echo
            if [ "$RESOLVED_MODE" = "onnx" ]; then
              echo "::error::Surrogate drift tolerance gate FAILED — surrogate drifted >1% from 9R4C baseline (strict ONNX mode). Retrain the surrogate or adjust the drift tolerance (Issue #1784)."
            else
              echo "::error::Surrogate drift tolerance gate FAILED — surrogate exceeded the lenient 100% fallback ceiling. This is unexpected in fallback mode; investigate the analytical load predictor (Issue #1865)."
            fi
            echo "See /tmp/surrogate_drift_output.txt for the failing assertion messages."
            exit 1
          fi

          if [ "$RESOLVED_MODE" = "onnx" ]; then
            echo "PASS: Surrogate drift tolerance gate holds (<1% drift from 9R4C baseline, strict ONNX mode${PEAK_DRIFT:+, peak drift $PEAK_DRIFT})."
          else
            echo "PASS: Surrogate drift gate passed in fallback mode — manifest models/surrogate_zone_thermal.onnx.sha256 IS present (Issue #2923 fail-closed precondition satisfied), strict 1% gate is dormant, fallback-mode floor (analytical fallback annual HVAC drift <10% from 9R4C baseline) enforced${PEAK_DRIFT:+ (peak drift $PEAK_DRIFT)}. See Issue #2923."
          fi

      - name: Upload drift-gate log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: surrogate-drift-gate
          path: /tmp/surrogate_drift_output.txt
          retention-days: 14
