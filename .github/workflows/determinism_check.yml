name: Cross-Platform Determinism CI

# Issue #3355: expand upstream scope to `develop` so the Fluxion Determinism
# Gate listener job (`fluxion-determinism-gate` in `ashrae_validation.yml`)
# fires for PRs targeting `develop`. The `workflow_run` listener in
# `ashrae_validation.yml` is filtered by
# `github.event.workflow_run.event == 'pull_request'`, so the listener
# activates as soon as this workflow runs for a develop PR.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    determinism-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: true   # Issue #3567-tier: cancel superseded PR runs to prevent backlog

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RUSTFLAGS for cross-platform FP determinism (Issues #1297 and #2549).
  # - opt-level=3: maximum optimization for consistent math behavior.
  # - debug-assertions=no: disable debug assertions for release-like behavior.
  # - codegen-units=1: serialize codegen so LLVM sees the whole crate at once;
  #   this removes the parallel-codegen reordering that perturbs float results.
  # - llvm-args=--enable-no-infs-fp-math=false: forbid LLVM from assuming
  #   arguments are never +inf, which would let it replace x/inf -> 0 etc.
  # - llvm-args=--enable-no-nans-fp-math=false: forbid LLVM from assuming
  #   arguments are never NaN, which would let it reorder x != x -> false etc.
  #
  # Together these pin LLVM's fp-math model so x86_64, ARM64, and Apple
  # Silicon all emit the same arithmetic ops (no Inf/NaN elision, no
  # reassociation). Note: target-cpu=haswell was removed earlier — it
  # causes SIMD compilation errors on ARM macOS.
  #
  # Flag rejection log (#2549): `-C llvm-args=--enable-unsafe-fp-math=false`
  # is NOT recognized by the LLVM bundled with rustc 1.97.x (LLVM 21);
  # rustc emits "Unknown command line argument". It is therefore omitted
  # here. The two `no-infs`/`no-nans` flags ARE recognized and are the
  # primary levers for disabling unsafe fp reassociation.
  RUSTFLAGS: >-
    -C opt-level=3
    -C debug-assertions=no
    -C codegen-units=1
    -C llvm-args=--enable-no-infs-fp-math=false
    -C llvm-args=--enable-no-nans-fp-math=false

jobs:
  determinism-check:
    name: Determinism Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Cover x86_64 (ubuntu/windows) + aarch64 Apple Silicon (macos-14).
        # macos-13 (the last Intel x86_64 macOS runner) was removed in #2618:
        # it is redundant with the ubuntu/windows x86_64 determinism signal
        # AND the macOS Intel GitHub-hosted runner pool is perpetually
        # oversubscribed (30+ min queue or never starts within the wave
        # polling window), which left every PR stuck UNSTABLE with a pending
        # `Determinism Check (macos-13)` job. macos-14 (Apple Silicon)
        # preserves the cross-arch determinism signal that #2549 wanted.
        # The job-level timeout-minutes caps runaway queue time for any
        # remaining variant (esp. macos-14) so none can hold a PR UNSTABLE.
        os: [ubuntu-latest, windows-latest, macos-14]
        rust: [stable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-determinism-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-determinism-cargo-

      - name: Resolve clang_rt.osx builtins (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          echo "=== Resolving libclang_rt.osx builtins ==="
          # The ORT (ONNX Runtime) prebuilt link step emits `-lclang_rt.osx`,
          # which the linker resolves to `libclang_rt.osx.a` (compiler-rt
          # builtins). On Xcode 16.x GHA runners the toolchain's
          # `clang/<ver>/lib/darwin/` directory is sometimes absent, so the
          # archive must be located elsewhere and made discoverable.
          #
          # NOTE: the real filename is `libclang_rt.osx.a` (static archive),
          # NOT `libclang_rt.osx` — the old diagnostic checked the wrong name
          # and therefore always reported "not found".

          RESOURCE_DIR="$(clang -print-resource-dir 2>/dev/null || true)"
          echo "clang resource dir : ${RESOURCE_DIR:-<unknown>}"
          echo "xcode-select path  : $(xcode-select -p 2>/dev/null || echo unknown)"
          echo "SDK path           : $(xcrun --show-sdk-path 2>/dev/null || echo unknown)"

          DARWIN_DIR=""
          if [ -n "$RESOURCE_DIR" ]; then
            DARWIN_DIR="$RESOURCE_DIR/lib/darwin"
          fi

          # 1) Already at the expected location?
          if [ -n "$DARWIN_DIR" ] && [ -f "$DARWIN_DIR/libclang_rt.osx.a" ]; then
            echo "✅ Already present: $DARWIN_DIR/libclang_rt.osx.a"
            echo "CLANG_RT_DIR=$DARWIN_DIR" >> $GITHUB_ENV
            echo "================================"
            exit 0
          fi

          echo "⚠️  libclang_rt.osx.a not at resource dir; searching the system..."
          # 2) Broad search across every likely toolchain (correct .a extension).
          SEARCH_ROOTS=(
            "/Applications/Xcode.app"
            /Applications/Xcode_*.app
            "/Library/Developer/CommandLineTools"
            "$(xcrun --show-sdk-platform-path 2>/dev/null)/Developer/SDKs"
            /opt/homebrew/opt/llvm
            /usr/local/opt/llvm
          )
          FOUND_FILE=""
          for root in "${SEARCH_ROOTS[@]}"; do
            [ -e "$root" ] || continue
            hit="$(find "$root" -type f -name "libclang_rt.osx.a" -print -quit 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              FOUND_FILE="$hit"
              break
            fi
          done

          # 3) Fallback: any darwin builtins archive (renamed variants, e.g.
          #    libclang_rt.macos.a in newer toolchains).
          if [ -z "$FOUND_FILE" ]; then
            echo "No libclang_rt.osx.a; listing all clang_rt builtins found:"
            for root in /Applications/Xcode*.app "/Library/Developer/CommandLineTools" /opt/homebrew/opt/llvm /usr/local/opt/llvm; do
              [ -e "$root" ] || continue
              find "$root" -type f -name "libclang_rt*.a" 2>/dev/null | head -40 || true
            done
            # Pick a macos/osx builtin if one exists under a different name.
            for root in /Applications/Xcode*.app "/Library/Developer/CommandLineTools" /opt/homebrew/opt/llvm /usr/local/opt/llvm; do
              [ -e "$root" ] || continue
              hit="$(find "$root" -type f \( -name "libclang_rt.macos.a" -o -name "libclang_rt.cc_kext.a" \) -print -quit 2>/dev/null || true)"
              if [ -n "$hit" ]; then
                FOUND_FILE="$hit"
                break
              fi
            done
          fi

          if [ -n "$FOUND_FILE" ]; then
            FOUND_DIR="$(dirname "$FOUND_FILE")"
            echo "✅ Found builtins: $FOUND_FILE"
            # Make it discoverable at the expected resource-dir location too,
            # so rustc's own `-L .../clang/<ver>/lib/darwin` resolves it.
            if [ -n "$DARWIN_DIR" ]; then
              mkdir -p "$DARWIN_DIR"
              [ -e "$DARWIN_DIR/libclang_rt.osx.a" ] || ln -sf "$FOUND_FILE" "$DARWIN_DIR/libclang_rt.osx.a"
            fi
            echo "CLANG_RT_DIR=$FOUND_DIR" >> $GITHUB_ENV
          else
            echo "❌ libclang_rt.osx.a not found in Xcode or Command Line Tools."
            echo "    Installing compiler-rt builtins via Homebrew LLVM..."
            # Last-resort: Homebrew LLVM ships a complete compiler-rt including
            # the darwin builtins. GHA macOS runners have Homebrew preinstalled.
            brew install llvm >/tmp/brew-llvm.log 2>&1 || { echo "brew install llvm failed"; tail -20 /tmp/brew-llvm.log; }
            BREW_LLVM="/opt/homebrew/opt/llvm"
            [ -d "$BREW_LLVM" ] || BREW_LLVM="/usr/local/opt/llvm"
            hit="$(find "$BREW_LLVM" -type f -name "libclang_rt.osx.a" -print -quit 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              FOUND_DIR="$(dirname "$hit")"
              echo "✅ Obtained builtins from Homebrew LLVM: $hit"
              if [ -n "$DARWIN_DIR" ]; then
                mkdir -p "$DARWIN_DIR"
                [ -e "$DARWIN_DIR/libclang_rt.osx.a" ] || ln -sf "$hit" "$DARWIN_DIR/libclang_rt.osx.a"
              fi
              echo "CLANG_RT_DIR=$FOUND_DIR" >> $GITHUB_ENV
            else
              echo "❌ Still not found after Homebrew LLVM; build will likely fail."
            fi
          fi
          echo "================================"

      - name: Build fluxion
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Toolchain diagnostic ==="
          echo "rustc: $(rustc --version 2>&1)"
          echo "cargo: $(cargo --version 2>&1)"
          echo "cc: $(cc --version 2>&1 | head -1 || echo 'cc not found')"
          echo "macOS: $(sw_vers 2>&1 || echo 'sw_vers not found')"
          echo "================================"
          # On macOS the Xcode 16.x toolchain intermittently cannot resolve
          # `libclang_rt.osx` (ORT link dependency). Two mitigations:
          #  (a) force a clean build so no stale incremental artifacts retain
          #      references to dead clang version paths (a known cause of
          #      `ld: library 'clang_rt.osx' not found`); and
          #  (b) extend the linker search path to the directory that actually
          #      holds the compiler-rt builtins (resolved in the prior step).
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export CARGO_BUILD_JOBS=2
            echo "macOS detected: limiting CARGO_BUILD_JOBS=2"
            # Drop stale release artifacts to avoid dead-path link fingerprints.
            cargo clean --release || true
            if [ -n "${CLANG_RT_DIR:-}" ]; then
              export RUSTFLAGS="$RUSTFLAGS -C link-arg=-L${CLANG_RT_DIR}"
              echo "macOS: RUSTFLAGS += -C link-arg=-L${CLANG_RT_DIR}"
            fi
          fi
          # Use || true to ensure diagnostics run even on build failure; then capture
          # cargo's exit code via PIPESTATUS and explicitly exit with it.
          cargo build --release --features wiring-tracing --verbose 2>&1 | tee build_output.txt || true
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "================================"
          echo "cargo build exit status: $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Last 100 lines of build output ==="
            tail -100 build_output.txt
            echo "=== dmesg (if available) ==="
            dmesg 2>&1 | tail -20 || echo "(dmesg not available)"
            exit $BUILD_STATUS
          fi
          echo "Build successful"

      - name: Run determinism tests for Cases 800/810/900/950/960/970
        # Issue #3583: extend the Fluxion Determinism Gate (issue #1351)
        # to cover ASHRAE 140 cases 600/800/810/900/950/960/970 in a single
        # cross-platform equality assertion. The 5 new case binaries
        # (`tests/case_800_determinism.rs`, …, `case_970_determinism.rs`)
        # print `DETERMINISM_CASE{NNN}_VALUES|...` markers; this step
        # captures the combined stdout into determinism_cases_output.txt
        # for the extraction step below.
        id: case-runs
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --test case_800_determinism \
            --test case_810_determinism \
            --test case_900_determinism \
            --test case_950_determinism \
            --test case_960_determinism \
            --test case_970_determinism \
            --release -- --nocapture 2>&1 | tee determinism_cases_output.txt

      - name: Run cross_platform_fp_regression (Case 600/920 + solar hash)
        # `tests/cross_platform_fp_regression.rs::test_case_600_annual_determinism_hash`
        # and `test_case_920_annual_determinism_hash` print
        # `DETERMINISM_CASE600_VALUES|...` and `DETERMINISM_CASE920_VALUES|...`
        # markers that were previously dead (issue #3583). They are now
        # consumed by the extraction step below; Case 920 is collected for
        # diagnostic visibility (it appears in `output_values.json`) but is
        # not part of the seven-case gate. The solar 8760h hash marker is
        # also collected from this run. `--nocapture` is required because
        # `cargo test` swallows passing-test stdout by default; without it
        # the markers never reach the output file and Case 600 / 920 would
        # silently look "missing" in the hash.
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test cross_platform_fp_regression --release -- --nocapture 2>&1 | tee cross_platform_output.txt

      - name: Run matrix_exponential_faer determinism test (Issue #2549)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test determinism_matrix_exponential --release 2>&1 | tee matexp_output.txt

      - name: Extract determinism values for the 7-case gate
        id: extract
        shell: bash
        run: |
          python3 << 'PYEOF'
          import re
          import json
          import hashlib
          import sys

          # Required: Cases 600 / 800 / 810 / 900 / 950 / 960 / 970 (per issue #3583).
          # Case 920 is collected for visibility but is NOT in the gate's required set.
          REQUIRED_CASES = ('600', '800', '810', '900', '950', '960', '970')

          def parse_markers(path):
              """Parse all DETERMINISM_*_VALUES markers from a single cargo test log."""
              try:
                  with open(path, 'r') as f:
                      text = f.read()
              except FileNotFoundError:
                  return {}
              values = {}
              # DETERMINISM_CASE{NNN}_VALUES|heating_mwh|cooling_mwh (Cases 600, 800, 810, 920, 950, 960, 970)
              for m in re.finditer(r'DETERMINISM_CASE(\d+)_VALUES\|([\d.]+)\|([\d.]+)', text):
                  case = m.group(1)
                  values[f'case{case}_annual_heating_mwh'] = float(m.group(2))
                  values[f'case{case}_annual_cooling_mwh'] = float(m.group(3))
              # DETERMINISM_VALUES|heating|cooling|peak_h|peak_c (Case 900 — backwards-compatible)
              m = re.search(r'DETERMINISM_VALUES\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)', text)
              if m:
                  values['case900_annual_heating_mwh'] = float(m.group(1))
                  values['case900_annual_cooling_mwh'] = float(m.group(2))
                  values['case900_peak_heating_kw'] = float(m.group(3))
                  values['case900_peak_cooling_kw'] = float(m.group(4))
              # DETERMINISM_FF_VALUES|min|max|avg|swing (Case 900FF)
              m = re.search(r'DETERMINISM_FF_VALUES\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)', text)
              if m:
                  values['case900ff_min_temp'] = float(m.group(1))
                  values['case900ff_max_temp'] = float(m.group(2))
                  values['case900ff_avg_temp'] = float(m.group(3))
                  values['case900ff_temp_swing'] = float(m.group(4))
              # DETERMINISM_SOLAR_8760H_HASH|hash (solar position determinism, issue #2558)
              m = re.search(r'DETERMINISM_SOLAR_8760H_HASH\|([0-9a-f]+)', text)
              if m:
                  values['solar_8760h_hash'] = m.group(1)
              return values

          values = {}
          values.update(parse_markers('determinism_cases_output.txt'))
          values.update(parse_markers('cross_platform_output.txt'))

          missing = [c for c in REQUIRED_CASES if f'case{c}_annual_heating_mwh' not in values]
          if missing:
              print(f"ERROR: determinism markers missing for cases {missing}", file=sys.stderr)
              print(f"Got keys: {sorted(values.keys())}", file=sys.stderr)
              # Visible via the visible-failure artifact; do not sys.exit here —
              # the workflow's later compare-hashes step still cross-checks.

          hash_input = json.dumps(values, sort_keys=True)
          hash_hex = hashlib.sha256(hash_input.encode()).hexdigest()

          with open('output_values.json', 'w') as f:
              json.dump(values, f, indent=2)
          with open('output_hash.txt', 'w') as f:
              f.write(hash_hex + '\n')
              f.write(hash_input + '\n')

          print(f"Hash: {hash_hex}")
          print(f"Cases collected: {sorted({k.split('_')[0] for k in values if k.startswith('case') and '_annual' in k})}")
          print(f"Values: {json.dumps(values, indent=2)}")
          PYEOF

          echo "output_hash=$(head -1 output_hash.txt)" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.os }}" >> $GITHUB_OUTPUT

      - name: Upload determinism-gate output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: determinism-gate-output-${{ matrix.os }}
          path: |
            determinism_cases_output.txt
            cross_platform_output.txt
            matexp_output.txt
            output_values.json
            output_hash.txt
          retention-days: 7

  compare-hashes:
    name: Compare Hashes
    needs: determinism-check
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Compare hashes across platforms
        run: |
          python3 << 'EOF'
          import os
          import json
          import sys

          # Issue #3583: aggregate 7 cases (600, 800, 810, 900, 950, 960, 970)
          # into a single cross-platform equality assertion. Any drift across
          # this set is a CI failure regardless of which case diverges.
          REQUIRED_CASES = ('600', '800', '810', '900', '950', '960', '970')

          artifacts_dir = 'artifacts'
          hashes = {}
          all_values = {}

          # Read hashes and values from all platforms
          for os_name in ['ubuntu-latest', 'windows-latest', 'macos-14']:
              hash_file = os.path.join(artifacts_dir, f'determinism-gate-output-{os_name}', 'output_hash.txt')
              values_file = os.path.join(artifacts_dir, f'determinism-gate-output-{os_name}', 'output_values.json')

              if os.path.exists(hash_file):
                  with open(hash_file, 'r') as f:
                      lines = f.readlines()
                      if lines:
                          hashes[os_name] = lines[0].strip()

              if os.path.exists(values_file):
                  with open(values_file, 'r') as f:
                      all_values[os_name] = json.load(f)

          print("=" * 60)
          print("Cross-Platform Determinism Check Results")
          print("Issue #3583: 7-case gate (600/800/810/900/950/960/970)")
          print("=" * 60)
          print()

          print("Hashes from each platform:")
          for os_name, h in hashes.items():
              print(f"  {os_name}: {h}")
          print()

          print("Values from each platform:")
          for os_name, vals in all_values.items():
              print(f"  {os_name}:")
              for k, v in vals.items():
                  print(f"    {k}: {v}")
          print()

          # Verify each platform has all required cases — a missing case indicates
          # the upstream cargo test step failed to print the marker.
          missing_by_platform = {}
          for os_name, vals in all_values.items():
              cases_present = {k.split('_')[0] for k in vals if k.startswith('case') and k.endswith('_annual_heating_mwh')}
              missing_by_platform[os_name] = sorted(c for c in REQUIRED_CASES if c not in cases_present)
          if any(missing_by_platform.values()):
              print("❌ Missing required cases by platform:")
              for os_name, missing in missing_by_platform.items():
                  if missing:
                      print(f"  {os_name}: missing {missing}")
              status = "FAIL"
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'missing_cases': missing_by_platform,
                  'platform_hashes': hashes,
                  'values': all_values
              }
              with open('comparison_result.json', 'w') as f:
                  json.dump(result, f, indent=2)
              sys.exit(1)

          # Check if all hashes are identical
          unique_hashes = set(hashes.values())

          if len(unique_hashes) == 1:
              print("✅ SUCCESS: All platforms produce identical outputs across all 7 cases")
              print(f"Universal hash: {list(unique_hashes)[0]}")
              status = "PASS"
              result = {
                  'status': 'PASS',
                  'all_identical': True,
                  'cases': list(REQUIRED_CASES),
                  'hash': list(unique_hashes)[0],
                  'platforms': list(hashes.keys()),
                  'values': all_values
              }
          else:
              print("❌ FAILURE: Hashes differ across platforms!")
              print(f"Unique hashes ({len(unique_hashes)}): {unique_hashes}")
              status = "FAIL"
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'cases': list(REQUIRED_CASES),
                  'platform_hashes': hashes,
                  'unique_hashes': list(unique_hashes),
                  'values': all_values
              }

          # Write result files
          with open('comparison_result.json', 'w') as f:
              json.dump(result, f, indent=2)

          if status == "FAIL":
              print()
              print("Detailed comparison:")
              for os_name, vals in all_values.items():
                  print(f"  {os_name}:")
                  for k, v in vals.items():
                      print(f"    {k}: {v}")
              sys.exit(1)
          EOF

      - name: Upload comparison result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: determinism-comparison
          path: comparison_result.json
          retention-days: 30

      - name: Display summary
        run: |
          echo "## Cross-Platform Determinism Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f comparison_result.json ]; then
            RESULT=$(cat comparison_result.json)
            echo "**Status**: $(echo $RESULT | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat comparison_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No comparison result found" >> $GITHUB_STEP_SUMMARY
          fi
