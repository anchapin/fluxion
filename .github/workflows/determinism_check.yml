name: Cross-Platform Determinism CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Ensure deterministic floating point across platforms
  # - nan-canonicalization: ensures NaN values are consistent
  # - debug-assertions=no: disable debug assertions for release-like behavior
  RUSTFLAGS: "-C opt-level=3 -C debug-assertions=no"

jobs:
  determinism-check:
    name: Determinism Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-determinism-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-determinism-cargo-

      - name: Build fluxion
        run: cargo build --release --features wiring-tracing

      - name: Run Case 900 Determinism Test
        id: case900
        run: |
          # Run the determinism test and capture output
          cargo test --test case_900_determinism --release -- --nocapture 2>&1 | tee case900_output.txt

      - name: Extract determinism values
        id: extract
        run: |
          python3 << 'EOF'
          import re
          import json

          with open('case900_output.txt', 'r') as f:
              output = f.read()

          # Look for DETERMINISM_VALUES line
          # Format: DETERMINISM_VALUES|heating|cooling|peak_h|peak_c
          values = {}

          # Extract Case 900 values
          match = re.search(r'DETERMINISM_VALUES\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)', output)
          if match:
              values['annual_heating_mwh'] = float(match.group(1))
              values['annual_cooling_mwh'] = float(match.group(2))
              values['peak_heating_kw'] = float(match.group(3))
              values['peak_cooling_kw'] = float(match.group(4))

          # Extract Case 900FF values if present
          ff_match = re.search(r'DETERMINISM_FF_VALUES\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)', output)
          if ff_match:
              values['ff_min_temp'] = float(ff_match.group(1))
              values['ff_max_temp'] = float(ff_match.group(2))
              values['ff_avg_temp'] = float(ff_match.group(3))
              values['ff_temp_swing'] = float(ff_match.group(4))

          # Create deterministic string for hashing
          hash_input = json.dumps(values, sort_keys=True)
          import hashlib
          hash_hex = hashlib.sha256(hash_input.encode()).hexdigest()

          # Write hash to file for comparison
          with open('output_values.json', 'w') as f:
              json.dump(values, f, indent=2)
          with open('output_hash.txt', 'w') as f:
              f.write(hash_hex + '\n')
              f.write(hash_input + '\n')

          print(f"Hash: {hash_hex}")
          print(f"Values: {json.dumps(values, indent=2)}")
          EOF

          # Output for workflow
          echo "output_hash=$(cat output_hash.txt | head -1)" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.os }}" >> $GITHUB_OUTPUT
          echo "values=$(cat output_values.json)" >> $GITHUB_OUTPUT

      - name: Upload Case 900 output
        uses: actions/upload-artifact@v4
        with:
          name: case900-output-${{ matrix.os }}
          path: |
            case900_output.txt
            output_values.json
            output_hash.txt
          retention-days: 7

  compare-hashes:
    name: Compare Hashes
    needs: determinism-check
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compare hashes across platforms
        run: |
          python3 << 'EOF'
          import os
          import json

          artifacts_dir = 'artifacts'
          hashes = {}
          all_values = {}

          # Read hashes and values from all platforms
          for os_name in ['ubuntu-latest', 'windows-latest', 'macos-latest']:
              hash_file = os.path.join(artifacts_dir, f'case900-output-{os_name}', 'output_hash.txt')
              values_file = os.path.join(artifacts_dir, f'case900-output-{os_name}', 'output_values.json')

              if os.path.exists(hash_file):
                  with open(hash_file, 'r') as f:
                      lines = f.readlines()
                      if lines:
                          hashes[os_name] = lines[0].strip()

              if os.path.exists(values_file):
                  with open(values_file, 'r') as f:
                      all_values[os_name] = json.load(f)

          print("=" * 60)
          print("Cross-Platform Determinism Check Results")
          print("=" * 60)
          print()

          print("Hashes from each platform:")
          for os_name, h in hashes.items():
              print(f"  {os_name}: {h}")
          print()

          print("Values from each platform:")
          for os_name, vals in all_values.items():
              print(f"  {os_name}:")
              for k, v in vals.items():
                  print(f"    {k}: {v}")
          print()

          # Check if all hashes are identical
          unique_hashes = set(hashes.values())

          if len(unique_hashes) == 1:
              print("✅ SUCCESS: All platforms produce identical outputs")
              print(f"Universal hash: {list(unique_hashes)[0]}")
              status = "PASS"
              result = {
                  'status': 'PASS',
                  'all_identical': True,
                  'hash': list(unique_hashes)[0],
                  'platforms': list(hashes.keys()),
                  'values': all_values
              }
          else:
              print("❌ FAILURE: Hashes differ across platforms!")
              print(f"Unique hashes ({len(unique_hashes)}): {unique_hashes}")
              status = "FAIL"
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'platform_hashes': hashes,
                  'unique_hashes': list(unique_hashes),
                  'values': all_values
              }

          # Write result files
          with open('comparison_result.json', 'w') as f:
              json.dump(result, f, indent=2)

          if status == "FAIL":
              print()
              print("Detailed comparison:")
              for os_name, vals in all_values.items():
                  print(f"  {os_name}:")
                  for k, v in vals.items():
                      print(f"    {k}: {v}")
              exit(1)
          EOF

      - name: Upload comparison result
        uses: actions/upload-artifact@v4
        with:
          name: determinism-comparison
          path: comparison_result.json
          retention-days: 30

      - name: Display summary
        run: |
          echo "## Cross-Platform Determinism Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f comparison_result.json ]; then
            RESULT=$(cat comparison_result.json)
            echo "**Status**: $(echo $RESULT | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat comparison_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No comparison result found" >> $GITHUB_STEP_SUMMARY
          fi
