name: Cross-Platform Determinism CI

# Issue #3355: expand upstream scope to `develop` so the Fluxion Determinism
# Gate listener job (`fluxion-determinism-gate` in `ashrae_validation.yml`)
# fires for PRs targeting `develop`. PR runs are phase-gated behind CI Gates
# via `workflow_run` (second PR of the two-PR rollout); the listener in
# `ashrae_validation.yml` accepts both direct `pull_request` runs (pre-rollout)
# and CI-Gates-triggered `workflow_run` runs, so no listener change was needed.
on:
  push:
    branches: [main, develop]
  # Phase-gated behind CI Gates (second PR of the two-PR workflow_run
  # rollout; see ci-gates.yml). PRs no longer trigger this workflow
  # directly; it runs via workflow_run when CI Gates succeeds for a PR.
  # The docs-only skip (ADR-0016 lane 2) is preserved via the
  # docs-only-gate check job below (workflow_run has no path filters).
  workflow_run:
    workflows: ["CI Gates"]
    types: [completed]
  # ADR-0016 lane 3 — nightly authority on develop. The determinism
  # matrix was the only lane-3 gate without a schedule; this nightly run
  # is the authoritative cross-platform floating-point verdict that the
  # wave-orchestrator merge freeze consumes (per-PR runs remain, now
  # non-blocking per ADR-0016). 03:30 UTC is deliberately offset from the
  # existing nightly cohort (02:00 performance dashboard, 03:00
  # architecture drift, 04:00 fast-math / 04:23 python-bindings) to avoid
  # a simultaneous job stampede against the runner concurrency cap. The
  # ADR-0015 per-head_sha concurrency block below is unchanged; schedule
  # events resolve to github.ref of the default branch.
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read
  pull-requests: read  # docs-only-gate reads the PR file list via gh

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RUSTFLAGS for cross-platform FP determinism (Issues #1297 and #2549).
  # - opt-level=3: maximum optimization for consistent math behavior.
  # - debug-assertions=no: disable debug assertions for release-like behavior.
  # - codegen-units=1: serialize codegen so LLVM sees the whole crate at once;
  #   this removes the parallel-codegen reordering that perturbs float results.
  # - llvm-args=--enable-no-infs-fp-math=false: forbid LLVM from assuming
  #   arguments are never +inf, which would let it replace x/inf -> 0 etc.
  # - llvm-args=--enable-no-nans-fp-math=false: forbid LLVM from assuming
  #   arguments are never NaN, which would let it reorder x != x -> false etc.
  #
  # Together these pin LLVM's fp-math model so x86_64, ARM64, and Apple
  # Silicon all emit the same arithmetic ops (no Inf/NaN elision, no
  # reassociation). Note: target-cpu=haswell was removed earlier — it
  # causes SIMD compilation errors on ARM macOS.
  #
  # Flag rejection log (#2549): `-C llvm-args=--enable-unsafe-fp-math=false`
  # is NOT recognized by the LLVM bundled with rustc 1.97.x (LLVM 21);
  # rustc emits "Unknown command line argument". It is therefore omitted
  # here. The two `no-infs`/`no-nans` flags ARE recognized and are the
  # primary levers for disabling unsafe fp reassociation.
  RUSTFLAGS: >-
    -C opt-level=3
    -C debug-assertions=no
    -C codegen-units=1
    -C llvm-args=--enable-no-infs-fp-math=false
    -C llvm-args=--enable-no-nans-fp-math=false

jobs:
  # Phase-gate precheck (same pattern as the other CI-Gates-gated heavy
  # workflows, e.g. fast_math_check.yml). For workflow_run events (PRs via
  # CI Gates), verifies the upstream succeeded for a PR and checks the
  # docs-only deny list. For push/schedule/dispatch, always passes.
  precheck:
    name: Phase-gate precheck
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
    steps:
      - name: Checkout (precheck needs the local docs-only-gate action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$UPSTREAM_EVENT" != "pull_request" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              echo "Upstream event is $UPSTREAM_EVENT (not pull_request); skipping"
              exit 0
            fi
            if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              echo "Upstream conclusion is $UPSTREAM_CONCLUSION (not success); skipping"
              exit 0
            fi
          fi
          echo "upstream_ok=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docs-only-gate
        id: docs
        if: steps.upstream.outputs.upstream_ok == 'true' && github.event_name == 'workflow_run'
      - id: final
        run: |
          if [ "${{ steps.upstream.outputs.upstream_ok }}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ steps.docs.outputs.docs_only }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR; skipping heavy jobs"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # Issue #4018: PR-triggered runs use ubuntu-only (the full 3-OS matrix
  # is ~30 job-min/PR; ubuntu-only is ~10). Push/schedule/dispatch keep
  # the full matrix as the nightly authority per ADR-0016. workflow_run
  # events from a PR-triggered upstream also use ubuntu-only.
  setup-matrix:
    name: Select determinism matrix
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || \
             [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo 'matrix={"os":["ubuntu-24.04"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-24.04","windows-latest","macos-14"]}' >> "$GITHUB_OUTPUT"
          fi

  determinism-check:
    name: Determinism Check (${{ matrix.os }})
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
        # (Full 3-OS matrix defined in setup-matrix above: ubuntu/windows
        # for x86_64 + macos-14 for aarch64 Apple Silicon. macos-13 was
        # removed in #2618 — redundant and the Intel pool is oversubscribed.)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # workflow_run checks out the default branch by default;
          # explicitly use the PR head SHA for gated runs.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: |
            .
            fluxion-core -> target
            fluxion-city -> target
            fluxion-fluid -> target
            fluxion-grid -> target
            fluxion-behavior -> target
            fluxion-mcp -> target
            fluxion-wasm -> target
            crates/fluxion-toon -> target
            crates/fluxion-twin -> target
            crates/fluxion-evaluator -> target
            fluxion-cfd -> target
            fluxion-tauri/src-tauri -> target          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-determinism-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-determinism-cargo-

      - name: Resolve clang_rt.osx builtins (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          echo "=== Resolving libclang_rt.osx builtins ==="
          # The ORT (ONNX Runtime) prebuilt link step emits `-lclang_rt.osx`,
          # which the linker resolves to `libclang_rt.osx.a` (compiler-rt
          # builtins). On Xcode 16.x GHA runners the toolchain's
          # `clang/<ver>/lib/darwin/` directory is sometimes absent, so the
          # archive must be located elsewhere and made discoverable.
          #
          # NOTE: the real filename is `libclang_rt.osx.a` (static archive),
          # NOT `libclang_rt.osx` — the old diagnostic checked the wrong name
          # and therefore always reported "not found".

          RESOURCE_DIR="$(clang -print-resource-dir 2>/dev/null || true)"
          echo "clang resource dir : ${RESOURCE_DIR:-<unknown>}"
          echo "xcode-select path  : $(xcode-select -p 2>/dev/null || echo unknown)"
          echo "SDK path           : $(xcrun --show-sdk-path 2>/dev/null || echo unknown)"

          DARWIN_DIR=""
          if [ -n "$RESOURCE_DIR" ]; then
            DARWIN_DIR="$RESOURCE_DIR/lib/darwin"
          fi

          # 1) Already at the expected location?
          if [ -n "$DARWIN_DIR" ] && [ -f "$DARWIN_DIR/libclang_rt.osx.a" ]; then
            echo "✅ Already present: $DARWIN_DIR/libclang_rt.osx.a"
            echo "CLANG_RT_DIR=$DARWIN_DIR" >> $GITHUB_ENV
            echo "================================"
            exit 0
          fi

          echo "⚠️  libclang_rt.osx.a not at resource dir; searching the system..."
          # 2) Broad search across every likely toolchain (correct .a extension).
          SEARCH_ROOTS=(
            "/Applications/Xcode.app"
            /Applications/Xcode_*.app
            "/Library/Developer/CommandLineTools"
            "$(xcrun --show-sdk-platform-path 2>/dev/null)/Developer/SDKs"
            /opt/homebrew/opt/llvm
            /usr/local/opt/llvm
          )
          FOUND_FILE=""
          for root in "${SEARCH_ROOTS[@]}"; do
            [ -e "$root" ] || continue
            hit="$(find "$root" -type f -name "libclang_rt.osx.a" -print -quit 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              FOUND_FILE="$hit"
              break
            fi
          done

          # 3) Fallback: any darwin builtins archive (renamed variants, e.g.
          #    libclang_rt.macos.a in newer toolchains).
          if [ -z "$FOUND_FILE" ]; then
            echo "No libclang_rt.osx.a; listing all clang_rt builtins found:"
            for root in /Applications/Xcode*.app "/Library/Developer/CommandLineTools" /opt/homebrew/opt/llvm /usr/local/opt/llvm; do
              [ -e "$root" ] || continue
              find "$root" -type f -name "libclang_rt*.a" 2>/dev/null | head -40 || true
            done
            # Pick a macos/osx builtin if one exists under a different name.
            for root in /Applications/Xcode*.app "/Library/Developer/CommandLineTools" /opt/homebrew/opt/llvm /usr/local/opt/llvm; do
              [ -e "$root" ] || continue
              hit="$(find "$root" -type f \( -name "libclang_rt.macos.a" -o -name "libclang_rt.cc_kext.a" \) -print -quit 2>/dev/null || true)"
              if [ -n "$hit" ]; then
                FOUND_FILE="$hit"
                break
              fi
            done
          fi

          if [ -n "$FOUND_FILE" ]; then
            FOUND_DIR="$(dirname "$FOUND_FILE")"
            echo "✅ Found builtins: $FOUND_FILE"
            # Make it discoverable at the expected resource-dir location too,
            # so rustc's own `-L .../clang/<ver>/lib/darwin` resolves it.
            if [ -n "$DARWIN_DIR" ]; then
              mkdir -p "$DARWIN_DIR"
              [ -e "$DARWIN_DIR/libclang_rt.osx.a" ] || ln -sf "$FOUND_FILE" "$DARWIN_DIR/libclang_rt.osx.a"
            fi
            echo "CLANG_RT_DIR=$FOUND_DIR" >> $GITHUB_ENV
          else
            echo "❌ libclang_rt.osx.a not found in Xcode or Command Line Tools."
            echo "    Installing compiler-rt builtins via Homebrew LLVM..."
            # Last-resort: Homebrew LLVM ships a complete compiler-rt including
            # the darwin builtins. GHA macOS runners have Homebrew preinstalled.
            brew install llvm >/tmp/brew-llvm.log 2>&1 || { echo "brew install llvm failed"; tail -20 /tmp/brew-llvm.log; }
            BREW_LLVM="/opt/homebrew/opt/llvm"
            [ -d "$BREW_LLVM" ] || BREW_LLVM="/usr/local/opt/llvm"
            hit="$(find "$BREW_LLVM" -type f -name "libclang_rt.osx.a" -print -quit 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              FOUND_DIR="$(dirname "$hit")"
              echo "✅ Obtained builtins from Homebrew LLVM: $hit"
              if [ -n "$DARWIN_DIR" ]; then
                mkdir -p "$DARWIN_DIR"
                [ -e "$DARWIN_DIR/libclang_rt.osx.a" ] || ln -sf "$hit" "$DARWIN_DIR/libclang_rt.osx.a"
              fi
              echo "CLANG_RT_DIR=$FOUND_DIR" >> $GITHUB_ENV
            else
              echo "❌ Still not found after Homebrew LLVM; build will likely fail."
            fi
          fi
          echo "================================"

      - name: Build fluxion
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Toolchain diagnostic ==="
          echo "rustc: $(rustc --version 2>&1)"
          echo "cargo: $(cargo --version 2>&1)"
          echo "cc: $(cc --version 2>&1 | head -1 || echo 'cc not found')"
          echo "macOS: $(sw_vers 2>&1 || echo 'sw_vers not found')"
          echo "================================"
          # On macOS the Xcode 16.x toolchain intermittently cannot resolve
          # `libclang_rt.osx` (ORT link dependency). Two mitigations:
          #  (a) force a clean build so no stale incremental artifacts retain
          #      references to dead clang version paths (a known cause of
          #      `ld: library 'clang_rt.osx' not found`); and
          #  (b) extend the linker search path to the directory that actually
          #      holds the compiler-rt builtins (resolved in the prior step).
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export CARGO_BUILD_JOBS=2
            echo "macOS detected: limiting CARGO_BUILD_JOBS=2"
            # Drop stale release artifacts to avoid dead-path link fingerprints.
            cargo clean --release || true
            if [ -n "${CLANG_RT_DIR:-}" ]; then
              export RUSTFLAGS="$RUSTFLAGS -C link-arg=-L${CLANG_RT_DIR}"
              echo "macOS: RUSTFLAGS += -C link-arg=-L${CLANG_RT_DIR}"
            fi
          fi
          # Use || true to ensure diagnostics run even on build failure; then capture
          # cargo's exit code via PIPESTATUS and explicitly exit with it.
          cargo build --release --features wiring-tracing --verbose 2>&1 | tee build_output.txt || true
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "================================"
          echo "cargo build exit status: $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Last 100 lines of build output ==="
            tail -100 build_output.txt
            echo "=== dmesg (if available) ==="
            dmesg 2>&1 | tail -20 || echo "(dmesg not available)"
            exit $BUILD_STATUS
          fi
          echo "Build successful"

      - name: Run determinism tests for Cases 800/810/900/950/960/970
        # Issue #3583: extend the Fluxion Determinism Gate (issue #1351)
        # to cover ASHRAE 140 cases 600/800/810/900/950/960/970 in a single
        # cross-platform equality assertion. The 5 new case binaries
        # (`tests/case_800_determinism.rs`, …, `case_970_determinism.rs`)
        # print `DETERMINISM_CASE{NNN}_VALUES|...` markers; this step
        # captures the combined stdout into determinism_cases_output.txt
        # for the extraction step below.
        id: case-runs
        shell: bash
        run: |
          set -euo pipefail
          # Post-#3764 the six determinism modules are all children of the one
          # `all_tests` target; cargo takes a single positional, so the six
          # module filters go through `--` to libtest (which ORs filters).
          cargo test \
            --test all_tests \
            --release -- \
            case_800_determinism:: \
            case_810_determinism:: \
            case_900_determinism:: \
            case_950_determinism:: \
            case_960_determinism:: \
            case_970_determinism:: \
            --nocapture 2>&1 | tee determinism_cases_output.txt

      - name: Run cross_platform_fp_regression (Case 600/920 + solar hash)
        # `tests/cross_platform_fp_regression.rs::test_case_600_annual_determinism_hash`
        # and `test_case_920_annual_determinism_hash` print
        # `DETERMINISM_CASE600_VALUES|...` and `DETERMINISM_CASE920_VALUES|...`
        # markers that were previously dead (issue #3583). They are now
        # consumed by the extraction step below; Case 920 is collected for
        # diagnostic visibility (it appears in `output_values.json`) but is
        # not part of the seven-case gate. The solar 8760h hash marker is
        # also collected from this run. `--nocapture` is required because
        # `cargo test` swallows passing-test stdout by default; without it
        # the markers never reach the output file and Case 600 / 920 would
        # silently look "missing" in the hash.
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test all_tests cross_platform_fp_regression:: --release -- --nocapture 2>&1 | tee cross_platform_output.txt

      - name: Run matrix_exponential_faer determinism test (Issue #2549)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test all_tests determinism_matrix_exponential:: --release 2>&1 | tee matexp_output.txt

      - name: Extract determinism values for the 7-case gate
        id: extract
        shell: bash
        run: |
          python3 << 'PYEOF'
          import re
          import json
          import hashlib
          import sys

          # Required: Cases 600 / 800 / 810 / 900 / 950 / 960 / 970 (per issue #3583).
          # Case 920 is collected for visibility but is NOT in the gate's required set.
          REQUIRED_CASES = ('600', '800', '810', '900', '950', '960', '970')

          def parse_markers(path):
              """Parse all DETERMINISM_*_VALUES markers from a single cargo test log."""
              try:
                  with open(path, 'r') as f:
                      text = f.read()
              except FileNotFoundError:
                  return {}
              values = {}
              # DETERMINISM_CASE{NNN}_VALUES|heating_mwh|cooling_mwh (Cases 600, 800, 810, 920, 950, 960, 970)
              for m in re.finditer(r'DETERMINISM_CASE(\d+)_VALUES\|([\d.]+)\|([\d.]+)', text):
                  case = m.group(1)
                  values[f'case{case}_annual_heating_mwh'] = float(m.group(2))
                  values[f'case{case}_annual_cooling_mwh'] = float(m.group(3))
              # DETERMINISM_VALUES|heating|cooling|peak_h|peak_c (Case 900 — backwards-compatible)
              m = re.search(r'DETERMINISM_VALUES\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)', text)
              if m:
                  values['case900_annual_heating_mwh'] = float(m.group(1))
                  values['case900_annual_cooling_mwh'] = float(m.group(2))
                  values['case900_peak_heating_kw'] = float(m.group(3))
                  values['case900_peak_cooling_kw'] = float(m.group(4))
              # DETERMINISM_FF_VALUES|min|max|avg|swing (Case 900FF)
              m = re.search(r'DETERMINISM_FF_VALUES\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)', text)
              if m:
                  values['case900ff_min_temp'] = float(m.group(1))
                  values['case900ff_max_temp'] = float(m.group(2))
                  values['case900ff_avg_temp'] = float(m.group(3))
                  values['case900ff_temp_swing'] = float(m.group(4))
              # DETERMINISM_SOLAR_8760H_HASH|hash (solar position determinism, issue #2558)
              m = re.search(r'DETERMINISM_SOLAR_8760H_HASH\|([0-9a-f]+)', text)
              if m:
                  values['solar_8760h_hash'] = m.group(1)
              return values

          values = {}
          values.update(parse_markers('determinism_cases_output.txt'))
          values.update(parse_markers('cross_platform_output.txt'))

          missing = [c for c in REQUIRED_CASES if f'case{c}_annual_heating_mwh' not in values]
          if missing:
              print(f"ERROR: determinism markers missing for cases {missing}", file=sys.stderr)
              print(f"Got keys: {sorted(values.keys())}", file=sys.stderr)
              # Visible via the visible-failure artifact; do not sys.exit here —
              # the workflow's later compare-hashes step still cross-checks.

          hash_input = json.dumps(values, sort_keys=True)
          hash_hex = hashlib.sha256(hash_input.encode()).hexdigest()

          with open('output_values.json', 'w') as f:
              json.dump(values, f, indent=2)
          with open('output_hash.txt', 'w') as f:
              f.write(hash_hex + '\n')
              f.write(hash_input + '\n')

          print(f"Hash: {hash_hex}")
          print(f"Cases collected: {sorted({k.split('_')[0] for k in values if k.startswith('case') and '_annual' in k})}")
          print(f"Values: {json.dumps(values, indent=2)}")
          PYEOF

          echo "output_hash=$(head -1 output_hash.txt)" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.os }}" >> $GITHUB_OUTPUT

      - name: Upload determinism-gate output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: determinism-gate-output-${{ matrix.os }}
          path: |
            determinism_cases_output.txt
            cross_platform_output.txt
            matexp_output.txt
            output_values.json
            output_hash.txt
          retention-days: 7
          # Issue #4545 (loop round 90): the default `warn` let a partial or
          # empty match ship a green upload — the observed failure family is a
          # green ubuntu leg whose artifact reached Compare Hashes without the
          # contract files (output_hash.txt / output_values.json), which the
          # compare guard correctly refuses as INCOMPLETE but nobody flagged
          # at the source. Error here, at the only step that knows what the
          # extract step promised.
          if-no-files-found: error

  compare-hashes:
    name: Compare Hashes
    # Round 80 (issue follow-up to #3583 hardening): the expected platform set
    # must come from the SAME matrix setup-matrix selected for this run. The
    # previous hardcoded PLATFORMS list assumed the full 3-OS nightly matrix,
    # so a workflow_run (ubuntu-only) run's Compare Hashes step failed
    # INCOMPLETE even though its only matrix leg succeeded and uploaded its
    # artifact (observed on develop 2e41ae7a, run 39593499936, 2026-10-21).
    needs: [determinism-check, setup-matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        id: download-artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      # Issue #4545 (loop round 90): actions/download-artifact v8 reports a
      # digest-mismatch as an annotation but does not fail the step, and the
      # compare script below then (correctly) refuses the partial set as
      # INCOMPLETE — with no recovery. Observed on run 39845087608
      # (2026-10-22, develop 604aed86): the ubuntu leg uploaded all 5 files
      # (digest recorded), the download step's served content failed its
      # digest check, and the extracted artifact lacked output_hash.txt /
      # output_values.json. Verify the contract files exist per expected
      # platform immediately after download and retry the download once.
      - name: Verify artifact completeness
        id: verify-artifacts
        env:
          EXPECTED_PLATFORMS_JSON: ${{ needs.setup-matrix.outputs.matrix }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          platforms = sorted(
              (json.loads(os.environ.get('EXPECTED_PLATFORMS_JSON') or '{}') or {}).get('os', [])
          )
          if not platforms:
              # Mirror the compare script's own refusal: no expected set, no
              # verification possible (the compare step reports this too).
              print("INCOMPLETE: setup-matrix output missing — cannot verify artifacts")
              sys.exit(1)
          missing = {}
          for os_name in platforms:
              d = f"artifacts/determinism-gate-output-{os_name}"
              absent = [
                  f"{d}/{f}" for f in ("output_hash.txt", "output_values.json")
                  if not os.path.exists(f"{d}/{f}")
              ]
              if absent:
                  missing[os_name] = absent
          if missing:
              for os_name, absent in missing.items():
                  print(f"artifact incomplete: {os_name}: missing {absent}")
              sys.exit(1)
          print(f"artifact set complete for {len(platforms)} expected platform(s)")
          EOF

      - name: Clear corrupted artifact set (retry preparation)
        if: steps.verify-artifacts.outcome == 'failure'
        run: |
          rm -rf artifacts

      - name: Re-download all artifacts (retry 1)
        id: redownload-artifacts
        if: steps.verify-artifacts.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Re-verify artifact completeness
        id: reverify-artifacts
        if: steps.verify-artifacts.outcome == 'failure'
        env:
          EXPECTED_PLATFORMS_JSON: ${{ needs.setup-matrix.outputs.matrix }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          platforms = sorted(
              (json.loads(os.environ.get('EXPECTED_PLATFORMS_JSON') or '{}') or {}).get('os', [])
          )
          if not platforms:
              print("INCOMPLETE: setup-matrix output missing — cannot verify artifacts")
              sys.exit(1)
          missing = {}
          for os_name in platforms:
              d = f"artifacts/determinism-gate-output-{os_name}"
              absent = [
                  f"{d}/{f}" for f in ("output_hash.txt", "output_values.json")
                  if not os.path.exists(f"{d}/{f}")
              ]
              if absent:
                  missing[os_name] = absent
          if missing:
              for os_name, absent in missing.items():
                  print(f"artifact still incomplete after retry: {os_name}: missing {absent}")
              sys.exit(1)
          print(f"artifact set complete after retry for {len(platforms)} expected platform(s)")
          EOF

      # Loop round 100 (2026-10-26, run 40235308494 on develop bccb3ebb): the
      # digest check PASSED and the stored zip was verified complete via the
      # API (5 files at zip root, fetched locally with `gh api .../zip`),
      # yet the toolkit extraction delivered only the FIRST 3 entries —
      # output_values.json / output_hash.txt (the last 2 entries) were
      # missing — reproducibly across the original run AND a failed-jobs
      # re-run. Retry 1 above reuses the same toolkit extraction, so it
      # reproduced the same truncation. Retry 2 re-fetches the artifact
      # zip over `gh api` and extracts it with python zipfile — a different
      # implementation end to end — before the compare step makes the final
      # loud INCOMPLETE call.
      - name: Re-fetch contract files via gh api + python zipfile (retry 2)
        id: ghfetch-artifacts
        if: steps.reverify-artifacts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLATFORMS_JSON: ${{ needs.setup-matrix.outputs.matrix }}
        run: |
          python3 << 'EOF'
          import io
          import json
          import os
          import subprocess
          import sys
          import zipfile

          platforms = sorted(
              (json.loads(os.environ.get('EXPECTED_PLATFORMS_JSON') or '{}') or {}).get('os', [])
          )
          if not platforms:
              print("retry 2: setup-matrix output missing — cannot re-fetch")
              sys.exit(1)
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          listing = subprocess.run(
              ['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts', '--paginate'],
              capture_output=True, text=True,
          )
          if listing.returncode != 0:
              print(f"retry 2: artifact listing failed: {listing.stderr}")
              sys.exit(1)
          arts = json.loads(listing.stdout).get('artifacts', [])
          failed = False
          for os_name in platforms:
              name = f'determinism-gate-output-{os_name}'
              ids = [a['id'] for a in arts if a.get('name') == name]
              if len(ids) != 1:
                  print(f"retry 2: expected exactly one artifact named {name}, found {len(ids)}")
                  failed = True
                  continue
              dest = f'artifacts/{name}'
              os.makedirs(dest, exist_ok=True)
              z = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/actions/artifacts/{ids[0]}/zip'],
                  capture_output=True,
              )
              if z.returncode != 0:
                  print(f"retry 2: download failed for {name}: {z.stderr.decode(errors='replace')}")
                  failed = True
                  continue
              with zipfile.ZipFile(io.BytesIO(z.stdout)) as zf:
                  zf.extractall(dest)
              print(f"retry 2: extracted {name} via python zipfile")
          sys.exit(1 if failed else 0)
          EOF

      - name: Compare hashes across platforms
        env:
          EXPECTED_PLATFORMS_JSON: ${{ needs.setup-matrix.outputs.matrix }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import sys

          # Issue #3583: aggregate 7 cases (600, 800, 810, 900, 950, 960, 970)
          # into a single cross-platform equality assertion. Any drift across
          # this set is a CI failure regardless of which case diverges.
          REQUIRED_CASES = ('600', '800', '810', '900', '950', '960', '970')

          artifacts_dir = 'artifacts'
          hashes = {}
          all_values = {}

          # Round 25 (issue #3061 loop): harden against the artifact-collection
          # race. The soft `os.path.exists` reads below used to let a missing
          # or partially-uploaded platform artifact silently shrink the
          # comparison set — 2-of-3 (even 1-of-3) platforms all sharing one
          # hash reported SUCCESS. Every expected platform must now deliver
          # BOTH files, or the gate fails loudly naming what is absent.
          import json as _json
          # The expected platform set is the matrix this run actually selected
          # (ubuntu-only on workflow_run PR lanes; the full 3-OS set on
          # push/schedule/dispatch). Never a hardcoded list again.
          PLATFORMS = sorted(
              (_json.loads(os.environ.get('EXPECTED_PLATFORMS_JSON') or '{}') or {}).get('os', [])
          )
          if not PLATFORMS:
              print("❌ INCOMPLETE: setup-matrix output missing — refusing to compare without the expected platform set")
              sys.exit(1)
          incomplete = {}
          for os_name in PLATFORMS:
              platform_dir = os.path.join(artifacts_dir, f'determinism-gate-output-{os_name}')
              hash_file = os.path.join(platform_dir, 'output_hash.txt')
              values_file = os.path.join(platform_dir, 'output_values.json')
              absent = [p for p in (hash_file, values_file) if not os.path.exists(p)]
              if absent:
                  incomplete[os_name] = absent
                  continue
              with open(hash_file, 'r') as f:
                  lines = f.readlines()
                  if lines:
                      hashes[os_name] = lines[0].strip()
              with open(values_file, 'r') as f:
                  all_values[os_name] = json.load(f)

          if incomplete or len(hashes) != len(PLATFORMS):
              print("❌ INCOMPLETE: artifact collection race or lost artifact — refusing to compare a partial set")
              for os_name, absent in incomplete.items():
                  print(f"  {os_name}: missing {absent}")
              print(f"  platforms with readable hashes: {sorted(hashes)} (need all {len(PLATFORMS)})")
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'incomplete_platforms': incomplete,
                  'platform_hashes': hashes,
                  'values': all_values
              }
              with open('comparison_result.json', 'w') as f:
                  json.dump(result, f, indent=2)
              sys.exit(1)

          print("=" * 60)
          print("Cross-Platform Determinism Check Results")
          print("Issue #3583: 7-case gate (600/800/810/900/950/960/970)")
          print("=" * 60)
          print()

          print("Hashes from each platform:")
          for os_name, h in hashes.items():
              print(f"  {os_name}: {h}")
          print()

          print("Values from each platform:")
          for os_name, vals in all_values.items():
              print(f"  {os_name}:")
              for k, v in vals.items():
                  print(f"    {k}: {v}")
          print()

          # Verify each platform has all required cases — a missing case indicates
          # the upstream cargo test step failed to print the marker.
          # Issue #3668 — strip the `case` prefix on the LHS before comparison;
          # previously `cases_present` held keys like `case600` and the
          # comparison `c not in cases_present` against bare strings (`'600'`)
          # always evaluated True, so every case appeared missing and the
          # gate failed with "Missing required cases by platform" even
          # though the data was present (verified by inspecting the
          # `determinism-gate-output-ubuntu-24.04/output_values.json`
          # artifact, which has `case600_annual_heating_mwh: 4.076293`
          # etc. for all 7 required cases). Strip the prefix so the
          # set contains `600`, `800`, … matching `REQUIRED_CASES`.
          missing_by_platform = {}
          for os_name, vals in all_values.items():
              cases_present = {
                  k.split('_')[0].removeprefix('case')
                  for k in vals
                  if k.startswith('case') and k.endswith('_annual_heating_mwh')
              }
              missing_by_platform[os_name] = sorted(c for c in REQUIRED_CASES if c not in cases_present)
          if any(missing_by_platform.values()):
              print("❌ Missing required cases by platform:")
              for os_name, missing in missing_by_platform.items():
                  if missing:
                      print(f"  {os_name}: missing {missing}")
              status = "FAIL"
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'missing_cases': missing_by_platform,
                  'platform_hashes': hashes,
                  'values': all_values
              }
              with open('comparison_result.json', 'w') as f:
                  json.dump(result, f, indent=2)
              sys.exit(1)

          # Check if all hashes are identical
          unique_hashes = set(hashes.values())

          if len(unique_hashes) == 1:
              print("✅ SUCCESS: All platforms produce identical outputs across all 7 cases")
              print(f"Universal hash: {list(unique_hashes)[0]}")
              status = "PASS"
              result = {
                  'status': 'PASS',
                  'all_identical': True,
                  'cases': list(REQUIRED_CASES),
                  'hash': list(unique_hashes)[0],
                  'platforms': list(hashes.keys()),
                  'values': all_values
              }
          else:
              print("❌ FAILURE: Hashes differ across platforms!")
              print(f"Unique hashes ({len(unique_hashes)}): {unique_hashes}")
              status = "FAIL"
              result = {
                  'status': 'FAIL',
                  'all_identical': False,
                  'cases': list(REQUIRED_CASES),
                  'platform_hashes': hashes,
                  'unique_hashes': list(unique_hashes),
                  'values': all_values
              }

          # Write result files
          with open('comparison_result.json', 'w') as f:
              json.dump(result, f, indent=2)

          if status == "FAIL":
              print()
              print("Detailed comparison:")
              for os_name, vals in all_values.items():
                  print(f"  {os_name}:")
                  for k, v in vals.items():
                      print(f"    {k}: {v}")
              sys.exit(1)
          EOF

      - name: Upload comparison result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: determinism-comparison
          path: comparison_result.json
          retention-days: 30
          # Issue #4545 (loop round 90): error, never a green empty upload.
          if-no-files-found: error

      - name: Display summary
        run: |
          echo "## Cross-Platform Determinism Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f comparison_result.json ]; then
            RESULT=$(cat comparison_result.json)
            echo "**Status**: $(echo $RESULT | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat comparison_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No comparison result found" >> $GITHUB_STEP_SUMMARY
          fi
