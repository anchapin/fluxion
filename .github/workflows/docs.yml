name: Documentation

on: [pull_request]

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

# Least-privilege GITHUB_TOKEN grants (Issue #2526). The Pages deploy step only
# fires on push-to-main, but this workflow is pull_request-only, so in practice
# contents: read is all that is ever exercised.
permissions:
  contents: read

jobs:
  docs:
    name: Build & Publish Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-env

      - name: Build documentation
        run: cargo doc --no-deps --document-private-items

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
