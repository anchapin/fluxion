name: Python Bindings (maturin)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  RUST_MIN_STACK: 33554432
  CARGO_BUILD_JOBS: 2

# PRs: fast signal with 2 key combos (ubuntu + windows, oldest + newest py).
# Main: full matrix (4 OS × 4 Python) for comprehensive validation.

jobs:
  build:
    name: Build Python Wheels (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PR gate: 2 jobs
          - os: ubuntu-latest
            python-version: '3.10'
            only_on_main: false
          - os: ubuntu-latest
            python-version: '3.12'
            only_on_main: false
          - os: windows-latest
            python-version: '3.10'
            only_on_main: false
          - os: windows-latest
            python-version: '3.12'
            only_on_main: false
          # Main-only: remaining OS × Python combos
          - os: macos-latest
            python-version: '3.10'
            only_on_main: true
          - os: macos-latest
            python-version: '3.11'
            only_on_main: true
          - os: macos-latest
            python-version: '3.12'
            only_on_main: true
          - os: macos-latest
            python-version: '3.13'
            only_on_main: true
          - os: ubuntu-latest
            python-version: '3.11'
            only_on_main: true
          - os: ubuntu-latest
            python-version: '3.13'
            only_on_main: true
          - os: windows-latest
            python-version: '3.11'
            only_on_main: true
          - os: windows-latest
            python-version: '3.13'
            only_on_main: true
        exclude:
          # Exclude main-only combos on PRs
          - os: macos-latest
            python-version: '3.10'
            only_on_main: true
          - os: macos-latest
            python-version: '3.11'
            only_on_main: true
          - os: macos-latest
            python-version: '3.12'
            only_on_main: true
          - os: macos-latest
            python-version: '3.13'
            only_on_main: true
          - os: ubuntu-latest
            python-version: '3.11'
            only_on_main: true
          - os: ubuntu-latest
            python-version: '3.13'
            only_on_main: true
          - os: windows-latest
            python-version: '3.11'
            only_on_main: true
          - os: windows-latest
            python-version: '3.13'
            only_on_main: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v4
        if: matrix.os == 'macos-latest'
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release --jobs 2 2>&1

      - name: Test Python import
        run: |
          pip install --find-links ./target/wheels fluxion
          python -c "import fluxion; print('[OK] Fluxion module loaded successfully')"
