name: Python Bindings (maturin)

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  RUST_MIN_STACK: 33554432
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: Build Python Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache ONNX Runtime binaries (macOS arm64)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ort-onnx
          key: ort-onnx-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-onnx-aarch64-apple-darwin-

      - name: Download and extract ONNX Runtime (macOS arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ONNX_VERSION="1.24.2"
          ONNX_ARCH="onnxruntime-osx-arm64-${ONNX_VERSION}.tgz"
          ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/${ONNX_ARCH}"
          CACHE_DIR="$HOME/Library/Caches/ort-onnx"
          mkdir -p "$CACHE_DIR"
          if [ ! -f "$CACHE_DIR/$ONNX_ARCH" ]; then
            echo "Downloading ONNX Runtime from $ONNX_URL"
            curl -fsSL "$ONNX_URL" -o "$CACHE_DIR/$ONNX_ARCH"
          fi
          mkdir -p "$CACHE_DIR/onnxruntime"
          if [ ! -d "$CACHE_DIR/onnxruntime/lib" ]; then
            echo "Extracting ONNX Runtime..."
            tar -xzf "$CACHE_DIR/$ONNX_ARCH" -C "$CACHE_DIR/onnxruntime"
          fi
          echo "ORT_LIB_DIR=$CACHE_DIR/onnxruntime" >> $GITHUB_ENV

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release --jobs 2 2>&1

      - name: Test Python import
        run: |
          pip install --find-links ./target/wheels fluxion
          python -c "import fluxion; print('[OK] Fluxion module loaded successfully')"
