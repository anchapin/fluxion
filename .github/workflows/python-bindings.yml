name: Python Bindings (maturin)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  RUST_MIN_STACK: 33554432
  CARGO_BUILD_JOBS: 2

# PRs: fast signal with 2 key combos (ubuntu + windows, oldest + newest py).
# Main: full matrix (4 OS × 4 Python) for comprehensive validation.

# Least-privilege GITHUB_TOKEN grants (Issue #2526): maturin build matrix only
# builds + uploads artifacts; no repo write-back.
permissions:
  contents: read

jobs:
  build:
    name: Build Python Wheels (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Exclude macOS on PRs (not in PR matrix)
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          # Exclude Python 3.11 and 3.13 on ubuntu/windows on PRs
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache ONNX Runtime binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        if: matrix.os == 'macos-latest'
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release --jobs 2 2>&1

      - name: Test Python import
        run: |
          pip install --find-links ./target/wheels fluxion
          python -c "import fluxion; print('[OK] Fluxion module loaded successfully')"

  # ---------------------------------------------------------------------------
  # Issue #2760 / #2744: run the PyO3 pytest + cargo test suite across the
  # full OS × Python matrix, not just ubuntu.
  #
  # This is DISTINCT from the `build` job above (the "Build Python Wheels"
  # gate, tracked separately by #2744): that job only smoke-tests
  # `import fluxion`. This job actually exercises the bindings with the
  # Python-side pytest suite and the Rust-side PyO3 / pyi-stub tests.
  #
  # PRs            → ubuntu + windows × {3.10, 3.13}  (fast signal, 4 legs)
  # main / dispatch → full 12-leg matrix (ubuntu + windows + macos × 3.10–3.13)
  #
  # NOTE on the dispatch job below: GitHub Actions does NOT expand the
  # `matrix` context until AFTER a job's `if:` is evaluated, so a job-level
  # `if:` that references `matrix.*` is a hard YAML parse error that fails
  # the ENTIRE workflow file (taking down the unrelated `build` wheel job
  # with it). That was the #2744 root cause: every PR saw all four
  # `Build Python Wheels` legs fail because the file would not parse.
  # The dispatch-job pattern below is the standard workaround — emit the
  # matrix as a JSON `outputs.matrix` from a tiny dispatcher, then consume
  # it via `needs:<job>.outputs.matrix` + `fromJson` in the consumer's
  # `strategy.matrix.include`.
  # ---------------------------------------------------------------------------
  pytest-matrix:
    name: PyO3 pytest matrix selector
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fast signal: ubuntu + windows × {3.10, 3.13}  (4 legs)
            matrix='[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.13"}]'
          else
            # Full matrix: ubuntu + windows + macos × {3.10, 3.11, 3.12, 3.13}  (12 legs)
            matrix='[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"}]'
          fi
          # Single-line JSON so the GITHUB_OUTPUT parse stays simple.
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  pytest-bindings:
    needs: pytest-matrix
    # `needs:` already short-circuits to "skipped" if pytest-matrix fails;
    # the explicit result check keeps the consumer skipped (not failed) when
    # the dispatcher is itself filtered out by an upstream rule.
    if: ${{ needs.pytest-matrix.result == 'success' }}
    name: PyO3 pytest (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.pytest-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin + test deps
        # Deliberately NOT installing requirements-dev.txt here: it pulls the
        # Linux-only `patchelf` plus heavy ML wheels (torch/onnx/sklearn) the
        # binding tests never import. The PyO3 suite only needs numpy + pytest.
        # `shell: bash` is available on all three runner OSes (Git Bash on Windows).
        shell: bash
        run: pip install maturin "pytest>=8.0.0" numpy

      - name: Build wheel (maturin build)
        # Use `maturin build` + `pip install` rather than `maturin develop`.
        # `maturin develop` requires a virtualenv or conda env — maturin ≥1.14
        # refuses to install into setup-python's bare system interpreter
        # (CI has no VIRTUAL_ENV / CONDA_PREFIX / .venv). Creating a venv
        # cross-OS is fiddly (Windows uses venv/Scripts/activate), so the
        # simpler path is `maturin build` then `pip install` the resulting
        # wheel — same approach the `build` job above uses for its
        # `import fluxion` smoke test.
        env:
          RUST_MIN_STACK: 33554432
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: maturin build --release --jobs 2

      - name: Install built wheel
        # `--find-links` points pip at target/wheels. We do NOT use --no-deps
        # here: the wheel declares numpy/onnxruntime/pandas, and while the
        # PyO3 pytest suite itself only imports numpy, the native
        # fluxion.fluxion extension may transitively need the others at
        # import time. Matching the `build` job's install pattern is the
        # safe choice.
        shell: bash
        run: pip install --find-links ./target/wheels fluxion

      - name: Stage native extension into source tree
        # `pip install` lands the compiled extension in site-packages, but
        # the pytest step runs from the repo root where the source `fluxion/`
        # directory shadows site-packages on sys.path. Without staging the
        # compiled extension into source fluxion/, `import fluxion.fluxion`
        # resolves to the source tree (no .so) and fails with
        # ModuleNotFoundError. (`maturin develop` works locally because it
        # stages the .so into the source tree as part of editable-install
        # behaviour; `maturin build` + `pip install` does not.)
        #
        # maturin's compiled-extension filename for module-name="fluxion.fluxion"
        # is `fluxion.abi3.so` on linux/macos and `fluxion.abi3.pyd` (or
        # `fluxion.pyd`) on Windows. Globbing `*.so`/`*.pyd` is safe — the
        # package dir contains only .py source files plus the one compiled
        # extension.
        #
        # Issue #2836: do NOT use `site.getsitepackages()[0]` here. On the
        # `windows-latest` runner with the official setup-python install
        # (C:\hostedtoolcache\windows\Python\X.Y.Z\x64), it returns the
        # bare `sys.prefix` instead of `sys.prefix\Lib\site-packages`, so
        # the glob below looks one directory too high and fails to find
        # the compiled `.pyd`. Verified by 10+ PRs (e.g. #2821, #2823,
        # #2824, #2827, #2828, #2829, #2833, #2834) across waves 1-5.
        # `pip show fluxion` reports the actual install location pip used
        # and is reliable cross-platform.
        shell: bash
        run: |
          set -euo pipefail
          SP="$(pip show fluxion | awk '/^Location:/{print $2}')"
          if [ -z "$SP" ]; then
            echo "::error::Could not determine fluxion install location via 'pip show fluxion'"
            pip show fluxion || true
            exit 1
          fi
          echo "fluxion install location (per pip): $SP"
          shopt -s nullglob
          NATIVE=( "$SP"/fluxion/*.so "$SP"/fluxion/*.pyd )
          if [ "${#NATIVE[@]}" -eq 0 ]; then
            echo "::error::No compiled extension (.so/.pyd) under $SP/fluxion/"
            ls -la "$SP"/fluxion/ || true
            echo "--- debug: site.getsitepackages() said ---"
            python -c 'import site; print(site.getsitepackages())' || true
            echo "--- debug: sys.prefix / sys.exec_prefix ---"
            python -c 'import sys; print("prefix=", sys.prefix, "exec_prefix=", sys.exec_prefix)' || true
            exit 1
          fi
          cp -v "${NATIVE[@]}" fluxion/
          echo "Staged into source fluxion/:"
          ls -la fluxion/*.so fluxion/*.pyd 2>/dev/null || true

      - name: Run PyO3 pytest suite
        # Issue #2852 — run the FULL `tests/python/` suite, not just the
        # 3-file subset enumerated in Issue #2760. The build job above
        # has already produced the native extension and staged it into
        # the source `fluxion/` tree, so every binding test runs against
        # real native code rather than silently skipping because the
        # compiled extension is missing. The previous 3-file scope left
        # `test_api_transformation.py`, `test_hvac_bindings.py`,
        # `test_osm_bindings.py`, `test_apply_measures_cli.py`,
        # `test_generate_scorecard.py`, `test_state_store.py`,
        # `test_webhook_notification.py`, `test_standard_measures.py`,
        # `test_numpy_zero_copy.py` entirely uncovered by CI — any
        # regression in those would only be caught at the developer's
        # local `pytest` run (which silently skipped 43+ tests).
        #
        # `python -m pytest` (not the `pytest` script) for cross-OS PATH safety.
        env:
          RUST_MIN_STACK: 33554432
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/python/ \
            tests/integration/test_numpy_arrays.py

      - name: Run Rust-side PyO3 integration tests
        # `--release` reuses artifacts produced by `maturin build --release`
        # above. `test_pyo3_bindings` is currently a doc-only file (a
        # cross-OS compile check of the python-bindings feature); the active
        # assertion lives in `pyi_stub_completeness` (self-contained text
        # parse of fluxion.pyi vs src/lib.rs, feature-independent).
        env:
          RUST_MIN_STACK: 33554432
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --features python-bindings \
            --test test_pyo3_bindings --test pyi_stub_completeness
# trigger
