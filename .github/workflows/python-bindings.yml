name: Python Bindings (maturin)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
  RUST_MIN_STACK: 33554432
  CARGO_BUILD_JOBS: 2

# PRs: fast signal with 2 key combos (ubuntu + windows, oldest + newest py).
# Main: full matrix (4 OS × 4 Python) for comprehensive validation.

# Least-privilege GITHUB_TOKEN grants (Issue #2526): maturin build matrix only
# builds + uploads artifacts; no repo write-back.
permissions:
  contents: read

jobs:
  build:
    name: Build Python Wheels (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Exclude macOS on PRs (not in PR matrix)
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          # Exclude Python 3.11 and 3.13 on ubuntu/windows on PRs
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache ONNX Runtime binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        if: matrix.os == 'macos-latest'
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release --jobs 2 2>&1

      - name: Test Python import
        run: |
          pip install --find-links ./target/wheels fluxion
          python -c "import fluxion; print('[OK] Fluxion module loaded successfully')"

  # ---------------------------------------------------------------------------
  # Issue #2760: run the PyO3 pytest + cargo test suite across the full
  # OS × Python matrix, not just ubuntu.
  #
  # This is DISTINCT from the `build` job above (the "Build Python Wheels"
  # gate, tracked separately by #2744): that job only smoke-tests
  # `import fluxion`. This job actually exercises the bindings with the
  # Python-side pytest suite and the Rust-side PyO3 / pyi-stub tests.
  #
  # PRs            → ubuntu + windows × {3.10, 3.13}  (fast signal, 4 legs)
  # main / dispatch → full 12-leg matrix (ubuntu + windows + macos × 3.10–3.13)
  # ---------------------------------------------------------------------------
  pytest-bindings:
    name: PyO3 pytest (${{ matrix.os }} / py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # On PRs only the ubuntu/windows fast-signal legs run; the full matrix
    # runs on main pushes and manual dispatch. Non-matching legs are skipped
    # (visible as "skipped" in the checks UI, not silently dropped).
    if: |
      github.event_name != 'pull_request' ||
      ((matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') &&
       (matrix.python-version == '3.10' || matrix.python-version == '3.13'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin + test deps
        # Deliberately NOT installing requirements-dev.txt here: it pulls the
        # Linux-only `patchelf` plus heavy ML wheels (torch/onnx/sklearn) the
        # binding tests never import. The PyO3 suite only needs numpy + pytest.
        # `shell: bash` is available on all three runner OSes (Git Bash on Windows).
        shell: bash
        run: pip install maturin "pytest>=8.0.0" numpy

      - name: Build & install bindings (maturin develop)
        # `maturin develop` builds the `python-extension` wheel (per
        # pyproject.toml) and installs it into the active interpreter, so
        # `import fluxion` resolves for the pytest step below. No venv is
        # used — setup-python's interpreter is the install target directly,
        # which avoids the Windows `venv/Scripts/activate` path divergence.
        env:
          RUST_MIN_STACK: 33554432
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: maturin develop --release --jobs 2

      - name: Run PyO3 pytest suite
        # Scoped to the binding tests enumerated in Issue #2760. Running bare
        # `pytest` would collect every test_*.py under tests/ (state-store,
        # CLI measures, etc.) and pull in uninstalled heavy deps. The root
        # conftest (tests/conftest.py) auto-skips `needs_fluxion` tests when
        # the module is absent, so a leg degrades to skips, not hard errors.
        # `python -m pytest` (not the `pytest` script) for cross-OS PATH safety.
        env:
          RUST_MIN_STACK: 33554432
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/python/test_model_mutations.py \
            tests/python/test_multi_node_bindings.py \
            tests/integration/test_numpy_arrays.py

      - name: Run Rust-side PyO3 integration tests
        # `--release` reuses artifacts produced by `maturin develop --release`
        # above. `test_pyo3_bindings` is currently a doc-only file (a
        # cross-OS compile check of the python-bindings feature); the active
        # assertion lives in `pyi_stub_completeness` (self-contained text
        # parse of fluxion.pyi vs src/lib.rs, feature-independent).
        env:
          RUST_MIN_STACK: 33554432
          CARGO_BUILD_JOBS: 2
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --features python-bindings \
            --test test_pyo3_bindings --test pyi_stub_completeness
# trigger
