name: Scripts Test Suite

# Issue #2817: pytest harness for the branch-protection-critical CI gate
# scripts under ``scripts/`` (architecture drift, cycle guards, root/docs
# hygiene, doc-inventory freshness). Before this workflow the gates were
# verified only by running them directly in CI; a logic regression (broken
# allow-list, off-by-one path filter) could only be caught if it happened
# to trip the gate on a real PR.
#
# The tests live under ``scripts/ci/`` (collected via ``scripts/pytest.ini``
# alongside the pre-existing OSimFlow harness) and drive each gate through
# parametric clean-tree / planted-violation cases against a hermetic
# ``tmp_path`` mock repo.
#
# Issue #2866: also invokes ``scripts/check_required_checks_sync.py``
# directly so a ``release_gates.yaml`` / ``.github/workflows/*.yml``
# desync (e.g. a renamed job that loses its ``workflow_index`` entry)
# fails the PR even when the pytest suite happens to be green. The
# ``scripts/ci/test_check_required_checks_sync.py`` companion covers
# the parser / matching primitives against synthetic fixtures; this
# direct invocation covers the end-to-end against the real repo.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "scripts/pytest.ini"
      - ".github/workflows/scripts-tests.yml"
      - "release_gates.yaml"
      # Issue #4176: the `dep-budget` job gates
      # `fluxion-core/Cargo.toml`; the workflow must fire on the PRs
      # that can trip it, or the required check would never report and
      # the PR would be unmergeable (the Issue #3898 lesson).
      - "fluxion-core/Cargo.toml"
      - ".github/workflows/**"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  scripts-tests:
    name: "Scripts Test Suite (Issue #2817)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full OSimFlow test-dep set, which already declares
          # pytest + pytest-asyncio + pytest-cov AND the boto3/botocore that
          # the pre-existing scripts/ci/test_cloud_campaign_manager.py needs
          # to exercise scripts/cloud_campaign_manager.py's S3 client. Skip
          # the minimum-only install — the gate tests are pure stdlib, but
          # the 187 pre-existing #2810 tests underneath scripts/ci/ are not.
          pip install -r scripts/requirements-test.txt

      # Issue #2866: catch any drift between release_gates.yaml's
      # `ci.required_checks` / `ci.workflow_index` and the actual
      # `jobs.<id>.name` fields in `.github/workflows/*.yml`. Run before
      # the pytest harness so a workflow-renaming PR is rejected with the
      # drift message rather than a generic test failure.
      - name: Run required_checks sync gate (Issue #2866)
        run: python3 scripts/check_required_checks_sync.py

      # Issue #4068: ruff runs BEFORE the pytest harness. The harness is
      # the slow step and used to run first, so a pytest failure skipped
      # ruff entirely (a failed step aborts the rest of the job) — that
      # is how an F401 shipped to develop unnoticed. Fast lint gate
      # first; both signals now surface on every run.
      - name: Enforce ruff clean (keep the #2811 baseline at 0)
        run: |
          # Match ``.pre-commit-config.yaml``'s ``astral-sh/ruff-pre-commit``
          # pin (``v0.14.5``) so the gate stays reproducible. A floating
          # ``pip install ruff`` here would silently pick up new minor
          # releases whose new rule codes (e.g. ``EXE001``, ``BLE001``,
          # ``DTZ011``, ``PLR1716``, ``UP006``/``UP007``) shift the
          # baseline and fail the pre-existing #2811-cleared scripts.
          pip install 'ruff==0.14.5'
          ruff check scripts/

      - name: Run scripts/ pytest harness
        run: python3 -m pytest scripts/

      # Issue #3531: runner-routing policy drift gate. The matcher in
      # ``scripts/check_runner_routing_policy.py`` enforces ``docs/SECURITY.md
      # §7`` (Issue #3445): every PR-triggered job that mentions
      # ``vars.FLUXION_LINUX_RUNNER`` MUST use the guarded
      # ``github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      # vars.FLUXION_LINUX_RUNNER || 'ubuntu-24.04'`` form (the canonical
      # pattern already used by ``onnx-integrity.yml:92-98`` and
      # ``python-tests.yml:49-55``). The unguarded ``vars.FLUXION_LINUX_RUNNER
      # || 'ubuntu-24.04'`` form silently routes PR-controlled code onto a
      # persistent self-hosted runner, defeating the gate's own trust
      # boundary. Workflows that don't trigger on PR (e.g. ``memory-budget.yml``)
      # and jobs whose ``if:`` clause is strictly main-only are exempt — the
      # unsafe ``runs-on`` is harmless there because the code never executes
      # on PR-controlled code.
      - name: Enforce runner-routing policy (Issue #3531)
        run: python3 scripts/check_runner_routing_policy.py

      # Issue #3211 / #3393 / #3443: quarantine registry audit. Closes
      # the 149-vs-78 gap that Issue #3393 documented by scanning every
      # `#[ignore]` attribute under tests/ and cross-referencing it
      # against tests/QUARANTINE.md. Issue #3443 wired the strict
      # downward-only ratchet (BASELINE_ORPHANED_IGNORES /
      # BASELINE_GHOST_ROWS): the script now exits 1 if any new orphan
      # `#[ignore]` is added without a corresponding registry row, if
      # any ghost row exists, or if the orphan / ghost count grows
      # above the documented baseline. The mirror of the
      # `BASELINE_KNOWN_ORPHANS` / `BASELINE_WIRED_BUT_DEAD` ratchets
      # in `scripts/check_orphan_modules.py` (Issues #3458 / #3459).
      # Companion cleanup PRs that resolve an orphan / ghost are
      # expected to lower the matching baseline by one.
      - name: Quarantine registry audit (Issue #3211, #3393, #3443)
        run: python3 scripts/generate_quarantine_registry.py --strict

      # Issue #3366 / #3444: ADR-0015 concurrency-template gate. The
      # matcher in ``scripts/check_concurrency_keys.py`` was previously
      # dead code — zero CI references — so a workflow drifting from the
      # per-``head_sha`` ``concurrency:`` template (a new workflow added
      # without the block, a stale ref-only ``group:`` key, an
      # unconditional ``cancel-in-progress:``) could merge silently.
      # The pytest companion ``scripts/ci/test_check_concurrency_keys.py``
      # covers the matcher's invariants against hermetic ``tmp_path``
      # fixtures; this direct invocation covers the end-to-end against
      # the real repo (same direct-invocation split as #2866 above).
      - name: Enforce ADR-0015 concurrency keys (Issue #3366, #3444)
        run: python3 scripts/check_concurrency_keys.py

      # Issue #4135: Dockerfile/`[workspace] members` drift guard.
      # ``cargo build --bin fluxion-rest --no-default-features`` resolves
      # the WHOLE workspace, so a member whose manifest is absent from the
      # image context aborts the build -- optional members such as
      # ``fluxion-cfd`` included. The Dockerfile's member list had drifted
      # three times (#2469, #3196, #3337) with no gate to catch it, and the
      # broken half of that (the unsatisfiable digest-pin gate, #4132) kept
      # the failure invisible. The pytest companion
      # ``scripts/ci/test_check_docker_workspace_members.py`` covers the
      # matcher against hermetic ``tmp_path`` fixtures; this direct
      # invocation covers the end-to-end against the real tree.
      - name: Enforce Dockerfile covers every workspace member (Issue #4135)
        run: python3 scripts/check_docker_workspace_members.py

      # Issue #4150: MSRV / digest-pin / docker.yml-parity guard for the
      # Dockerfile base images. The Dockerfile has cited
      # ``scripts/check_docker_base_image_msrv.py`` since the #4138 MSRV
      # bump, but the script did not exist -- the repo asserted a control
      # it never enforced. The concrete cost was #4149: the pin script
      # wrote ``FROM rust:1.98.0-bookworm@sha256:sha256:<hex>``, an
      # unparseable reference that ``docker build`` rejects, while CI
      # stayed green because the only digest assertion in CI reads the
      # ``docker.yml`` env pins and never compares them to the Dockerfile
      # ``FROM`` lines. This gate enforces (1) the builder tag against
      # ``rust-version``, (2) that every base ``FROM`` is digest-pinned
      # with a well-formed digest documented by its comment, and (3)
      # Dockerfile/docker.yml digest parity. Hermetic -- no docker daemon
      # and no network. The pytest companion
      # ``scripts/ci/test_check_docker_base_image_msrv.py`` covers each
      # invariant against hermetic ``tmp_path`` fixtures; this direct
      # invocation covers the end-to-end against the real tree.
      - name: Enforce Dockerfile base-image MSRV and digest pins (Issue #4150)
        run: python3 scripts/check_docker_base_image_msrv.py

      # Issue #3475: SHA-pinning hygiene guard for ``.github/workflows/``.
      # PR #3472 repinned the last tag-pinned third-party actions but, by
      # scope, did not add a general enforcement gate. The matcher in
      # ``scripts/check_workflow_pin.py`` fails any non-SHA-pinned
      # ``uses:`` (or non-local-composite) so a future contributor adding
      # ``uses: action@v4`` -- a mutable tag that re-resolves every run --
      # is rejected at PR time. The pytest companion
      # ``scripts/ci/test_check_workflow_pin.py`` covers the classifier /
      # extractor / main() exit-code contract against hermetic ``tmp_path``
      # fixtures (tag, branch, bare, empty, SHA, local); this direct
      # invocation covers the end-to-end against the real repo (same
      # direct-invocation split as #2866 / #3444 above).
      - name: Enforce SHA-pinned workflow `uses:` (Issue #3475)
        run: python3 scripts/check_workflow_pin.py

      # Issue #4068: reject duplicate YAML mapping keys in
      # ``.github/workflows/*.yml``. PR #4018's phase-gating mechanically
      # inserted ``needs: precheck`` / ``if: needs.precheck...`` after
      # each job's ``name:`` line, creating duplicate ``needs:`` / ``if:``
      # keys in four jobs across fast_math_check.yml, ashrae_validation.yml
      # and performance_dashboard.yml. GitHub's parser rejects the whole
      # file at startup ("workflow file issue", zero jobs, zero logs)
      # while stock PyYAML silently keeps the last duplicate -- so every
      # existing local gate passed. The pytest companion
      # ``scripts/ci/test_check_workflow_dup_keys.py`` covers the
      # detector against hermetic fixtures; this direct invocation covers
      # the end-to-end against the real tree.
      - name: Enforce no duplicate workflow YAML keys (Issue #4068)
        run: python3 scripts/check_workflow_dup_keys.py

      # Issue #3530: reject the named mutable GitHub Actions refs without
      # weakening the stricter SHA-only gate above. The checker reports every
      # offending workflow and line so PR authors can pin the exact action SHA.
      - name: Enforce named action pinning refs (Issue #3530)
        run: python3 scripts/check_action_pinning.py

      # Issue #3812: pin Python installs in credential-bearing workflow
      # jobs (jobs with `secrets.*` env, `permissions: id-token: write`,
      # or `permissions: contents: write`). Bare `pip install <pkg>` in
      # such a job re-resolves the package on every run, exposing the
      # credential scope to a compromised-transitive-dep / dependency-
      # confusion PyPI artifact. The gate accepts `-r <pinned-file>` or
      # `pip install name==X.Y.Z` and reports bare installs with a line
      # ref so the contributor can update the workflow to use the
      # committed `scripts/requirements-ci.txt` constraints file.
      - name: Enforce pip pinning in credential-bearing workflows (Issue #3812)
        run: python3 scripts/check_pip_pinning.py

      # Issue #4186: Trivy must scan the BUILT IMAGE, not the repo
      # filesystem. The `security` job in `docker.yml` used to run
      # `scan-type: 'fs'` + `scan-ref: '.'` (auditing only the checkout's
      # Python/JS deps, never the shipped Debian runtime layer) with no
      # `exit-code`, so the scan could neither see image CVEs nor fail
      # the build. The matcher in
      # ``scripts/check_trivy_scan_target.py`` fails any trivy-action
      # step that sets `scan-type: 'fs'` without a `trivy-fs-justified:`
      # comment documenting why a filesystem scan is correct there. The
      # pytest companion
      # ``scripts/ci/test_check_trivy_scan_target.py`` covers the
      # detector / justification / ``main()`` exit-code contract against
      # hermetic ``tmp_path`` fixtures; this direct invocation covers the
      # end-to-end against the real tree (same direct-invocation split as
      # #2866 / #3444 / #3475 above).
      - name: Enforce Trivy scans the built image (Issue #4186)
        run: python3 scripts/check_trivy_scan_target.py

      # Issue #4159: reject the `continue-on-error: true` + downstream
      # `steps.<id>.outcome` anti-pattern. On a masked step `.outcome`
      # is ALWAYS 'success' (it reflects the continue-on-error
      # handling, not the step's real result), so a terminal "fail if X
      # failed" re-raise testing `.outcome` can never fire — the workflow
      # goes green while the gate it guards is red. The ASHRAE 140
      # release-gate re-raise in `ashrae_140_validation.yml` was exactly
      # this bug (since fixed to `steps.check.conclusion`, along with
      # the same pattern in `ashrae_benchmark_harness.yml`,
      # `nightly_validation.yml`, and `pgo-nightly.yml`). The matcher in
      # ``scripts/check_continue_on_error_outcome.py`` fails any
      # `steps.<id>.outcome` reference where the step sets
      # `continue-on-error: true`; `.outcome` on unmasked steps and all
      # `.conclusion` references are left alone. The pytest companion
      # ``scripts/ci/test_check_continue_on_error_outcome.py`` covers the
      # detector / classification / ``main()`` exit-code contract against
      # hermetic ``tmp_path`` fixtures; this direct invocation covers the
      # end-to-end against the real tree (same direct-invocation split as
      # #2866 / #3444 / #3475 / #4186 above).
      - name: Enforce no masked-step `.outcome` re-raise (Issue #4159)
        run: python3 scripts/check_continue_on_error_outcome.py

      # Issue #3453: ENV_LOCK serialisation guard for env-mutating
      # integration tests. ``tests/ashrae_140_diagnostic_integration_test``
      # shipped with bare ``env::set_var`` / ``env::remove_var`` calls and
      # fell through the ADR-0014 nextest-migration safety net, so the
      # process-wide env state could leak between sibling tests under
      # ``--test-threads=2``. The matcher in
      # ``scripts/check_env_setvar_serialized.py`` fails any
      # ``tests/**/*.rs`` that calls ``std::env::set_var`` /
      # ``std::env::remove_var`` (or the unqualified ``env::`` form) without
      # a file-local ``static <NAME>_LOCK: ... Mutex ...`` declaration --
      # the convention already carried by
      # ``tests/onnx_signature_integration.rs``, ``tests/email_notifier_header_safety.rs``,
      # and ``src/ai/surrogate.rs::tests``. The pytest companion
      # ``scripts/ci/test_check_env_setvar_serialized.py`` covers the
      # detector / lock-declaration regex / ``main()`` exit-code contract
      # against hermetic ``tmp_path`` fixtures; this direct invocation
      # covers the end-to-end against the real repo (same
      # direct-invocation split as #2866 / #3444 / #3475 above).
      - name: Enforce ENV_LOCK on env-mutating integration tests (Issue #3453)
        run: python3 scripts/check_env_setvar_serialized.py

      # Issue #3442: test-inventory drift gate. The companion
      # ``scripts/ci/test_check_test_inventory_drift.py`` covers the
      # detector / ratchet / ``--update-baseline`` / ``--json``
      # output-shape contracts against hermetic ``tmp_path``
      # fixtures; this direct invocation covers the end-to-end
      # against the real repo (same direct-invocation split as
      # #2866 / #3444 / #3475 / #3453 above). The ``--no-verify``
      # flag keeps the gate sub-second by using the AST-regex
      # inventory; the verified (cargo ``--list`` cross-checked)
      # counts are a separate ``python3 scripts/
      # generate_test_inventory.py --verify`` invocation run by
      # operators locally after a test-adding PR. Drift beyond the
      # documented threshold (±5% or ±25 tests, whichever is
      # larger), or growth above the ``BASELINE_LIB_TESTS`` /
      # ``BASELINE_WORKSPACE_TESTS`` / ``BASELINE_TEST_BINARIES``
      # ratchets in ``scripts/check_test_inventory_drift.py``,
      # fails the PR.
      - name: Enforce test-inventory drift gate (Issue #3442)
        run: python3 scripts/check_test_inventory_drift.py --no-verify

  # Issue #4176: fluxion-core dependency-budget gate as a named,
  # branch-protection-required job. `fluxion-core` is a
  # dependency-light leaf; the static manifest scan plus the `cargo
  # tree` dynamic scan in `scripts/check_fluxion_core_dep_budget.py`
  # keep heavyweight crates (reqwest, hyper, tokio, sqlx, diesel,
  # serde_json, futures, async-trait, actix-web, redis, clap, ...) out
  # of the default-feature dependency tree. The check needs the Rust
  # toolchain (`cargo tree`), so it cannot live as a step in the
  # Python-only `scripts-tests` job above — hence this separate job.
  # The `pull_request` `paths:` filter at the top of this file includes
  # `fluxion-core/Cargo.toml` so the gate actually fires on the PRs
  # that can trip it (a path-filtered required check whose workflow
  # never runs would block the PR forever -- the Issue #3898 lesson).
  dep-budget:
    name: "Fluxion Core Dependency Budget Gate (Issue #4176)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-env

      - name: Enforce fluxion-core dependency budget (Issue #4176)
        run: python3 scripts/check_fluxion_core_dep_budget.py
