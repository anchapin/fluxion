name: Scripts Test Suite

# Issue #2817: pytest harness for the branch-protection-critical CI gate
# scripts under ``scripts/`` (architecture drift, cycle guards, root/docs
# hygiene, doc-inventory freshness). Before this workflow the gates were
# verified only by running them directly in CI; a logic regression (broken
# allow-list, off-by-one path filter) could only be caught if it happened
# to trip the gate on a real PR.
#
# The tests live under ``scripts/ci/`` (collected via ``scripts/pytest.ini``
# alongside the pre-existing OSimFlow harness) and drive each gate through
# parametric clean-tree / planted-violation cases against a hermetic
# ``tmp_path`` mock repo.
#
# Issue #2866: also invokes ``scripts/check_required_checks_sync.py``
# directly so a ``release_gates.yaml`` / ``.github/workflows/*.yml``
# desync (e.g. a renamed job that loses its ``workflow_index`` entry)
# fails the PR even when the pytest suite happens to be green. The
# ``scripts/ci/test_check_required_checks_sync.py`` companion covers
# the parser / matching primitives against synthetic fixtures; this
# direct invocation covers the end-to-end against the real repo.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "scripts/pytest.ini"
      - ".github/workflows/scripts-tests.yml"
      - "release_gates.yaml"
      - ".github/workflows/**"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  scripts-tests:
    name: Scripts Test Suite (Issue #2817)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full OSimFlow test-dep set, which already declares
          # pytest + pytest-asyncio + pytest-cov AND the boto3/botocore that
          # the pre-existing scripts/ci/test_cloud_campaign_manager.py needs
          # to exercise scripts/cloud_campaign_manager.py's S3 client. Skip
          # the minimum-only install — the gate tests are pure stdlib, but
          # the 187 pre-existing #2810 tests underneath scripts/ci/ are not.
          pip install -r scripts/requirements-test.txt

      # Issue #2866: catch any drift between release_gates.yaml's
      # `ci.required_checks` / `ci.workflow_index` and the actual
      # `jobs.<id>.name` fields in `.github/workflows/*.yml`. Run before
      # the pytest harness so a workflow-renaming PR is rejected with the
      # drift message rather than a generic test failure.
      - name: Run required_checks sync gate (Issue #2866)
        run: python3 scripts/check_required_checks_sync.py

      - name: Run scripts/ pytest harness
        run: python3 -m pytest scripts/

      # Issue #3531: runner-routing policy drift gate. The matcher in
      # ``scripts/check_runner_routing_policy.py`` enforces ``docs/SECURITY.md
      # §7`` (Issue #3445): every PR-triggered job that mentions
      # ``vars.FLUXION_LINUX_RUNNER`` MUST use the guarded
      # ``github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      # vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest'`` form (the canonical
      # pattern already used by ``onnx-integrity.yml:92-98`` and
      # ``python-tests.yml:49-55``). The unguarded ``vars.FLUXION_LINUX_RUNNER
      # || 'ubuntu-latest'`` form silently routes PR-controlled code onto a
      # persistent self-hosted runner, defeating the gate's own trust
      # boundary. Workflows that don't trigger on PR (e.g. ``memory-budget.yml``)
      # and jobs whose ``if:`` clause is strictly main-only are exempt — the
      # unsafe ``runs-on`` is harmless there because the code never executes
      # on PR-controlled code.
      - name: Enforce runner-routing policy (Issue #3531)
        run: python3 scripts/check_runner_routing_policy.py

      # Issue #3211 / #3393 / #3443: quarantine registry audit. Closes
      # the 149-vs-78 gap that Issue #3393 documented by scanning every
      # `#[ignore]` attribute under tests/ and cross-referencing it
      # against tests/QUARANTINE.md. Issue #3443 wired the strict
      # downward-only ratchet (BASELINE_ORPHANED_IGNORES /
      # BASELINE_GHOST_ROWS): the script now exits 1 if any new orphan
      # `#[ignore]` is added without a corresponding registry row, if
      # any ghost row exists, or if the orphan / ghost count grows
      # above the documented baseline. The mirror of the
      # `BASELINE_KNOWN_ORPHANS` / `BASELINE_WIRED_BUT_DEAD` ratchets
      # in `scripts/check_orphan_modules.py` (Issues #3458 / #3459).
      # Companion cleanup PRs that resolve an orphan / ghost are
      # expected to lower the matching baseline by one.
      - name: Quarantine registry audit (Issue #3211, #3393, #3443)
        run: python3 scripts/generate_quarantine_registry.py --strict

      # Issue #3366 / #3444: ADR-0015 concurrency-template gate. The
      # matcher in ``scripts/check_concurrency_keys.py`` was previously
      # dead code — zero CI references — so a workflow drifting from the
      # per-``head_sha`` ``concurrency:`` template (a new workflow added
      # without the block, a stale ref-only ``group:`` key, an
      # unconditional ``cancel-in-progress:``) could merge silently.
      # The pytest companion ``scripts/ci/test_check_concurrency_keys.py``
      # covers the matcher's invariants against hermetic ``tmp_path``
      # fixtures; this direct invocation covers the end-to-end against
      # the real repo (same direct-invocation split as #2866 above).
      - name: Enforce ADR-0015 concurrency keys (Issue #3366, #3444)
        run: python3 scripts/check_concurrency_keys.py

      # Issue #3475: SHA-pinning hygiene guard for ``.github/workflows/``.
      # PR #3472 repinned the last tag-pinned third-party actions but, by
      # scope, did not add a general enforcement gate. The matcher in
      # ``scripts/check_workflow_pin.py`` fails any non-SHA-pinned
      # ``uses:`` (or non-local-composite) so a future contributor adding
      # ``uses: action@v4`` -- a mutable tag that re-resolves every run --
      # is rejected at PR time. The pytest companion
      # ``scripts/ci/test_check_workflow_pin.py`` covers the classifier /
      # extractor / main() exit-code contract against hermetic ``tmp_path``
      # fixtures (tag, branch, bare, empty, SHA, local); this direct
      # invocation covers the end-to-end against the real repo (same
      # direct-invocation split as #2866 / #3444 above).
      - name: Enforce SHA-pinned workflow `uses:` (Issue #3475)
        run: python3 scripts/check_workflow_pin.py

      # Issue #3453: ENV_LOCK serialisation guard for env-mutating
      # integration tests. ``tests/ashrae_140_diagnostic_integration_test``
      # shipped with bare ``env::set_var`` / ``env::remove_var`` calls and
      # fell through the ADR-0014 nextest-migration safety net, so the
      # process-wide env state could leak between sibling tests under
      # ``--test-threads=2``. The matcher in
      # ``scripts/check_env_setvar_serialized.py`` fails any
      # ``tests/**/*.rs`` that calls ``std::env::set_var`` /
      # ``std::env::remove_var`` (or the unqualified ``env::`` form) without
      # a file-local ``static <NAME>_LOCK: ... Mutex ...`` declaration --
      # the convention already carried by
      # ``tests/onnx_signature_integration.rs``, ``tests/email_notifier_header_safety.rs``,
      # and ``src/ai/surrogate.rs::tests``. The pytest companion
      # ``scripts/ci/test_check_env_setvar_serialized.py`` covers the
      # detector / lock-declaration regex / ``main()`` exit-code contract
      # against hermetic ``tmp_path`` fixtures; this direct invocation
      # covers the end-to-end against the real repo (same
      # direct-invocation split as #2866 / #3444 / #3475 above).
      - name: Enforce ENV_LOCK on env-mutating integration tests (Issue #3453)
        run: python3 scripts/check_env_setvar_serialized.py

      # Issue #3442: test-inventory drift gate. The companion
      # ``scripts/ci/test_check_test_inventory_drift.py`` covers the
      # detector / ratchet / ``--update-baseline`` / ``--json``
      # output-shape contracts against hermetic ``tmp_path``
      # fixtures; this direct invocation covers the end-to-end
      # against the real repo (same direct-invocation split as
      # #2866 / #3444 / #3475 / #3453 above). The ``--no-verify``
      # flag keeps the gate sub-second by using the AST-regex
      # inventory; the verified (cargo ``--list`` cross-checked)
      # counts are a separate ``python3 scripts/
      # generate_test_inventory.py --verify`` invocation run by
      # operators locally after a test-adding PR. Drift beyond the
      # documented threshold (±5% or ±25 tests, whichever is
      # larger), or growth above the ``BASELINE_LIB_TESTS`` /
      # ``BASELINE_WORKSPACE_TESTS`` / ``BASELINE_TEST_BINARIES``
      # ratchets in ``scripts/check_test_inventory_drift.py``,
      # fails the PR.
      - name: Enforce test-inventory drift gate (Issue #3442)
        run: python3 scripts/check_test_inventory_drift.py --no-verify

      - name: Enforce ruff clean (keep the #2811 baseline at 0)
        run: |
          # Match ``.pre-commit-config.yaml``'s ``astral-sh/ruff-pre-commit``
          # pin (``v0.14.5``) so the gate stays reproducible. A floating
          # ``pip install ruff`` here would silently pick up new minor
          # releases whose new rule codes (e.g. ``EXE001``, ``BLE001``,
          # ``DTZ011``, ``PLR1716``, ``UP006``/``UP007``) shift the
          # baseline and fail the pre-existing #2811-cleared scripts.
          pip install 'ruff==0.14.5'
          ruff check scripts/
