name: Scripts Test Suite

# Issue #2817: pytest harness for the branch-protection-critical CI gate
# scripts under ``scripts/`` (architecture drift, cycle guards, root/docs
# hygiene, doc-inventory freshness). Before this workflow the gates were
# verified only by running them directly in CI; a logic regression (broken
# allow-list, off-by-one path filter) could only be caught if it happened
# to trip the gate on a real PR.
#
# The tests live under ``scripts/ci/`` (collected via ``scripts/pytest.ini``
# alongside the pre-existing OSimFlow harness) and drive each gate through
# parametric clean-tree / planted-violation cases against a hermetic
# ``tmp_path`` mock repo.
#
# Issue #2866: also invokes ``scripts/check_required_checks_sync.py``
# directly so a ``release_gates.yaml`` / ``.github/workflows/*.yml``
# desync (e.g. a renamed job that loses its ``workflow_index`` entry)
# fails the PR even when the pytest suite happens to be green. The
# ``scripts/ci/test_check_required_checks_sync.py`` companion covers
# the parser / matching primitives against synthetic fixtures; this
# direct invocation covers the end-to-end against the real repo.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "scripts/pytest.ini"
      - ".github/workflows/scripts-tests.yml"
      - "release_gates.yaml"
      - ".github/workflows/**"
  push:
    branches:
      - develop
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  scripts-tests:
    name: Scripts Test Suite (Issue #2817)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the full OSimFlow test-dep set, which already declares
          # pytest + pytest-asyncio + pytest-cov AND the boto3/botocore that
          # the pre-existing scripts/ci/test_cloud_campaign_manager.py needs
          # to exercise scripts/cloud_campaign_manager.py's S3 client. Skip
          # the minimum-only install — the gate tests are pure stdlib, but
          # the 187 pre-existing #2810 tests underneath scripts/ci/ are not.
          pip install -r scripts/requirements-test.txt

      # Issue #2866: catch any drift between release_gates.yaml's
      # `ci.required_checks` / `ci.workflow_index` and the actual
      # `jobs.<id>.name` fields in `.github/workflows/*.yml`. Run before
      # the pytest harness so a workflow-renaming PR is rejected with the
      # drift message rather than a generic test failure.
      - name: Run required_checks sync gate (Issue #2866)
        run: python3 scripts/check_required_checks_sync.py

      - name: Run scripts/ pytest harness
        run: python3 -m pytest scripts/

      - name: Enforce ruff clean (keep the #2811 baseline at 0)
        run: |
          # Match ``.pre-commit-config.yaml``'s ``astral-sh/ruff-pre-commit``
          # pin (``v0.14.5``) so the gate stays reproducible. A floating
          # ``pip install ruff`` here would silently pick up new minor
          # releases whose new rule codes (e.g. ``EXE001``, ``BLE001``,
          # ``DTZ011``, ``PLR1716``, ``UP006``/``UP007``) shift the
          # baseline and fail the pre-existing #2811-cleared scripts.
          pip install 'ruff==0.14.5'
          ruff check scripts/
