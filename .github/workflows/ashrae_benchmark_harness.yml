name: ASHRAE 140 Benchmark Harness

# Dedicated benchmark harness for tracking ASHRAE 140 pass/fail counts
# and per-target timing across PRs and main pushes.
#
# Complements ashrae_140_validation.yml (which checks correctness) by adding:
#   - Per-target wall-clock timing
#   - Structured JSON artifact uploaded for every run
#   - Delta comparison vs. the last main-branch baseline
#   - PR step summary showing "+N passes" / regression warnings
#
# Related issues: #722 (CI benchmark hardening), #669 (Phase E CI gate),
# #3450 (least-privilege: the workflow-level `contents: write` grant was
# removed — the only step that genuinely needs `contents: write`
# (`Update committed baseline`) is now an isolated `update-baseline` job
# whose permission escalation only fires under the existing main +
# workflow_dispatch + update_baseline=true gate, matching the docker.yml
# and pypi-release.yml escalation pattern).

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Save result as new main baseline (main branch only)'
        type: boolean
        default: false

concurrency:
  group: >-
    ashrae-benchmark-harness-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

# Least-privilege GITHUB_TOKEN default (Issues #2526, #3450).
#
# - `contents: read` is the workflow-wide floor. PR runs execute the
#   `scripts/ashrae_benchmark_harness.py` script plus any transitive
#   Python deps that ship on the PR branch — untrusted PR code — and
#   therefore must not be granted `contents: write` on the parent repo.
#   A PR that exfiltrates a contents-writable GITHUB_TOKEN can push
#   branches or tamper with unprotected refs as `github-actions[bot]`,
#   which would undermine branch protection as the canonical integrity
#   boundary for ASHRAE 140 evidence.
# - `issues: write` is escalated at the workflow level because every
#   PR run posts a delta comment via `github.rest.issues.createComment`
#   in `.github/workflows/scripts/post_pr_comment.js` (PRs are issues
#   in the REST API, so this is the narrowest scope the comment step
#   needs). No `pull-requests: write` is granted because we never call
#   `github.rest.pulls.*`; no `contents: write` because nothing in this
#   job pushes branches.
# - The baseline-commit logic — the only step in this workflow that
#   genuinely needs `contents: write` — is isolated into the
#   `update-baseline` job below. That job's job-level
#   `permissions: contents: write` block only takes effect under the
#   existing `main + workflow_dispatch + update_baseline=true` gate,
#   so PR runs and pushes that do not request a baseline update receive
#   only `contents: read`.
permissions:
  contents: read
  issues: write  # PR comments via github.rest.issues.createComment

env:
  BASELINE_PATH: benches/baseline/ashrae_benchmark_baseline.json
  RESULTS_FILE: ashrae_benchmark_results.json

jobs:
  benchmark-harness:
    name: ASHRAE 140 Benchmark Harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Workflow-level `contents: read` + `issues: write` (declared above) is
    # exactly the set this job needs: checkout the repo, build the harness,
    # upload the result artifact, post a PR delta comment. No `contents:
    # write` is granted here, so a PR exfiltrating the GITHUB_TOKEN cannot
    # push branches to the parent repo.

    steps:
      # -----------------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # -----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      # -----------------------------------------------------------------------
      - name: Install Rust (stable)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      # -----------------------------------------------------------------------
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-bench-harness-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-harness-
            ${{ runner.os }}-cargo-

      # -----------------------------------------------------------------------
      # Download the last main-branch baseline (if available) for comparison.
      # On PRs this lets us show "N more passes than main".
      - name: Download main baseline artifact
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7  # v24
        with:
          workflow: ashrae_benchmark_harness.yml
          branch: main
          name: ashrae-benchmark-baseline
          path: baseline_download/
          if_no_artifact_found: warn
          search_artifacts: true
        continue-on-error: true

      - name: Locate baseline JSON
        id: baseline
        run: |
          # Prefer downloaded main artifact; fall back to committed file
          if [ -f "baseline_download/ashrae_benchmark_baseline.json" ]; then
            echo "path=baseline_download/ashrae_benchmark_baseline.json" >> $GITHUB_OUTPUT
            echo "source=artifact" >> $GITHUB_OUTPUT
          elif [ -f "$BASELINE_PATH" ]; then
            echo "path=$BASELINE_PATH" >> $GITHUB_OUTPUT
            echo "source=committed" >> $GITHUB_OUTPUT
          else
            echo "path=" >> $GITHUB_OUTPUT
            echo "source=none" >> $GITHUB_OUTPUT
          fi
          echo "Baseline source: ${{ steps.baseline.outputs.source }}"

      # -----------------------------------------------------------------------
      - name: Run ASHRAE 140 Benchmark Harness
        id: harness
        run: |
          COMPARE_ARG=""
          if [ -n "${{ steps.baseline.outputs.path }}" ]; then
            COMPARE_ARG="--compare ${{ steps.baseline.outputs.path }}"
          fi

          python3 scripts/ashrae_benchmark_harness.py \
            $COMPARE_ARG \
            --output "$RESULTS_FILE" \
            --fail-on-regression \
            --timeout 300
        continue-on-error: true  # capture exit code without failing job immediately

      - name: Check harness exit code
        run: |
          EXIT_CODE=${{ steps.harness.outcome == 'failure' && '1' || '0' }}
          echo "Harness exit code: $EXIT_CODE"
          # Allow regression on non-main branches (warn only); fail on main
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$EXIT_CODE" = "1" ]; then
            echo "::error::ASHRAE 140 regression detected on main branch"
            exit 1
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "::warning::ASHRAE 140 regression vs. baseline (non-main branch — warn only)"
          fi

      # -----------------------------------------------------------------------
      # Upload the structured JSON result for this run as a persistent artifact.
      # Future PRs will download this as the baseline when targeting main.
      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ashrae-benchmark-${{ github.sha }}
          path: ${{ env.RESULTS_FILE }}
          retention-days: 90

      # Upload a stable "baseline" artifact for main-branch runs
      - name: Upload baseline artifact (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ashrae-benchmark-baseline
          path: ${{ env.RESULTS_FILE }}
          retention-days: 365
          overwrite: true

      # -----------------------------------------------------------------------
      # Baseline commit is intentionally NOT performed by this job.
      # Issue #3450: granting `contents: write` to the benchmark-harness job
      # gave every PR run a write-scoped GITHUB_TOKEN. That grant is now
      # isolated in the dedicated `update-baseline` job below, whose
      # `permissions: contents: write` block only fires under the existing
      # `main + workflow_dispatch + update_baseline=true` gate.

      # -----------------------------------------------------------------------
      - name: Post PR comment with delta (PRs only)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        continue-on-error: true
        with:
          script-path: .github/workflows/scripts/post_pr_comment.js
          env: |
            RESULTS_FILE: ${{ env.RESULTS_FILE }}

  # -----------------------------------------------------------------------
  # Issue #3450 — isolated baseline-commit job.
  #
  # This is the ONLY job in this workflow that receives `contents: write`.
  # It only runs under the strict triple gate
  #   (ref == refs/heads/main)
  #   && (event_name == workflow_dispatch)
  #   && (inputs.update_baseline == 'true')
  # which:
  #   1. Excludes every `pull_request` event (the threat vector — PR runs
  #      execute untrusted PR code with a workflow-scoped GITHUB_TOKEN).
  #   2. Excludes every `push` event (pushes to main are branch-protected
  #      merges that already passed review; they are not supposed to rewrite
  #      the benchmark baseline silently).
  #   3. Requires an explicit human opt-in via the workflow_dispatch input.
  # The job-level `permissions: contents: write` overrides the workflow-level
  # `contents: read` ONLY while this job runs — the benchmark-harness job
  # above continues to see only `contents: read` regardless of trigger.
  update-baseline:
    name: Update committed baseline (manual, main only)
    runs-on: ubuntu-latest
    needs: benchmark-harness
    timeout-minutes: 15
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.update_baseline == 'true'
    # Escalation: narrow `contents: write` for the `git push` baseline
    # commit. Mirrors the docker.yml build-platform pattern: workflow default
    # stays `contents: read`; the one job that genuinely writes escalates
    # itself at the job level and is gated by an event+input triple
    # condition above. No PR run, push run, or unflagged dispatch run
    # ever receives this scope.
    permissions:
      contents: write

    steps:
      # -----------------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # -----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      # -----------------------------------------------------------------------
      - name: Regenerate committed baseline
        run: |
          python3 scripts/ashrae_benchmark_harness.py \
            --output "$BASELINE_PATH" \
            --timeout 300

      # -----------------------------------------------------------------------
      # Commit and push the baseline JSON. Uses [skip ci] so the push does
      # not re-trigger this workflow.
      - name: Commit and push baseline
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BASELINE_PATH"
          git diff --staged --quiet || \
            git commit -m "chore(perf): update ASHRAE 140 benchmark baseline [skip ci]"
          git push
