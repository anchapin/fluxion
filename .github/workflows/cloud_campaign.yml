name: Cloud Campaign Runner

# Issue #2526: this workflow previously injected long-lived static AWS credentials
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN secrets) directly
# into the runner environment. It now assumes an IAM role via OIDC federation
# (short-lived STS tokens) using `aws-actions/configure-aws-credentials`. No static
# AWS secrets are referenced anywhere in the workflow.
#
# PREREQUISITE — the repository maintainer MUST configure (Settings → Secrets and
# variables → Actions → Variables, NOT Secrets):
#   * FLUXION_AWS_CAMPAIGN_ROLE_ARN — the IAM role ARN to assume. The role's trust
#     policy must allow `sts:AssumeRoleWithWebIdentity` for this repo's GitHub OIDC
#     provider, scoped to `ref:refs/heads/main` (and `environment:` if one is added).
#     See docs/SECURITY.md "GitHub Actions least-privilege" for the trust policy.
#   * AWS_REGION (optional, defaults to us-east-1 below)
# Until FLUXION_AWS_CAMPAIGN_ROLE_ARN is set, the configure-aws-credentials step
# fails fast with a clear message instead of silently using static keys.

# Issue #3449: every `workflow_dispatch` input reaches the shell only via
# `env:`-mapped variables consumed by `scripts/cloud_campaign_manager.py`.
# String interpolation of `${{ inputs.* }}` directly inside `run:` blocks is a
# shell-injection vector (Issue #3449); an attacker who can dispatch this
# workflow could otherwise chain a malicious value with the AWS credentials
# configured below. Allowed values are also restricted at the
# `cloud_campaign_manager.py` allowlist layer for defense in depth.

on:
  workflow_dispatch:
    inputs:
      campaign_type:
        description: 'Campaign type'
        required: true
        default: 'ashrae_sweep'
        type: choice
        options:
          - ashrae_sweep
          - monte_carlo
          - sensitivity_analysis
      case_id:
        description: 'ASHRAE 140 case ID (3-4 digit number, e.g. 600, 800, 900, 1200)'
        required: true
        default: '600'
        type: string
      params:
        description: 'Comma-separated parameter names to sweep (identifiers only: [A-Za-z_][A-Za-z0-9_]*)'
        required: false
        default: 'R_value,wall_thickness'
        type: string
      sweep_type:
        description: 'Sweep type'
        required: true
        default: 'random'
        type: choice
        options:
          - random
          - grid
          - latin_hypercube
      samples:
        description: 'Number of samples (positive integer)'
        required: false
        default: '50'
        type: string
      s3_bucket:
        description: 'S3 bucket for campaign data (DNS-compliant name)'
        required: true
        type: string
      s3_prefix:
        description: 'S3 prefix (no leading slash, no shell metacharacters)'
        required: false
        default: 'fluxion-campaigns'
        type: string
      sns_topic:
        description: 'SNS topic ARN for notifications (arn:aws:sns:...)'
        required: false
        type: string

# Least-privilege GITHUB_TOKEN default (Issue #2526). Each job that talks to AWS
# escalates to id-token: write (required to mint the OIDC token) via its own
# job-level permissions block.

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  create-campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC federation → STS role assumption
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3

      - name: Configure AWS credentials via OIDC (no static secrets)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ vars.FLUXION_AWS_CAMPAIGN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Issue #3449: dispatch inputs reach the Python script ONLY via env vars;
      # no `${{ inputs.* }}` interpolation remains inside the `run:` block.
      # `--action` is hardcoded by the workflow; only the user-controlled
      # inputs are env-mapped.
      - name: Create campaign
        env:
          FLUXION_CAMPAIGN_CASE: ${{ inputs.case_id }}
          FLUXION_CAMPAIGN_PARAMS: ${{ inputs.params }}
          FLUXION_CAMPAIGN_SWEEP_TYPE: ${{ inputs.sweep_type }}
          FLUXION_CAMPAIGN_SAMPLES: ${{ inputs.samples }}
          FLUXION_S3_BUCKET: ${{ inputs.s3_bucket }}
          FLUXION_S3_PREFIX: ${{ inputs.s3_prefix }}
          FLUXION_SNS_TOPIC_ARN: ${{ inputs.sns_topic }}
        run: |
          python scripts/cloud_campaign_manager.py --action create

  wait-for-completion:
    needs: create-campaign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC federation → STS role assumption
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3

      - name: Configure AWS credentials via OIDC (no static secrets)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ vars.FLUXION_AWS_CAMPAIGN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Issue #3449: campaign_id comes from a job output (trusted) and S3
      # coordinates reach the script ONLY through env vars.
      - name: Wait for campaign
        env:
          FLUXION_CAMPAIGN_CAMPAIGN_ID: ${{ needs.create-campaign.outputs.campaign_id }}
          FLUXION_S3_BUCKET: ${{ inputs.s3_bucket }}
          FLUXION_S3_PREFIX: ${{ inputs.s3_prefix }}
        run: |
          python scripts/cloud_campaign_manager.py --action wait

  aggregate-results:
    needs: wait-for-completion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC federation → STS role assumption
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3

      - name: Configure AWS credentials via OIDC (no static secrets)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ vars.FLUXION_AWS_CAMPAIGN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Issue #3449: the only `${{ ... }}` interpolation left is the trusted
      # job-output `campaign_id`; S3 coordinates are env-mapped. No `inputs.*`
      # reaches the shell. `--output-format` is a workflow-controlled literal,
      # so passing it on the command line is safe (no `${{ }}` interpolation).
      - name: Aggregate results
        env:
          FLUXION_CAMPAIGN_CAMPAIGN_ID: ${{ needs.create-campaign.outputs.campaign_id }}
          FLUXION_S3_BUCKET: ${{ inputs.s3_bucket }}
          FLUXION_S3_PREFIX: ${{ inputs.s3_prefix }}
        run: |
          python scripts/s3_aggregator.py --output-format both
