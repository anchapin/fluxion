name: HVAC BESTEST Validation
# ASHRAE RP-865 HVAC BESTEST validation suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly validation at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: hvac-bestest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run HVAC BESTEST scaffold
        run: cargo test --test hvac_bestest

      - name: Run HVAC BESTEST Validation Tests
        id: validation
        run: |
          cargo test --test hvac_bestest_validation --release -- --nocapture 2>&1 | tee validation_output.txt
          TEST_EXIT=$?
          echo "test_exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
          exit 0  # Always continue to generate report
        continue-on-error: true

      - name: Extract Validation Results
        id: extract
        run: |
          python3 << 'EOF'
          import re
          import json

          with open('validation_output.txt', 'r') as f:
              output = f.read()

          # Extract case results
          cases = {}
          case_pattern = r"Case (\d+):.*?Annual Energy: ([\d.]+) kWh.*?Peak Demand: ([\d.]+) W.*?Energy Error: ([-\d.]+)%"
          for match in re.finditer(case_pattern, output, re.DOTALL):
              case_id, energy, demand, error = match.groups()
              cases[case_id] = {
                  'annual_energy_kwh': float(energy),
                  'peak_demand_w': float(demand),
                  'energy_error_percent': float(error),
              }

          # Extract summary
          summary_pattern = r"Passed: (\d+).*?Failed: (\d+).*?Mean Error: ([\d.]+)%"
          summary_match = re.search(summary_pattern, output, re.DOTALL)

          summary = {}
          if summary_match:
              passed, failed, mean_error = summary_match.groups()
              summary = {
                  'passed': int(passed),
                  'failed': int(failed),
                  'mean_error': float(mean_error)
              }

          with open('validation_results.json', 'w') as f:
              json.dump({'cases': cases, 'summary': summary}, f, indent=2)

          print(f"::notice::HVAC BESTEST Validation Summary")
          if summary:
              print(f"Passed: {summary['passed']}")
              print(f"Failed: {summary['failed']}")
              print(f"Mean Error: {summary['mean_error']:.2f}%")
          EOF

      - name: Generate Markdown Report
        run: |
          python3 << 'EOF'
          import json

          with open('validation_results.json', 'r') as f:
              data = json.load(f)

          cases = data.get('cases', {})
          summary = data.get('summary', {})

          report_lines = [
              "# HVAC BESTEST Validation Report",
              "",
              "## Summary",
              f"- **Cases Passed**: {summary.get('passed', 0)}",
              f"- **Cases Failed**: {summary.get('failed', 0)}",
              f"- **Mean Error**: {summary.get('mean_error', 0):.2f}%",
              "",
              "## Case Results",
              "",
              "| Case | Equipment | Annual Energy (kWh) | Peak Demand (W) | Energy Error (%) |",
              "|------|-----------|---------------------|------------------|------------------|",
          ]

          case_names = {
              '600': 'Chiller',
              '610': 'Boiler',
              '620': 'Heat Pump',
              '630': 'VAV System',
              '640': 'CAV System',
          }

          for case_id in sorted(cases.keys()):
              case = cases[case_id]
              name = case_names.get(case_id, 'Unknown')
              report_lines.append(
                  f"| {case_id} | {name} | {case['annual_energy_kwh']:.1f} | "
                  f"{case['peak_demand_w']:.0f} | {case['energy_error_percent']:.1f}% |"
              )

          report_lines.extend([
              "",
              "## ASHRAE RP-865 Reference",
              "- Case 600: Chiller part-load performance",
              "- Case 610: Boiler part-load performance",
              "- Case 620: Heat pump performance",
              "- Case 630: VAV system performance",
              "- Case 640: CAV system performance",
              "",
              "---",
              "Generated by HVAC BESTEST CI Validation",
          ])

          with open('HVAC_BESTEST_VALIDATION_REPORT.md', 'w') as f:
              f.write('\n'.join(report_lines))
          EOF

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvac-bestest-results
          path: |
            validation_output.txt
            validation_results.json
            HVAC_BESTEST_VALIDATION_REPORT.md
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import subprocess

          with open('HVAC_BESTEST_VALIDATION_REPORT.md', 'r') as f:
              report = f.read()

          result = subprocess.run(
              ['gh', 'pr', 'comment', '--body', report],
              capture_output=True,
              text=True
          )
          print("PR comment result:", result.returncode)
          if result.returncode != 0:
              print("stdout:", result.stdout)
              print("stderr:", result.stderr)
          EOF
        continue-on-error: true
