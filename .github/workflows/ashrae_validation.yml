# ============================================================================
# ASHRAE 140 CI Gate (Issue #1351 — cross-workflow determinism listener)
# ============================================================================
#
# This workflow is the canonical validation gate for PRs to main. It owns:
#   * (removed Issue #4018) the in-workflow determinism matrix — now
#     owned by the standalone `Cross-Platform Determinism CI` workflow,
#   * the ASHRAE 140 blind validation (`validate`),
#   * the module-isolation tests for Weather / Solar / Conduction /
#     Ventilation / Zone Balance.
#
# ----------------------------------------------------------------------------
# Issue #1505 — Tiered runner fallback (Option A)
# ----------------------------------------------------------------------------
# Self-hosted runner capacity (`ubuntu-latest-4-cores` via
# `vars.FLUXION_LINUX_RUNNER`) undersizes PR throughput: every PR used
# to queue 30-90 minutes waiting for the self-hosted pool, which made
# the merge-state stuck in `UNKNOWN` for the entire PR lifetime. This
# workflow implements a three-tier fallback strategy:
#
#   Tier 1 (DEFAULT / happy path)
#     Deterministic sub-jobs and benchmark jobs all run on standard
#     GitHub-hosted runners (ubuntu-latest / windows-latest /
#     macos-latest). Fast and always-available. This is the state the
#     repository is in when `vars.FLUXION_LINUX_RUNNER` is unset.
#
#   Tier 2 (BENCHMARK ONLY, when self-hosted is configured)
#     When `vars.FLUXION_LINUX_RUNNER` is set (e.g., "fluxion-ci"),
#     only the benchmark job (`validate`, the ASHRAE 140 blind
#     validation) routes to self-hosted runners via
#     `${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}`. The `||`
#     clause makes the GitHub-hosted fallback automatic. Deterministic
#     sub-jobs deliberately stay on GitHub-hosted because they are
#     already fast and reproducible there.
#
#   Tier 3 (10-MIN QUEUE-STALL FALLBACK)
#     `queue-stall-detector` runs first and sleeps 10 minutes when
#     self-hosted routing is active. If a primary self-hosted path
#     stalls beyond the window, `validate-fallback` re-runs the
#     ASHRAE 140 blind validation on `ubuntu-latest` so the gate does
#     not block PRs. The fallback infrastructure is dormant when
#     self-hosted is not configured, so the happy path wall-time is
#     unchanged.
#
# Cross-workflow gate (Issue #1351) is updated for #1505 to tolerate
# `skipped` upstream conclusions (which happen when benchmark
# sub-jobs queue-stall past the 10-minute window) while continuing to
# pass through `failure` / `cancelled` / `timed_out` signals.
#
# See https://github.com/anchapin/fluxion/issues/1505 for full context,
# acceptance criteria, and the rejected Option B / Option C trade-offs.
#
# PR gate wiring (Issue #1351, closes #1297 acceptance gap)
# --------------------------------------------------------
# GitHub branch protection requires a single canonical "Required status
# check" name. The standalone `Cross-Platform Determinism CI` workflow
# (`determinism_check.yml`) runs the 3-OS determinism matrix. To give
# branch protection a single, stable, non-matrix check name, this
# workflow exposes a `workflow_run` listener job (`fluxion-determinism-gate`)
# that fires after `Cross-Platform Determinism CI` completes for the same
# SHA and fails the build if the upstream concluded `failure` or
# `cancelled`. Add that job name to the branch-protection required list
# (also recorded in `release_gates.yaml::ci.required_checks`).
#
# The former in-workflow `determinism-check` + `compare-hashes` jobs were
# removed (Issue #4018 follow-up): they duplicated the standalone
# workflow's 3-OS matrix (~42 job-min per PR) while claiming to be a
# "fast first line of defence" — they were the same 10–16m builds, not
# fast. The standalone workflow is now the source of truth; the listener
# job is the durable cross-workflow mirror that branch protection names.

name: ASHRAE 140 CI Gate

on:
  # Issue #3355: include `develop` so the inline `surrogate-ashrae-mae-gate`
  # (Issue #2924) fires for PRs targeting `develop`. The workflow_run
  # listener jobs (`fluxion-determinism-gate`, `fluxion-performance-gate`)
  # activate independently for develop PRs as soon as their upstream
  # workflows (`determinism_check.yml`, `performance_dashboard.yml`) run
  # for develop — both upstreams were also expanded to `[main, develop]`
  # in this commit.
  # Issue #4018: PRs phase-gated behind CI Gates (see workflow_run below).
  # Docs-only skip preserved via docs-only-gate check job.
  # Issue #1351: mirror the Cross-Platform Determinism CI conclusion
  # into this workflow as a single non-matrix "Fluxion Determinism Gate"
  # check that branch protection can reference. The listener only fires
  # for the same SHA on the same branch, so spurious upstream runs on
  # unrelated branches are ignored.
  # Issue #3372: also mirror the Performance Dashboard conclusion into
  # the "Fluxion Performance Gate (Issue #1618)" check. Without this,
  # the `fluxion-performance-gate` listener is dead code — its `if:`
  # filter is correct but the `workflow_run` event is never delivered.
  # Each listener scopes itself by `name` so the two coexist cleanly.
  workflow_run:
    workflows:
    - "CI Gates"
    - "Cross-Platform Determinism CI"
    - "Performance Dashboard"
    types: [completed]

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Issue #1505: informational. Defaults to "github-hosted", which
  # leaves the fallback machinery dormant. Set to
  # "self-hosted-with-fallback" alongside `vars.FLUXION_LINUX_RUNNER`
  # to activate the 10-min queue-stall detector and
  # `validate-fallback` job. Keeping the default as the github-hosted
  # tier guarantees the existing happy-path wall-time is unaffected
  # by this change.
  RUNNER_TIER: github-hosted

# Least-privilege GITHUB_TOKEN default (Issue #2526). The validate-* jobs that
# post PR comments or commit regression notices escalate via their own job-level
# permissions blocks; everything else is read-only.
permissions:
  contents: read

jobs:
  # Issue #4018: phase-gate precheck. Heavy jobs run only when triggered
  # by CI Gates succeeding for a PR (not by Determinism/Performance
  # listener events). Docs-only skip via docs-only-gate.
  precheck:
    name: Phase-gate precheck
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
    steps:
      - id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # Only CI Gates triggers heavy jobs; Determinism/Performance
            # events are for the listener jobs only.
            if [ "$UPSTREAM_NAME" != "CI Gates" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              echo "Upstream is $UPSTREAM_NAME (not CI Gates); heavy jobs skip"
              exit 0
            fi
            if [ "$UPSTREAM_EVENT" != "pull_request" ] || [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "upstream_ok=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docs-only-gate
        id: docs
        if: steps.upstream.outputs.upstream_ok == 'true' && github.event_name == 'workflow_run'
      - id: final
        run: |
          if [ "${{ steps.upstream.outputs.upstream_ok }}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ steps.docs.outputs.docs_only }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
  # =====================================================================
  # Issue #1505 — Queue-stall detector (10-min wait)
  # =====================================================================
  # Runs first so the *-fallback jobs (below) have a chance to fire
  # within the same workflow run if a self-hosted runner stalls
  # beyond the 10-minute window. When `vars.FLUXION_LINUX_RUNNER`
  # is unset (the default), the detector is a no-op (no `sleep`) so
  # this does not add any wall-time to existing PR runs.
  #
  # The detector itself is advisory and always succeeds; its only
  # side-effect is to publish `enable_fallback` so the `validate-fallback`
  # job's `if:` can read it.
  # =====================================================================
  queue-stall-detector:
    name: "Queue-Stall Detector (10 min, Issue #1505)"
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      enable_fallback: ${{ steps.detect.outputs.enable_fallback }}
    steps:
      - name: Wait 10 minutes for self-hosted runner claim (no-op when github-hosted)
        id: detect
        env:
          FLUXION_LINUX_RUNNER: ${{ vars.FLUXION_LINUX_RUNNER }}
        run: |
          set -euo pipefail
          echo "Issue #1505 queue-stall detector"
          echo "FLUXION_LINUX_RUNNER='${FLUXION_LINUX_RUNNER:-<unset>}'"
          if [ -n "${FLUXION_LINUX_RUNNER:-}" ]; then
            echo "Self-hosted routing active (FLUXION_LINUX_RUNNER=${FLUXION_LINUX_RUNNER})."
            echo "Waiting 10 minutes for self-hosted runners to claim primary benchmark jobs before"
            echo "the validate-fallback job on ubuntu-latest is allowed to start."
            sleep 600
            echo "::notice::10-min queue-stall window elapsed. validate-fallback is now eligible to start if the primary benchmark job has not reported success."
          else
            echo "FLUXION_LINUX_RUNNER unset. Default tier (github-hosted) is in effect; bypassing the 10-min wait so happy-path wall-time is unchanged."
          fi
          echo "enable_fallback=true" >> "$GITHUB_OUTPUT"

  # Issue #1297: Cross-platform FP determinism check - runs first as a gate
  validate:
    name: ASHRAE 140 Blind Validation
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    # Issue #1505: benchmark jobs (the actual ASHRAE 140 simulation
    # suite) prefer self-hosted runners when `vars.FLUXION_LINUX_RUNNER`
    # is set. Issue #3445: persistent self-hosted runners MUST NOT
    # execute PR-controlled code — CI is the enforcement layer for the
    # ASHRAE 140 gate, so a runner compromise here poisons the gate's
    # own evidence. Force ephemeral GH-hosted `ubuntu-latest` on any
    # `pull_request` event; only main-merge pushes honour the routing
    # variable. Do NOT simplify back to
    # `vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest'` — see SECURITY.md
    # §"Self-hosted runner job execution policy".
    runs-on: >-
      ${{
        github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && vars.FLUXION_LINUX_RUNNER
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60
    # Issue #1351: the explicit `needs: compare-hashes` makes the
    # ASHRAE 140 validate job block on cross-platform determinism
    # (compare-hashes itself needs determinism-check, so this is a
    # transitive gate on the entire determinism matrix). The new
    # `fluxion-determinism-gate` workflow_run listener is the canonical
    # non-matrix check that branch protection references.
    # Issue #4018: in-workflow determinism-check/compare-hashes removed;
    # determinism signal now comes from the standalone
    # Cross-Platform Determinism CI workflow via the
    # fluxion-determinism-gate listener (required check).
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run ASHRAE 140 Validation Tests
        id: validation
        run: |
          cargo test --test all_tests ashrae_140_validation:: --release -- --nocapture 2>&1 | tee validation_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Extract Validation Results
        if: always()
        run: |
          python3 << 'PYEOF'
          import re
          import json

          with open('validation_output.txt', 'r') as f:
              output = f.read()

          pass_rate = None
          passed = None
          failed = None
          mae = None

          rate_pattern = r"Pass Rate:\s*([0-9.]+|inf)%"
          rate_match = re.search(rate_pattern, output)
          if rate_match:
              rate_str = rate_match.group(1).strip()
              pass_rate = float('inf') if rate_str == 'inf' else float(rate_str)

          passed_pattern = r"Passed:\s*([0-9]+)"
          passed_match = re.search(passed_pattern, output)
          if passed_match:
              passed = int(passed_match.group(1))

          failed_pattern = r"Failed:\s*([0-9]+)"
          failed_match = re.search(failed_pattern, output)
          if failed_match:
              failed = int(failed_match.group(1))

          mae_pattern = r"Mean Absolute Error:\s*([0-9.]+|inf)%?"
          mae_match = re.search(mae_pattern, output)
          if mae_match:
              mae_str = mae_match.group(1).strip()
              mae = float('inf') if mae_str == 'inf' else float(mae_str)

          results = {
              'pass_rate': pass_rate,
              'passed': passed,
              'failed': failed,
              'mae': mae
          }

          with open('validation_summary.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"Pass Rate: {pass_rate}%")
          print(f"Passed: {passed}")
          print(f"Failed: {failed}")
          print(f"MAE: {mae}%")
          PYEOF

      - name: Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess
          import os

          with open('validation_summary.json', 'r') as f:
              summary = json.load(f)

          pass_rate = summary.get('pass_rate', 0) or 0
          passed = summary.get('passed', 0) or 0
          failed = summary.get('failed', 0) or 0
          mae = summary.get('mae', 0) or 0

          if pass_rate >= 80:
              status_emoji = "PASS"
              status_text = "PASSED"
              status_detail = "All ASHRAE 140 test cases are within acceptable tolerance. CI gate passed."
          else:
              status_emoji = "FAIL"
              status_text = "FAILED"
              status_detail = "Blind validation pass rate is below 80%. Please review failed cases before merging."

          lines = [
              "## ASHRAE 140 CI Gate Results [" + status_emoji + "]",
              "",
              "### Validation Summary",
              "",
              "- **Pass Rate**: " + str(pass_rate) + "% (threshold: 80%)",
              "- **Cases Passed**: " + str(passed),
              "- **Cases Failed**: " + str(failed),
              "- **Mean Absolute Error**: " + str(mae) + "%",
              "",
              "### Status: " + status_text,
              "",
              status_detail,
              "",
              "---",
              "*This is an automated comment from the ASHRAE 140 CI Gate workflow.*"
          ]

          with open('pr_comment.md', 'w') as f:
              f.write('\n'.join(lines))

          pr_number = os.getenv('PR_NUMBER')
          if pr_number:
              subprocess.run(
                  ['gh', 'pr', 'comment', pr_number, '--body-file', 'pr_comment.md'],
                  check=False
              )
          else:
              print("Warning: PR_NUMBER not found in environment")
          PYEOF

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ashrae-validation-results-${{ github.run_id }}
          path: |
            validation_output.txt
            validation_summary.json
            pr_comment.md
          retention-days: 30

      # Issue #2978 — capture the regenerated validation docs as a workflow
      # artifact instead of leaving them dirty in the worktree. We chose
      # path (b) (artifact-only) over path (a) (auto-commit + push a
      # `[skip ci]` commit on every run) because path (a) pollutes the PR
      # branch history with a docs-only commit per CI invocation and would
      # also re-trigger the same `validate` job recursively when the
      # committed contents change. The committed snapshots of these two
      # files remain the static reference baseline; a separate release-time
      # PR updates them. See issue #2978 for the full acceptance criteria.
      - name: Upload regenerated validation docs (Issue #2978)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ashrae140-results
          path: |
            docs/ASHRAE140_RESULTS.md
            docs/QUALITY_METRICS.md
          retention-days: 30
          if-no-files-found: ignore

      # Issue #2978 — restore the committed baseline snapshots of the two
      # docs files the validation test regenerates. Without this step, the
      # worktree remains dirty (the regenerated content differs from the
      # source-branch tip the PR was based on) and any sub-agent that runs
      # `git status` in a worktree branched off this SHA during the 5-min
      # CI poll interval would see them as "modified but not committed"
      # (PRs #2975 and #2977 cleanup reports hit this). Combined with the
      # upload step above, downstream consumers can download the live
      # regenerated report from the artifact without the worktree state
      # being polluted.
      - name: Restore committed baseline docs (Issue #2978)
        if: always()
        run: |
          git checkout HEAD -- docs/ASHRAE140_RESULTS.md docs/QUALITY_METRICS.md

      - name: CI Gate Check
        id: gate
        # Issue #3763 audit (known-red validation site): the 80% pass-rate
        # gate is expected-red until the §LIMIT-* cohort in
        # docs/KNOWN_ISSUES.md closes (GaugeSolver routing #1465/#1462/#3297),
        # so on pull_request events this is advisory only. It is NOT
        # best-effort: the "Fail if validation gate failed (non-PR)" step
        # below re-raises steps.gate.outcome == 'failure' on push/schedule
        # events.
        continue-on-error: true
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import sys

          with open('validation_summary.json', 'r') as f:
              summary = json.load(f)

          pass_rate = summary.get('pass_rate', 0) or 0
          failed = summary.get('failed', 0) or 0

          print(f"CI Gate Check: Pass rate = {pass_rate}%, Failed = {failed}")

          if pass_rate < 80:
              print(f"::error::CI gate failed: pass rate {pass_rate:.1f}% is below 80% threshold")
              print(f"::error::{failed} case(s) failed ASHRAE 140 blind validation")
              sys.exit(1)
          else:
              print(f"::notice::CI gate passed: {pass_rate:.1f}% pass rate")
              sys.exit(0)
          PYEOF

      - name: Add PR Review Request
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f validation_summary.json ]; then
            PASS_RATE=$(python3 -c "import json; print(json.load(open('validation_summary.json')).get('pass_rate', 0))")
            if (( $(echo "$PASS_RATE < 80" | bc -l) )); then
              echo "::warning::ASHRAE 140 validation below 80% threshold - PR review required"
            fi
          fi

      - name: Fail if validation gate failed (non-PR)
        if: steps.gate.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "❌ ASHRAE 140 CI gate failed on ${{ github.event_name }}"
          exit 1

  # =====================================================================
  # Issue #1505 — `validate-fallback` (10-min queue-stall fallback)
  # =====================================================================
  # Fires ONLY when:
  #   * `queue-stall-detector` ran (i.e. the 10-min window elapsed),
  #     AND
  #   * the primary `validate` benchmark job did NOT report `success`
  #     (i.e. it failed, was cancelled, or was skipped because the
  #     self-hosted runner never claimed it).
  #
  # In that case, `validate-fallback` re-runs the same ASHRAE 140
  # blind validation on a GitHub-hosted `ubuntu-latest` runner so the
  # PR does not block on the gate for the entire queue-stall window.
  # When `vars.FLUXION_LINUX_RUNNER` is unset, the detector is a
  # no-op, primary `validate` runs on GitHub-hosted directly, and
  # this fallback job is dormant — preserving the happy path.
  # =====================================================================
  validate-fallback:
    name: "ASHRAE 140 Validation (10-min Fallback, Issue #1505)"
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    needs: [queue-stall-detector, validate]
    if: |
      needs.queue-stall-detector.outputs.enable_fallback == 'true' &&
      # Issue #4018: compare-hashes removed; determinism enforced via listener.

      (needs.validate.result == 'failure' || needs.validate.result == 'cancelled' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fallback-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fallback-
            ${{ runner.os }}-cargo-

      - name: Run ASHRAE 140 Validation Tests (fallback path)
        run: |
          set -euo pipefail
          echo "::notice::Issue #1505 fallback: re-running ASHRAE 140 blind validation on GitHub-hosted ubuntu-latest after a 10-min self-hosted queue stall."
          echo "Primary validate result was: ${{ needs.validate.result }}"
          cargo test --test all_tests ashrae_140_validation:: --release -- --nocapture 2>&1 | tee validation_fallback_output.txt

  # Module isolation tests - each module must match EnergyPlus within 1% tolerance.
  # Issue #1351: every isolation job now explicitly `needs: compare-hashes` so the
  # whole gate (not just the ASHRAE 140 validate job) blocks on cross-platform
  # determinism. Without this, a determinism regression would surface only via
  # the `validate` job, and the isolation jobs could still report PASS.
  isolation-weather:
    name: Weather Isolation
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Issue #4018: in-workflow determinism-check/compare-hashes removed;
    # determinism signal now comes from the standalone
    # Cross-Platform Determinism CI workflow via the
    # fluxion-determinism-gate listener (required check).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Weather Isolation Tests
        run: "cargo test --test all_tests weather_isolation:: --release"

  isolation-solar:
