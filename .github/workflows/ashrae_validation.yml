name: ASHRAE 140 CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ashrae-ci-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Issue #1297: Cross-platform FP determinism check - runs first as a gate
  determinism-check:
    name: Determinism Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config nasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-determinism-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-determinism-cargo-

      - name: Build fluxion
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Toolchain diagnostic ==="
          echo "rustc: $(rustc --version 2>&1)"
          echo "cargo: $(cargo --version 2>&1)"
          echo "cc: $(cc --version 2>&1 | head -1 || echo 'cc not found')"
          echo "================================"
          cargo build --release --features wiring-tracing 2>&1 | tee build_output.txt

      - name: Run Case 900 Determinism Test
        id: case900
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test case_900_determinism --release -- --nocapture 2>&1 | tee case900_output.txt

      - name: Extract determinism values
        id: extract
        shell: bash
        run: |
          python3 << 'PYEOF'
          import re
          import json
          import hashlib

          with open('case900_output.txt', 'r') as f:
              output = f.read()

          values = {}

          match = re.search(r'DETERMINISM_VALUES\|([\d.]+)\|([\d.]+)\|([\d.]+)\|([\d.]+)', output)
          if match:
              values['annual_heating_mwh'] = float(match.group(1))
              values['annual_cooling_mwh'] = float(match.group(2))
              values['peak_heating_kw'] = float(match.group(3))
              values['peak_cooling_kw'] = float(match.group(4))

          ff_match = re.search(r'DETERMINISM_FF_VALUES\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)\|([\d.-]+)', output)
          if ff_match:
              values['ff_min_temp'] = float(ff_match.group(1))
              values['ff_max_temp'] = float(ff_match.group(2))
              values['ff_avg_temp'] = float(ff_match.group(3))
              values['ff_temp_swing'] = float(ff_match.group(4))

          hash_input = json.dumps(values, sort_keys=True)
          hash_hex = hashlib.sha256(hash_input.encode()).hexdigest()

          with open('output_values.json', 'w') as f:
              json.dump(values, f, indent=2)
          with open('output_hash.txt', 'w') as f:
              f.write(hash_hex + '\n')
              f.write(hash_input + '\n')

          print(f"Hash: {hash_hex}")
          print(f"Values: {json.dumps(values, indent=2)}")
          PYEOF

          echo "output_hash=$(head -1 output_hash.txt)" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.os }}" >> $GITHUB_OUTPUT

      - name: Upload Case 900 output
        uses: actions/upload-artifact@v4
        with:
          name: case900-output-${{ matrix.os }}
          path: |
            case900_output.txt
            output_values.json
            output_hash.txt
          retention-days: 7

  # Compare hashes across platforms - must pass before validation runs
  compare-hashes:
    name: Compare Hashes
    needs: determinism-check
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compare hashes across platforms
        run: |
          python3 << 'EOF'
          import os
          import json
          import sys

          artifacts_dir = 'artifacts'
          hashes = {}
          all_values = {}

          # Read hashes and values from all platforms
          for os_name in ['ubuntu-latest', 'windows-latest', 'macos-latest']:
              hash_file = os.path.join(artifacts_dir, f'case900-output-{os_name}', 'output_hash.txt')
              values_file = os.path.join(artifacts_dir, f'case900-output-{os_name}', 'output_values.json')

              if os.path.exists(hash_file):
                  with open(hash_file, 'r') as f:
                      lines = f.readlines()
                      if lines:
                          hashes[os_name] = lines[0].strip()

              if os.path.exists(values_file):
                  with open(values_file, 'r') as f:
                      all_values[os_name] = json.load(f)

          print("=" * 60)
          print("Cross-Platform Determinism Check Results")
          print("=" * 60)
          print()

          print("Hashes from each platform:")
          for os_name, h in hashes.items():
              print(f"  {os_name}: {h}")
          print()

          print("Values from each platform:")
          for os_name, vals in all_values.items():
              print(f"  {os_name}:")
              for k, v in vals.items():
                  print(f"    {k}: {v}")
          print()

          # Check if all hashes are identical
          unique_hashes = set(hashes.values())

          if len(unique_hashes) == 1:
              print("✅ SUCCESS: All platforms produce identical outputs")
              print(f"Universal hash: {list(unique_hashes)[0]}")
              status = "PASS"
          else:
              print("❌ FAILURE: Hashes differ across platforms!")
              print(f"Unique hashes ({len(unique_hashes)}): {unique_hashes}")
              status = "FAIL"
              # Detailed comparison
              print()
              print("Detailed comparison:")
              for os_name, vals in all_values.items():
                  print(f"  {os_name}:")
                  for k, v in vals.items():
                      print(f"    {k}: {v}")
              sys.exit(1)

          # Write result files
          result = {
              'status': status,
              'all_identical': status == "PASS",
              'hash': list(unique_hashes)[0] if status == "PASS" else None,
              'platforms': list(hashes.keys()),
              'values': all_values
          }
          with open('comparison_result.json', 'w') as f:
              json.dump(result, f, indent=2)
          EOF

      - name: Upload comparison result
        uses: actions/upload-artifact@v4
        with:
          name: determinism-comparison
          path: comparison_result.json
          retention-days: 30

  validate:
    name: ASHRAE 140 Blind Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: compare-hashes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run ASHRAE 140 Validation Tests
        id: validation
        run: |
          cargo test --test ashrae_140_validation --release -- --nocapture 2>&1 | tee validation_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Extract Validation Results
        if: always()
        run: |
          python3 << 'PYEOF'
          import re
          import json

          with open('validation_output.txt', 'r') as f:
              output = f.read()

          pass_rate = None
          passed = None
          failed = None
          mae = None

          rate_pattern = r"Pass Rate:\s*([0-9.]+|inf)%"
          rate_match = re.search(rate_pattern, output)
          if rate_match:
              rate_str = rate_match.group(1).strip()
              pass_rate = float('inf') if rate_str == 'inf' else float(rate_str)

          passed_pattern = r"Passed:\s*([0-9]+)"
          passed_match = re.search(passed_pattern, output)
          if passed_match:
              passed = int(passed_match.group(1))

          failed_pattern = r"Failed:\s*([0-9]+)"
          failed_match = re.search(failed_pattern, output)
          if failed_match:
              failed = int(failed_match.group(1))

          mae_pattern = r"Mean Absolute Error:\s*([0-9.]+|inf)%?"
          mae_match = re.search(mae_pattern, output)
          if mae_match:
              mae_str = mae_match.group(1).strip()
              mae = float('inf') if mae_str == 'inf' else float(mae_str)

          results = {
              'pass_rate': pass_rate,
              'passed': passed,
              'failed': failed,
              'mae': mae
          }

          with open('validation_summary.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"Pass Rate: {pass_rate}%")
          print(f"Passed: {passed}")
          print(f"Failed: {failed}")
          print(f"MAE: {mae}%")
          PYEOF

      - name: Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess
          import os

          with open('validation_summary.json', 'r') as f:
              summary = json.load(f)

          pass_rate = summary.get('pass_rate', 0) or 0
          passed = summary.get('passed', 0) or 0
          failed = summary.get('failed', 0) or 0
          mae = summary.get('mae', 0) or 0

          if pass_rate >= 80:
              status_emoji = "PASS"
              status_text = "PASSED"
              status_detail = "All ASHRAE 140 test cases are within acceptable tolerance. CI gate passed."
          else:
              status_emoji = "FAIL"
              status_text = "FAILED"
              status_detail = "Blind validation pass rate is below 80%. Please review failed cases before merging."

          lines = [
              "## ASHRAE 140 CI Gate Results [" + status_emoji + "]",
              "",
              "### Validation Summary",
              "",
              "- **Pass Rate**: " + str(pass_rate) + "% (threshold: 80%)",
              "- **Cases Passed**: " + str(passed),
              "- **Cases Failed**: " + str(failed),
              "- **Mean Absolute Error**: " + str(mae) + "%",
              "",
              "### Status: " + status_text,
              "",
              status_detail,
              "",
              "---",
              "*This is an automated comment from the ASHRAE 140 CI Gate workflow.*"
          ]

          with open('pr_comment.md', 'w') as f:
              f.write('\n'.join(lines))

          pr_number = os.getenv('PR_NUMBER')
          if pr_number:
              subprocess.run(
                  ['gh', 'pr', 'comment', pr_number, '--body-file', 'pr_comment.md'],
                  check=False
              )
          else:
              print("Warning: PR_NUMBER not found in environment")
          PYEOF

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashrae-validation-results-${{ github.run_id }}
          path: |
            validation_output.txt
            validation_summary.json
            pr_comment.md
          retention-days: 30

      - name: CI Gate Check
        id: gate
        continue-on-error: true  # advisory on PRs; hard gate on push/schedule
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import sys

          with open('validation_summary.json', 'r') as f:
              summary = json.load(f)

          pass_rate = summary.get('pass_rate', 0) or 0
          failed = summary.get('failed', 0) or 0

          print(f"CI Gate Check: Pass rate = {pass_rate}%, Failed = {failed}")

          if pass_rate < 80:
              print(f"::error::CI gate failed: pass rate {pass_rate:.1f}% is below 80% threshold")
              print(f"::error::{failed} case(s) failed ASHRAE 140 blind validation")
              sys.exit(1)
          else:
              print(f"::notice::CI gate passed: {pass_rate:.1f}% pass rate")
              sys.exit(0)
          PYEOF

      - name: Add PR Review Request
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f validation_summary.json ]; then
            PASS_RATE=$(python3 -c "import json; print(json.load(open('validation_summary.json')).get('pass_rate', 0))")
            if (( $(echo "$PASS_RATE < 80" | bc -l) )); then
              echo "::warning::ASHRAE 140 validation below 80% threshold - PR review required"
            fi
          fi

      - name: Fail if validation gate failed (non-PR)
        if: steps.gate.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "❌ ASHRAE 140 CI gate failed on ${{ github.event_name }}"
          exit 1

  # Module isolation tests - each module must match EnergyPlus within 1% tolerance
  isolation-weather:
    name: Weather Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Weather Isolation Tests
        run: cargo test --test weather_isolation --release

  isolation-solar:
    name: Solar Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Solar Isolation Tests
        run: cargo test --test solar_isolation --release

  isolation-conduction:
    name: Conduction Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Conduction Isolation Tests
        run: cargo test --test conduction_5r1c_isolation --release

  isolation-ventilation:
    name: Ventilation Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Ventilation Isolation Tests
        run: cargo test --test ventilation_infiltration_vs_energyplus --release

  isolation-zone-balance:
    name: Zone Balance Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Zone Balance Isolation Tests
        run: cargo test --test zone_balance_eplus_isolation --release