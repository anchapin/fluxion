# ============================================================================
# ASHRAE 140 CI Gate (Issue #1351 — cross-workflow determinism listener)
# ============================================================================
#
# This workflow is the canonical validation gate for PRs to main. It owns:
#   * (removed Issue #4018) the in-workflow determinism matrix — now
#     owned by the standalone `Cross-Platform Determinism CI` workflow,
#   * (removed Issue #4007) the ASHRAE 140 blind validation (`validate`)
#     and the module-isolation tests for Weather / Solar / Conduction /
#     Ventilation / Zone Balance — now owned by the sharded
#     `ashrae-shard.yml` workflow (single build warms sccache, six
#     shards run against the warm cache),
#   * the surrogate ASHRAE 140 MAE gate (Issue #2924),
#   * the quantum-python verification and gauge-python diagnostic jobs,
#   * the cross-workflow determinism / performance listeners.
#
# ----------------------------------------------------------------------------
# Issue #4007 — sharding note
# ----------------------------------------------------------------------------
# The six heavy test suites moved to `ashrae-shard.yml` (build + 6-shard
# matrix, all on ephemeral ubuntu-24.04). The self-hosted runner routing
# (`vars.FLUXION_LINUX_RUNNER`) and the 10-min queue-stall fallback
# (Issue #1505) were removed with the move: that machinery only existed
# to tolerate self-hosted queue stalls, which cannot happen on
# ephemeral runners. See `ashrae-shard.yml` for the sharded layout and
# the 06:00 UTC nightly sccache prime.
#
# ----------------------------------------------------------------------------
# Issue #1505 — Tiered runner fallback (Option A) — HISTORICAL
# ----------------------------------------------------------------------------
# The three-tier fallback described below was removed in Issue #4007
# when the benchmark jobs moved to `ashrae-shard.yml` (ephemeral
# runners only). Retained for archaeology; do not reintroduce
# self-hosted routing for PR-triggered jobs (Issue #3445 trust
# boundary).
# Self-hosted runner capacity (`ubuntu-latest-4-cores` via
# `vars.FLUXION_LINUX_RUNNER`) undersizes PR throughput: every PR used
# to queue 30-90 minutes waiting for the self-hosted pool, which made
# the merge-state stuck in `UNKNOWN` for the entire PR lifetime. This
# workflow implements a three-tier fallback strategy:
#
#   Tier 1 (DEFAULT / happy path)
#     Deterministic sub-jobs and benchmark jobs all run on standard
#     GitHub-hosted runners (ubuntu-24.04 / windows-latest /
#     macos-latest). Fast and always-available. This is the state the
#     repository is in when `vars.FLUXION_LINUX_RUNNER` is unset.
#
#   Tier 2 (BENCHMARK ONLY, when self-hosted is configured)
#     When `vars.FLUXION_LINUX_RUNNER` is set (e.g., "fluxion-ci"),
#     only the benchmark job (`validate`, the ASHRAE 140 blind
#     validation) routes to self-hosted runners via
#     `${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-24.04' }}`. The `||`
#     clause makes the GitHub-hosted fallback automatic. Deterministic
#     sub-jobs deliberately stay on GitHub-hosted because they are
#     already fast and reproducible there.
#
#   Tier 3 (10-MIN QUEUE-STALL FALLBACK)
#     `queue-stall-detector` runs first and sleeps 10 minutes when
#     self-hosted routing is active. If a primary self-hosted path
#     stalls beyond the window, `validate-fallback` re-runs the
#     ASHRAE 140 blind validation on `ubuntu-24.04` so the gate does
#     not block PRs. The fallback infrastructure is dormant when
#     self-hosted is not configured, so the happy path wall-time is
#     unchanged.
#
# Cross-workflow gate (Issue #1351) is updated for #1505 to tolerate
# `skipped` upstream conclusions (which happen when benchmark
# sub-jobs queue-stall past the 10-minute window) while continuing to
# pass through `failure` / `cancelled` / `timed_out` signals.
#
# See https://github.com/anchapin/fluxion/issues/1505 for full context,
# acceptance criteria, and the rejected Option B / Option C trade-offs.
#
# PR gate wiring (Issue #1351, closes #1297 acceptance gap)
# --------------------------------------------------------
# GitHub branch protection requires a single canonical "Required status
# check" name. The standalone `Cross-Platform Determinism CI` workflow
# (`determinism_check.yml`) runs the 3-OS determinism matrix. To give
# branch protection a single, stable, non-matrix check name, this
# workflow exposes a `workflow_run` listener job (`fluxion-determinism-gate`)
# that fires after `Cross-Platform Determinism CI` completes for the same
# SHA and fails the build if the upstream concluded `failure` or
# `cancelled`. Add that job name to the branch-protection required list
# (also recorded in `release_gates.yaml::ci.required_checks`).
#
# The former in-workflow `determinism-check` + `compare-hashes` jobs were
# removed (Issue #4018 follow-up): they duplicated the standalone
# workflow's 3-OS matrix (~42 job-min per PR) while claiming to be a
# "fast first line of defence" — they were the same 10–16m builds, not
# fast. The standalone workflow is now the source of truth; the listener
# job is the durable cross-workflow mirror that branch protection names.

name: ASHRAE 140 CI Gate

on:
  # Issue #3355: include `develop` so the inline `surrogate-ashrae-mae-gate`
  # (Issue #2924) fires for PRs targeting `develop`. The workflow_run
  # listener jobs (`fluxion-determinism-gate`, `fluxion-performance-gate`)
  # activate independently for develop PRs as soon as their upstream
  # workflows (`determinism_check.yml`, `performance_dashboard.yml`) run
  # for develop — both upstreams were also expanded to `[main, develop]`
  # in this commit.
  # Issue #4018: PRs phase-gated behind CI Gates (see workflow_run below).
  # Docs-only skip preserved via docs-only-gate check job.
  # Issue #1351: mirror the Cross-Platform Determinism CI conclusion
  # into this workflow as a single non-matrix "Fluxion Determinism Gate"
  # check that branch protection can reference. The listener only fires
  # for the same SHA on the same branch, so spurious upstream runs on
  # unrelated branches are ignored.
  # Issue #3372: also mirror the Performance Dashboard conclusion into
  # the "Fluxion Performance Gate (Issue #1618)" check. Without this,
  # the `fluxion-performance-gate` listener is dead code — its `if:`
  # filter is correct but the `workflow_run` event is never delivered.
  # Each listener scopes itself by `name` so the two coexist cleanly.
  workflow_run:
    workflows:
    - "CI Gates"
    - "Cross-Platform Determinism CI"
    - "Performance Dashboard"
    types: [completed]

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Issue #1505: informational. Defaults to "github-hosted", which
  # leaves the fallback machinery dormant. Set to
  # "self-hosted-with-fallback" alongside `vars.FLUXION_LINUX_RUNNER`
  # to activate the 10-min queue-stall detector and
  # `validate-fallback` job. Keeping the default as the github-hosted
  # tier guarantees the existing happy-path wall-time is unaffected
  # by this change.
  RUNNER_TIER: github-hosted

# Least-privilege GITHUB_TOKEN default (Issue #2526). The validate-* jobs that
# post PR comments or commit regression notices escalate via their own job-level
# permissions blocks; everything else is read-only.
permissions:
  contents: read

jobs:
  # Issue #4018: phase-gate precheck. Heavy jobs run only when triggered
  # by CI Gates succeeding for a PR (not by Determinism/Performance
  # listener events). Docs-only skip via docs-only-gate.
  precheck:
    name: Phase-gate precheck
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
    steps:
      - name: Checkout (precheck needs the local docs-only-gate action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # Only CI Gates triggers heavy jobs; Determinism/Performance
            # events are for the listener jobs only.
            if [ "$UPSTREAM_NAME" != "CI Gates" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              echo "Upstream is $UPSTREAM_NAME (not CI Gates); heavy jobs skip"
              exit 0
            fi
            if [ "$UPSTREAM_EVENT" != "pull_request" ] || [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "upstream_ok=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docs-only-gate
        id: docs
        if: steps.upstream.outputs.upstream_ok == 'true' && github.event_name == 'workflow_run'
      - id: final
        run: |
          if [ "${{ steps.upstream.outputs.upstream_ok }}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ steps.docs.outputs.docs_only }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
  # =====================================================================
  # =====================================================================
  # Issue #2924 — Surrogate ASHRAE 140 MAE Gate (Cases 600/900 cooling)
  # =====================================================================
  # Annual cooling kWh MAE gate at the SURROGATE layer (between the
  # per-timestep drift gate #1784 and the system-level strict ±15% gate
  # #1333). Asserts `SurrogateThermalModel::solve_timesteps` predicts
  # annual cooling kWh within ±5% of the EnergyPlus published reference
  # for ASHRAE 140 Cases 600 (low-mass) and 900 (high-mass).
  #
  # Two-mode operation (mirrors `surrogate_drift_gate.yml` Issue #1865):
  #   - ONNX mode — a trained model is resolvable. The strict ±5% gate
  #     is enforced; any deviation > 5% of the EnergyPlus midpoint fails.
  #   - FALLBACK mode — no trained model. The surrogate runs the analytical
  #     predictor with synthetic weather (0–20 °C, see
  #     SurrogateThermalLoadAdapter::solve_timesteps in src/sim/thermal_model.rs);
  #     the synthetic cycle cannot reproduce the EnergyPlus outdoor range
  #     that drives the published Case 600/900 cooling demand, so the
  #     measured-vs-EnergyPlus gap is expected to be near 100%. The gate
  #     degrades to an advisory that only enforces finite / non-negative
  #     invariants — the system-level #1333 gate is the authoritative
  #     catch for the underlying engine gap.
  #
  # The reference JSON files live at
  # `tests/reference_data/ashrae140/case_{600,900}_cooling_kwh.json`. The
  # EnergyPlus reference values are the midpoints of the published ASHRAE
  # 140-2023 Annex B band (Case 600: 5030 kWh, Case 900: 2900 kWh).
  #
  # Why --features ort
  # ------------------
  # The 9R4C thermal network (Case 900) lives behind the `ort` feature
  # gate (per issue #1294). Without `--features ort`, the surrogate path
  # would compile out the multi-node solver and the gate would not exercise
  # the correct physics baseline. The `ort` feature also enables the
  # ONNX runtime so `SurrogateManager::new_with_auto_load()` can resolve
  # `models/surrogate_zone_thermal.onnx` when present.
  #
  # Status check name
  # -----------------
  # Job id is `surrogate-ashrae-mae-gate`; the human-readable name is
  # "Surrogate ASHRAE 140 MAE Gate (Issue #2924)". Declared in
  # `release_gates.yaml` under `ci.required_checks`.
  # =====================================================================
  surrogate-ashrae-mae-gate:
    name: "Surrogate ASHRAE 140 MAE Gate (Issue #2924)"
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    # Issue #3445: persistent self-hosted runners MUST NOT execute
    # PR-controlled code. The surrogate MAE gate is the per-timestep
    # ±1% ASHRAE 140 drift gate — letting PR code touch a persistent
    # runner would let it poison the sccache / cargo / model caches
    # and silently alter the very evidence the gate is meant to
    # validate. Force ephemeral GH-hosted `ubuntu-24.04` on any
    # `pull_request` event; only main-merge pushes honour the routing
    # variable. Do NOT simplify this back to
    # `vars.FLUXION_LINUX_RUNNER || 'ubuntu-24.04'` — see SECURITY.md
    # §"Self-hosted runner job execution policy".
    runs-on: >-
      ${{
        github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && vars.FLUXION_LINUX_RUNNER
        || 'ubuntu-24.04'
      }}
    # Issue #4018: in-workflow determinism-check/compare-hashes removed;
    # determinism signal now comes from the standalone
    # Cross-Platform Determinism CI workflow via the
    # fluxion-determinism-gate listener (required check).
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
          sccache: 'false'

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: surrogate-mae-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            surrogate-mae-gate-${{ runner.os }}-

      - name: Resolve surrogate gate mode
        # Mirror SurrogateManager::new_with_auto_load() (src/ai/surrogate.rs):
        #   1. FLUXION_ONNX_MODEL env var (if it points at an existing file)
        #   2. models/surrogate_zone_thermal.onnx (built-in default)
        #   3. otherwise → fallback (analytical predictor, advisory gate)
        id: gate-mode
        run: |
          model=""
          if [ -n "${FLUXION_ONNX_MODEL:-}" ] && [ -f "${FLUXION_ONNX_MODEL}" ]; then
            model="${FLUXION_ONNX_MODEL}"
          elif [ -f "models/surrogate_zone_thermal.onnx" ]; then
            model="models/surrogate_zone_thermal.onnx"
          fi
          if [ -n "$model" ]; then
            echo "mode=onnx" >> "$GITHUB_OUTPUT"
            echo "model=$model" >> "$GITHUB_OUTPUT"
            echo "Gate mode: ONNX (strict ±5% tolerance) — model: $model"
          else
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "Gate mode: FALLBACK (advisory — no trained ONNX model; finite / non-negative invariant only)"
          fi

      - name: Run surrogate ASHRAE 140 MAE gate
        # All three tests in `tests/surrogate_ashrae_600_cooling_mae.rs`:
        #   1. surrogate_annual_cooling_within_5pct_of_energyplus_when_model_loaded
        #      — STRICT ±5% gate (ONNX mode). Dormant in fallback mode.
        #   2. surrogate_annual_cooling_fallback_advisory_report
        #      — ADVISORY fallback report (finite / non-negative invariant).
        #        Dormant in ONNX mode.
        #   3. reference_json_files_match_authoritative_ashrae_140_band
        #      — Pure unit test on the JSON schema (no simulation). Always runs.
        # The coverage regex below enforces all three appear in the captured
        # output (Issue #1866: a renamed / removed test is itself a gate
        # regression).
        # Issue #3668 — capture stdout and stderr to SEPARATE files instead
        # of merging via `2>&1 | tee`. Cargo test's "test X ..." line is
        # printed to stdout (line-buffered), then the test function runs,
        # then "ok" is appended to that same line — but if any `eprintln!`
        # in the test fires, it goes to stderr, and the captured
        # `2>&1` output ends up with the eprintln! text inlined into the
        # "test X ..." line, with "ok" appearing on a LATER line after
        # the eprintln! chain. Splitting stdout and stderr avoids this:
        # the stdout file has clean "test X ... ok" lines that match the
        # coverage regex, and the stderr file has the eprintln! diagnostic
        # output that the next-step grep parses. The 8-case expansion by
        # Issue #3584 made this visible — the previous 2-case test
        # generated 2 `eprintln!` lines, the new 8-case test generates
        # 8, which trips the regex on most runs.
        run: |
          stdbuf -oL -eL cargo test --release --features ort --verbose \
            --test all_tests surrogate_ashrae_600_cooling_mae:: \
            -- --nocapture --test-threads=1 \
            > /tmp/surrogate_mae_gate_output.txt \
            2> /tmp/surrogate_mae_gate_stderr.txt
          echo "exit_code=$?"

      - name: Verify gate coverage and extract results
        run: |
          echo "=== Surrogate ASHRAE 140 MAE gate coverage check ==="
          # Strip ANSI colour codes so the parser does not get confused.
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/surrogate_mae_gate_output.txt

          # All three tests must appear in the captured output. A missing
          # test name means a filter silently dropped it (Issue #1866) —
          # fail honestly rather than report a false PASS.
          # Issue #3668 — coverage check now runs against the stdout-only
          # file (see the cargo test step above) so the eprintln!
          # diagnostic output (in stderr) can't interleave with the
          # cargo harness's "test X ... ok" line. The original strict
          # regex `\.\.\. (ok|ignored|FAILED)` is restored now that the
          # captured stdout is clean.
          # Issue #3764 — the consolidated `tests/all_tests` harness prints
          # module-qualified names (`test <module>::<name> ... ok`); an
          # optional `<module>::` prefix is tolerated between `test ` and
          # the test name.
          check_coverage() {
            local name="$1"
            if grep -qE "(^|[^[:alnum:]_])test ([a-z0-9_]+::)?$name \.\.\. (ok|ignored|FAILED)" /tmp/surrogate_mae_gate_output.txt; then
              echo "  COVERED: $name"
            else
              echo "  DROPPED FROM GATE: $name"
              echo "  This test name was not found in the cargo output."
              echo "  Either the test was renamed/removed, or the workflow"
              echo "  filter needs updating. Failing the build."
              exit 1
            fi
          }
          check_coverage surrogate_annual_cooling_within_5pct_of_energyplus_when_model_loaded
          check_coverage surrogate_annual_cooling_fallback_advisory_report
          check_coverage reference_json_files_match_authoritative_ashrae_140_band

          echo
          echo "=== Surrogate ASHRAE 140 MAE gate result extraction ==="
          # Issue #3764: tolerate module-qualified names in the PASSED
          # extractor (`test <module>::surrogate_annual_cooling_...`).
          FAILED=$(grep -cE '(^|[^[:alnum:]_])test .* \.\.\. FAILED' /tmp/surrogate_mae_gate_output.txt || true)
          PANICS=$(grep -cE 'panicked at' /tmp/surrogate_mae_gate_output.txt || true)
          PASSED=$(grep -cE '(^|[^[:alnum:]_])test ([a-z0-9_]+::)?(surrogate_annual_cooling_|reference_json_files_).* \.\.\. ok' /tmp/surrogate_mae_gate_output.txt || true)
          RESOLVED_MODE="${{ steps.gate-mode.outputs.mode }}"

          echo "  Passed        : $PASSED"
          echo "  Failed        : $FAILED"
          echo "  Panics        : $PANICS"
          echo "  Resolved mode : $RESOLVED_MODE"

          # Pull the two diagnostic lines printed by the test under
          # --nocapture. The advisory branch always prints; the strict
          # branch only prints when the ONNX model is loaded.
          grep -E '\[surrogate-mae-gate-diag\] case=600' /tmp/surrogate_mae_gate_stderr.txt || true
          grep -E '\[surrogate-mae-gate-diag\] case=900' /tmp/surrogate_mae_gate_stderr.txt || true

          if [ "$FAILED" -gt 0 ] || [ "$PANICS" -gt 0 ]; then
            echo
            if [ "$RESOLVED_MODE" = "onnx" ]; then
              echo "::error::Surrogate ASHRAE 140 MAE gate FAILED — surrogate's annual cooling kWh exceeded the strict ±5% tolerance vs. the EnergyPlus midpoint for one or both cases. Retrain the surrogate or fix the underlying energy balance (Issue #2924)."
            else
              echo "::error::Surrogate ASHRAE 140 MAE gate FAILED — fallback-mode invariant breached (non-finite or negative annual cooling kWh). The surrogate produced NaN/Inf or a negative value; investigate the dispatch loop (Issue #2924)."
            fi
            echo "See /tmp/surrogate_mae_gate_output.txt for the failing assertion messages."
            exit 1
          fi

          if [ "$RESOLVED_MODE" = "onnx" ]; then
            echo "PASS: Surrogate ASHRAE 140 MAE gate holds (≤5% deviation from EnergyPlus midpoint, strict ONNX mode)."
          else
            echo "::warning::Surrogate ASHRAE 140 MAE gate ran in ADVISORY (fallback) mode — no trained ONNX model is registered (FLUXION_ONNX_MODEL unset and models/surrogate_zone_thermal.onnx absent). The strict ±5% gate is dormant; the finite / non-negative invariant passed. To activate the strict gate, ship models/surrogate_zone_thermal.onnx and configure FLUXION_ONNX_MODEL. See Issue #1865 / #2924."
            echo "PASS: Surrogate ASHRAE 140 MAE gate passed in ADVISORY fallback mode (strict ±5% gate dormant — no trained ONNX model)."
          fi

      - name: Upload MAE gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surrogate-ashrae-mae-gate
          path: |
            /tmp/surrogate_mae_gate_output.txt
            /tmp/surrogate_mae_gate_stderr.txt
          retention-days: 14

  # Issue #3810: GH-listener pattern for the path-filtered
  # `surrogate-ashrae-mae-gate` job (#2924). The upstream is path-filtered
  # via the workflow-level `paths-ignore` (docs/markdown/license/etc.
  # only — anything else triggers the workflow), so on a docs-only /
  # scripts-only PR the workflow is skipped and the required-check
  # context is never reported — branch protection's expected-vs-actual
  # gap that #3805 documented.
  #
  # The `surrogate-ashrae-mae-gate-listener` job is unconditional
  # (`if: always()`) and observes the upstream result: PASS on
  # `success` / `skipped` (path-filter neutral-success); FAIL on
  # `failure` / `cancelled` / `timed_out`. Listener's `name:` is the
  # exact required-check string so GitHub branch protection can
  # reference it verbatim (Issue #3116). Job id is suffixed
  # `-listener` to avoid colliding with the upstream
  # `surrogate-ashrae-mae-gate` id.
  surrogate-ashrae-mae-gate-listener:
    name: "Surrogate ASHRAE 140 MAE Gate (Issue #2924)"
    needs: [surrogate-ashrae-mae-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()

    steps:
      - name: Verify upstream result
        run: |
          set -uo pipefail
          RESULT="${{ needs.surrogate-ashrae-mae-gate.result }}"
          echo "surrogate-ashrae-mae-gate upstream result: ${RESULT}"
          if [[ "${RESULT}" != "success" && "${RESULT}" != "skipped" ]]; then
            echo "::error::Surrogate ASHRAE 140 MAE Gate upstream did not succeed: ${RESULT}"
            exit 1
          fi
          echo "Surrogate ASHRAE 140 MAE Gate (Issue #2924) PASS"

  # Python verification scripts — Issue #1699
  # These scripts validate QUBO math (issue-1464) and diurnal parity (issue-1465).
  # They are not built into the Rust binary; they run as standalone Python scripts
  # and must execute without crashing for CI to pass.
  quantum-python-verification:
    name: Quantum Python Verification
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    # Issue #4018: in-workflow determinism-check/compare-hashes removed;
    # determinism signal now comes from the standalone
    # Cross-Platform Determinism CI workflow via the
    # fluxion-determinism-gate listener (required check).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev python3
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Quantum Python Verification
        run: "cargo test --test all_tests quantum_python_verification:: --release"

  gauge-python-diagnostic:
    name: Gauge Python Diagnostic
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    # Issue #4018: in-workflow determinism-check/compare-hashes removed;
    # determinism signal now comes from the standalone
    # Cross-Platform Determinism CI workflow via the
    # fluxion-determinism-gate listener (required check).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev python3
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Gauge Python Diagnostic
        run: "cargo test --test all_tests gauge_python_diagnostic:: --release"


  # =====================================================================
  # Issue #1351 — Cross-workflow determinism gate listener
  # =====================================================================
  # This job fires after the `Cross-Platform Determinism CI` workflow
  # completes for the same SHA. It exists so branch protection can name
  # a single, non-matrix required check (`Fluxion Determinism Gate`) and
  # the PR can be blocked at the gate even if the in-workflow
  # `compare-hashes` job and the upstream `compare-hashes` job ever
  # disagree (e.g. one runs on a stale fork SHA, the other doesn't).
  #
  # The listener is intentionally minimal: it does NOT re-run the
  # determinism test — it just observes the upstream `conclusion` and
  # surfaces a clear PR comment + branch-protection check name.
  # =====================================================================
  fluxion-determinism-gate:
    name: "Fluxion Determinism Gate (Issue #1351)"
    runs-on: ubuntu-24.04
    # Issue #4018: accept both direct-PR determinism runs (event ==
    # 'pull_request', pre-rollout) and CI-Gates-triggered runs (event ==
    # 'workflow_run'). The two-PR rollout is complete as of the
    # determinism phase-gate follow-up; only the workflow_run kind fires now.
    if: (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_run') && github.event.workflow_run.name == 'Cross-Platform Determinism CI'
    # Issue #1505: the previous guard `&& conclusion != 'skipped'`
    # suppressed the listener when an upstream benchmark sub-job was
    # skipped (a self-hosted queue-stall leaves the upstream
    # conclusion as `skipped` rather than `failure`). With the
    # fallback infrastructure now in place, suppressing the listener
    # would leave branch protection in `UNKNOWN` for the lifetime
    # of the PR — exactly the failure mode Issue #1505 was filed
    # to remove. The listener now fires on `skipped` too; the
    # catch-all `*)` branch below treats `skipped` as a soft pass,
    # while `failure` / `cancelled` / `timed_out` continue to block
    # the gate via the explicit `case` arm and the hard-fail step
    # below. The `validate-fallback` job in this workflow provides
    # the success signal that the upstream `validate` would have
    # produced on a healthy self-hosted runner.
    permissions:
      contents: read
      checks: read
      pull-requests: write
      actions: read
    steps:
      - name: Verify upstream conclusion and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "Upstream workflow: ${UPSTREAM_NAME}"
          echo "Upstream run ID:   ${UPSTREAM_RUN_ID}"
          echo "Upstream head SHA: ${UPSTREAM_HEAD_SHA}"
          echo "Upstream head ref: ${UPSTREAM_HEAD_REF}"
          echo "Upstream conclusion: ${UPSTREAM_CONCLUSION}"

          # Pull-request number lookup — workflow_run events do not carry
          # the PR number directly. We find the PR for the head SHA and
          # use that for the failure comment.
          PR_NUMBER="$(gh pr list --state open --head "${UPSTREAM_HEAD_REF}" --json number --jq '.[0].number // empty' || true)"

          case "${UPSTREAM_CONCLUSION}" in
            success)
              echo "::notice::Determinism gate PASSED — upstream workflow succeeded."
              exit 0
              ;;
            failure|cancelled|timed_out)
              echo "::error::Determinism gate FAILED — upstream workflow concluded '${UPSTREAM_CONCLUSION}'."
              echo "::error::See upstream run: ${UPSTREAM_RUN_URL}"
              if [ -n "${PR_NUMBER:-}" ]; then
                COMMENT_FILE="$(mktemp -t determinism-gate-comment.XXXXXX.md)"
                # Issue #1397 — the previous python heredoc (<<'PYEOF' inside
                # nested `case`/`if`) failed to parse on every workflow run:
                # bash's quoted heredoc terminator must be at column 0, but the
                # YAML multi-line string preserves indentation. Move the
                # Python code to a dedicated script file under `scripts/`.
                UPSTREAM_CONCLUSION="${UPSTREAM_CONCLUSION}" \
                UPSTREAM_RUN_URL="${UPSTREAM_RUN_URL}" \
                UPSTREAM_HEAD_SHA="${UPSTREAM_HEAD_SHA}" \
                COMMENT_FILE="${COMMENT_FILE}" \
                python3 "${GITHUB_WORKSPACE}/.github/workflows/scripts/post_determinism_gate_comment.py"
                gh pr comment "${PR_NUMBER}" --body-file "${COMMENT_FILE}" \
                  || echo "::warning::Failed to post PR comment for PR #${PR_NUMBER}"
                rm -f "${COMMENT_FILE}"
              else
                echo "::warning::No open PR found for ref ${UPSTREAM_HEAD_REF}; skipping PR comment."
              fi
              exit 1
              ;;
            *)
              # Issue #1505: 'skipped' / 'neutral' / unknown are
              # NOT blocking. `skipped` typically means the upstream
              # benchmark sub-jobs never claimed a self-hosted runner
              # within the 10-min queue-stall window — the
              # `validate-fallback` job on `ubuntu-24.04` provides
              # the safety signal in that case (it would have failed
              # the gate via its own conclusion). Falling through
              # here with `exit 0` therefore matches the issue's
              # acceptance criterion: a PR with a successful
              # deterministic gate on GitHub-hosted runners merges
              # even when the self-hosted benchmark jobs were
              # queued >10 min.
              echo "::notice::Upstream determinism workflow concluded '${UPSTREAM_CONCLUSION}' — not blocking the gate."
              exit 0
              ;;
          esac

      - name: Hard fail on upstream non-success
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'
        run: |
          echo "::error::Determinism gate hard fail — see upstream run ${{ github.event.workflow_run.html_url }}"
          exit 1

  # =====================================================================
  # Issue #1618 — Cross-workflow performance regression gate listener
  # =====================================================================
  # This job fires after the `Performance Dashboard` workflow completes
  # for the same SHA. It exists so branch protection can name a single,
  # non-matrix required check (`Fluxion Performance Gate`) and the PR can
  # be blocked at the gate if a performance regression is detected.
  #
  # The listener is intentionally minimal: it does NOT re-run benchmarks —
  # it just observes the upstream `conclusion` and surfaces a clear PR
  # comment + branch-protection check name.
  # =====================================================================
  fluxion-performance-gate:
    name: "Fluxion Performance Gate (Issue #1618)"
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.name == 'Performance Dashboard'
    permissions:
      contents: read
      checks: read
      pull-requests: write
      actions: read
    steps:
      - name: Verify upstream conclusion and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "Upstream workflow: ${UPSTREAM_NAME}"
          echo "Upstream run ID:   ${UPSTREAM_RUN_ID}"
          echo "Upstream head SHA: ${UPSTREAM_HEAD_SHA}"
          echo "Upstream head ref: ${UPSTREAM_HEAD_REF}"
          echo "Upstream conclusion: ${UPSTREAM_CONCLUSION}"

          PR_NUMBER="$(gh pr list --state open --head "${UPSTREAM_HEAD_REF}" --json number --jq '.[0].number // empty' || true)"

          case "${UPSTREAM_CONCLUSION}" in
            success)
              echo "::notice::Performance gate PASSED — upstream workflow succeeded."
              exit 0
              ;;
            failure|cancelled|timed_out)
              echo "::error::Performance gate FAILED — upstream workflow concluded '${UPSTREAM_CONCLUSION}'."
              echo "::error::See upstream run: ${UPSTREAM_RUN_URL}"
              if [ -n "${PR_NUMBER:-}" ]; then
                COMMENT_FILE="$(mktemp -t performance-gate-comment.XXXXXX.md)"
                # Issue #3117 — the previous inline PR-comment heredoc
                # (`<<'COMMENTEOF'`) terminated the YAML literal block scalar
                # prematurely (the heredoc body was deindented below the YAML
                # minimum), producing invalid YAML on the next line and causing
                # the workflow to fail at parse time. The body now lives in a
                # dedicated script under `.github/workflows/scripts/`, mirroring
                # the `post_determinism_gate_comment.py` pattern fixed in #1397.
                OUTPUT_FILE="${COMMENT_FILE}" \
                  python3 "${GITHUB_WORKSPACE}/.github/workflows/scripts/post_performance_gate_comment.py"
                gh pr comment "${PR_NUMBER}" --body-file "${COMMENT_FILE}" \
                  || echo "::warning::Failed to post PR comment for PR #${PR_NUMBER}"
                rm -f "${COMMENT_FILE}"
              else
                echo "::warning::No open PR found for ref ${UPSTREAM_HEAD_REF}; skipping PR comment."
              fi
              exit 1
              ;;
            *)
              echo "::notice::Upstream performance workflow concluded '${UPSTREAM_CONCLUSION}' — not blocking the gate."
              exit 0
              ;;
          esac

      - name: Hard fail on upstream non-success
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'
        run: |
          echo "::error::Performance gate hard fail — see upstream run ${{ github.event.workflow_run.html_url }}"
          exit 1