  # =====================================================================
  # Issue #1351 — Cross-workflow determinism gate listener
  # =====================================================================
  # This job fires after the `Cross-Platform Determinism CI` workflow
  # completes for the same SHA. It exists so branch protection can name
  # a single, non-matrix required check (`Fluxion Determinism Gate`) and
  # the PR can be blocked at the gate even if the in-workflow
  # `compare-hashes` job and the upstream `compare-hashes` job ever
  # disagree (e.g. one runs on a stale fork SHA, the other doesn't).
  #
  # The listener is intentionally minimal: it does NOT re-run the
  # determinism test — it just observes the upstream `conclusion` and
  # surfaces a clear PR comment + branch-protection check name.
  # =====================================================================
  fluxion-determinism-gate:
    name: "Fluxion Determinism Gate (Issue #1351)"
    runs-on: ubuntu-latest
    # Issue #4018: accept both direct-PR determinism runs (event ==
    # 'pull_request', current) and future CI-Gates-triggered runs (event
    # == 'workflow_run'). Two-PR rollout per ci-gates.yml warning.
    if: (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_run') && github.event.workflow_run.name == 'Cross-Platform Determinism CI'
    # Issue #1505: the previous guard `&& conclusion != 'skipped'`
    # suppressed the listener when an upstream benchmark sub-job was
    # skipped (a self-hosted queue-stall leaves the upstream
    # conclusion as `skipped` rather than `failure`). With the
    # fallback infrastructure now in place, suppressing the listener
    # would leave branch protection in `UNKNOWN` for the lifetime
    # of the PR — exactly the failure mode Issue #1505 was filed
    # to remove. The listener now fires on `skipped` too; the
    # catch-all `*)` branch below treats `skipped` as a soft pass,
    # while `failure` / `cancelled` / `timed_out` continue to block
    # the gate via the explicit `case` arm and the hard-fail step
    # below. The `validate-fallback` job in this workflow provides
    # the success signal that the upstream `validate` would have
    # produced on a healthy self-hosted runner.
    permissions:
      contents: read
      checks: read
      pull-requests: write
      actions: read
    steps:
      - name: Verify upstream conclusion and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "Upstream workflow: ${UPSTREAM_NAME}"
          echo "Upstream run ID:   ${UPSTREAM_RUN_ID}"
          echo "Upstream head SHA: ${UPSTREAM_HEAD_SHA}"
          echo "Upstream head ref: ${UPSTREAM_HEAD_REF}"
          echo "Upstream conclusion: ${UPSTREAM_CONCLUSION}"

          # Pull-request number lookup — workflow_run events do not carry
          # the PR number directly. We find the PR for the head SHA and
          # use that for the failure comment.
          PR_NUMBER="$(gh pr list --state open --head "${UPSTREAM_HEAD_REF}" --json number --jq '.[0].number // empty' || true)"

          case "${UPSTREAM_CONCLUSION}" in
            success)
              echo "::notice::Determinism gate PASSED — upstream workflow succeeded."
              exit 0
              ;;
            failure|cancelled|timed_out)
              echo "::error::Determinism gate FAILED — upstream workflow concluded '${UPSTREAM_CONCLUSION}'."
              echo "::error::See upstream run: ${UPSTREAM_RUN_URL}"
              if [ -n "${PR_NUMBER:-}" ]; then
                COMMENT_FILE="$(mktemp -t determinism-gate-comment.XXXXXX.md)"
                # Issue #1397 — the previous python heredoc (<<'PYEOF' inside
                # nested `case`/`if`) failed to parse on every workflow run:
                # bash's quoted heredoc terminator must be at column 0, but the
                # YAML multi-line string preserves indentation. Move the
                # Python code to a dedicated script file under `scripts/`.
                UPSTREAM_CONCLUSION="${UPSTREAM_CONCLUSION}" \
                UPSTREAM_RUN_URL="${UPSTREAM_RUN_URL}" \
                UPSTREAM_HEAD_SHA="${UPSTREAM_HEAD_SHA}" \
                COMMENT_FILE="${COMMENT_FILE}" \
                python3 "${GITHUB_WORKSPACE}/.github/workflows/scripts/post_determinism_gate_comment.py"
                gh pr comment "${PR_NUMBER}" --body-file "${COMMENT_FILE}" \
                  || echo "::warning::Failed to post PR comment for PR #${PR_NUMBER}"
                rm -f "${COMMENT_FILE}"
              else
                echo "::warning::No open PR found for ref ${UPSTREAM_HEAD_REF}; skipping PR comment."
              fi
              exit 1
              ;;
            *)
              # Issue #1505: 'skipped' / 'neutral' / unknown are
              # NOT blocking. `skipped` typically means the upstream
              # benchmark sub-jobs never claimed a self-hosted runner
              # within the 10-min queue-stall window — the
              # `validate-fallback` job on `ubuntu-latest` provides
              # the safety signal in that case (it would have failed
              # the gate via its own conclusion). Falling through
              # here with `exit 0` therefore matches the issue's
              # acceptance criterion: a PR with a successful
              # deterministic gate on GitHub-hosted runners merges
              # even when the self-hosted benchmark jobs were
              # queued >10 min.
              echo "::notice::Upstream determinism workflow concluded '${UPSTREAM_CONCLUSION}' — not blocking the gate."
              exit 0
              ;;
          esac

      - name: Hard fail on upstream non-success
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'
        run: |
          echo "::error::Determinism gate hard fail — see upstream run ${{ github.event.workflow_run.html_url }}"
          exit 1

  # =====================================================================
  # Issue #1618 — Cross-workflow performance regression gate listener
  # =====================================================================
  # This job fires after the `Performance Dashboard` workflow completes
  # for the same SHA. It exists so branch protection can name a single,
  # non-matrix required check (`Fluxion Performance Gate`) and the PR can
  # be blocked at the gate if a performance regression is detected.
  #
  # The listener is intentionally minimal: it does NOT re-run benchmarks —
  # it just observes the upstream `conclusion` and surfaces a clear PR
  # comment + branch-protection check name.
  # =====================================================================
  fluxion-performance-gate:
    name: "Fluxion Performance Gate (Issue #1618)"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.name == 'Performance Dashboard'
    permissions:
      contents: read
      checks: read
      pull-requests: write
      actions: read
    steps:
      - name: Verify upstream conclusion and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "Upstream workflow: ${UPSTREAM_NAME}"
          echo "Upstream run ID:   ${UPSTREAM_RUN_ID}"
          echo "Upstream head SHA: ${UPSTREAM_HEAD_SHA}"
          echo "Upstream head ref: ${UPSTREAM_HEAD_REF}"
          echo "Upstream conclusion: ${UPSTREAM_CONCLUSION}"

          PR_NUMBER="$(gh pr list --state open --head "${UPSTREAM_HEAD_REF}" --json number --jq '.[0].number // empty' || true)"

          case "${UPSTREAM_CONCLUSION}" in
            success)
              echo "::notice::Performance gate PASSED — upstream workflow succeeded."
              exit 0
              ;;
            failure|cancelled|timed_out)
              echo "::error::Performance gate FAILED — upstream workflow concluded '${UPSTREAM_CONCLUSION}'."
              echo "::error::See upstream run: ${UPSTREAM_RUN_URL}"
              if [ -n "${PR_NUMBER:-}" ]; then
                COMMENT_FILE="$(mktemp -t performance-gate-comment.XXXXXX.md)"
                # Issue #3117 — the previous inline PR-comment heredoc
                # (`<<'COMMENTEOF'`) terminated the YAML literal block scalar
                # prematurely (the heredoc body was deindented below the YAML
                # minimum), producing invalid YAML on the next line and causing
                # the workflow to fail at parse time. The body now lives in a
                # dedicated script under `.github/workflows/scripts/`, mirroring
                # the `post_determinism_gate_comment.py` pattern fixed in #1397.
                OUTPUT_FILE="${COMMENT_FILE}" \
                  python3 "${GITHUB_WORKSPACE}/.github/workflows/scripts/post_performance_gate_comment.py"
                gh pr comment "${PR_NUMBER}" --body-file "${COMMENT_FILE}" \
                  || echo "::warning::Failed to post PR comment for PR #${PR_NUMBER}"
                rm -f "${COMMENT_FILE}"
              else
                echo "::warning::No open PR found for ref ${UPSTREAM_HEAD_REF}; skipping PR comment."
              fi
              exit 1
              ;;
            *)
              echo "::notice::Upstream performance workflow concluded '${UPSTREAM_CONCLUSION}' — not blocking the gate."
              exit 0
              ;;
          esac

      - name: Hard fail on upstream non-success
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'
        run: |
          echo "::error::Performance gate hard fail — see upstream run ${{ github.event.workflow_run.html_url }}"
          exit 1