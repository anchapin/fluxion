name: Performance Validation

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      trigger-reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'

# PRs: manual trigger only (workflow_dispatch) to save runner minutes.
# Main/dev push + manual dispatch: run full benchmark suite.

# Least-privilege GITHUB_TOKEN grants (Issue #2526): benchmarks only run + upload
# artifacts; no repo write-back.

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

permissions:
  contents: read

jobs:
  thermal-model-bench:
    name: Thermal Model Bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run thermal model benchmarks
        run: cargo bench --bench performance --no-fail-fast -- thermal_model

  batch-oracle-bench:
    name: Batch Oracle Bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run batch oracle benchmarks
        run: cargo bench --bench performance --no-fail-fast -- batch_oracle

  # Issue #2522 — multi-zone throughput criterion benchmark compile check.
  # Verifies benches/multi_zone_throughput.rs (sweeps BatchOracle::evaluate_population
  # across populations {10,100,1000,10000} on a 10-zone ThermalModel) compiles in
  # the gate-relevant multi-zone feature profile. The bench carries
  # `required-features = ["multi-zone"]`, so a full criterion run (~1 h for
  # population_10k at ~28 configs/sec) is opt-in and CI compile-checks (--no-run).
  # The default-features Performance Dashboard sweep (which the Fluxion Performance
  # Gate #1618 observes) skips this target via required-features, keeping the 15-min
  # dashboard budget intact; the runtime floor (10 configs/sec @ pop 100) stays
  # enforced by tests/performance_ci_test.rs in the performance-tests job above.
  multi-zone-throughput-bench:
    name: Multi-Zone Throughput Bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target/
          key: ${{ runner.os }}-cargo-multizone-${{ hashFiles('**/Cargo.lock') }}
      - name: Compile-check multi-zone throughput benchmark
        run: cargo bench --bench multi_zone_throughput --features multi-zone --no-run

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: libssl-dev,pkg-config,libfontconfig1-dev,fontconfig
      - name: Install Rust
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run performance tests
        run: |
          cargo test --test performance_ci_test
          cargo test --test performance_regression_test

      - name: Generate benchmark results
        run: |
          cargo test --test performance_regression_test --release -- --nocapture 2>&1 | tee perf_output.txt

          python3 << 'EOF'
          import re
          import json

          with open('perf_output.txt', 'r') as f:
              output = f.read()

          throughput_match = re.search(r'Throughput:\s*([\d.]+)\s*configs/sec', output)
          latency_match = re.search(r'Latency per config:\s*([\d.]+)ms', output)

          results = {
              "metrics": {
                  "throughput_configs_per_sec": float(throughput_match.group(1)) if throughput_match else 0,
                  "latency_ms_per_config": float(latency_match.group(1)) if latency_match else 0
              }
          }

          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"Generated benchmark_results.json")
          if throughput_match:
              print(f"Throughput: {throughput_match.group(1)} configs/sec")
          if latency_match:
              print(f"Latency: {latency_match.group(1)} ms/config")
          EOF

      - name: Run Release Gate Checker
        run: |
          python3 scripts/release_gate_checker.py \
            --benchmark-results benchmark_results.json \
            --json --output gate_status.json

      - name: Display Gate Status
        run: |
          echo "## Performance Gate Status" >> $GITHUB_STEP_SUMMARY
          if [ -f gate_status.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat gate_status.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: performance-report
          path: |
            target/criterion/**/*
            benchmark_results.json
            gate_status.json
          retention-days: 30

      - name: Fail if performance gate failed
        if: failure()
        run: |
          echo "❌ Performance gate check failed"
          if [ -f gate_status.json ]; then
            python3 scripts/display_gate_status.py
          fi
          exit 1
