name: MSRV Check

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/msrv.yml'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN grants (Issue #2526). The msrv-build job only
# checks out code and runs `cargo +1.98.0 build --workspace`; no repo write-back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv-build:
    runs-on: ubuntu-latest
    name: MSRV Check (Issue #2934)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Preflight disk space
        run: df -h /home

      # System build deps (libssl-dev, pkg-config, fontconfig, libglib2.0-dev,
      # libgtk-3-dev). Matches the apt-install list in
      # .github/actions/setup-rust-env/action.yml so the MSRV job can build
      # crates that link against C libs (yeslogic-fontconfig-sys, openssl-sys,
      # glib-sys via Tauri, gtk-sys/gdk-sys via Tauri GUI, etc.). Keep this in
      # sync with setup-rust-env if more system deps are added there.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      # Install the MSRV-pinned stable toolchain (issue #2934; floor raised
      # to 1.98.0 by issue #3321). The crate's `rust-version = "1.98.0"`
      # field — set on the root Cargo.toml, the [workspace.package] block,
      # and all 11 workspace-member Cargo.toml files — is what
      # `cargo install` / crates.io / `cargo update --precise` users see;
      # this job is the enforcement side, failing the build when a change
      # drifts past 1.98.0. The floor was raised deliberately — no longer
      # "the lowest stable that builds today" — to unlock the Rust 1.98
      # std APIs planned for adoption in follow-up issues: the algebraic
      # floating-point methods (f32/f64::algebraic_{add,sub,mul,div,rem},
      # prerequisite for an opt-in fast-math feature) and buffered integer
      # formatting (format_into/NumBuffer, prerequisite for fluxion-toon
      # serialization micro-optimization). Dependency floors remain
      # satisfied: clap_lex 1.1.0 (edition2024, Cargo 1.85+) and nalgebra
      # 0.35 / safe_arch 1.1 / statrs 0.19.1 / wide 1.6.1 (each declaring
      # rustc >= 1.89) all sit below the new floor. The action SHA pin
      # matches the one used by .github/actions/setup-rust-env/action.yml
      # so any drift is caught in one place.
      - name: Install Rust 1.98.0 (MSRV)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0  # 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            .
            fluxion-core -> target
            fluxion-city -> target
            fluxion-fluid -> target
            fluxion-grid -> target
            fluxion-behavior -> target
            fluxion-mcp -> target
            fluxion-wasm -> target
            crates/fluxion-toon -> target
            crates/fluxion-twin -> target
            fluxion-cfd -> target
            fluxion-tauri -> target

      # fluxion-tauri is excluded for the same reason every cargo invocation
      # in rust-tests.yml excludes it: its `tauri::generate_context!()` panics
      # unless `frontendDist` (`../frontend/dist`, a gitignored vite build
      # artifact) exists, and this job never builds the frontend. Without the
      # exclude the job only passes on a warm rust-cache (cold cache fails,
      # e.g. develop run 33712530041).
      - name: cargo +1.98.0 build --workspace
        run: cargo +1.98.0 build --workspace --locked --exclude fluxion-tauri