name: Cross-Validation CI

description: Automated cross-validation testing

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: '16777216'

# Least-privilege GITHUB_TOKEN grants (Issue #2526): cross-validation only
# builds, runs tests, and uploads an artifact — no repo write-back.
permissions:
  contents: read

jobs:
  cross-validation:
    name: Cross-Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 15
          command: rustup toolchain install stable --profile default

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project
        run: |
          # Build with wiring-tracing feature for integration tests
          cargo build --features wiring-tracing

      - name: Run cross-validation tests
        run: |
          # Run with wiring-tracing feature for integration tests.
          # Issue #3726: the `|| true` mask is removed — this step now fails
          # CI on any non-quarantined test failure. Known-failing tests are
          # `#[ignore]`-quarantined with matching rows in `tests/QUARANTINE.md`
          # per the Issue #3629 protocol (owner, un-ignore criteria, status);
          # un-quarantine via the registry, never by re-masking.
          # `--lib --bins --tests` scopes the run to the code surfaces
          # actually covered by the cross-validation harness (lib + bins +
          # integration test binaries); doctests are excluded because they
          # are not part of this harness, are not exercised by any other
          # workflow (rust-tests.yml uses `cargo nextest run` which skips
          # doctests), and the few stale doc examples are tracked
          # separately from #3726.
          cargo test --features wiring-tracing --lib --bins --tests -- --test-threads=1

      - name: Generate validation report
        run: cargo run --bin fluxion -- validate --format=markdown --output-file=validation_report.md

      - name: Upload validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-report
          path: validation_report.md
