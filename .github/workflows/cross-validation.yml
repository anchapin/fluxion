name: Cross-Validation CI

description: Automated cross-validation testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: '1.70.0'
  CARGO_TERM_COLOR: always
  # Increase stack size to prevent SIGSEGV during LTO compilation
  RUST_MIN_STACK: '16777216'

jobs:
  cross-validation:
    name: Cross-Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev fontconfig

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project
        run: |
          # Set RUST_MIN_STACK for the build process to prevent OOM/SIGSEGV
          export RUST_MIN_STACK=16777216
          cargo build --release

      - name: Run cross-validation tests
        run: |
          export RUST_MIN_STACK=16777216
          cargo test --release -- --test-threads=1

      - name: Generate validation report
        run: cargo run --release --bin fluxion -- validate --format=markdown --output-file=validation_report.md

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.md
