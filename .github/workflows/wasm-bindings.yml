# Issue #2903: WASM runtime tests gated to cfg(target_arch = "wasm32") never run in any CI workflow.
#
# Closes the gap where the 22 wasm-bindgen-test cases in
# `fluxion-wasm/tests/wasm_integration_tests.rs` (declared under
# `cfg(target_arch = "wasm32")`) never reached a WASM runtime in CI. The
# companion `wasm-build.yml` (issue #2914) verifies that the artifact
# *builds* across ubuntu/macos/windows; this workflow verifies that the
# wasm-bindgen tests *execute* under a real WASM runtime (Node.js) and
# pass before any artifact is published.
#
# To avoid duplicating the wasm-pack installation chattiness with
# `wasm-build.yml`, we mirror the same installer block (with the same
# resolved-version note — a wasm-pack major bump would change the
# `--node` test-runner output and must be a deliberate change tracked
# alongside a test-suite re-baseline).
#
# Mirrors `node-bindings.yml` structure: matrix of ubuntu-latest and
# windows-latest, `napi-rs`/`napi build` swapped for `wasm-pack test
# --node`, no `npm install` step (Node ships pre-installed on both
# runners and `wasm-pack test --node` drives the runtime itself).

name: WASM Bindings

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'fluxion-wasm/**'
      - 'fluxion-fluid/**'
      - 'fluxion-core/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/wasm-bindings.yml'
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # wasm-pack's chromium / node runners occasionally hit thread-stack
  # limits on 32 MiB-default hosts; match the bump used by the other
  # binding workflows.
  RUST_MIN_STACK: 33554432

# Least-privilege GITHUB_TOKEN grants (Issue #2526): the WASM runtime
# test matrix only checks out code, installs wasm-pack, builds the
# wasm32 crate, and runs the wasm-bindgen-test suite — no repo
# write-back.
permissions:
  contents: read

jobs:
  build-test:
    name: WASM Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux honours the repo's FLUXION_LINUX_RUNNER routing var on
        # main-merge pushes only — on pull_request events the expression
        # MUST resolve to ubuntu-latest (docs/SECURITY.md §7; Issues
        # #3531/#3718). Windows is always GitHub-hosted.
        # macos-latest is intentionally omitted here — `wasm-pack test
        # --node` on macOS has been a recurring flake source, and the
        # u+x w cross-platform interface contract is already covered by
        # the `wasm-build.yml` matrix. Runtime correctness is platform
        # neutral (the underlying V8 is the same Node version), so the
        # 2-runner matrix is sufficient for the gate.
        os:
          - ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # wasm-pack v0.15.0 is installed from the official GitHub release
      # tarball with a per-platform SHA-256 checksum verified before
      # extraction (Issue #3740). The previous `curl ... | sh` pattern
      # downloaded and executed the upstream installer unconditionally —
      # a moving-target code-execution path that bypassed the SHA-pinning
      # guarantees every other action in this repo enjoys (Issues
      # #3475/#3530). The version + per-platform SHA-256 are hard-coded
      # in the install step below; bumping the wasm-pack version requires
      # updating both AND re-running the interface-hash baseline
      # (Issue #2914) if the wasm-bindgen test-runner output format
      # changes.
      - name: Install wasm-pack (pinned v0.15.0, SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          if command -v wasm-pack >/dev/null 2>&1; then
            echo "wasm-pack already installed: $(wasm-pack --version)"
            exit 0
          fi

          # Pinned wasm-pack install — Issue #3740. Bumping the version
          # requires updating WASM_PACK_VERSION AND every per-platform
          # SHA-256 in the case statement below.
          WASM_PACK_VERSION="v0.15.0"

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              TRIPLE="x86_64-unknown-linux-musl"
              SHA256="c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a"
              BIN_NAME="wasm-pack"
              ;;
            Linux-ARM64)
              TRIPLE="aarch64-unknown-linux-musl"
              SHA256="e17ef0806381c3a0acb9c9ddad643a49facaa5a2ecf657a421d4d8f3357a24b7"
              BIN_NAME="wasm-pack"
              ;;
            # Match the upstream wasm-pack installer init.sh: on Apple
            # Silicon runners fall back to the x86_64 tarball (executes
            # under Rosetta). See
            # https://github.com/wasm-bindgen/wasm-pack/pull/1088.
            macOS-ARM64)
              TRIPLE="x86_64-apple-darwin"
              SHA256="d3f1a4a33e95f8f0d7801b024e08624c479999ac96aa150908b2394015cd0363"
              BIN_NAME="wasm-pack"
              ;;
            macOS-X64)
              TRIPLE="x86_64-apple-darwin"
              SHA256="d3f1a4a33e95f8f0d7801b024e08624c479999ac96aa150908b2394015cd0363"
              BIN_NAME="wasm-pack"
              ;;
            Windows-X64)
              TRIPLE="x86_64-pc-windows-msvc"
              SHA256="518dc51180c7bc864699c9279b3bc99025bc109123e0249a34ba34d130a509bf"
              BIN_NAME="wasm-pack.exe"
              ;;
            *)
              echo "::error::Unsupported runner for wasm-pack pinned install: ${RUNNER_OS}-${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          URL="https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-${TRIPLE}.tar.gz"
          INSTALL_DIR="${HOME}/.local/bin"
          # ${RUNNER_TEMP} is Windows-style (e.g. D:\a\_temp) on windows-latest, which the tar
          # child process launched from Git Bash can't resolve in `tar -xzf`. Convert it to
          # a POSIX path on Windows and pass-through unchanged on Linux/macOS.
          if command -v cygpath >/dev/null 2>&1; then
            RUNNER_TEMP_POSIX="$(cygpath -u "${RUNNER_TEMP}")"
          else
            RUNNER_TEMP_POSIX="${RUNNER_TEMP}"
          fi
          TARBALL="${RUNNER_TEMP_POSIX}/wasm-pack-${WASM_PACK_VERSION}-${TRIPLE}.tar.gz"

          mkdir -p "${INSTALL_DIR}"

          echo "Downloading ${URL}"
          curl --fail --silent --show-error --location --output "${TARBALL}" "${URL}"

          # SHA-256 verification — Python is portable across the BSD-vs-GNU
          # `sha256sum` / `shasum` split on macOS-Linux-Windows (the
          # workflow runs on all three).
          echo "Verifying SHA-256 of ${TARBALL}"
          ACTUAL_SHA256="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${TARBALL}")"
          if [[ "${ACTUAL_SHA256}" != "${SHA256}" ]]; then
            echo "::error::wasm-pack tarball SHA-256 mismatch: expected ${SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi

          tar -xzf "${TARBALL}" -C "${INSTALL_DIR}" --strip-components=1 \
              "wasm-pack-${WASM_PACK_VERSION}-${TRIPLE}/${BIN_NAME}"
          chmod +x "${INSTALL_DIR}/${BIN_NAME}"

          # Persist INSTALL_DIR for subsequent steps (each runs in a fresh
          # shell). GitHub-hosted runners include ~/.local/bin in the
          # default PATH, but the GITHUB_PATH append is a belt-and-
          # suspenders guarantee.
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

          echo "Installed wasm-pack $("${INSTALL_DIR}/${BIN_NAME}" --version) at ${INSTALL_DIR}/${BIN_NAME}"

      # Toolchain with the wasm32-unknown-unknown target. `setup-rust-env`
      # also installs libssl/fontconfig system deps on Linux (unnecessary
      # for a pure WASM build but harmless, and keeps the workflow aligned
      # with the rest of the CI surface so a future shared refactor
      # doesn't have to special-case this file). sccache is OFF — the
      # wasm32 test target is rebuilt for each test run anyway (no
      # cache invalidation between the test compile and the wasm-pack
      # link step), and cross-OS cache reuse is unreliable for the
      # wasm32 target (cargo encodes the host arch into
      # target-fingerprinted artifacts).
      - name: Set up Rust toolchain (with wasm32 target)
        uses: ./.github/actions/setup-rust-env
        with:
          toolchain: wasm32-unknown-unknown
          sccache: 'false'

      # Node.js is required by `wasm-pack test --node` — it spawns a
      # Node child process to execute the generated wasm-bindgen
      # shim. Pin to the current LTS (20), the same version used by
      # `node-bindings.yml` so a single `node-version` bump is
      # symmetric across all bindings workflows.
      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      # `wasm-pack test --node fluxion-wasm` compiles the crate to
      # wasm32-unknown-unknown and then runs every
      # `#[wasm_bindgen_test]` under Node. The crate is a wasm-bindgen
      # consumer (no explicit `[[bin]]`/`[lib]` integration target
      # needed beyond the existing `crate-type = ["cdylib", "rlib"]`).
      # `--node` is the runtime, not a deploy target — it execs the
      # generated shim + .wasm inside Node's V8 isolate, which is the
      # same engine a browser would use for the WASM artifact.
      - name: Run wasm-pack test --node (fluxion-wasm)
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack test --node fluxion-wasm
