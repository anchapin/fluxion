# ASHRAE 140 Strict Annual-Energy CI Gate (Issue #1333, #2506)
#
# Runs the strict ±15% annual-energy tolerance tests for ASHRAE 140
# Cases 600 (low-mass baseline) and 900 (high-mass) on every PR and push
# to main. This is the durable regression guard that locks in the post-#1323
# roof-solar physics fix (PR #1356) and prevents silent regressions in the
# annual-energy band.
#
# ─────────────────────────────────────────────────────────────────────────
# How the gate works (post-#2506: transparent + regression-catching)
# ─────────────────────────────────────────────────────────────────────────
# Two strict tolerance tests exist:
#   - test_case_600_annual_energy_ashrae140_tolerance  (zone_balance_eplus_isolation)
#   - test_case_900_annual_energy_ashrae140_tolerance  (zone_balance_eplus_isolation)
# They assert that annual heating AND cooling land within ±15% of the NREL
# published band. Both are `#[ignore]`'d because the Case 600/900 annual
# COOLING physics gap is NOT yet closed (post-#1323 / #1213 / #1328 chain).
# As of the 2026-08-11 baseline, HEATING passes the ±15% band for both
# cases, but COOLING is ~36% (Case 600) and ~61% (Case 900) below the band
# midpoint. Un-ignoring now would fail the gate on every PR and block all
# development (RULES.md: no parameter tuning to fake a pass).
#
# Pre-#2506 the workflow ran these tests WITHOUT --include-ignored, so they
# reported `ignored` and the gate was silently green on every PR — a PR
# that worsened the cooling gap would pass undetected. That is the bug
# #2506 closes.
#
# Post-#2506 the gate instead:
#   1. Runs the two strict tests WITH `--include-ignored` so they execute
#      and print their measured H/C values vs. the ±15% band, e.g.
#        "[#1147 Case 600 strict] H=5.236 MWh (band 4.314-5.836), \
#         C=2.455 MWh (band 4.275-5.784)"
#      The step uses `set +e` because the cooling assertions WILL fail
#      today; the raw cargo exit code is recorded but does NOT fail the
#      job.
#   2. Runs the two infrastructure tests (NOT ignored) which MUST pass —
#      a failure there is a real regression, not a known structural gap.
#   3. `scripts/check_strict_energy_gate_regression.py` parses the printed
#      values, recomputes each metric's gap as a % of the band midpoint,
#      and compares against the recorded baseline in
#      `tests/reference_data/zone_balance/strict_energy_gate_baseline.json`.
#      Verdict per metric:
#        PASS        gap == 0 (within ±15% band)
#        KNOWN-FAIL  gap > 0 but within `regression_tolerance_pp` of baseline
#                    (the documented structural cooling gap — tracked, not
#                    silently ignored)
#        REGRESSION  gap worsened beyond the tolerance, OR a previously-PASS
#                    metric drifted outside the band beyond the tolerance
#                    → fails the gate.
#   4. The check also fails if a case line is missing from the log (a
#      renamed test / drifted filter is itself a gate-coverage regression).
#
# When the physics is fixed and a cooling metric re-enters its band, lower
# its baseline gap in the same PR (or un-ignore the tests and remove this
# baseline machinery — issues #1333 / #2506 acceptance). The baseline must
# NEVER be raised to hide a regression (AGENTS.md / RULES.md).
#
# The four test filters are each precise enough to match exactly one test
# (cargo test accepts only one TESTNAME positional arg, and a too-broad
# substring like "_infrastructure" matches 7 blind-mode tests in
# `ashrae_140_blind_validation.rs`).
#
# Why --release
# -------------
# The strict ±15% tolerance tests run annual simulations (8760 hourly
# steps). Release mode matches the production binary and avoids the
# 5-10x slowdown that debug-mode unit tests incur. Same reasoning as
# `.github/workflows/ashrae_140_validation.yml`.
#
# Why --features ort
# ------------------
# Case 900 routes through the production `MultiNodeSolver` (9R4C thermal
# network) when the construction is HighMass. That code path lives
# behind the `ort` feature gate (per issue #1294). Without `--features
# ort`, Case 900 would compile out of the `MultiNodeSolver` arm and the
# strict gate would only exercise the low-mass path — false-positive
# coverage.
#
# Status check name
# -----------------
# The job id is `strict-energy-gate`; the human-readable name is
# "ASHRAE 140 Strict Energy Gate (Issue #1333)". It is declared in
# `release_gates.yaml` under `ci.required_checks`.
#
# Linked issues
# -------------
# - #2506 — un-ignore / make the gate non-silent about known 600/900 failures
# - #1333 — original gate wiring (this issue)
# - #1323 — roof-solar physics fix (PR #1356)
# - #1328 — Case 900 peak-cooling closure verification
# - #1295 — established the strict energy-conservation invariant CI pattern
# - #1147 — ASHRAE 140 blind validation baseline
# - #1283 — ValidationMode::Blind wiring
# - #1332 — extended Blind coverage to Cases 800/810/920/950/960

name: ASHRAE 140 Strict Energy Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize strict-gate runs per ref so two pushes don't double-allocate
# runners while the previous run is still queued. Different refs run in
# parallel (so feature branches don't queue behind main).
concurrency:
  group: ashrae-140-strict-energy-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  strict-energy-gate:
    name: ASHRAE 140 Strict Energy Gate (Issue #1333)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev

      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ashrae-140-strict-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ashrae-140-strict-gate-${{ runner.os }}-

      - name: Strict ±15% Case 600/900 tolerance (transparent measurement)
        # Runs BOTH `*_annual_energy_ashrae140_tolerance` tests with
        # `--include-ignored` so their measured H/C values print. The
        # cooling assertions WILL fail today (known structural gap) — the
        # step deliberately does NOT fail (`set +e` + `exit 0`); the
        # regression-check step below makes the real pass/fail decision
        # against the recorded baseline (issue #2506).
        run: |
          set +e
          cargo test --release --features ort --verbose \
            --test zone_balance_eplus_isolation \
            _annual_energy_ashrae140_tolerance \
            -- --include-ignored --nocapture \
            2>&1 | tee /tmp/strict_gate_output.txt
          ec=${PIPESTATUS[0]}
          echo "---"
          echo "strict-tolerance-raw-exit=$ec (non-zero expected: cooling assertion fails today)"
          echo "strict-tolerance-raw-exit=$ec" >> /tmp/strict_gate_output.txt
          exit 0

      - name: ValidationMode::Blind Case 600 infrastructure (must pass)
        # Test 3/4: API-level infrastructure for Case 600 (already passing).
        # Filter `_blind_mode_case_600_infrastructure` is precise — only
        # one test in the workspace matches this substring. NOT ignored;
        # a failure here is a real regression.
        run: |
          cargo test --release --features ort --verbose \
            --test ashrae_140_blind_validation \
            _blind_mode_case_600_infrastructure \
            2>&1 | tee -a /tmp/strict_gate_output.txt

      - name: ValidationMode::Blind Case 900 infrastructure (must pass)
        # Test 4/4: API-level infrastructure for Case 900 (already passing).
        run: |
          cargo test --release --features ort --verbose \
            --test ashrae_140_blind_validation \
            _blind_mode_case_900_infrastructure \
            2>&1 | tee -a /tmp/strict_gate_output.txt

      - name: Regression check vs. known baseline (issue #2506)
        # Parses the measured H/C values from the strict-tolerance step,
        # computes each metric's gap from the ±15% band, and compares
        # against the recorded baseline. Fails ONLY on regression beyond
        # the tolerance, or if a measured line is missing (filter drift).
        # Also confirms the two infrastructure tests ran and passed.
        run: |
          set -e
          echo "=== Strict gate coverage + regression check ==="
          # Strip ANSI colour codes for grep / the parser.
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/strict_gate_output.txt

          # Coverage: the two infrastructure tests must appear as `ok`.
          # (The two strict tolerance tests are coverage-checked by the
          # Python parser, which fails if a case line is missing.)
          for t in \
            test_blind_mode_case_600_infrastructure \
            test_blind_mode_case_900_infrastructure ; do
            if grep -qE "^test $t \.\.\. ok$" /tmp/strict_gate_output.txt; then
              echo "  COVERED (pass): $t"
            else
              echo "  DROPPED OR FAILING: $t"
              echo "  This infrastructure test must pass. A missing/failed"
              echo "  line is a real regression (not a known structural gap)."
              exit 1
            fi
          done

          echo
          echo "=== Strict ±15% tolerance regression analysis ==="
          python3 scripts/check_strict_energy_gate_regression.py /tmp/strict_gate_output.txt

      - name: Upload strict-gate log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ashrae-140-strict-energy-gate
          path: /tmp/strict_gate_output.txt
          retention-days: 14
