name: Rust Tests & Linting

on:
  push:
    branches: [main]
  pull_request:
    # Issue #3367: skip the heavy `Rust Tests & Linting` matrix on
    # docs-only PRs. PRs that touch only `docs/**`, `*.md`, `*.mdx`,
    # or the canonical root markdown files do not need the 38-minute
    # cargo test long pole — the branch-protection
    # `release_gates.yaml::ci.required_checks_workflow_only` set
    # (issue #3142) already enforces the documentation-only branch-
    # protection invariant, and docs PRs cannot change Rust runtime
    # behaviour.
    #
    # The explicit root-`.md` entries are defensive: `**.md` already
    # matches them, but listing them inline documents which root files
    # are considered "documentation" for this carve-out so a future
    # contributor adding a new root `.md` file does not have to ask.
    # Companion to PR #3369 (nextest rollout, ADR-0015 per-`head_sha`
    # concurrency).
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.mdx"
      - "README.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - "RULES.md"
      - "CODEBASE_MAP.md"
      - "SCORECARD.md"
      - "KNOWN_ISSUES.md"
      - "ASHRAE140_RESULTS.md"
      - "CONTRIBUTING.md"
  schedule:
    # Issue #2768: nightly cron for the cycle downward-trend guard's R2
    # enforcement (downward progress within the last 14 snapshots). Only
    # the `cycle-trend-nightly` job below listens for `schedule` events;
    # every other job keeps its explicit `pull_request` / `push: main`
    # gating so the nightly trigger does NOT broaden their runs.
    #        minute hour dom month dow
    - cron: "17 3 * * *"
  workflow_dispatch:
    # Manual trigger for the `cycle-trend-nightly` job (issue #2768).

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.sha
      || github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'push'
      && contains('refs/heads/main,refs/heads/develop', github.ref)
    }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

# Job execution policy
# ---------------------------------------------------------------------------
# PR branch push  ->  fmt + clippy + test-pr (ubuntu-latest, unit tests only).
#                     Target wall time: < 5 minutes.
# Main merge      ->  All of the above + test-full (3-platform matrix) +
#                     build-release.
# ---------------------------------------------------------------------------
#
# Runner routing (Linux jobs)
# ---------------------------------------------------------------------------
# FLUXION_LINUX_RUNNER repo variable controls where heavy Linux jobs run.
# Set to "fluxion-ci" to use self-hosted Hetzner runners; leave unset to
# use GitHub-hosted ubuntu-latest (free for public repos).
#
# Hetzner overflow pool (issue #2133): When GH-hosted runners are saturated
# (queued >5 min), jobs automatically fall back to the on-demand Hetzner
# overflow pool (labels: self-hosted,fluxion-overflow) via the probe pattern.
# The static FLUXION_LINUX_RUNNER pool continues to operate independently.
#
# See docs/self-hosted-runners.md for provisioning instructions.
# ---------------------------------------------------------------------------

# Least-privilege GITHUB_TOKEN grants (Issue #2526): the test matrix only checks
# out code, builds, runs tests, and uploads artifacts — no repo write-back.
permissions:
  contents: read

jobs:
  # -- Always: fast gate (both PR and main) ----------------------------------
  # PRs: single-platform (ubuntu only) for fast signal.
  # Main: full 3-platform matrix for cross-platform validation.

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_set.name }})
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: |
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        rust: [stable]
        feature_set:
          - {name: "no-default",       flags: "--no-default-features"}
          - {name: "wiring-tracing",   flags: "--features wiring-tracing"}
          - {name: "multi-zone",       flags: "--features wiring-tracing,multi-zone"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'

      - name: Cache ONNX Runtime binaries
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      # Issue #3366 / ADR-0014: consolidated the 7-line `cargo test` block
      # into a single `cargo nextest run` invocation. Each test binary
      # runs in its own process; per-binary concurrency overrides live
      # in `.config/nextest.toml` (audit findings). `--no-fail-fast`
      # keeps the matrix honest — a single failing binary does not
      # abort the whole run.
      #
      # The test selector list matches the original 7-line block's
      # scope (root lib + 4 root integration tests + the workspace
      # package tests called out by Issues #2909 / #2904). The full
      # `--workspace --all-targets` scope from ADR-0014 is deferred —
      # it would expand to ~7,900 tests across the whole workspace and
      # surface pre-existing failures in tests that the original 7-line
      # block intentionally did NOT run (e.g. broader ASHRAE 140 case
      # series, `test_edge_cases`, `test_delta_analysis`). Tracking
      # issue: revisit after the deferred ASHRAE 140 cooling-gate fix
      # lands (RULES.md §"Physics and Validation Guardrails").
      #
      # Matrix `flags` carries the per-entry nextest args verbatim (e.g.
      # `--no-default-features` for the "no-default" entry, `--features
      # wiring-tracing` for the "wiring-tracing" entry, `--features
      # wiring-tracing,multi-zone` for the "multi-zone" entry). The
      # earlier `--features ${{ matrix.feature_set.nextest_flags }}`
      # template was broken: `nextest_flags` does not exist on the
      # matrix object, so the interpolation produced an empty string
      # and cargo-nextest rejected every matrix entry with
      # `error: a value is required for '--features <FEATURES>'`. The
      # interpolation below yields the full flag string and bash's
      # word-splitting parses it correctly per matrix entry.
      - name: Run tests
        run: |
          cargo nextest run \
            -p fluxion \
            --lib \
            --test surface_flux_provider_isolation \
            --test regression_exterior_film_unification \
            --test validation_empirical_harness \
            --test hvac_bestest \
            -p fluxion-behavior --test lighting_occupancy_integration \
            -p fluxion-twin --test mqtt_ukf_integration --test ukf_covariance_stability --test ukf_van_der_pol --test websocket_memory_leak \
            --test-threads=2 \
            --no-fail-fast \
            ${{ matrix.feature_set.flags }}
        env:
          PYO3_PYTHON: /usr/bin/python3

  # ---------------------------------------------------------------------------
  # Issue #2133: Hetzner autoscaling overflow
  #
  # Probe pattern: a lightweight job tries to grab a GH runner with a 5-minute
  # timeout.  If GH runners are saturated, the probe is cancelled after 5 min
  # and the overflow path (ci-on-hetzner) runs on the Hetzner autoscaling pool.
  #
  # Jobs below follow this pattern.  Each group has:
  #   <job>-gh-probe  — lightweight GH availability probe (5-min timeout)
  #   <job>-gh        — CI on GH-hosted runner (runs if probe succeeds)
  #   <job>-hz        — CI on Hetzner overflow (runs if probe fails/cancelled)
  #
  # The FLUXION_LINUX_RUNNER || ubuntu-latest jobs (test-full, build-release,
  # cuda-smoke, cuda-parity) are unaffected — they already route to the static
  # self-hosted pool as primary with GH as fallback.
  # ---------------------------------------------------------------------------

  # -- Energy Conservation (Issue #1295) ---------------------------------------

  energy-conservation-gh-probe:
    name: "EC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  energy-conservation-gh:
    name: "Energy Conservation (GH)"
    needs: energy-conservation-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run energy conservation tests
        run: |
          cargo test --test test_energy_conservation --verbose 2>&1 | tee /tmp/energy_test_output.txt
          cargo test --test zone_balance_eplus_isolation --verbose 2>&1 | tee /tmp/zone_balance_test_output.txt
      - name: Extract violation counts
        run: |
          echo "=== Energy Conservation Test Results ==="
          echo "Checking for energy conservation violations..."
          ENERGY_VIOLATIONS=$(grep -c "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt 2>/dev/null || echo "0")
          echo "Total violations found: $ENERGY_VIOLATIONS"
          if [ "$ENERGY_VIOLATIONS" -gt "0" ]; then
            echo "FAIL: Energy conservation violations detected"
            grep -A2 "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt
            exit 1
          fi
          echo "PASS: No energy conservation violations"

  energy-conservation-hz:
    name: "Energy Conservation (Hetzner Overflow)"
    needs: energy-conservation-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    # Only run if GH probe timed out (GH runners saturated) or was cancelled
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.energy-conservation-gh-probe.result == 'failure'
          || needs.energy-conservation-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run energy conservation tests
        run: |
          cargo test --test test_energy_conservation --verbose 2>&1 | tee /tmp/energy_test_output.txt
          cargo test --test zone_balance_eplus_isolation --verbose 2>&1 | tee /tmp/zone_balance_test_output.txt
      - name: Extract violation counts
        run: |
          echo "=== Energy Conservation Test Results ==="
          echo "Checking for energy conservation violations..."
          ENERGY_VIOLATIONS=$(grep -c "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt 2>/dev/null || echo "0")
          echo "Total violations found: $ENERGY_VIOLATIONS"
          if [ "$ENERGY_VIOLATIONS" -gt "0" ]; then
            echo "FAIL: Energy conservation violations detected"
            grep -A2 "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt
            exit 1
          fi
          echo "PASS: No energy conservation violations"

  # -- Rustfmt ----------------------------------------------------------------

  fmt-gh-probe:
    name: "Fmt Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "GH runner acquired"

  fmt-gh:
    name: Rustfmt (GH)
    needs: fmt-gh-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-env
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  fmt-hz:
    name: Rustfmt (Hetzner Overflow)
    needs: fmt-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      needs.fmt-gh-probe.result == 'failure'
      || needs.fmt-gh-probe.result == 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-env
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  # -- Clippy -----------------------------------------------------------------

  clippy-gh-probe:
    name: "Clippy Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - run: echo "GH runner acquired"

  clippy-gh:
    name: Clippy (GH)
    needs: clippy-gh-probe
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
      - run: cargo clippy --lib -- -D warnings

  clippy-hz:
    name: Clippy (Hetzner Overflow)
    needs: clippy-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    env:
      CARGO_BUILD_JOBS: 1
    if: |
      needs.clippy-gh-probe.result == 'failure'
      || needs.clippy-gh-probe.result == 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
      - run: cargo clippy --lib -- -D warnings

  # -- Issue #1723: KNOWN_ISSUES.md stale check --------------------------------

  known-issues-stale-gh-probe:
    name: "KI Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  known-issues-stale-gh:
    name: "Known Issues Stale Check (GH)"
    needs: known-issues-stale-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run stale check
        run: python3 scripts/check_known_issues_stale.py

  known-issues-stale-hz:
    name: "Known Issues Stale Check (Hetzner Overflow)"
    needs: known-issues-stale-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.known-issues-stale-gh-probe.result == 'failure'
          || needs.known-issues-stale-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run stale check
        run: python3 scripts/check_known_issues_stale.py

  # -- Main only: cross-platform matrix --------------------------------------
  # Validates that nothing is accidentally Linux/x86-specific before changes
  # land on main. Linux slot uses FLUXION_LINUX_RUNNER if set (self-hosted
  # Hetzner), falling back to GitHub-hosted ubuntu-latest. macOS and Windows
  # always use GitHub-hosted runners.

  test-full:
    name: Test Suite (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && vars.FLUXION_LINUX_RUNNER) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Cache ONNX Runtime binaries
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-
      - name: Run tests
        run: |
          cargo test --lib --verbose --no-default-features
          cargo test --test regression_exterior_film_unification --verbose --no-default-features
          # Issue #1803 / Plan T10.1 — empirical validation harness skeleton.
          cargo test --test validation_empirical_harness --verbose --no-default-features
          # Issue #1756 — HVAC BESTEST CI runner stub (dummy, always-green).
          cargo test --test hvac_bestest --verbose --no-default-features
          # Issue #2909 — fluxion-behavior workspace E2E integration tests
          # (occupancy → thermal → lighting → comfort → moisture).
          cargo test -p fluxion-behavior --test lighting_occupancy_integration --verbose --no-default-features
          # Issue #2904 — fluxion-twin workspace integration tests
          # (UKF van der Pol, UKF covariance stability, MQTT → UKF pipeline,
          # WebSocket broadcaster memory-leak). Closes #2058, #2060, #2061,
          # #2064.
          cargo test -p fluxion-twin --tests --verbose --no-default-features
        env:
          PYO3_PYTHON: /usr/bin/python3

  # -- Main only: release build verification ---------------------------------

  build-release:
    name: Build Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      # Issue #2983: also build the workspace siblings in release mode so the
      # main-branch release smoke catches sibling regressions. The per-PR
      # `Workspace Check` job handles default-feature coverage; this step
      # confirms the workspace also links in release mode. Uses default
      # features (root has `default = []`) so the cuda/ort features are
      # not pulled in on CPU-only runners.
      - run: cargo build --release --workspace --verbose --exclude fluxion-tauri

  # -- Issue #2983: `cargo check --workspace` ---------------------------------
  # Bare `cargo build` / `cargo test` only compile the root package because
  # `default-members = ["."]` is set in the workspace root. This gate catches
  # sibling regressions like PR #2960 (`chore(deps): cargo-major bump`)
  # which broke `fluxion-behavior` via the `rand 0.8 -> 0.9` bump but left
  # the root crate compiling green. Without `--workspace` the breakage
  # slipped through to `develop`. Follows the GH-probe + Hetzner-overflow
  # pattern (issue #2133). Uses default features (root has `default = []`)
  # so the cuda / ort features are not pulled in on CPU-only runners — see
  # the issue body §"Acceptance" for the rationale.

  workspace-check-gh-probe:
    name: "Workspace Check Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  workspace-check-gh:
    name: "Workspace Check (GH)"
    needs: workspace-check-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run workspace check
        run: cargo check --workspace --verbose --exclude fluxion-tauri
      # Issue #3125: catch example drift. `--examples` is NOT included by
      # default in `cargo check --workspace`, so a renamed field/method
      # silently breaks `examples/*.rs` (which are user-facing docs) until
      # a downstream user complains. The new step adds `--examples
      # --all-targets` to catch this drift at PR time.
      #
      # `continue-on-error: true` because the 4 broken examples reported
      # in #3126 (`multi_zone_demo.rs`, `debug_solar_case_600.rs`,
      # `tutorial_custom_model.rs`, `test_6r2c.rs`) still fail to compile
      # on current `develop`. The check observes the drift without
      # blocking PRs; once #3126 lands and `cargo check --workspace
      # --examples --all-targets` exits 0 against `develop`, drop the
      # `continue-on-error` so this becomes a required gate.
      - name: Run workspace check (examples, Issue #3125)
        continue-on-error: true
        run: cargo check --workspace --examples --all-targets --verbose --exclude fluxion-tauri

  workspace-check-hz:
    name: "Workspace Check (Hetzner Overflow)"
    needs: workspace-check-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.workspace-check-gh-probe.result == 'failure'
          || needs.workspace-check-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run workspace check
        run: cargo check --workspace --verbose --exclude fluxion-tauri
      # Issue #3125: see `workspace-check-gh` for the rationale behind
      # `--examples --all-targets` + `continue-on-error: true`.
      - name: Run workspace check (examples, Issue #3125)
        continue-on-error: true
        run: cargo check --workspace --examples --all-targets --verbose --exclude fluxion-tauri

  # -- ASHRAE Cases Cycle Check -----------------------------------------------

  ashrae-cases-cycle-gh-probe:
    name: "ACC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  ashrae-cases-cycle-gh:
    name: "Ashrae Cases Cycle Check (GH)"
    needs: ashrae-cases-cycle-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run cycle check
        run: python3 scripts/check_ashrae_cases_cycle.py

  ashrae-cases-cycle-hz:
    name: "Ashrae Cases Cycle Check (Hetzner Overflow)"
    needs: ashrae-cases-cycle-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.ashrae-cases-cycle-gh-probe.result == 'failure'
          || needs.ashrae-cases-cycle-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run cycle check
        run: python3 scripts/check_ashrae_cases_cycle.py

  # -- Physics <-> Sim Cycle Check (Issue #2463) -----------------------------
  # Mirrors the `Ashrae Cases Cycle Check` job above (Issue #1441) but for
  # the `physics <-> sim` cycle documented in ARCHITECTURE.md §"Remaining
  # cycles" and docs/mutation_testing_crate_split.md §"Phase 2". The
  # companion cycle-break issue drives the reported edge count from 5
  # (current baseline) down to 0; this guard prevents silent regressions
  # in the meantime.
  #
  # Canonical listener job name: `Physics-Sim-Cycle-Check`. The "(GH)"
  # and "(Hetzner Overflow)" suffixes match the issue #1441 pattern; the
  # canonical name (sans suffix) is what AGENTS.md §CI Gates and
  # release_gates.yaml::ci.required_checks reference. Adding the new gate
  # to release_gates.yaml::ci.required_checks is deferred to the merge PR
  # that closes both this issue and the companion cycle-break issue
  # (see issue body §"Notes" for the rationale).

  physics-sim-cycle-gh-probe:
    name: "PSC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  physics-sim-cycle-gh:
    name: "Physics-Sim-Cycle-Check (GH)"
    needs: physics-sim-cycle-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run physics-sim cycle check
        run: python3 scripts/check_physics_sim_cycle.py

  physics-sim-cycle-hz:
    name: "Physics-Sim-Cycle-Check (Hetzner Overflow)"
    needs: physics-sim-cycle-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.physics-sim-cycle-gh-probe.result == 'failure'
          || needs.physics-sim-cycle-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run physics-sim cycle check
        run: python3 scripts/check_physics_sim_cycle.py

  # -- Cycle Downward Trend Guard (Issue #2768) ------------------------------
  # Companion to `Ashrae Cases Cycle Check` (#1441) and `Physics-Sim-Cycle-
  # Check` (#2463). The existing guards enforce a *magnitude* contract
  # (count <= baseline); this guard enforces a *directional* contract:
  # the cycle must trend toward zero, and a net-flat edge swap (removing
  # one edge while adding another of equal count but different
  # criticality) is rejected. Backed by `scripts/check_cycle_downward_
  # trend.py` reading the append-only ledger
  # `scripts/cycle_baseline_history.json`.
  #
  # NOT in `release_gates.yaml::ci.required_checks` yet -- letting it run
  # as a non-blocking check first to validate the signature stability of
  # the edge scan across the PR fleet. Promote to `required_checks`
  # after a green week (see the PR that closes #2768).
  #
  # The `cycle-trend-nightly` job below is the only consumer of the
  # `schedule` trigger added to this workflow's `on:` block. It enforces
  # R2 (downward progress within the last 14 snapshots); per-PR jobs do
  # not enforce R2, so an ordinary PR that doesn't touch the cycle still
  # merges.

  cycle-trend-gh:
    name: "Cycle Downward Trend Guard (Issue #2768)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: "Run cycle downward-trend guard (per-PR: R1 + R3)"
        run: python3 scripts/check_cycle_downward_trend.py

  cycle-trend-nightly:
    name: "Cycle Downward Trend Guard (nightly, Issue #2768)"
    # Read-only R2 enforcement: fails if the cycle has been frozen at the
    # same total for >= 14 consecutive snapshots. Does NOT auto-update the
    # ledger -- snapshots are appended manually via `--update` as part of
    # the cycle-removal workflow (see ARCHITECTURE.md Section "Downward
    # trend guard (Issue #2768)").
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: "Run cycle downward-trend guard (nightly: R1 + R2 + R3)"
        run: python3 scripts/check_cycle_downward_trend.py --nightly

  # -- Issue #1603: GPU smoke test for InferenceBackend::CUDA -------------
  # Runs on every PR and main push. On CPU-only runners the test skips
  # gracefully (cuda_ep_available() returns false at runtime). On GPU runners
  # (self-hosted with NVIDIA GPU) the test executes fully and verifies
  # CUDA-vs-CPU numerical parity within 0.1%.
  # Compiling with --features cuda ensures the CUDA EP gate in the source
  # is exercised even when no physical GPU is present.

  cuda-smoke:
    name: CUDA Smoke Test (Issue #1603)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      # -- Issue #2962: skip the CUDA build on CPU-only runners ---------------
      # `cargo build --features cuda` requires nvcc + cudnn headers; on
      # GitHub-hosted CPU runners those are absent and the build fails with
      # bindgen / pkg-config errors. Detect nvcc up-front and skip the build
      # step (which would otherwise fail CI for unrelated PRs — see #2944,
      # #2959, #2960). Actual CUDA validation on self-hosted GPU runners is
      # unchanged.
      - name: Detect CUDA toolchain
        id: cuda
        run: |
          if ! command -v nvcc >/dev/null 2>&1; then
            echo "cuda_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::nvcc not found on this runner; skipping CUDA job (CPU-only runner, see issue #2962)"
          else
            echo "cuda_available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with CUDA support
        if: steps.cuda.outputs.cuda_available == 'true'
        run: cargo build --features cuda --verbose
      - name: Run CUDA smoke test
        if: steps.cuda.outputs.cuda_available == 'true'
        run: cargo test --test surrogate_cuda_smoke --features cuda --verbose
        env:
          PYO3_PYTHON: /usr/bin/python3

  # -- Issue #1895: CPU/CUDA inference parity test on GPU hardware ---------
  # Runs on every PR and main push. Executes the #[ignore]'d CUDA parity
  # test from tests/surrogate_backend_parity.rs on a GPU-enabled runner.
  #
  # The test (test_cpu_vs_cuda_parity_within_tolerance) verifies CUDA EP
  # wiring + session-pool construction; it skips gracefully when no GPU is
  # present at runtime. With --features ort the ONNX Runtime CUDA EP is
  # compiled in and can be exercised on real hardware.
  #
  # Advisory only (non-blocking): the CPU-vs-CUDA parity assertion is
  # informational until a real ONNX model is committed (issue #1285).
  # The job uses continue-on-error so a missing GPU runner does not fail CI.

  cuda-parity:
    name: CUDA Parity (Issue #1895)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      # -- Issue #2962: skip the CUDA build on CPU-only runners ---------------
      # See cuda-smoke job above for rationale. Detects nvcc and gates the
      # build + test steps so they are skipped (not failed) on runners that
      # lack the CUDA toolkit. continue-on-error on the job ensures that any
      # remaining parity-test drift does not block PRs.
      - name: Detect CUDA toolchain
        id: cuda
        run: |
          if ! command -v nvcc >/dev/null 2>&1; then
            echo "cuda_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::nvcc not found on this runner; skipping CUDA job (CPU-only runner, see issue #2962)"
          else
            echo "cuda_available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with CUDA + ONNX Runtime
        if: steps.cuda.outputs.cuda_available == 'true'
        run: cargo build --features cuda --features ort --verbose
      - name: Run CUDA parity test
        if: steps.cuda.outputs.cuda_available == 'true'
        run: cargo test --test surrogate_backend_parity --features cuda --features ort -- --ignored
        env:
          PYO3_PYTHON: /usr/bin/python3
      - name: Upload parity test results
        if: always()
        run: |
          # Collect any test output logs for artifact upload.
          # The parity test skips gracefully when no GPU is present, so
          # there is no per-timestep CSV to upload (issue #1285: no
          # committed ONNX model yet). This step is a no-op placeholder
          # for future artifact upload once #1285 is resolved.
          echo "CUDA parity test completed — see workflow logs for details"
          echo "Per-timestep CSV upload requires issue #1285 (committed ONNX model)"

  # -- fluxion-grid Integration Tests (Issue #2908) --------------------------
  # `fluxion-grid` has zero workspace integration tests (Battery/PV/PowerFlow/
  # Joint-Thermal-Electrical convergence not E2E tested). The
  # `tests/grid_solver_integration.rs` file exercises three scenarios:
  #   1. 3-node Newton-Raphson power-flow round-trip,
  #   2. 10-heat-pump load case on a radial feeder,
  #   3. IEEE 33-bus co-simulation (Joint-Thermal-Electrical solver + power
  #      flow with the ANSI C84.1 voltage-band acceptance criterion).
  # Each test asserts convergence via `max |ΔP|, max |ΔQ| < 1e-6 pu`. The
  # package has `default = []`, so no feature flag is forwarded.

  fluxion-grid-integration-gh-probe:
    name: "FGI Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  fluxion-grid-integration-gh:
    name: "fluxion-grid Integration Tests (GH)"
    needs: fluxion-grid-integration-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run fluxion-grid integration tests
        run: |
          cargo test -p fluxion-grid --test grid_solver_integration --verbose

  fluxion-grid-integration-hz:
    name: "fluxion-grid Integration Tests (Hetzner Overflow)"
    needs: fluxion-grid-integration-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.fluxion-grid-integration-gh-probe.result == 'failure'
          || needs.fluxion-grid-integration-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run fluxion-grid integration tests
        run: |
          cargo test -p fluxion-grid --test grid_solver_integration --verbose
