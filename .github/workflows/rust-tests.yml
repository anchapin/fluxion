name: Rust Tests & Linting

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

# Job execution policy
# ---------------------------------------------------------------------------
# PR branch push  ->  fmt + clippy + test-pr (ubuntu-latest, unit tests only).
#                     Target wall time: < 5 minutes.
# Main merge      ->  All of the above + test-full (3-platform matrix) +
#                     build-release.
# ---------------------------------------------------------------------------
#
# Runner routing (Linux jobs)
# ---------------------------------------------------------------------------
# FLUXION_LINUX_RUNNER repo variable controls where heavy Linux jobs run.
# Set to "fluxion-ci" to use self-hosted Hetzner runners; leave unset to
# use GitHub-hosted ubuntu-latest (free for public repos).
#
# Hetzner overflow pool (issue #2133): When GH-hosted runners are saturated
# (queued >5 min), jobs automatically fall back to the on-demand Hetzner
# overflow pool (labels: self-hosted,fluxion-overflow) via the probe pattern.
# The static FLUXION_LINUX_RUNNER pool continues to operate independently.
#
# See docs/self-hosted-runners.md for provisioning instructions.
# ---------------------------------------------------------------------------

jobs:
  # -- Always: fast gate (both PR and main) ----------------------------------
  # PRs: single-platform (ubuntu only) for fast signal.
  # Main: full 3-platform matrix for cross-platform validation.

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_set.name }})
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: |
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        rust: [stable]
        feature_set:
          - {name: "no-default",       flags: "--no-default-features"}
          - {name: "wiring-tracing",   flags: "--features wiring-tracing"}
          - {name: "multi-zone",       flags: "--features wiring-tracing,multi-zone"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'

      - name: Cache ONNX Runtime binaries
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-

      - name: Run tests
        run: |
          cargo test --lib --verbose ${{ matrix.feature_set.flags }}
          cargo test --test surface_flux_provider_isolation --verbose ${{ matrix.feature_set.flags }}
          cargo test --test regression_exterior_film_unification --verbose ${{ matrix.feature_set.flags }}
          # Issue #1803 / Plan T10.1 — empirical validation harness skeleton.
          cargo test --test validation_empirical_harness --verbose ${{ matrix.feature_set.flags }}
          # Issue #1756 — HVAC BESTEST CI runner stub (dummy, always-green).
          cargo test --test hvac_bestest --verbose ${{ matrix.feature_set.flags }}
        env:
          PYO3_PYTHON: /usr/bin/python3

  # ---------------------------------------------------------------------------
  # Issue #2133: Hetzner autoscaling overflow
  #
  # Probe pattern: a lightweight job tries to grab a GH runner with a 5-minute
  # timeout.  If GH runners are saturated, the probe is cancelled after 5 min
  # and the overflow path (ci-on-hetzner) runs on the Hetzner autoscaling pool.
  #
  # Jobs below follow this pattern.  Each group has:
  #   <job>-gh-probe  — lightweight GH availability probe (5-min timeout)
  #   <job>-gh        — CI on GH-hosted runner (runs if probe succeeds)
  #   <job>-hz        — CI on Hetzner overflow (runs if probe fails/cancelled)
  #
  # The FLUXION_LINUX_RUNNER || ubuntu-latest jobs (test-full, build-release,
  # cuda-smoke, cuda-parity) are unaffected — they already route to the static
  # self-hosted pool as primary with GH as fallback.
  # ---------------------------------------------------------------------------

  # -- Energy Conservation (Issue #1295) ---------------------------------------

  energy-conservation-gh-probe:
    name: "EC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  energy-conservation-gh:
    name: "Energy Conservation (GH)"
    needs: energy-conservation-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run energy conservation tests
        run: |
          cargo test --test test_energy_conservation --verbose 2>&1 | tee /tmp/energy_test_output.txt
          cargo test --test zone_balance_eplus_isolation --verbose 2>&1 | tee /tmp/zone_balance_test_output.txt
      - name: Extract violation counts
        run: |
          echo "=== Energy Conservation Test Results ==="
          echo "Checking for energy conservation violations..."
          ENERGY_VIOLATIONS=$(grep -c "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt 2>/dev/null || echo "0")
          echo "Total violations found: $ENERGY_VIOLATIONS"
          if [ "$ENERGY_VIOLATIONS" -gt "0" ]; then
            echo "FAIL: Energy conservation violations detected"
            grep -A2 "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt
            exit 1
          fi
          echo "PASS: No energy conservation violations"

  energy-conservation-hz:
    name: "Energy Conservation (Hetzner Overflow)"
    needs: energy-conservation-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    # Only run if GH probe timed out (GH runners saturated) or was cancelled
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.energy-conservation-gh-probe.result == 'failure'
          || needs.energy-conservation-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run energy conservation tests
        run: |
          cargo test --test test_energy_conservation --verbose 2>&1 | tee /tmp/energy_test_output.txt
          cargo test --test zone_balance_eplus_isolation --verbose 2>&1 | tee /tmp/zone_balance_test_output.txt
      - name: Extract violation counts
        run: |
          echo "=== Energy Conservation Test Results ==="
          echo "Checking for energy conservation violations..."
          ENERGY_VIOLATIONS=$(grep -c "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt 2>/dev/null || echo "0")
          echo "Total violations found: $ENERGY_VIOLATIONS"
          if [ "$ENERGY_VIOLATIONS" -gt "0" ]; then
            echo "FAIL: Energy conservation violations detected"
            grep -A2 "violated energy conservation" /tmp/energy_test_output.txt /tmp/zone_balance_test_output.txt
            exit 1
          fi
          echo "PASS: No energy conservation violations"

  # -- Rustfmt ----------------------------------------------------------------

  fmt-gh-probe:
    name: "Fmt Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "GH runner acquired"

  fmt-gh:
    name: Rustfmt (GH)
    needs: fmt-gh-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-env
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  fmt-hz:
    name: Rustfmt (Hetzner Overflow)
    needs: fmt-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      needs.fmt-gh-probe.result == 'failure'
      || needs.fmt-gh-probe.result == 'cancelled'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-env
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  # -- Clippy -----------------------------------------------------------------

  clippy-gh-probe:
    name: "Clippy Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - run: echo "GH runner acquired"

  clippy-gh:
    name: Clippy (GH)
    needs: clippy-gh-probe
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
      - run: cargo clippy --lib -- -D warnings

  clippy-hz:
    name: Clippy (Hetzner Overflow)
    needs: clippy-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    env:
      CARGO_BUILD_JOBS: 1
    if: |
      needs.clippy-gh-probe.result == 'failure'
      || needs.clippy-gh-probe.result == 'cancelled'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
      - run: cargo clippy --lib -- -D warnings

  # -- Issue #1723: KNOWN_ISSUES.md stale check --------------------------------

  known-issues-stale-gh-probe:
    name: "KI Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  known-issues-stale-gh:
    name: "Known Issues Stale Check (GH)"
    needs: known-issues-stale-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Run stale check
        run: python3 scripts/check_known_issues_stale.py

  known-issues-stale-hz:
    name: "Known Issues Stale Check (Hetzner Overflow)"
    needs: known-issues-stale-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.known-issues-stale-gh-probe.result == 'failure'
          || needs.known-issues-stale-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Run stale check
        run: python3 scripts/check_known_issues_stale.py

  # -- Main only: cross-platform matrix --------------------------------------
  # Validates that nothing is accidentally Linux/x86-specific before changes
  # land on main. Linux slot uses FLUXION_LINUX_RUNNER if set (self-hosted
  # Hetzner), falling back to GitHub-hosted ubuntu-latest. macOS and Windows
  # always use GitHub-hosted runners.

  test-full:
    name: Test Suite (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && vars.FLUXION_LINUX_RUNNER) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Cache ONNX Runtime binaries
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/Library/Caches/ort.pyke.io
          key: ort-binaries-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-binaries-aarch64-apple-darwin-
      - name: Run tests
        run: |
          cargo test --lib --verbose --no-default-features
          cargo test --test regression_exterior_film_unification --verbose --no-default-features
          # Issue #1803 / Plan T10.1 — empirical validation harness skeleton.
          cargo test --test validation_empirical_harness --verbose --no-default-features
          # Issue #1756 — HVAC BESTEST CI runner stub (dummy, always-green).
          cargo test --test hvac_bestest --verbose --no-default-features
        env:
          PYO3_PYTHON: /usr/bin/python3

  # -- Main only: release build verification ---------------------------------

  build-release:
    name: Build Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - run: cargo build --release --verbose

  # -- ASHRAE Cases Cycle Check -----------------------------------------------

  ashrae-cases-cycle-gh-probe:
    name: "ACC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  ashrae-cases-cycle-gh:
    name: "Ashrae Cases Cycle Check (GH)"
    needs: ashrae-cases-cycle-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run cycle check
        run: python3 scripts/check_ashrae_cases_cycle.py

  ashrae-cases-cycle-hz:
    name: "Ashrae Cases Cycle Check (Hetzner Overflow)"
    needs: ashrae-cases-cycle-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.ashrae-cases-cycle-gh-probe.result == 'failure'
          || needs.ashrae-cases-cycle-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run cycle check
        run: python3 scripts/check_ashrae_cases_cycle.py

  # -- Physics <-> Sim Cycle Check (Issue #2463) -----------------------------
  # Mirrors the `Ashrae Cases Cycle Check` job above (Issue #1441) but for
  # the `physics <-> sim` cycle documented in ARCHITECTURE.md §"Remaining
  # cycles" and docs/mutation_testing_crate_split.md §"Phase 2". The
  # companion cycle-break issue drives the reported edge count from 5
  # (current baseline) down to 0; this guard prevents silent regressions
  # in the meantime.
  #
  # Canonical listener job name: `Physics-Sim-Cycle-Check`. The "(GH)"
  # and "(Hetzner Overflow)" suffixes match the issue #1441 pattern; the
  # canonical name (sans suffix) is what AGENTS.md §CI Gates and
  # release_gates.yaml::ci.required_checks reference. Adding the new gate
  # to release_gates.yaml::ci.required_checks is deferred to the merge PR
  # that closes both this issue and the companion cycle-break issue
  # (see issue body §"Notes" for the rationale).

  physics-sim-cycle-gh-probe:
    name: "PSC Probe"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "GH runner acquired"

  physics-sim-cycle-gh:
    name: "Physics-Sim-Cycle-Check (GH)"
    needs: physics-sim-cycle-gh-probe
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run physics-sim cycle check
        run: python3 scripts/check_physics_sim_cycle.py

  physics-sim-cycle-hz:
    name: "Physics-Sim-Cycle-Check (Hetzner Overflow)"
    needs: physics-sim-cycle-gh-probe
    runs-on: [self-hosted,fluxion-overflow]
    if: |
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && (needs.physics-sim-cycle-gh-probe.result == 'failure'
          || needs.physics-sim-cycle-gh-probe.result == 'cancelled')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Run physics-sim cycle check
        run: python3 scripts/check_physics_sim_cycle.py

  # -- Issue #1603: GPU smoke test for InferenceBackend::CUDA -------------
  # Runs on every PR and main push. On CPU-only runners the test skips
  # gracefully (cuda_ep_available() returns false at runtime). On GPU runners
  # (self-hosted with NVIDIA GPU) the test executes fully and verifies
  # CUDA-vs-CPU numerical parity within 0.1%.
  # Compiling with --features cuda ensures the CUDA EP gate in the source
  # is exercised even when no physical GPU is present.

  cuda-smoke:
    name: CUDA Smoke Test (Issue #1603)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Build with CUDA support
        run: cargo build --features cuda --verbose
      - name: Run CUDA smoke test
        run: cargo test --test surrogate_cuda_smoke --features cuda --verbose
        env:
          PYO3_PYTHON: /usr/bin/python3

  # -- Issue #1895: CPU/CUDA inference parity test on GPU hardware ---------
  # Runs on every PR and main push. Executes the #[ignore]'d CUDA parity
  # test from tests/surrogate_backend_parity.rs on a GPU-enabled runner.
  #
  # The test (test_cpu_vs_cuda_parity_within_tolerance) verifies CUDA EP
  # wiring + session-pool construction; it skips gracefully when no GPU is
  # present at runtime. With --features ort the ONNX Runtime CUDA EP is
  # compiled in and can be exercised on real hardware.
  #
  # Advisory only (non-blocking): the CPU-vs-CUDA parity assertion is
  # informational until a real ONNX model is committed (issue #1285).
  # The job uses continue-on-error so a missing GPU runner does not fail CI.

  cuda-parity:
    name: CUDA Parity (Issue #1895)
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Build with CUDA + ONNX Runtime
        run: cargo build --features cuda --features ort --verbose
      - name: Run CUDA parity test
        run: cargo test --test surrogate_backend_parity --features cuda --features ort -- --ignored
        env:
          PYO3_PYTHON: /usr/bin/python3
      - name: Upload parity test results
        if: always()
        run: |
          # Collect any test output logs for artifact upload.
          # The parity test skips gracefully when no GPU is present, so
          # there is no per-timestep CSV to upload (issue #1285: no
          # committed ONNX model yet). This step is a no-op placeholder
          # for future artifact upload once #1285 is resolved.
          echo "CUDA parity test completed — see workflow logs for details"
          echo "Per-timestep CSV upload requires issue #1285 (committed ONNX model)"

  # -- Issue #2384: Memory budget check for large simulations ---------------
  # Runs the 10-zone reference simulation and monitors peak RSS.
  # Warns if peak RSS exceeds 10GB to catch memory regressions early.

  memory-budget:
    name: "Memory Budget (Issue #2384)"
    runs-on: ${{ vars.FLUXION_LINUX_RUNNER || 'ubuntu-latest' }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
      - name: Build
        run: cargo build --release --features multi-zone
      - name: Run 10-zone test with memory monitoring
        run: |
          # Run the 10-zone test in background while monitoring RSS
          (
            cargo test --release --features multi-zone --test multi_zone_n_zone_network -- multi_zone_n_zone_network_10_zone_round_trip --nocapture
          ) &
          CARGO_PID=$!

          MAX_RSS_KB=0
          while kill -0 $CARGO_PID 2>/dev/null; do
            RSS=$(ps -o rss= -p $CARGO_PID 2>/dev/null || echo 0)
            if [[ "$RSS" -gt "$MAX_RSS_KB" ]]; then
              MAX_RSS_KB=$RSS
            fi
            sleep 0.5
          done
          wait $CARGO_PID
          TEST_EXIT=$?

          MAX_RSS_GB=$(echo "scale=2; $MAX_RSS_KB / 1024 / 1024" | bc)
          echo ""
          echo "=== Memory Budget Check ==="
          echo "Peak RSS: ${MAX_RSS_GB} GB"
          echo "Test exit code: $TEST_EXIT"

          WARN_GB=10
          WARN_KB=$((WARN_GB * 1024 * 1024))

          if [[ "$MAX_RSS_KB" -gt "$WARN_KB" ]]; then
            echo ""
            echo "WARNING: Peak RSS ${MAX_RSS_GB} GB exceeds 10 GB budget"
            echo "This may indicate a memory regression in large simulations."
            if [[ "$TEST_EXIT" -ne 0 ]]; then
              echo "Note: Test also failed (exit code $TEST_EXIT)"
              exit 1
            fi
            exit 0
          else
            echo "Memory budget check passed (${MAX_RSS_GB} GB < ${WARN_GB} GB)"
            exit $TEST_EXIT
          fi
