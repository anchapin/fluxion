name: Rust Tests & Linting

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libssl-dev pkg-config libfontconfig1-dev
          version: 1.0
          retry: 3
          retry_wait_seconds: 10
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
          cache: 'false'

      - name: Cache ONNX Runtime binaries (macOS arm64)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ort-onnx
          key: ort-onnx-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ort-onnx-aarch64-apple-darwin-

      - name: Download and extract ONNX Runtime (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ONNX_VERSION="1.24.2"
          ONNX_ARCH="onnxruntime-osx-arm64-${ONNX_VERSION}.tgz"
          ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/${ONNX_ARCH}"
          CACHE_DIR="$HOME/Library/Caches/ort-onnx"
          mkdir -p "$CACHE_DIR"
          if [ ! -f "$CACHE_DIR/$ONNX_ARCH" ]; then
            echo "Downloading ONNX Runtime from $ONNX_URL"
            curl -fsSL "$ONNX_URL" -o "$CACHE_DIR/$ONNX_ARCH"
          fi
          mkdir -p "$CACHE_DIR/onnxruntime"
          if [ ! -d "$CACHE_DIR/onnxruntime/lib" ]; then
            echo "Extracting ONNX Runtime..."
            tar -xzf "$CACHE_DIR/$ONNX_ARCH" -C "$CACHE_DIR/onnxruntime"
          fi
          echo "ORT_LIB_DIR=$CACHE_DIR/onnxruntime" >> $GITHUB_ENV

      - name: Run tests
        run: cargo test --lib --verbose --no-default-features
        env:
          PYO3_PYTHON: /usr/bin/python3

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          rust-components: clippy
          python-version: '3.10'
          cache: 'false'
      - run: cargo clippy --lib -- -D warnings

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-python-env
        with:
          python-version: '3.10'
          cache: 'false'
      - run: cargo build --release --verbose
