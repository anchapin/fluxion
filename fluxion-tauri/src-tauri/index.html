<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluxion 3D Geometry Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: system-ui, sans-serif; }
        #viewer { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 8px;
        }
        #controls button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        #controls button:hover { background: #2563eb; }
        #tab-bar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 4px;
            z-index: 100;
        }
        #tab-bar button {
            background: rgba(0,0,0,0.7);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 13px;
        }
        #tab-bar button.active { background: rgba(59,130,246,0.9); border-color: #3b82f6; }
        #params-panel {
            display: none;
            position: absolute;
            top: 52px;
            right: 16px;
            width: 280px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 16px;
            border-radius: 0 0 8px 8px;
            z-index: 99;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }
        #params-panel.visible { display: block; }
        .param-group { margin-bottom: 14px; }
        .param-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ccc;
        }
        .param-group label span { color: #3b82f6; font-weight: bold; }
        .param-group input[type=range] {
            width: 100%;
            accent-color: #3b82f6;
            cursor: pointer;
        }
        #apply-params {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        #apply-params:hover { background: #2563eb; }
        #param-status {
            font-size: 11px;
            margin-top: 6px;
            color: #22c55e;
            min-height: 14px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="info">
        <div id="building-name">Loading...</div>
        <div id="stats"></div>
    </div>
    <div id="controls">
        <button id="btn-reset">Reset View</button>
        <button id="btn-wireframe">Wireframe</button>
        <button id="btn-zones">Toggle Zones</button>
    </div>
    <div id="tab-bar">
        <button id="tab-view" class="active">View</button>
        <button id="tab-params">Controls</button>
    </div>
    <div id="params-panel">
        <div class="param-group">
            <label>Heating Setpoint <span id="val-heating">20.0°C</span></label>
            <input type="range" id="param-heating" min="10" max="25" step="0.5" value="20" />
        </div>
        <div class="param-group">
            <label>Cooling Setpoint <span id="val-cooling">26.0°C</span></label>
            <input type="range" id="param-cooling" min="18" max="35" step="0.5" value="26" />
        </div>
        <div class="param-group">
            <label>Lighting Load <span id="val-lighting">5.0 W/m²</span></label>
            <input type="range" id="param-lighting" min="0" max="20" step="0.5" value="5" />
        </div>
        <div class="param-group">
            <label>Equipment Load <span id="val-equipment">10.0 W/m²</span></label>
            <input type="range" id="param-equipment" min="0" max="30" step="0.5" value="10" />
        </div>
        <div class="param-group">
            <label>Occupancy <span id="val-occupancy">0.1 pers/m²</span></label>
            <input type="range" id="param-occupancy" min="0" max="0.5" step="0.01" value="0.1" />
        </div>
        <div class="param-group">
            <label>Ventilation Rate <span id="val-vent">0.5 ach</span></label>
            <input type="range" id="param-vent" min="0" max="5" step="0.1" value="0.5" />
        </div>
        <div class="param-group">
            <label>Wall U-Value <span id="val-wall">0.5 W/m²K</span></label>
            <input type="range" id="param-wall" min="0.1" max="2.0" step="0.05" value="0.5" />
        </div>
        <div class="param-group">
            <label>Roof U-Value <span id="val-roof">0.3 W/m²K</span></label>
            <input type="range" id="param-roof" min="0.1" max="2.0" step="0.05" value="0.3" />
        </div>
        <button id="apply-params">Apply Parameters</button>
        <div id="param-status"></div>
    </div>
    <div class="loading" id="loading">Initializing 3D Viewer...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

        const viewer = document.getElementById('viewer');
        const loading = document.getElementById('loading');
        const buildingName = document.getElementById('building-name');
        const stats = document.getElementById('stats');

        let scene, camera, renderer, controls;
        let buildingMesh = null;
        let zoneMeshes = [];
        let showZones = true;

        // Tab switching
        const tabView = document.getElementById('tab-view');
        const tabParams = document.getElementById('tab-params');
        const paramsPanel = document.getElementById('params-panel');
        tabView.addEventListener('click', () => {
            tabView.classList.add('active'); tabParams.classList.remove('active');
            paramsPanel.classList.remove('visible');
        });
        tabParams.addEventListener('click', async () => {
            tabParams.classList.add('active'); tabView.classList.remove('active');
            paramsPanel.classList.add('visible');
            // Load current params from backend
            if (typeof window.__TAURI__ !== 'undefined') {
                try {
                    const { invoke } = window.__TAURI__.core;
                    const params = await invoke('get_simulation_parameters');
                    document.getElementById('param-heating').value = params.heating_setpoint ?? 20;
                    document.getElementById('val-heating').textContent = (params.heating_setpoint ?? 20).toFixed(1) + '°C';
                    document.getElementById('param-cooling').value = params.cooling_setpoint ?? 26;
                    document.getElementById('val-cooling').textContent = (params.cooling_setpoint ?? 26).toFixed(1) + '°C';
                    document.getElementById('param-lighting').value = params.lighting_load ?? 5;
                    document.getElementById('val-lighting').textContent = (params.lighting_load ?? 5).toFixed(1) + ' W/m²';
                    document.getElementById('param-equipment').value = params.equipment_load ?? 10;
                    document.getElementById('val-equipment').textContent = (params.equipment_load ?? 10).toFixed(1) + ' W/m²';
                    document.getElementById('param-occupancy').value = params.occupancy ?? 0.1;
                    document.getElementById('val-occupancy').textContent = (params.occupancy ?? 0.1).toFixed(2) + ' pers/m²';
                    document.getElementById('param-vent').value = params.ventilation_rate ?? 0.5;
                    document.getElementById('val-vent').textContent = (params.ventilation_rate ?? 0.5).toFixed(1) + ' ach';
                    document.getElementById('param-wall').value = params.wall_u_value ?? 0.5;
                    document.getElementById('val-wall').textContent = (params.wall_u_value ?? 0.5).toFixed(2) + ' W/m²K';
                    document.getElementById('param-roof').value = params.roof_u_value ?? 0.3;
                    document.getElementById('val-roof').textContent = (params.roof_u_value ?? 0.3).toFixed(2) + ' W/m²K';
                } catch(e) { console.warn('Could not load params:', e); }
            }
        });

        // Slider live display
        const sliders = [
            ['param-heating', 'val-heating', v => v.toFixed(1) + '°C'],
            ['param-cooling', 'val-cooling', v => v.toFixed(1) + '°C'],
            ['param-lighting', 'val-lighting', v => v.toFixed(1) + ' W/m²'],
            ['param-equipment', 'val-equipment', v => v.toFixed(1) + ' W/m²'],
            ['param-occupancy', 'val-occupancy', v => v.toFixed(2) + ' pers/m²'],
            ['param-vent', 'val-vent', v => v.toFixed(1) + ' ach'],
            ['param-wall', 'val-wall', v => v.toFixed(2) + ' W/m²K'],
            ['param-roof', 'val-roof', v => v.toFixed(2) + ' W/m²K'],
        ];
        sliders.forEach(([id, valId, fmt]) => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            el.addEventListener('input', () => { valEl.textContent = fmt(parseFloat(el.value)); });
        });

        // Apply button
        document.getElementById('apply-params').addEventListener('click', async () => {
            const status = document.getElementById('param-status');
            status.textContent = 'Applying...';
            const params = {
                heating_setpoint: parseFloat(document.getElementById('param-heating').value),
                cooling_setpoint: parseFloat(document.getElementById('param-cooling').value),
                lighting_load: parseFloat(document.getElementById('param-lighting').value),
                equipment_load: parseFloat(document.getElementById('param-equipment').value),
                occupancy: parseFloat(document.getElementById('param-occupancy').value),
                ventilation_rate: parseFloat(document.getElementById('param-vent').value),
                wall_u_value: parseFloat(document.getElementById('param-wall').value),
                roof_u_value: parseFloat(document.getElementById('param-roof').value),
            };
            try {
                if (typeof window.__TAURI__ !== 'undefined') {
                    const { invoke } = window.__TAURI__.core;
                    await invoke('update_simulation_parameters', { params });
                }
                status.textContent = '✓ Applied';
                setTimeout(() => { status.textContent = ''; }, 3000);
            } catch(e) {
                status.textContent = '✗ ' + e;
            }
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            viewer.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(10, 20, 10);
            scene.add(directional);

            const grid = new THREE.GridHelper(50, 50, 0x444444, 0x333333);
            scene.add(grid);

            RectAreaLightUniformsLib.init();

            window.addEventListener('resize', onResize);

            document.getElementById('btn-reset').addEventListener('click', resetView);
            document.getElementById('btn-wireframe').addEventListener('click', toggleWireframe);
            document.getElementById('btn-zones').addEventListener('click', toggleZones);

            animate();
            loadGeometry();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function resetView() {
            camera.position.set(15, 15, 15);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleWireframe() {
            if (buildingMesh) {
                buildingMesh.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.wireframe = !child.material.wireframe;
                    }
                });
            }
        }

        function toggleZones() {
            showZones = !showZones;
            zoneMeshes.forEach(m => m.visible = showZones);
        }

        function createSampleBuilding() {
            const group = new THREE.Group();

            const matWall = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide
            });

            const matFloor = new THREE.MeshStandardMaterial({
                color: 0x555555,
                side: THREE.DoubleSide
            });

            const walls = [
                { pos: [2, 1.5, 0], size: [4, 3, 0.1] },
                { pos: [2, 1.5, 4], size: [4, 3, 0.1] },
                { pos: [0, 1.5, 2], size: [0.1, 3, 4] },
                { pos: [4, 1.5, 2], size: [0.1, 3, 4] },
            ];

            walls.forEach(w => {
                const geo = new THREE.BoxGeometry(...w.size);
                const mesh = new THREE.Mesh(geo, matWall);
                mesh.position.set(...w.pos);
                group.add(mesh);
            });

            const floorGeo = new THREE.PlaneGeometry(4, 4);
            const floor = new THREE.Mesh(floorGeo, matFloor);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            group.add(floor);

            const zoneMat = new THREE.MeshStandardMaterial({
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const zoneGeo = new THREE.BoxGeometry(3.8, 2.8, 3.8);
            const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
            zoneMesh.position.set(2, 1.4, 2);
            zoneMesh.visible = showZones;
            zoneMeshes.push(zoneMesh);
            group.add(zoneMesh);

            buildingMesh = group;
            scene.add(group);

            buildingName.textContent = 'Sample Building';
            stats.textContent = 'Levels: 1 | Spaces: 1 | Zones: 1';
            loading.style.display = 'none';
        }

        async function loadGeometry() {
            try {
                if (typeof window.__TAURI__ !== 'undefined') {
                    const { invoke } = window.__TAURI__.core;
                    const geometry = await invoke('load_geometry');
                    renderGeometry(geometry);
                } else {
                    createSampleBuilding();
                }
            } catch (e) {
                console.warn('Tauri not available, using sample data:', e);
                createSampleBuilding();
            }
        }

        function renderGeometry(geometry) {
            if (buildingMesh) {
                scene.remove(buildingMesh);
                buildingMesh = null;
            }

            const group = new THREE.Group();
            const materials = {
                Wall: new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true, opacity: 0.6, side: THREE.DoubleSide }),
                Floor: new THREE.MeshStandardMaterial({ color: 0x555555, side: THREE.DoubleSide }),
                Roof: new THREE.MeshStandardMaterial({ color: 0x8b4513, side: THREE.DoubleSide }),
            };

            const zoneColors = [0x3b82f6, 0x22c55e, 0xf59e0b, 0xef4444, 0x8b5cf6];

            geometry.levels.forEach((level, li) => {
                level.spaces.forEach((space, si) => {
                    const zoneIndex = geometry.zones.findIndex(z => z.space_ids.includes(space.id));
                    const zoneColor = zoneColors[zoneIndex % zoneColors.length];

                    space.surfaces.forEach(surface => {
                        const mat = materials[surface.surface_type] || materials.Wall;
                        const verts = surface.vertices;

                        if (verts.length < 3) return;

                        const shape = new THREE.Shape();
                        shape.moveTo(verts[0].x, verts[0].z);
                        verts.slice(1).forEach(v => shape.lineTo(v.x, v.z));

                        const geo = new THREE.ShapeGeometry(shape);
                        const mesh = new THREE.Mesh(geo, mat.clone());
                        mesh.rotation.x = -Math.PI / 2;
                        mesh.position.y = verts[0].y;
                        group.add(mesh);
                    });

                    const zoneMat = new THREE.MeshStandardMaterial({
                        color: zoneColor,
                        transparent: true,
                        opacity: 0.2,
                        side: THREE.DoubleSide
                    });
                    const bb = space.bounding_box;
                    const w = bb.max.x - bb.min.x;
                    const h = bb.max.z - bb.min.z;
                    const d = bb.max.y - bb.min.y;
                    const zoneGeo = new THREE.BoxGeometry(w, d, h);
                    const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
                    zoneMesh.position.set(
                        (bb.min.x + bb.max.x) / 2,
                        (bb.min.y + bb.max.y) / 2,
                        (bb.min.z + bb.max.z) / 2
                    );
                    zoneMesh.visible = showZones;
                    zoneMeshes.push(zoneMesh);
                    group.add(zoneMesh);
                });
            });

            buildingMesh = group;
            scene.add(group);

            buildingName.textContent = geometry.name;
            stats.textContent = `Levels: ${geometry.levels.length} | Spaces: ${geometry.levels.reduce((a, l) => a + l.spaces.length, 0)} | Zones: ${geometry.zones.length}`;
            loading.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
