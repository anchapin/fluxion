[package]
name = "fluxion-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Fluxion Team <team@fluxion.org>"]
description = "Tauri desktop application for building energy modeling with 3D geometry viewer"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"

[dependencies]
# Fluxion core
fluxion = { path = "..", default-features = false }

# Tauri
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

[build-dependencies]
tauri-build = "2"

# Serialization
serde.workspace = true
serde_json = "1.0"

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Geometry parsing (IFC/gbXML)
quick-xml = "0.41"

# UUID for geometry element IDs
uuid = { workspace = true, features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror.workspace = true

[features]
default = ["multi-zone"]
multi-zone = ["fluxion/multi-zone"]

[[bin]]
name = "fluxion-tauri"
path = "src-tauri/src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
