[package]
name = "fluxion-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
authors = ["Fluxion Team <team@fluxion.org>"]
description = "Tauri desktop application for building energy modeling with 3D geometry viewer"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"

[dependencies]
fluxion = { path = "..", default-features = false }

tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

serde.workspace = true
serde_json = "1.0"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid.workspace = true
thiserror.workspace = true

quick-xml = "0.41"
anyhow = "1.0"

[build-dependencies]
tauri-build = "2"

[features]
default = ["multi-zone"]
multi-zone = ["fluxion/multi-zone"]

[[bin]]
name = "fluxion-tauri"
path = "src-tauri/src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
