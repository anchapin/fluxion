[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fluxion"
version = "1.0.0"
requires-python = ">=3.10"
authors = [
    {name = "Fluxion Team", email = "team@fluxion.org"},
    {name = "Dr. Aris Thorne", email = "aris.thorne@fluxion.org"},
]
description = "A differentiable, AI-accelerated Building Energy Modeling engine with multi-zone support."
readme = "README.md"
license = {text = "MIT"}
keywords = ["building-energy", "simulation", "thermal-modeling", "ASHRAE", "machine-learning", "surrogate-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.0,<2.0",
    "patchelf",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "urllib3>=2.6.0",  # CVE-2025-66418: fix unbounded decompression chain DoS
    "pyasn1>=0.6.2",   # CVE-2026-23490: fix RELATIVE-OID memory exhaustion DoS
    "cbor2>=5.9.0",    # CVE-2026-26209: fix uncontrolled recursion DoS
    "jaraco-context>=6.1.0",  # CVE-2026-23949: fix Zip Slip path traversal
    "diskcache>=5.6.4",  # CVE-2025-69872: fix arbitrary code execution via pickle deserialization
    "pillow>=12.1.1",   # CVE-2026-25990: fix out-of-bounds write in PSD image loading
    "brotli>=1.2.0",    # CVE-2025-6176: fix decompression bomb DoS in Scrapy
    "pygments>=2.20.0",  # CVE-2026-4539: fix ReDoS in AdlLexer
]
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "starlette>=0.49.1",  # CVE-2025-62727: fix Range header ReDoS DoS
    "orjson>=3.11.6",     # CVE-2025-67221: fix uncontrolled recursion in dumps
]
all = [
    "fluxion[dev,api]",
]

[project.urls]
Homepage = "https://github.com/anchapin/fluxion"
Repository = "https://github.com/anchapin/fluxion"
Documentation = "https://fluxion.readthedocs.io"
Issues = "https://github.com/anchapin/fluxion/issues"

[project.scripts]
fluxion = "fluxion.cli:main"

[tool.maturin]
# Build the Rust extension as a sub-module of the ``fluxion`` Python package
# so that pure-Python helpers (e.g. ``fluxion.measures``, ``fluxion.cli``
# added in issue #1814) ship alongside the compiled ``.abi3.so``.
#
# ``python-extension`` enables ``pyo3/extension-module`` on top of
# ``python-bindings`` (Issue #2532). Without ``pyo3/extension-module`` the
# resulting artifact would link libpython and try to initialise an embedded
# interpreter, which is wrong for a CPython extension. ``cargo test
# --features python-bindings`` uses only ``python-bindings`` (no extension)
# so the test binary can link libpython and exercise the Rust-side wrappers.
# The ``source = ["fluxion"]`` below tells maturin to include any ``.py``
# files we add to that directory in the wheel — required for the
# ``FluxionMeasure`` base class and the ``fluxion apply-measures`` CLI
# (issue #1814).
features = ["python-extension"]
module-name = "fluxion.fluxion"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "I"]
# Exclude long lines in docstrings and multi-line table strings
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
# Collect the script-test harness under ``scripts/ci/`` (issue #2817).
# Note: ``tests/`` is the Rust integration-test directory (see AGENTS.md) and
# is owned by ``cargo test`` — not pytest. The pre-existing Python files under
# ``tests/python/`` and ``tests/visual/`` have a known syntax bug (#2832, filed
# during this work) and require the maturin-built ``fluxion`` extension for
# their native bindings; both are out of scope for #2817 and are collected
# explicitly by the Python-bindings workflow legs, not by ``pytest``.
testpaths = ["scripts"]
python_files = "test_*.py"

[tool.coverage.run]
source = ["fluxion"]
omit = ["*test*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
