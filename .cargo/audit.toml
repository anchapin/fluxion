# Audit configuration for Fluxion
#
# Remediated in #2553 (PR-A):
#   - RUSTSEC-2026-0098 (rustls-webpki name constraints for URI names, GHSA-965h-392x-2mh5):
#       Patched in rustls-webpki >= 0.103.12. Our Cargo.lock already resolves
#       rustls-webpki to 0.103.13 (transitively via rustls 0.23.37 →
#       hyper-rustls 0.27.7 → reqwest 0.12.28). The previous ignore entry
#       was stale; removing it lets cargo audit verify the fix on every PR.
#   - RUSTSEC-2026-0099 (rustls-webpki name constraints for wildcard DNS,
#       GHSA-xgp8-3hg3-c2mh):
#       Same remediation path as RUSTSEC-2026-0098 above. Stale ignore.
#
# Time-bounded ignore pending PyO3 migration (PR-B, #2553):
#   - RUSTSEC-2026-0177 (PyO3 Sync bound on PyCFunction::new_closure,
#       GHSA-chgr-c6px-7xpp):
#       Affects pyo3 0.15.0..<0.29.0. We pin pyo3 0.22 (Cargo.toml:205) and
#       Cargo.lock resolves to 0.22.6, so the advisory is ACTIVE. Ignore
#       entry below carries a TODO with target date 2026-12-31; cargo audit
#       will start failing once that date passes without a PyO3 bump. The
#       pyo3 0.22 → 0.29 migration is non-trivial (Bound<'py, T>,
#       IntoPy/FromPyObject, gil-refs removal, abi3 abi bumps) and touches
#       src/python/, src/bin/fluxion-py/, pyo3-macros, pyo3-build-config.

[advisories]
# Issue #2750: the previous `informational_warnings = ["unmaintained"]` line
# explicitly downgraded unmaintained-crate advisories to non-blocking warnings.
# It is removed so unmaintained advisories are surfaced at their default
# severity. The gate is now enforced hard-fail via `cargo audit --deny warnings`
# in .github/workflows/security.yml.
#
# Policy note (divergence vs deny.toml): cargo-deny scopes unmaintained to
# `unmaintained = "workspace"` (transitive unmaintained deps are non-blocking),
# whereas `cargo audit --deny warnings` fails on ALL unmaintained advisories
# including transitive ones. The three documented unmaintained advisories
# below (RUSTSEC-2024-0436 paste, RUSTSEC-2026-0192 ttf-parser,
# RUSTSEC-2025-0134 rustls-pemfile) are workspace-transparent — they are
# tracked here with removal conditions rather than papered over via
# `informational_warnings`. Aligning the two scopes across cargo-audit and
# cargo-deny is tracked as a follow-up; do NOT re-add
# `informational_warnings` to hide the gap — surface and track the
# advisory instead.
# Ignore advisories for pinned/transitive dependencies that can't be easily bumped
ignore = [
    # RUSTSEC-2025-0020 (pyo3 < 0.24.1, PyString buffer overflow) was REMOVED
    # in #2749: the PyO3 0.22 -> 0.29 migration in #2585 moved pyo3 outside the
    # affected range (< 0.24.1); cargo audit now verifies the fix on every PR.
    #
    # The three entries below are transitive `unmaintained` advisories. They
    # are deliberately NOT mirrored in `deny.toml` (#2749): cargo-deny scopes
    # unmaintained to workspace members (`unmaintained = "workspace"`) and
    # would only emit `advisory-not-detected` noise for them, whereas
    # cargo-audit (run with `--deny warnings`) enforces transitive unmaintained
    # too. Removing them HERE would re-introduce unmaintained failures on
    # the cargo-audit gate.
    #
    # `paste` is unmaintained; transitive via gemm (linear-algebra path:
    # gemm <- faer/simba/nalgebra <- fluxion/statrs). No security vulnerability:
    # rustsec type is `unmaintained`, no patched versions exist. Drop this
    # ignore once the upstream chain migrates off paste (e.g. gemm/ndarray
    # adopt `pastey` or drop the proc-macro dependency).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0177 (PyCFunction::new_closure missing Sync bound) REMEDIATED
    # in #2585 by migrating PyO3 0.22 → 0.29. pyo3 0.29.0+ includes the Sync
    # bound fix (GHSA-chgr-c6px-7xpp). The ignore entry was removed and cargo
    # audit now verifies the fix on every PR.
    # ttf-parser is unmaintained but still functional — see docs/SECURITY.md.
    # Depth=2 transitive through plotters (used for chart caption rendering
    # in src/validation/report.rs). No security vulnerability: rustsec type is
    # `unmaintained`. The advisory explicitly states "no patched versions";
    # the latest release (v0.25.1, Nov 2024) is also unmaintained. The
    # recommended successor `skrifa` is not yet adopted upstream by plotters
    # 0.3.7. Removing ttf-parser from the dependency graph would require
    # switching plotters to its `ab_glyph` font feature and bundling a font
    # at build time, which exceeds the S/<=4h/low-risk scope of #1458.
    "RUSTSEC-2026-0192",
    # RUSTSEC-2025-0134 (rustls-pemfile is unmaintained) — Issue #2797.
    # Depth=1 transitive: rustls-pemfile v2.2.0 <- rumqttc v0.25.1 <-
    # fluxion-twin <- fluxion. The crate's last release (v2.2.0, May 2025)
    # is the unmaintained version per the advisory; the recommended successor
    # (`rustls-pki-types` for the shared types, with PEM parsing absorbed
    # directly into rustls >= 0.23) is not yet adopted upstream by rumqttc.
    # No security vulnerability: rustsec type is `unmaintained` ("no patched
    # versions"). The same root cause as the four rustls-webpki entries
    # below — both clusters clear when upstream publishes a rumqttc release
    # that drops rustls-pemfile and bumps webpki past 0.102.x.
    #
    # Impact scope: rustls-pemfile is loaded by rumqttc's `use-rustls`
    # feature to parse PEM certs/keys at MQTT connect time. It is *not* in
    # the active TLS validation path (rustls 0.23 + rustls-webpki 0.103.13,
    # pinned by fluxion-twin's direct dependency, do the actual cert
    # validation). The unmaintained crate only affects PEM file *parsing*
    # (rustsec type is `unmaintained`, not `vulnerability`).
    #
    # Upstream tracking (same as the webpki cluster):
    #   - https://github.com/bytebeamio/rumqtt/issues/1067
    #   - https://github.com/bytebeamio/rumqtt/pull/1037
    #
    # >>> REMOVE this entry once a fixed rumqttc is published on crates.io
    # >>> and `crates/fluxion-twin/Cargo.toml` is bumped to it. Coordinated
    # >>> with #2757 (rumqttc → rustls-webpki 0.102.8 cluster, same root
    # >>> cause); resolving #2757's webpki bump will resolve this too.
    "RUSTSEC-2025-0134",

    # --- TEMPORARY: Issue #2757 (rumqttc → rustls-webpki 0.102.8) -------------
    # The four CR-LF CRL / name-constraint / name-constraint-wildcard / CRL-panic
    # advisories on rustls-webpki 0.102.8, all reached via rumqttc 0.25.1's
    # `use-rustls` feature. The predecessor `rumqttc` ignore block (Issue #2690,
    # "personal-fork removal") only documented the supply-chain-cleanup context
    # and pointed to the upstream tracking; this rewrite (#2757) expands it to
    # match the PR #2847 / RUSTSEC-2025-0134 documentation pattern (depth,
    # scope, upstream tracking, explicit REMOVE conditions) so the gate
    # surfaces the advisories and the suppressions are fully traceable.
    #
    # Depth=2 transitive: rustls-webpki v0.102.8 <- rumqttc v0.25.1 <-
    # fluxion-twin <- fluxion. No patched 0.102.x exists on crates.io
    # (0.102.8 is the last 0.102 release); the fixes landed only in
    # rustls-webpki 0.103.10 / 0.103.12 / 0.103.13. Removing the 0.102.x
    # copy from the dep graph requires a new rumqttc release that bumps the
    # webpki requirement past 0.102.x — there is no published release on
    # crates.io that does so today (queried 2026-08-13). Upstream PR
    # bytebeamio/rumqtt#1037 carries the bump but is not yet merged.
    #
    # Impact scope: rustls-webpki 0.102.8 is loaded by rumqttc's `use-rustls`
    # feature for x.509 certificate validation against the broker. The
    # affected advisories are real vulnerabilities (rustsec types: `vulnerability`
    # for the four entries below — not `unmaintained` or `informational`):
    #   - RUSTSEC-2026-0049: CRL Distribution Point faulty matching
    #     (fix >=0.103.10). CWE-295, improper certificate validation.
    #   - RUSTSEC-2026-0098: URI name-constraints wrongly accepted
    #     (fix >=0.103.12). CWE-295, issuer-imposed constraints bypassed.
    #   - RUSTSEC-2026-0099: wildcard DNS name-constraints wrongly accepted
    #     (fix >=0.103.12). CWE-295, same class as -0098.
    #   - RUSTSEC-2026-0104: reachable panic in CRL parsing
    #     (fix >=0.103.13). CWE-400, denial-of-service via malformed CRL.
    # The 0.102.8 copy is pulled in ONLY by rumqttc's TLS feature; fluxion-twin's
    # direct `rustls = "0.23"` dependency resolves the fixed rustls-webpki
    # 0.103.13 that backs the actual TLS stack. The vulnerable 0.102.8 is
    # therefore not the one validating live broker certs in the
    # rumqttc→broker path — but it does still ship in the binary and would
    # be used if any other code path inside rumqttc exercised it. The
    # documented "certificates are validated by default" posture in
    # `crates/fluxion-twin/src/mqtt.rs:11-15` is therefore satisfied by the
    # fixed 0.103.13 copy, not the 0.102.8 one.
    #
    # Resolution path (acceptance criteria):
    #   (a) bump rumqttc to a release requiring webpki >=0.103.10; OR
    #   (b) vendor a `[patch.crates-io]` pin on an auditable org account
    #       (NOT a personal-fork — cf. #2690, which removed exactly that).
    # Neither option is currently available — there is no patched rumqttc
    # on crates.io, and no auditable org account publishes a rumqttc fork
    # with the bump. The ignore entries below are the documented fallback.
    #
    # Upstream tracking:
    #   - https://github.com/bytebeamio/rumqtt/issues/1067
    #     (advisory report, originally opened by maintainers)
    #   - https://github.com/bytebeamio/rumqtt/pull/1037
    #     (open PR: bumps rustls-webpki + tokio-rustls; not yet merged)
    #
    # Side benefit: removing these four entries will ALSO close
    # RUSTSEC-2025-0134 (rustls-pemfile unmaintained, tracked by #2797,
    # already correctly documented in this file above) — both clusters
    # clear when upstream publishes a rumqttc release that drops the
    # 0.102.x webpki and the rustls-pemfile transitive.
    #
    # >>> REMOVE these four entries once a fixed rumqttc is published on
    # >>> crates.io (or a [patch.crates-io] pin is added on an auditable
    # >>> org account per the acceptance criteria above) and
    # >>> `crates/fluxion-twin/Cargo.toml` is bumped to that version.
    # >>> Verify Cargo.lock resolves `rustls-webpki` to >=0.103.13 across
    # >>> the workspace, then `cargo audit --deny warnings` and
    # >>> `cargo deny check advisories` must both pass with these four
    # >>> entries removed.
    "RUSTSEC-2026-0049",  # CRL Distribution Point faulty matching (fix >=0.103.10)
    "RUSTSEC-2026-0098",  # URI name-constraints wrongly accepted (fix >=0.103.12)
    "RUSTSEC-2026-0099",  # wildcard name-constraints wrongly accepted (fix >=0.103.12)
    "RUSTSEC-2026-0104",  # reachable panic in CRL parsing (fix >=0.103.13)

    # --- TEMPORARY: Tauri 2.x → gtk-rs + unic unmaintained cluster --------
    # Tauri 2.x on Linux pulls in gtk-rs ~0.18 via its GUI feature. All gtk-rs
    # crates are marked unmaintained — upstream moved to gtk4-rs. No patched
    # GTK3-sys version exists. unic-char-property/range/common/ucd-ident/ucd-version
    # are transitive through gtk-rs. glib has an unsoundness advisory
    # (RUSTSEC-2024-0429). Ignoring these follows the rustls-pemfile pattern:
    # transitive deps with no fix short of a Tauri version bump or GTK3→GTK4
    # migration. Scope: fluxion-tauri GUI builds on Linux.
    # Tracking: https://github.com/nicbarker/cliff/issues/247
    "RUSTSEC-2024-0411",  # gdkwayland-sys
    "RUSTSEC-2024-0412",  # gdk
    "RUSTSEC-2024-0413",  # atk
    "RUSTSEC-2024-0414",  # gtk
    "RUSTSEC-2024-0415",  # gtk-sys
    "RUSTSEC-2024-0416",  # atk-sys
    "RUSTSEC-2024-0417",  # gdkx11-sys
    "RUSTSEC-2024-0418",  # gdk-sys
    "RUSTSEC-2024-0419",  # gtk3-macros
    "RUSTSEC-2024-0420",  # gtk-sys (additional advisory)
    "RUSTSEC-2024-0370",  # proc-macro-error (used by gtk-rs proc-macros)
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0100",  # unic-ucd-ident
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2024-0429",  # glib unsound (Iterator impls for VariantStrIter)
]
