# cargo-mutants configuration for fluxion
# See https://mutants.rs/config.html
#
# Issue #1244: Mutation testing is DISABLED on CI due to cargo-mutants OOM.
# cargo-mutants 27.x requires ~28GB RAM to analyze fluxion's type hierarchies.
# Standard CI runners have 7GB RAM. See workflow file for details.
#
# To run mutation testing manually (requires 32GB+ RAM machine):
#   cargo install cargo-mutants --locked
#   cargo mutants

# Skip common allocator-sizes patterns that don't represent real bugs
skip_calls = ["with_capacity", "new", "default"]

# Minimum time to wait for test to complete
minimum_test_timeout = 60

# Exclude modules with complex generic types from mutation testing
# These modules have type hierarchies that cause cargo-mutants to OOM
# during the discovery phase (issue #1260 re-opens #1244).
#
# Issue #1349 (Phase 2 crate split) removed the broad `src/physics/**` glob:
# `assembly`, `multi_node`, and the bulk of the simple physics types now
# live in `fluxion-core` (the leaf crate), so cargo-mutants no longer has
# to re-compile the heaviest domain types for every mutant.
#
# What stays excluded is the small set of physics files that contain the
# truly combinatorial type machinery (CTF state-space, multi-node solver,
# geometry tensors, FD/CTF coefficient tables). Each of these individually
# is too large to mutate in the <16 GB peak-RSS budget from #1349.
#
# Peak RSS verification:
#   /usr/bin/time -v cargo mutants --list
# must be run on a 32 GB ubuntu-latest-8-cores runner and recorded in the
# PR that closes #1349. The architecturally-motivated ceiling is <16 GB.
#
# src/ai/** is no longer excluded (issue #1294): the workflow now passes
# --features ort so src/ai/surrogate compiles end-to-end. The ort type
# hierarchy is still large, so peak RSS may still approach the 32 GB limit;
# monitoring and follow-up are documented in the PR.
exclude_globs = [
    # Heavy physics files that remain in `fluxion` and individually cause
    # combinatorial type expansion during cargo-mutants discovery.
    # Order roughly by size / RSS contribution.
    "src/physics/state_space_ctf.rs",      # 4120 lines — CTF state-space machinery
    "src/physics/multi_node_solver.rs",    # 1744 lines — multi-node solver
    "src/physics/ctf_coefficients.rs",     # 1776 lines — CTF coefficient tables
    "src/physics/fd_discretization.rs",    # 739 lines  — FD wall discretization
    "src/physics/fd_solver.rs",            # 896 lines  — FD core solver
    "src/physics/ctf_solver.rs",           # 761 lines  — CTF core solver
    "src/physics/geometry_tensor.rs",      # 604 lines  — geometric tensor types
    "src/physics/nd_array.rs",             # 745 lines  — n-dimensional array types
    "src/physics/fd_surface_balance.rs",   # 786 lines  — FD surface balance
    "src/physics/ctf_zone_coupling.rs",    # 580 lines  — CTF zone coupling
    "src/physics/cta.rs",                  # 854 lines  — Continuous Tensor Abstraction
    "src/physics/thermal_mass/**",         # sub-tree of thermal mass data

    # Large sim files with complex generic types
    "src/sim/thermal_model_physics/**",
    "src/sim/thermal_model_core.rs",
    "src/sim/thermal_model_iterative.rs",
    "src/sim/sky_radiation.rs",

    # Large validation modules
    "src/validation/**",
]

# Use slice sharding for better memory locality when running manually
sharding = "slice"