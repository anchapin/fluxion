[package]
name = "fluxion-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Fluxion Team <team@fluxion.org>"]
description = "Model Context Protocol server for Rust-native Building Energy Modeling interface"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"
keywords = ["mcp", "bem", "energyplus", "building-energy", "simulation"]
categories = ["simulation", "scientific", "api-bindings"]

[dependencies]
# Fluxion core — `multi-zone` is activated via fluxion-mcp's own `multi-zone` feature (on by
# default), not unconditionally on this dependency. `default-features = false` keeps fluxion's
# default feature set explicit. See issue #2540.
fluxion = { path = "..", default-features = false }

# Fluxion fluid for HVAC fluid network topology
fluxion-fluid = { path = "../fluxion-fluid", version = "1.0.0" }

# TOON serialization (Issue #2072)
fluxion-toon = { path = "../crates/fluxion-toon" }

# Async runtime
tokio = { version = "1.40", features = ["full"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability — per-tool latency / error metrics (Issue #2515). Versions
# pinned to match the root fluxion crate so the workspace resolves a single
# copy of each.
metrics = "0.24"
uuid = { version = "1.10", features = ["v4"] }

# Error handling
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.27"
# Thread-local DebuggingRecorder lets metric-assertion tests run in parallel
# without touching the process-global recorder (same pattern as the root
# crate's ONNX tests in `src/ai/surrogate.rs`).
metrics-util = "0.20"

[features]
# `multi-zone` is required by the MCP thermal-model tool surface (ThermalModel::<VectorField>).
# It is a default feature so `cargo build -p fluxion-mcp` works out of the box, but it is gated
# behind this crate's own feature rather than hard-pinned on the `fluxion` dependency, so a
# workspace `--no-default-features` build no longer forces `multi-zone` onto every other member.
# See issue #2540.
default = ["multi-zone"]
multi-zone = ["fluxion/multi-zone"]

[[bin]]
name = "fluxion-mcp"
path = "src/main.rs"