# cargo-deny configuration — supply-chain gate for Fluxion (issue #2699).
#
# Complements `.cargo/audit.toml` (cargo-audit) by enforcing:
#   - [licenses]   no copyleft (GPL/AGPL/LGPL) sneaks in transitively;
#                  Fluxion is Apache-2.0 and only permissive licenses are allowed.
#   - [bans]       duplicate-version detection (start permissive: "warn") and a
#                  documented denylist slot for banned crates.
#   - [advisories] RustSec advisory DB scan; `ignore` list mirrored from
#                  `.cargo/audit.toml` so the two tools agree.
#   - [sources]    flag crates from unexpected registries or git sources.
#
# Run locally:  cargo deny check
# CI:           .github/workflows/security.yml → job `cargo-deny`
#
# Schema note: cargo-deny 0.14+ moved advisory severity to a scope enum
# (`all` | `workspace` | `transitive` | `none`) and applies sensible defaults
# (vulnerabilities/unsound → deny) out of the box. We set `unmaintained =
# "workspace"` so that unmaintained advisories are only enforced for workspace
# members; transitive unmaintained deps (e.g. rustls-pemfile via rumqttc) are
# non-blocking here. NOTE (#2750): cargo-audit is now the STRICTER gate for
# unmaintained — it runs with `--deny warnings` and fails on transitive
# unmaintained too, whereas cargo-deny (with `unmaintained = "workspace"`)
# does not. `.cargo/audit.toml`'s `informational_warnings` line was removed in
# #2750; aligning the unmaintained scope across both tools is a tracked
# follow-up. Override on the CLI via `cargo deny check --deny <lint>`.

[graph]
# Scan the FULL feature graph so crates that only appear under a feature flag
# (ONNX/`ort` w/ download-binaries, `rdkafka`, `pyo3`, `napi`, `dhat`, `dwave`,
# etc.) are scanned for advisories / licenses / bans / sources too. The
# `dwave` feature in particular handles a live API token — its deps must not
# go unscanned. Issue #2758.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Advisories — RustSec database scan.
# The `ignore` list is kept in lock-step with `.cargo/audit.toml` wherever both
# tools enforce the same scope. The ONE deliberate exception is transitive
# `unmaintained` advisories (e.g. paste via gemm, ttf-parser via plotters):
# cargo-deny scopes unmaintained to workspace members (`unmaintained =
# "workspace"` below) so it never flags them, and an ignore entry here would
# only emit `advisory-not-detected` noise. Those advisories ARE still ignored
# in `.cargo/audit.toml`, which (run as `cargo audit --deny warnings`) enforces
# transitive unmaintained too. See #2749 for the cleanup rationale. A single
# shared source of truth for both tools remains a follow-up.
# -----------------------------------------------------------------------------
[advisories]
# Only enforce `unmaintained` for workspace members (transitive unmaintained
# deps such as rustls-pemfile via rumqttc are non-blocking, matching
# `.cargo/audit.toml`). Vulnerabilities and unsound advisories are denied by
# default for all crates.
unmaintained = "workspace"
ignore = [
    # NOTE (#2749): three formerly-listed advisories were removed because each
    # produced an `advisory-not-detected` warning under this file's
    # `unmaintained = "workspace"` scope:
    #   - RUSTSEC-2025-0020 (pyo3 < 0.24.1, PyString buffer overflow) — pyo3
    #     was bumped to 0.29 in #2585; the affected range no longer matches.
    #   - RUSTSEC-2024-0436 (paste, unmaintained) — transitive via gemm; never
    #     flagged here because cargo-deny scopes unmaintained to workspace
    #     members. STILL IGNORED in `.cargo/audit.toml` (cargo-audit enforces
    #     transitive unmaintained too).
    #   - RUSTSEC-2026-0192 (ttf-parser, unmaintained) — transitive via
    #     plotters; same reasoning as RUSTSEC-2024-0436. STILL IGNORED in
    #     `.cargo/audit.toml`.
    # The two `*.audit.toml` ignores are deliberately NOT mirrored here: doing
    # so would re-introduce `advisory-not-detected` noise without changing
    # cargo-deny's enforcement (transitive unmaintained is out of scope).
# --- REMOVED in #3451: Issue #2757 (rumqttc → rustls-webpki 0.102.8) ---
    # RUSTSEC-2026-0049, -0098, -0099, -0104 are RESOLVED by the
    # `[patch.crates-io]` pin on `anchapin/rumqtt.git` at the project-owner
    # fork's `fix/rustsec-2026-webpki` SHA (see root `Cargo.toml`).
    # That fork bumps `rumqttc`'s requirement from `rustls-webpki = "^0.102.8"`
    # to `rustls-webpki = ">=0.103.13"`, so `Cargo.lock` now resolves
    # `rustls-webpki` only to 0.103.13 (the fixed copy) and the four
    # advisories no longer apply. cargo-deny's `cargo deny check advisories`
    # verifies the resolution at every CI run. The previous personal-fork
    # `[patch.crates-io]` was removed in #2690 as an unacceptable
    # supply-chain exposure; this re-establishment pins a specific commit
    # SHA on the project's own source-of-truth GitHub account (the same
    # account that publishes fluxion), so the supply-chain argument no
    # longer applies — re-pointing the SHA requires a code change to root
    # `Cargo.toml`, which is a reviewable, auditable commit.
    #
    # >>> REMOVE this comment block once upstream bytebeamio/rumqtt
    # >>> publishes a crates.io release requiring rustls-webpki >=0.103.13.
    # >>> Then drop the `[patch.crates-io]` from root `Cargo.toml` and
    # >>> bump `crates/fluxion-twin/Cargo.toml`'s `rumqttc` dep to that
    # >>> upstream version. Upstream tracking:
    # >>>   https://github.com/bytebeamio/rumqtt/issues/1067
    # >>>   https://github.com/bytebeamio/rumqtt/pull/1037
    # RUSTSEC-2026-0097 (rand) and RUSTSEC-2026-0190 (anyhow) were REMOVED in
    # #2681: both unsound advisories are patch-fixed in Cargo.lock (anyhow
    # 1.0.104, rand 0.8.7 + 0.9.5) via `cargo update -p anyhow -p rand@*`.
    # Do not re-add ignores for advisories that a routine `cargo update` clears.
]

# -----------------------------------------------------------------------------
# Licenses — allowlist of permissive licenses only. Fluxion is Apache-2.0.
#
# cargo-deny 0.20 (PR #611) removed the `[licenses] deny` field: anything NOT
# in `allow` is rejected automatically. So copyleft (GPL/AGPL/LGPL/EUPL) is
# excluded BY OMISSION — if a crate's resolved license expression can't be
# satisfied from the allowlist, the check fails with a clear "license not
# allowed" diagnostic. (LGPL-2.1-or-later appears only inside `r-efi`'s
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` OR-expression; since MIT and
# Apache-2.0 are allowed, that crate resolves clean without listing LGPL.)
# -----------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",          # file-level copyleft — acceptable (colored, dwrote, option-ext)
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# -----------------------------------------------------------------------------
# Bans — duplicate-version detection and a crate denylist.
# START PERMISSIVE: `multiple-versions = "warn"` and `wildcards = "warn"` so the
# gate passes today. Audited in #3310 (was 45, then 43 live): the workspace now
# resolves 38 duplicate-version instances. Five diagnostics were eliminated at
# the root cause: the root package's UNUSED `directories = "5.0"` (the real
# user is fluxion-core 6.0) — whose removal also dropped dirs-sys 0.4.1,
# windows-sys/windows-targets 0.48 and their 0.48 windows-* arch libs, and
# redox_users 0.4.6 — and root `uom` aligned 0.35 → 0.38 with fluxion-fluid.
#
# Remaining 38 are classified UNAVOIDABLE (transitive-only, or alignment
# requires a semver-breaking workspace source migration):
#   - faer ecosystem chain (upstream-pinned): equator/equator-macro 0.2/0.4/0.6,
#     wide 0.7/1.6, safe_arch 0.7/1.1 (via pulp/nano-gemm/spindle/private-gemm),
#     sysctl -> thiserror 1.x (2.0 is the workspace standard), rustc-hash 1.x
#     (via dhat dev-profile).
#   - statrs 0.18 chain: nalgebra 0.33 + simba 0.9 (workspace standard is
#     nalgebra 0.35; statrs pins 0.33 upstream).
#   - rand 0.8 vs 0.9 family (rand, rand_chacha, rand_core, rand_distr,
#     getrandom 0.2/0.3/0.4, r-efi 5/6): root uses rand 0.8; fluxion-twin +
#     proptest need 0.9. Aligning requires a rand 0.9 API migration in root
#     source — out of scope for a manifest-only fix.
#   - digest 0.10 vs 0.11 chain (block-buffer, cpufeatures, crypto-common,
#     digest, sha2): root sha2 0.10 vs fluxion-core sha2 0.11; digest 0.11
#     moved to hybrid-array — source migration required.
#   - windows-sys 0.42/0.52/0.61 + windows-* arch libs (via atomic-wait/spindle
#     from faer, ring/rustls, and modern tokio/rustix/tempfile); each arch lib
#     still has 0.42 (faer chain) + 0.52 (ring) copies.
#   - long-tail transitive pairs: bitflags 1/2 (core-graphics+png via
#     plotters/font-kit), core-foundation 0.9/0.10, foreign-types(-shared)
#     0.3/0.5 (openssl vs core-graphics), foldhash 0.1/0.2 (hashbrown
#     0.15/0.16), hashbrown 0.15/0.16, libloading 0.8/0.9 (dlib vs napi-sys),
#     syn 1/2/3 (interpol / older proc-macros / serde+clap+tokio),
#     winnow 0.7/1.0 (toml_edit 0.25 pins ^0.7 upstream; fluxion-toon was
#     deliberately bumped to 1.0 in #3293), rustls-webpki 0.102.8/0.103.13
#     (rumqttc 0.25.1 — documented under [advisories] above).
#
# `duplicates_baseline` is the budget the `.github/workflows/security.yml`
# `deny` job enforces — the CI step greps the `cargo deny` JSON output for
# `"code":"duplicate"` lines and fails when the count exceeds this baseline.
# The accepted value is the LIVE count from `cargo deny -f json check bans`.
#
# cargo-deny 0.20.2 rejects unknown keys in `[bans]` (the schema is fixed at
# {multiple-versions, multiple-versions-include-dev, highlight, deny, allow,
# allow-workspace, features, external-default-features, workspace-default-
# features, skip, skip-tree, wildcards, allow-wildcard-paths, allow-build-
# scripts, build, workspace-dependencies, std-replacements}), so the baseline
# lives in a comment-style key/value pair that the CI step parses. Replacing
# the comment with a real `duplicates_baseline = N` table entry will fail the
# config load. Future cargo-deny versions MAY add a real key — migrate when
# the schema is extended.
#
# To tighten later: (1) reduce the count via cluster bumping (issue #2994),
# (2) decrement `duplicates_baseline` to match the new count, (3) flip
# `multiple-versions` to "deny" and migrate any remaining unavoidable
# duplicates to `skip` with a `reason` per entry.
#
# Tracking issue: #2994 (duplicate-version budget reduction plan);
# #3310 (audit, classification, headroom restoration).
# Provenance: #2933 (acceptance criteria), follow-up to #2699.
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "warn"
# Issue #3310: budget enforced by `.github/workflows/security.yml` `deny` job.
# Live count is 38 as of 2026-09-01 (was 45 at the #2933 measurement, already
# 43 by merge-base before this fix); the inventory above classifies every
# remaining duplicate as unavoidable. Decrement when cluster bumps land;
# raise ONLY after the new unavoidable transitive has been verified and added
# to issue #2994's scope.
# duplicates_baseline: 38
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Banned-crate denylist — add crates that must never enter the dependency graph.
# Example: a crate with a license-downgrade history or a known-broken release.
# Entries use the `crate = "name@version"` spec (version optional) and may
# carry a `reason`. Wrapper crates can exempt a banned transitive via
# `{ crate = "x@1.0", wrappers = ["direct-depender"] }`.
deny = [
    # (empty by default — add as needed)
]
# Focused skip exceptions for duplicate-version warnings that are unavoidable.
# Only add a crate here as a last resort after attempting `cargo update` or a
# workspace pin, and ALWAYS include a `reason`. Not needed while
# multiple-versions = "warn"; populated when tightening to "deny".
skip = [
    # { crate = "windows-sys@0.52.0", reason = "transitive via ring 0.17; unifiable only by bumping the whole windows-* family" },
]

# -----------------------------------------------------------------------------
# Sources — flag crates from anywhere other than crates.io. Fluxion's only
# expected registry is crates.io; the rumqttc personal-fork [patch.crates-io]
# was removed in #2690 and there should be no git-only deps in the default graph.
#
# `unknown-registry` / `unknown-git` are set to "deny" (not "warn") so that any
# future supply-chain redirection — e.g. a [patch.crates-io] pointing at a
# personal fork, or a git-only dep slipping in — fails the gate loudly instead
# of being silently observed. Issue #2774: the original "warn" setting let the
# #2690 rumqttc fork pass unnoticed; this tightening makes the rule enforceable.
#
# `allow-registry` lists BOTH resolution paths so the rule matches regardless of
# how cargo resolves the index:
#   - `https://github.com/rust-lang/crates.io-index`  — legacy git index
#   - `sparse+https://index.crates.io/`                — modern sparse index
#     (the default since cargo 1.70). Without the sparse entry, deny would
#     falsely flag every crates.io dep under the modern resolution path.
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]
# Issue #3451 (follow-up to closed #2757): the rumqttc `[patch.crates-io]`
# pins a fork at github.com/anchapin/rumqtt.git — the project's source-of-
# truth GitHub account. The commit SHA is recorded verbatim in root
# `Cargo.toml`'s `[patch.crates-io]` table (NOT a floating branch ref).
# Allow exactly this git URL so `cargo deny check` keeps enforcing
# `unknown-git = "deny"` for every other git dep. The previous personal-
# fork entry was removed in #2690; this one is the project's own audit
# surface so the supply-chain argument from #2690 no longer applies.
# REMOVE this entry when upstream bytebeamio/rumqtt publishes a crates.io
# release requiring rustls-webpki >=0.103.13 and we drop the
# `[patch.crates-io]`.
allow-git = [
    "https://github.com/anchapin/rumqtt.git",
]
