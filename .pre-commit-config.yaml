repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin to a known ruff-pre-commit release for reproducibility; adjust as needed.
    rev: v0.14.5
    hooks:
      # Run the linter (use --fix to auto-apply fixes).
      - id: ruff-check
        # Example: enable automatic fixes during pre-commit (optional)
        # args: ["--fix"]
      # Run the formatter (ruff format). Can be placed before/after check when not using --fix.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: ["types-requests"]
        # Disabled: 101+ pre-existing type errors need systematic fixing
        # Run manually with: mypy .
        stages: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # RUST CODE QUALITY & SAFETY
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      # NOTE: cargo-check is NOT registered here. The doublify hook runs
      # `cargo check` against default features only, which does not match
      # CI's feature graph (multi-zone / ort / python-bindings / --all-features
      # in cargo-deny). Locally-green PRs would still fail CI. The matching
      # CI-graph check lives in the `local` repo below (`cargo-check-features`,
      # issue #2888).

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: batch-oracle-pattern
        name: "BatchOracle Pattern Compliance"
        entry: bash .githooks/batch-oracle-check.sh
        language: system
        types: [rust]
        pass_filenames: true
        stages: [pre-commit]

      - id: rust-doc-check
        name: "Rust Doc Comments"
        entry: python3 .githooks/rust-doc-check.py
        language: system
        types: [rust]
        pass_filenames: true
        stages: [pre-commit]

      # Issue #2888: replace doublify/pre-commit-rust's `cargo-check` (which
      # only checks default features) with a diff-driven matrix that mirrors
      # CI's feature graph. Modes:
      #   default (pre-commit): parse staged diff, run `cargo check --workspace
      #     --features <F>` for each matched feature (python-bindings / multi-zone
      #     / ort), plus the always-required default-features check.
      #   --all: `cargo check --workspace --all-features` (CI-equivalent, slow).
      #   --selftest: pattern-matrix dry-run, no cargo invocation.
      # Use `bash .githooks/cargo-check-features.sh --all` for full CI parity.
      # Trigger on Rust files OR Cargo.toml: a Cargo.toml-only [features] edit
      # still needs the escalation path (see detect_features_from_diff).
      - id: cargo-check-features
        name: "Cargo Check (CI feature graph, issue #2888)"
        entry: bash .githooks/cargo-check-features.sh
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-audit
        name: "Cargo Audit"
        entry: cargo audit
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: perf-baseline-optional
        name: "Performance Baseline (Optional)"
        entry: python3 .githooks/perf-baseline.py
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: physics-coverage
        name: "Physics Coverage (Manual)"
        entry: bash .githooks/physics-coverage-check.sh
        language: system
        types: [rust]
        files: ^src/physics/
        pass_filenames: false
        stages: [manual]

      - id: doc-inventory-check
        name: "Doc Inventory Check"
        entry: python3 scripts/doc_inventory_check.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: root-md-policy-check
        name: "Root `.md` Policy Check (issue #2466)"
        entry: python3 scripts/check_root_md_policy.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: docs-summaries-check
        name: "Docs 7-Line Summary Coverage (issue #2466)"
        entry: python3 scripts/check_docs_summaries.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: doc-inventory-fresh-check
        name: "Doc Inventory Freshness (issue #2765)"
        entry: python3 scripts/check_doc_inventory_fresh.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: doc-drift-check
        name: "Doc-Comment Cycle Drift Check (issue #2895)"
        entry: python3 scripts/check_doc_drift.py
        language: system
        pass_filenames: false
        stages: [manual]

# Fluxion Pre-Commit Hooks Configuration
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Usage:
#   git commit -m "..."                    # Runs hooks automatically
#   pre-commit run --all-files             # Manual run on all files
#   pre-commit run cargo-fmt --all-files   # Run specific hook
#   git commit --no-verify                 # Skip hooks (not recommended)
