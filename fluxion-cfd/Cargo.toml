[package]
name = "fluxion-cfd"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "GPU-accelerated Fast Fluid Dynamics solver for building airflow simulation"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]

[features]
default = ["cpu"]
cuda = []
opencl = []
cpu = []

[dependencies]
fluxion-core = { path = "../fluxion-core", version = "1.0.0" }
thiserror.workspace = true
anyhow = "1.0"
nalgebra.workspace = true
faer = { workspace = true, default-features = false, features = ["std"] }
ndarray = { workspace = true, default-features = false, features = ["std"] }
num-complex = "0.4"
rayon.workspace = true
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"
criterion = "0.8"

[[bench]]
name = "ffd_bench"
harness = false
