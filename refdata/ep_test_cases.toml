# Convection Test Cases
[[case]]
id = "convection_natural_vertical"
name = "Natural Convection - Vertical Plate"
category = "convection"
convection_type = "natural"
surface_type = "vertical_plate"
orientation = "south"
characteristic_length = 1.0
air_temperature = 293.15  # 20°C
surface_temperatures = [298.15, 303.15, 308.15]  # 25°C, 30°C, 35°C
# Expected h_c values per ISO 15099:5.2
expected_hc_w_m2k = [2.5, 3.2, 4.0]

[[case]]
id = "convection_natural_horizontal_hot_up"
name = "Natural Convection - Horizontal Hot Surface Facing Up"
category = "convection"
convection_type = "natural"
surface_type = "horizontal_plate_hot_up"
characteristic_length = 1.0
air_temperature = 293.15
surface_temperatures = [298.15, 303.15, 308.15]
expected_hc_w_m2k = [1.8, 2.3, 2.9]

[[case]]
id = "convection_natural_horizontal_hot_down"
name = "Natural Convection - Horizontal Hot Surface Facing Down"
category = "convection"
convection_type = "natural"
surface_type = "horizontal_plate_hot_down"
characteristic_length = 1.0
air_temperature = 293.15
surface_temperatures = [298.15, 303.15, 308.15]
expected_hc_w_m2k = [0.8, 1.0, 1.2]

[[case]]
id = "convection_forced_exterior"
name = "Forced Convection - Exterior Surface"
category = "convection"
convection_type = "forced"
surface_type = "exterior_wall"
wind_speeds = [0.5, 1.0, 2.0, 5.0]  # m/s
characteristic_length = 1.0
air_temperature = 293.15
surface_temperature = 298.15
# Expected per McAdams: h = 5.8 + 3.94 * v
expected_hc_w_m2k = [7.77, 9.74, 13.68, 25.50]

[[case]]
id = "convection_forced_interior"
name = "Forced Convection - Interior Surface"
category = "convection"
convection_type = "forced"
surface_type = "interior_wall"
velocity = 0.2  # m/s
characteristic_length = 1.0
air_temperature = 293.15
surface_temperature = 298.15
expected_hc_w_m2k = 3.5

# Radiation Test Cases
[[case]]
id = "radiation_longwave_stefan_boltzmann"
name = "Longwave Radiation - Stefan-Boltzmann Law"
category = "radiation"
radiation_type = "longwave"
surface_emissivity = 0.9
surface_temperatures = [273.15, 283.15, 293.15, 303.15]  # 0, 10, 20, 30°C
sky_temperatures = [253.15, 263.15, 273.15, 283.15]  # -20, -10, 0, 10°C
# Expected q = ε * σ * (Ts⁴ - Tsky⁴)
# σ = 5.67e-8 W/(m²·K⁴)

[[case]]
id = "radiation_solar_incidence"
name = "Solar Radiation - Incidence Angle"
category = "radiation"
radiation_type = "shortwave"
latitude = 39.7392  # Denver
longitude = -104.9903
day_of_year = 172  # June 21
hours = [6, 8, 10, 12, 14, 16, 18]  # Solar hours
surface_azimuth = 0  # South
surface_tilt = 90  # Vertical
# Expected incidence angles (degrees)
expected_incidence_deg = [75.5, 52.3, 28.8, 0.0, 28.8, 52.3, 75.5]

[[case]]
id = "radiation_solar_beam_diffuse_split"
name = "Solar Radiation - Beam/Diffuse Split"
category = "radiation"
radiation_type = "shortwave"
ghi_values = [200, 400, 600, 800, 1000]  # W/m²
zenith_angles = [10, 30, 50, 70, 80]  # degrees
# Expected per Erbs model
expected_diffuse_fraction = [0.22, 0.30, 0.42, 0.60, 0.78]

# CTF Coefficient Test Cases
[[case]]
id = "ctf_single_layer_concrete"
name = "CTF - Single Layer Concrete Wall"
category = "ctf_coefficients"
layers = [
  { name = "Concrete", thickness = 0.15, conductivity = 1.73, density = 2243, specific_heat = 837 }
]
timestep_hours = 1.0
# Expected CTF coefficients (calculated)
# a: cross conduction coefficients
# b: history-dependent cross conduction
# c: current flux coefficients
# d: history-dependent flux coefficients

[[case]]
id = "ctf_two_layer_brick_insulation"
name = "CTF - Two Layer Brick + Insulation"
category = "ctf_coefficients"
