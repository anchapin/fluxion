  { name = "Brick", thickness = 0.10, conductivity = 0.77, density = 1920, specific_heat = 790 },
  { name = "Insulation", thickness = 0.05, conductivity = 0.04, density = 32, specific_heat = 840 }
]
timestep_hours = 1.0

[[case]]
id = "ctf_three_layer_wall"
name = "CTF - Three Layer Wall"
category = "ctf_coefficients"
layers = [
  { name = "Stucco", thickness = 0.025, conductivity = 0.69, density = 1856, specific_heat = 837 },
  { name = "Concrete", thickness = 0.10, conductivity = 1.73, density = 2243, specific_heat = 837 },
  { name = "Drywall", thickness = 0.013, conductivity = 0.16, density = 784, specific_heat = 830 }
]
timestep_hours = 1.0

# Newton Solver Test Cases
[[case]]
id = "newton_convergence_quadratic"
name = "Newton - Quadratic Convergence"
category = "newton_solver"
function_type = "quadratic"
function_params = { a = 1.0, b = 0.0, c = -4.0 }  # f(x) = x² - 4
expected_root = 2.0
initial_guess = 1.0
max_iterations = 10
tolerance = 1e-10
expected_iterations = 3

[[case]]
id = "newton_non_convergence"
name = "Newton - Non-Convergence"
category = "newton_solver"
function_type = "oscillatory"
# Function that causes oscillation near root
expected_convergence = false
initial_guess = 1.0
max_iterations = 5

# Per-Surface Model Test Cases
[[case]]
id = "per_surface_single_zone_energy_balance"
name = "Per-Surface - Single Zone Energy Balance"
category = "per_surface_model"
zone_count = 1
surfaces_per_zone = 6
floor_area = 48.0
ceiling_height = 3.0
# Verify: sum of all surface fluxes = 0

[[case]]
id = "per_surface_two_zone_coupling"
name = "Per-Surface - Two Zone Interzone Coupling"
category = "per_surface_model"
zone_count = 2
interzone_surfaces = 1
coupling_u = 0.5
# Verify: interzone flux is conserved (q_ab = -q_ba)

# Combined Heat Balance Test Cases
[[case]]
id = "combined_convection_radiation"
name = "Combined - Convection + Radiation"
category = "combined_heat_balance"
surface_temperature = 293.15
air_temperature = 298.15
sky_temperature = 283.15
surface_emissivity = 0.9
expected_total_flux_w_m2 = -15.5  # Negative = surface losing heat

[[case]]
id = "combined_with_solar"
name = "Combined - With Solar Gain"
category = "combined_heat_balance"
surface_temperature = 293.15
air_temperature = 298.15
solar_irradiance = 500.0  # W/m²
surface_solar_absorptance = 0.6
surface_emissivity = 0.9
sky_temperature = 283.15
expected_total_flux_w_m2 = 285.0  # Net gain from solar

# FD Solver Test Cases
[[case]]
id = "fd_stability_explicit"
name = "FD - Explicit Method Stability"
category = "fd_solver"
method = "explicit"
thermal_diffusivity = 1e-6  # m²/s
grid_spacing = 0.01  # m
# Stability criterion: Δt ≤ Δx² / (2α)
expected_max_timestep_s = 50.0

[[case]]
id = "fd_convergence_implicit"
name = "FD - Implicit Method Convergence"
category = "fd_solver"
method = "implicit"
time_steps = [1, 10, 100, 1000]
expected_convergence_order = 1  # First order in time

# Energy Balance Verification Cases
[[case]]
id = "energy_balance_annual"
name = "Energy Balance - Annual Verification"
category = "energy_balance"
duration_months = 12
# Verify: ΔU + ΔE_in - ΔE_out = 0
# Over a full year, internal energy change should be minimal

[[case]]
id = "energy_balance_diurnal"
name = "Energy Balance - Diurnal Cycle"
category = "energy_balance"
duration_hours = 24
# Verify: energy is conserved over a 24-hour cycle
