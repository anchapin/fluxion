[package]
name = "fluxion-fluid"
version = "1.0.0"
edition = "2021"
rust-version = "1.98.0"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "Compile-time strongly typed fluid port traits for fluxion DAE systems"
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[dependencies]
thiserror.workspace = true
num-traits = "0.2"
uom = { version = "0.38", features = ["f32"] }
nalgebra.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
approx = "0.5"
criterion = "0.8"
shipyard = "0.11"
hecs = "0.11"

[lib]
name = "fluxion_fluid"
crate-type = ["lib"]
