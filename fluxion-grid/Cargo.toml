[package]
name = "fluxion-grid"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "Grid-edge electrical network components for Fluxion: battery storage, bus nodes, power flow, and joint thermal-electrical convergence."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[lib]
name = "fluxion_grid"
path = "src/lib.rs"

[features]
default = []
# Enable the joint thermal-electrical convergence bridge (`fluxion_bridge`).
# The bridge defines its own `ThermalModelQuery` trait so the crate never depends
# back on the main `fluxion` crate — the dependency direction is strictly
# `fluxion` (feature `grid`) → `fluxion-grid` (Issue #4005). Cargo rejects
# optional-optional package cycles, so the former `dep:fluxion` back-edge and the
# deprecated `fluxion` alias were removed; nothing in the workspace used them.
fluxion-integration = []
# Enable integration with fluxion-fluid for HvacState/HvacMode scalar HVAC types.
# When enabled, ThermalElectricalCoupler gains hvac_state_to_electrical,
# thermal_to_electrical, and update_cop_from_hvac_state methods.
# Matches the `fluid = ["dep:fluxion-fluid"]` convention used by the main fluxion crate.
fluid = ["dep:fluxion-fluid"]

[dependencies]
uuid = { workspace = true, features = ["serde", "v4"] }
serde.workspace = true
thiserror.workspace = true
nalgebra.workspace = true
# Optional dependency on fluxion-fluid for HvacState/HvacMode types
# (gated behind the "fluid" feature — see Issue #2561).
fluxion-fluid = { path = "../fluxion-fluid", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1.5"
