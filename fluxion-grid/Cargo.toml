[package]
name = "fluxion-grid"
version = "1.0.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "Electrical grid modeling with bus node types for power flow analysis."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(docsrs,test)", "cfg(gil_refs)"] }
