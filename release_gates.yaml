# Release Gates Configuration
# Issue #505: Define release gates for accuracy and performance
#
# This file defines explicit fail conditions for validation regressions,
# benchmark regressions, and report drift.
#
# Gates are evaluated in CI and must pass before a release is cut.
# Run `python scripts/release_gate_checker.py` locally to check gate status.

# =============================================================================
# VALIDATION GATES
# =============================================================================
# Validation gates check that ASHRAE 140 test pass rates meet minimum thresholds.
# These gates prevent releasing when validation accuracy has regressed.

validation:
  # Minimum overall pass rate required (as percentage)
  # ASHRAE 140 specifies minimum pass rates for certification; 60% is the practical
  # minimum threshold below which the model cannot be considered validated against
  # the standard test suite. Below this, the physics or implementation has
  # fundamental issues that must be addressed before release.
  min_pass_rate: 60.0

  # Pass rate by case series - fail if any series drops below threshold
  by_series:
    baseline:    # 600-650 series
      min_pass_rate: 50.0
      description: "Low-mass baseline cases - 50% minimum due to envelope simplification"
    high_mass:   # 900-950 series
      min_pass_rate: 50.0
      description: "High-mass building cases - 50% minimum due to thermal mass model limitations"
    free_floating:  # FF cases
      min_pass_rate: 60.0
      description: "Free-floating temperature cases - full 60% threshold"
    special:     # 195, 960 series
      min_pass_rate: 50.0
      description: "Special test cases - 50% minimum due to edge-case simplifications"

  # Maximum mean absolute error (MAE) allowed across all cases
  # MAE measures average deviation from ASHRAE 140 reference values.
  # 50% MAE means predictions average within 50% of reference values.
  # CI baseline shows ~42% MAE with current physics; 50% threshold provides
  # 8 percentage points of margin before blocking release.
  max_mae: 50.0

  # Individual case thresholds
  individual:
    # Maximum allowed deviation for any single case (percentage)
    # Cases exceeding this are flagged for investigation; however, structurally-limited
    # cases (known_failures) are excluded from blocking release.
    max_deviation: 100.0
    # Number of cases that can exceed 50% deviation before gate fails
    # Setting to 2 ensures only rare, truly exceptional cases can deviate
    # significantly without blocking release. Known failures are excluded.
    extreme_deviation_limit: 2
    # Known failures: structurally-limited cases excluded from extreme_count
    # Case 900 heating: ~200% deviation (high-mass building - thermal mass model limitation)
    # Case 600 series: multiple tests (low-mass baseline - simplified envelope model)
    known_failures:
      - "900"    # Case 900 - High-mass building heating deviation
      - "600"    # Case 600 series - Low-mass baseline envelope simplification

# =============================================================================
# BENCHMARK GATES
# =============================================================================
# Benchmark gates check that performance metrics meet minimum requirements.
# These gates prevent releasing when performance has regressed.

benchmark:
  # Throughput - minimum configs per second
  throughput:
    min_configs_per_sec: 150  # Wave 1+1.5 CI runners ~157 configs/sec; dev/release target remains 200 (see benchmark.throughput.target_configs_per_sec)
    description: "Minimum throughput for batch simulation"

  # Latency - maximum allowed latency per config (milliseconds)
  latency:
    max_ms_per_config: 10.0
    description: "Maximum latency for single config evaluation"

  # Multi-zone scaling
  # Issue #2362: Multi-zone throughput gate (10 configs/sec minimum)
  multi_zone:
    min_configs_per_sec: 10  # Minimum 10 configs/sec for 10-zone simulation
    zones: 10
    description: "Minimum throughput for 10-zone simulation"

  # HybridThermalModel scaling (Issue #2922)
  # The Absolute Perf Gate (#2693) and Multi-Zone Perf Gate (#2772) only
  # measure the pure-physics path (ThermalModel<VectorField>). They do NOT
  # exercise the production-default HybridThermalModel routing
  # (`HybridRouting::default()`: surrogate loads, physics everything else).
  # A regression adding per-timestep dispatch overhead in Hybrid mode
  # (e.g. to the surrogate-load branch) would slip through both gates
  # silently. These floors close that gap.
  hybrid:
    min_configs_per_sec: 80  # Single-zone HybridThermalModel, pop_100, default routing
    description: "Minimum throughput for single-zone HybridThermalModel"
  hybrid_multi_zone:
    min_configs_per_sec: 8  # 10-zone HybridThermalModel, pop_1000, default routing
    zones: 10
    description: "Minimum throughput for 10-zone HybridThermalModel"

  # Cross-validation latency
  cross_validation:
    max_ms: 500
    description: "Maximum latency for cross-validation"

  # Issue #2919: PR-blocking cold-start latency gate for the ONNX surrogate.
  # `absolute-perf-gate` (#2693) measures warm steady-state latency on
  # `BatchOracle::evaluate_population`, which constructs its own models and
  # never exercises the FIRST `predict_loads_onnx` call against a freshly
  # constructed `SurrogateManager`. That first call pays the full cost of
  # `SessionPool::get_or_create_session` (`src/ai/surrogate.rs:1247` —
  # ort env init + model parse + session allocation) plus per-call scratch
  # tensors, and is invisible to the warm-path gate.
  #
  # Floors enforced by the new `tests/surrogate_cold_start_test.rs` and the
  # `multi-zone-cold-start-gate` GitHub Actions job (Issue #2919). The
  # baseline lives at `tests/reference_data/surrogate/cold_start_baseline.json`
  # (median-of-3 cold/warm cycles); a regression > 25% relative to the
  # baseline trips the gate. Diagnostic regeneration prints the cycle
  # values via `cargo test --release --features ort -- --ignored
  # --nocapture diagnostic_print_cold_warm_cycles`.
  cold_start:
    # Maximum median cold-start latency (FIRST `predict_loads_onnx` on a
    # freshly constructed `SurrogateManager`, median of 3 cycles). Matches
    # the Issue #2919 acceptance criterion "latency < 100 ms". On a 256 MiB
    # shipped model the cold path is dominated by session-construction; on
    # the 193-byte dummy CI fixture the cold path is ~0 ms and the bound is
    # effectively always satisfied in CI — the ratio bound below is the
    # real CI-side regression catcher.
    max_ms: 100
    # Maximum median warm steady-state latency. Bounds warm latency so the
    # cold/warm ratio stays interpretable — a regression that only inflates
    # the warm path would otherwise shrink the ratio and silently green
    # the cold-start signal. Picked with margin over the existing
    # `latency.max_ms_per_config = 10.0` (#2693) to account for the ORT
    # forward-pass overhead on a 6-input dummy model.
    warm_max_ms: 25
    # Maximum allowed median cold/warm ratio (Issue #2919 acceptance
    # criterion). A first-call cost above 1.5× steady-state is real
    # regression noise (page-cache misses, allocator-warmup, ORT session
    # re-initialization) the warm-path-only #2693 gate does not catch.
    # Below `trivial_fixture_ms` this bound is SKIPPED — on the 193-byte
    # dummy CI fixture session-construction dominates the cold path and
    # the ratio is naturally ~3× even when no regression occurred, so the
    # absolute cold_ms + baseline-regression checks are the binding signal
    # in that regime.
    max_cold_warm_ratio: 1.5
    # Cold-ms threshold below which the cold/warm ratio check is SKIPPED.
    # The CI runner only has the 193-byte dummy ONNX fixture (no real
    # 256 MiB shipped model), so cold-path cost there is dominated by
    # session-construction rather than real ORT forward-pass work. At
    # that scale the cold/warm ratio is not a meaningful regression
    # signal; absolute cold_ms + baseline-regression (25%) are.
    # 5 ms is well above the dummy fixture's natural cold_ms (~0.015 ms)
    # and well below the shipped-model cold_ms (~400 ms).
    trivial_fixture_ms: 5.0
    # Regression tolerance vs. the stored baseline (fraction; 0.25 = 25%).
    # Mirrors the #1333 / #2506 strict-energy gate pattern: the CI job
    # compares the measured median cold/warm ratio against the baseline
    # ratio and fails the PR if the increase exceeds this threshold.
    # Calibration: matches the Issue #2919 acceptance wording "fails a PR
    # if cold-start regresses > 25% relative to a stored baseline".
    regression_tolerance: 0.25
    # Path to the JSON baseline (relative to project root). The CI job
    # loads it via `tests/reference_data/surrogate/cold_start_baseline.json`
    # and applies the regression tolerance above.
    baseline_file: "tests/reference_data/surrogate/cold_start_baseline.json"
    description: "PR-blocking cold-start latency gate for the ONNX surrogate (Issue #2919)"

  # Regression threshold - percentage change allowed before warning
  regression_threshold: 5.0  # percentage

  # Absolute minimum - any value below this fails regardless of baseline
  absolute_min_throughput: 100

# =============================================================================
# CRATE SIZE GATES
# =============================================================================
# Issue #2930 / Goal #10: enforce the "Crate size <10 MB published" release
# goal. The packaged crate is whatever `cargo package --allow-dirty
# --no-verify` produces at `target/package/fluxion-*.crate`. The 10 MiB
# ceiling matches crates.io's published-crate policy and is the only hard
# number declared for Goal #10 — the declarative discipline (Cargo.toml
# `exclude = [...]` block + `.cargoignore`) was in place before but had no
# CI-side enforcement, so any regression slipped through silently. This gate
# is the second layer: the workflow (`.github/workflows/crate-size.yml`)
# runs the measurement, and `scripts/release_gate_checker.py
# --crate-size-gates` re-validates the size against the threshold declared
# below as part of the release audit. The 10 MiB limit is mirrored as a
# literal in the workflow file (CRATE_SIZE_LIMIT_BYTES) — change both if
# you change one.

crate_size:
  # Maximum published-crate size, in MiB. Default 10 (Goal #10).
  max_mb: 10
  # Path to the packaged crate, relative to project root. Glob is supported
  # by the loader; the first match is used. Defaults to the standard
  # cargo-package output path.
  crate_glob: "target/package/fluxion-*.crate"

# =============================================================================
# REPORT DRIFT GATES
# =============================================================================
# Report drift gates detect unexpected changes in validation reports over time.
# These gates prevent releasing when validation results have changed unexpectedly.

drift:
  # Enable drift detection
  enabled: true

  # Maximum allowed change in pass rate between baseline and current (percentage points)
  max_pass_rate_change: 2.0

  # Maximum allowed change in MAE (percentage points)
  max_mae_change: 5.0

  # Maximum number of cases that can change from pass to fail
  max_pass_to_fail: 1

  # Maximum number of cases that can change from fail to pass
  max_fail_to_pass: 5

  # Baseline file path (relative to project root)
  baseline_file: "validation_baseline.json"

  # Create baseline if it doesn't exist
  create_baseline_if_missing: true

# =============================================================================
# RELEASE GATE REQUIREMENTS
# =============================================================================
# Defines which gates must pass for different release types.

release_requirements:
  # Major releases - all gates must pass
  major:
    - validation
    - benchmark
    - drift

  # Minor releases - all gates must pass
  minor:
    - validation
    - benchmark
    - drift

  # Patch releases - relaxed validation, must pass benchmark and drift
  patch:
    validation:
      min_pass_rate: 40.0  # 40% minimum for patch releases (still meaningful for hotfixes)
    benchmark:
      - throughput
      - latency
    drift:
      - max_pass_rate_change  # Still check drift even for patches

# =============================================================================
# CI INTEGRATION
# =============================================================================
# Settings for how gates are checked in CI

ci:
  # Fail fast - stop checking after first gate fails
  fail_fast: true

  # Upload gate results as artifact
  upload_results: true

  # Post results as PR comment
  post_pr_comment: true

  # Gate status output file
  output_file: "gate_status.json"

  # =============================================================================
  # REQUIRED STATUS CHECKS
  # =============================================================================
  # GitHub branch-protection "Required status checks" list. Every check
  # named here must report `success` on the merge commit before the PR
  # can be merged into `main`. Mirrors the `#1295` energy-conservation
  # pattern (`rust-tests.yml::energy-conservation`) — the strict energy
  # gate (#1333) is the next layer of the same regression-guard stack.
  #
  # Job names (NOT workflow names) must match the `jobs.<id>.name`
  # field in each workflow file. To find them, look for
  # `name: ASHRAE 140 Strict Energy Gate (Issue #1333)` in
  # `.github/workflows/ashrae_140_strict_energy_gate.yml`.
  required_checks:
    # Strict ±15% annual-energy tolerance for ASHRAE 140 Cases 600/900
    # (issue #1333). Currently exercises the two Blind-mode
    # infrastructure tests (passing) plus the two strict-tolerance
    # tests (skipped via `#[ignore]` pending A#4 closure verification).
    # When the `#[ignore]` attributes are removed (tracked by the
    # follow-up issue recorded in PR #1367's body), the same gate will
    # enforce the ±15% band automatically.
    - "ASHRAE 140 Strict Energy Gate (Issue #1333)"

    # Issue #2924: surrogate-layer MAE gate (between the per-timestep drift
    # gate #1784 and the system-level strict ±15% gate #1333 just above).
    # Asserts `SurrogateThermalModel::solve_timesteps` predicts annual
    # cooling kWh within ±5% of the EnergyPlus published reference for
    # ASHRAE 140 Cases 600 / 900. Job is defined in
    # `.github/workflows/ashrae_validation.yml` under the
    # `surrogate-ashrae-mae-gate` id, gated by `--features ort`. Two-mode
    # operation (mirrors Issue #1865 / `surrogate_drift_gate.yml`): ONNX
    # mode enforces the strict ±5% gate; fallback mode (no trained model
    # shipped) is an advisory that only enforces finite / non-negative
    # invariants — the system-level #1333 gate is the authoritative catch
    # for the underlying engine gap. The reference JSON files live at
    # `tests/reference_data/ashrae140/case_{600,900}_cooling_kwh.json`.
    - "Surrogate ASHRAE 140 MAE Gate (Issue #2924)"

    # Cross-platform floating-point determinism (issues #1351 / #1297).
    # The listener job is defined in `.github/workflows/ashrae_validation.yml`
    # under the `fluxion-determinism-gate` id and is triggered by the
    # `Cross-Platform Determinism CI` workflow_run completion. It is the
    # canonical non-matrix check name that branch protection references
    # (the upstream `determinism-check` job expands into three OS matrix
    # rows and is not a stable branch-protection target on its own).
    # The listener exits non-zero on `failure` / `cancelled` / `timed_out`
    # upstream conclusions and posts a PR comment linking the upstream
    # run URL — closing the #1297 acceptance gap that allowed a
    # determinism failure to slip through with a green `validate` job.
    - "Fluxion Determinism Gate (Issue #1351)"

    # Issue #1618: performance regression gate wired as a required check.
    # The listener job is defined in `.github/workflows/ashrae_validation.yml`
    # under the `fluxion-performance-gate` id and is triggered by the
    # `Performance Dashboard` workflow_run completion. It exits non-zero on
    # `failure` / `cancelled` / `timed_out` upstream conclusions and posts
    # a PR comment linking the upstream run URL.
    - "Fluxion Performance Gate (Issue #1618)"

    # Issue #1932: per-critical-path coverage ratchet gate.  Runs
    # cargo-llvm-cov, buckets results by the four ARCHITECTURE.md critical
    # physics paths (Weather→Solar, Weather→Ventilation, Conduction→Zone
    # Balance, HVAC→Zone Balance), and fails the build when any path whose
    # baseline has been set (validation/coverage_baseline.json) regresses by
    # more than 1% relative.  Paths with a 0.0 baseline are unenforced
    # (collection pending) and never trip the gate — see the KNOWN_ISSUES.md
    # entry titled "Code coverage gate (issue #1932)".
    - "Code Coverage Gate (Issue #1932)"

    # Issue #2466: docs-hygiene gate.  Verifies that (a) every `.md`
    # file at the repo root is in the AGENTS.md allow-list (CLAUDE.md
    # warns but never fails — it's auto-generated per session), (b)
    # every `docs/**/*.md` file has a 7-line summary at lines 2-8,
    # and (c) the canonical root-docs table in docs/doc-inventory.md
    # is in sync.  Backed by three Python scripts under `scripts/`
    # and one workflow file under `.github/workflows/`.
    - "Docs Hygiene Gate (Issue #2466)"

    # Issue #2462 (closes #2463 cycle guard): physics ↔ sim cycle check.
    # After #2462 the cycle is broken (zero edges), so the listener job
    # (defined in `.github/workflows/rust-tests.yml` under
    # `physics-sim-cycle-gh` / `physics-sim-cycle-hz`) becomes a
    # regression guard that exits non-zero on any *new* `use crate::sim::*`
    # import under `src/physics/**` or `use crate::physics::*` import
    # under `src/sim/construction.rs` / `src/sim/per_surface_conduction.rs`.
    # Backed by `scripts/check_physics_sim_cycle.py`.
    - "Physics-Sim-Cycle-Check"

    # Issue #2983: workspace compile gate. Closes the systemic gap that let
    # PR #2960 (`chore(deps): cargo-major + sha256_hex fix`) merge broken
    # — the `rand 0.8 -> 0.9` bump broke `fluxion-behavior` but bare
    # `cargo check` / `cargo test` only compile the root crate (because
    # `default-members = ["."]` is set in the workspace root), so the
    # breakage slipped through. Mirrors the `Physics-Sim-Cycle-Check`
    # pattern: the GH-runner and Hetzner-overflow variants both share the
    # canonical listener name `Workspace Check` (the parenthetical "(GH)" /
    # "(Hetzner Overflow)" suffixes are workflow-internal). Branch
    # protection matches the canonical name without the suffix.
    - "Workspace Check"

    # Issue #2693: PR-level ABSOLUTE performance floor. The throughput ≥ 150
    # configs/sec and latency ≤ 10 ms/config thresholds below were already
    # defined here but only evaluated on push to main/dev (performance.yml)
    # and at release time — never on PRs. The `regression-check` /
    # Fluxion Performance Gate (#1618) is a RELATIVE 5% gate with no
    # absolute floor, so a PR could regress throughput below 150 cfg/s and
    # still merge. The `absolute-perf-gate` job in
    # `performance_dashboard.yml` runs `performance_regression_test` x3,
    # takes the median, and feeds it to `release_gate_checker.py
    # --benchmark-gates throughput,latency`, failing the PR on breach.
    - "Absolute Perf Gate (Issue #2693)"

    # Issue #2772: PR-level ABSOLUTE multi-zone floor. The
    # `benchmark.multi_zone.min_configs_per_sec: 10` threshold (10-zone
    # model) was already defined here but only enforced by
    # `tests/performance_ci_test.rs` on population=100 — never on the
    # slowest regime (pop_1000 / pop_10k). The #2693 Absolute Perf Gate
    # measures the SINGLE-ZONE analytical path (150 cfg/s floor), a much
    # easier target, so a per-zone-cost regression could merge and blow
    # the multi-zone margin (only 2.8× per
    # `benches/multi_zone_throughput.rs:17`) silently. The
    # `multi-zone-perf-gate` job in `performance_dashboard.yml` runs the
    # new `test_multi_zone_performance_regression` (pop_1000, 10-zone,
    # analytical) x3 → median → `release_gate_checker.py --benchmark-gates
    # multi_zone_throughput`, failing the PR on breach. Transparency rule
    # (#2506 / #1333): this is a real regression-catching absolute floor,
    # not a silently-greened gate.
    - "Multi-Zone Perf Gate (Issue #2772)"

    # Issue #2919: PR-level cold-start latency floor for the ONNX
    # surrogate. The #2693 Absolute Perf Gate and #2772 / #2922 multi-
    # zone / hybrid gates all measure warm steady-state paths on
    # `BatchOracle::evaluate_population` / `HybridThermalModel` — none
    # construct a fresh `SurrogateManager` per cycle and none exercise
    # the FIRST `predict_loads_onnx` call against a cold session pool.
    # That first call pays the full cost of
    # `SessionPool::get_or_create_session` (`src/ai/surrogate.rs:1247` —
    # ort env init + model parse + session allocation) plus per-call
    # scratch tensors, and at the API layer the first `/v1/simulate`
    # request after a fresh process pays the same cost — easy > 500 ms
    # on a 256 MiB shipped model. The
    # `multi-zone-cold-start-gate` job in `performance_dashboard.yml`
    # runs `tests/surrogate_cold_start_test.rs` x3, takes the median,
    # and feeds the result to `release_gate_checker.py --benchmark-gates
    # cold_start`, which enforces absolute cold ≤ 100 ms, cold/warm
    # ratio ≤ 1.5×, and ≤ 25% regression relative to
    # `tests/reference_data/surrogate/cold_start_baseline.json`.
    - "Multi-Zone Cold Start Gate (Issue #2919)"

    # Issue #2922: PR-level ABSOLUTE HybridThermalModel floor. The
    # #2693 Absolute Perf Gate and #2772 Multi-Zone Perf Gate both measure
    # the pure-physics path (`ThermalModel<VectorField>` /
    # `BatchOracle::evaluate_population`); HybridThermalModel with
    # `HybridRouting::default()` (the production-recommended default
    # `ThermalModelMode::Hybrid` routing — surrogate loads, physics
    # everything else) is NOT exercised by either gate. A regression
    # adding per-timestep overhead in the surrogate-load branch fires
    # only in Hybrid mode and would slip through. The `hybrid-perf-gate`
    # job in `performance_dashboard.yml` runs the new
    # `tests/hybrid_perf_regression.rs::test_hybrid_performance_regression`
    # (pop_100, 1-zone) and
    # `test_hybrid_multi_zone_performance_regression` (pop_1000, 10-zone)
    # x3 → median → `release_gate_checker.py --benchmark-gates
    # hybrid_throughput,hybrid_multi_zone_throughput`, failing the PR on
    # breach. Floors: `benchmark.hybrid.min_configs_per_sec: 80` and
    # `benchmark.hybrid_multi_zone.min_configs_per_sec: 8`.
    - "Hybrid Perf Gate (Issue #2922)"

    # Energy Conservation gate (#1295). Listener job defined in
    # `.github/workflows/ashrae_validation.yml` under the
    # `fluxion-energy-conservation-gate` id. Mirrors the determinism /
    # performance gate pattern: triggered by the upstream Energy Conservation
    # workflow_run, exits non-zero on `failure` / `cancelled` / `timed_out`.
    - "Energy Conservation (GH)"

    # Rustfmt gate. Listener job in `.github/workflows/ashrae_validation.yml`
    # under the `fluxion-rustfmt-gate` id. Triggers on upstream rustfmt
    # workflow_run completion; non-zero exit on format drift.
    - "Rustfmt (GH)"

    # Clippy gate with -D warnings. Listener job in
    # `.github/workflows/ashrae_validation.yml` under `fluxion-clippy-gate`.
    # Triggers on upstream clippy workflow_run; non-zero exit on any warning.
    - "Clippy (GH)"

    # Known Issues Staleness gate (#1723). Listener job in
    # `.github/workflows/known-issues-stale.yml` (the `fluxion-known-issues-gate`
    # id). Triggers on the upstream KNOWN_ISSUES.md freshness workflow_run;
    # non-zero exit when `*Last Updated:*` header is >60 days stale.
    - "Known Issues Stale Check (GH)"

    # ASHRAE 140 Cases Cycle Check (#1441). Listener job in
    # `.github/workflows/ashrae_validation.yml` under
    # `fluxion-ashrae-cases-cycle-gate`. Triggers on upstream cycle check
    # workflow_run; non-zero exit on any new sim ↔ validation cycle edge.
    # Companion to Physics-Sim-Cycle-Check (#2463).
    - "Ashrae Cases Cycle Check (GH)"

    # CUDA smoke test (#1603). The smoke-test job in `ashrae_validation.yml`
    # verifies `--features cuda` builds and runs the gate. Auto-skips on
    # CPU-only runners; non-zero exit on any CUDA regression.
    - "CUDA Smoke Test (Issue #1603)"

    # Architecture Drift Detection. Scheduled job in
    # `.github/workflows/architecture_drift.yml`; runs nightly plus on
    # `src/**/*.rs` and `ARCHITECTURE.md` changes. Verifies the documented
    # swap-point traits (HeatConductionSolver, VentilationSchedule,
    # ThermalModelTrait) match the source. Backed by
    # `scripts/check_architecture_drift.py`.
    - "Architecture Drift Detection"

    # Cargo Deny supply-chain gate (#2699). Job in `.github/workflows/ci.yml`
    # enforces deny.toml rules: licenses, duplicates, bans, sources. The
    # `ignore` list is mirrored from `.cargo/audit.toml` (keep in sync).
    - "Cargo Deny"

    # Issue #2912: audit-ignore freshness gate. Parses `.cargo/audit.toml`,
    # extracts each advisory ignore entry's `>>> REMOVE` block, and
    # surfaces when at least one documented removal condition is met
    # (Cargo.lock no longer resolves the vulnerable transitive; an
    # upstream fix has landed on crates.io; or a recorded removal-date
    # has passed). Historical pattern (#2749 stale deny.toml advisory-
    # not-detected, #2750 cargo-audit gate leniency, #2681 unsound
    # advisories papered over) shows that documented-ignore lists decay
    # into permanent ones unless something actively checks them. The
    # default CI invocation is offline (conditions (b)+(c) only);
    # condition (a) — crates.io poll — is opt-in via `--check-upstream`
    # and not used here, keeping the gate network-free.
    - "Audit Ignore Freshness (Issue #2912)"

    # Issue #2934: Minimum Supported Rust Version (MSRV) gate. The
    # `package.rust-version = "1.81"` field is now declared on the root
    # Cargo.toml, the root `[workspace.package]` block, and all 10
    # workspace-member Cargo.toml files; this job enforces it by running
    # `cargo +1.81 build --workspace --locked` against any change that
    # touches a Cargo.toml, Cargo.lock, or the workflow itself. Closes the
    # crate-publish goal (#1) gap — without an MSRV declaration, `cargo
    # install` / crates.io / `cargo update --precise` users had no
    # machine-readable signal of which stable toolchain the build requires.
    - "MSRV Check (Issue #2934)"

    # Issue #2930 / Goal #10: PR-blocking crate-size gate. Runs
    # `cargo package --allow-dirty --no-verify` against the root crate,
    # measures the resulting `target/package/fluxion-*.crate` file, and
    # fails the build when the artifact exceeds the 10 MiB ceiling
    # (`crate_size.max_mb` below). The threshold is mirrored as a literal
    # (CRATE_SIZE_LIMIT_BYTES) in the workflow file for standalone use;
    # changing one without the other is a release-gate drift and must be
    # caught by the next audit run. Goal #10 was previously unenforced —
    # the declarative discipline in Cargo.toml/.cargoignore had no CI-side
    # measurement, so any regression slipped through silently.
    - "Crate Size Gate (Issue #2930)"

  # Job-to-workflow map (informational; branch-protection reads job
  # names directly). Used by `scripts/release_gate_checker.py` to verify
  # the required_checks list is in sync with the workflows directory.
  workflow_index:
    - job: "ASHRAE 140 Strict Energy Gate (Issue #1333)"
      workflow: ".github/workflows/ashrae_140_strict_energy_gate.yml"
      issue: 1333
      triggered_by: "PR + push to main"

    - job: "Surrogate ASHRAE 140 MAE Gate (Issue #2924)"
      # Surrogate-layer annual cooling kWh MAE gate. Closes the gap
      # between the per-timestep drift gate (#1784) and the system-level
      # strict ±15% gate (#1333) — the 0.5%-per-timestep surrogate
      # divergence that compounds to ≈5% annual would slip through #1784
      # and only be caught by #1333 once it pushed the band, not at the
      # source. Job is a PR-blocking required check on PRs to develop.
      workflow: ".github/workflows/ashrae_validation.yml"
      issue: 2924
      triggered_by: "PR + push to develop"

    - job: "Fluxion Determinism Gate (Issue #1351)"
      # The listener job is defined in `ashrae_validation.yml`; it
      # observes completion of the upstream workflow named below.
      workflow: ".github/workflows/ashrae_validation.yml"
      observes_workflow: "Cross-Platform Determinism CI"
      observes_workflow_file: ".github/workflows/determinism_check.yml"
      issue: 1351
      depends_on: 1297
      triggered_by: "workflow_run on Cross-Platform Determinism CI completion"

    - job: "Fluxion Performance Gate (Issue #1618)"
      # The listener job is defined in `ashrae_validation.yml`; it
      # observes completion of the upstream workflow named below.
      workflow: ".github/workflows/ashrae_validation.yml"
      observes_workflow: "Performance Dashboard"
      observes_workflow_file: ".github/workflows/performance_dashboard.yml"
      issue: 1618
      triggered_by: "workflow_run on Performance Dashboard completion + PR trigger"

    - job: "Code Coverage Gate (Issue #1932)"
      workflow: ".github/workflows/code-coverage.yml"
      issue: 1932
      triggered_by: "PR + push to develop"

    - job: "Docs Hygiene Gate (Issue #2466)"
      workflow: ".github/workflows/docs-hygiene.yml"
      issue: 2466
      triggered_by: "PR + push to develop/main"

    - job: "Physics-Sim-Cycle-Check"
      # Mirrors the `Ashrae Cases Cycle Check (Issue #1441)` pattern.
      # Both the GH runner variant and the Hetzner-overflow variant share
      # the canonical listener name (the parenthetical "(GH)" / "(Hetzner
      # Overflow)" suffixes are workflow-internal). Branch protection
      # matches the canonical name without the suffix.
      workflow: ".github/workflows/rust-tests.yml"
      issue: 2463
      closes_issue: 2462
      triggered_by: "PR + push to main"

    - job: "Workspace Check"
      # Mirrors the `Physics-Sim-Cycle-Check` pattern above: the GH runner
      # variant (`workspace-check-gh` job id) and the Hetzner-overflow
      # variant (`workspace-check-hz` job id) share the canonical listener
      # name `Workspace Check` (the parenthetical "(GH)" / "(Hetzner
      # Overflow)" suffixes are workflow-internal). Closes the systemic gap
      # that let PR #2960 merge broken — bare `cargo check` only compiles
      # the root crate because `default-members = ["."]` is set in the
      # workspace root, so sibling regressions like `fluxion-behavior`'s
      # `rand 0.8 -> 0.9` breakage slipped through. `build-release`
      # (also in this file) was updated to add `cargo build --release
      # --workspace` for the main-only release smoke.
      workflow: ".github/workflows/rust-tests.yml"
      issue: 2983
      closes_issue: 2960
      triggered_by: "PR + push to main"

    - job: "Absolute Perf Gate (Issue #2693)"
      # PR-blocking ABSOLUTE performance floor (throughput ≥ 150 cfg/s,
      # latency ≤ 10 ms). Distinct from the RELATIVE `Fluxion Performance
      # Gate (#1618)` which only checks 5% regression with no floor.
      workflow: ".github/workflows/performance_dashboard.yml"
      issue: 2693
      triggered_by: "PR + push to main + workflow_dispatch"

    - job: "Multi-Zone Perf Gate (Issue #2772)"
      # PR-blocking ABSOLUTE multi-zone floor (≥ 10 cfg/s on a 10-zone
      # model, pop_1000, analytical mode). The #2693 Absolute Perf Gate
      # measures the SINGLE-ZONE analytical path against 150 cfg/s — a
      # much easier target than the 10 cfg/s multi-zone floor
      # (`benchmark.multi_zone.min_configs_per_sec`). Before #2772 the
      # slowest regime (pop_1000 / pop_10k) was only gated by manual
      # `cargo bench`; a per-zone-cost regression could pass #2693 and
      # blow the multi-zone margin (only 2.8× per
      # `benches/multi_zone_throughput.rs:17`). Same runner / noise-
      # suppression discipline as #2693 (ubuntu-latest, median-of-3).
      workflow: ".github/workflows/performance_dashboard.yml"
      issue: 2772
      triggered_by: "PR + push to main + workflow_dispatch"

    - job: "Multi-Zone Cold Start Gate (Issue #2919)"
      # PR-blocking cold-start latency floor for the ONNX surrogate
      # (`benchmark.cold_start.{max_ms: 100, max_cold_warm_ratio: 1.5,
      # regression_tolerance: 0.25}`). The #2693 Absolute Perf Gate,
      # #2772 Multi-Zone Perf Gate, and #2922 Hybrid Perf Gate all
      # measure warm steady-state paths on `BatchOracle::evaluate_
      # population` / `HybridThermalModel` — none exercise the FIRST
      # `predict_loads_onnx` call against a freshly constructed
      # `SurrogateManager`. Before #2919 a regression that added 400 ms
      # to first-call cost passed CI invisibly. The job runs
      # `tests/surrogate_cold_start_test.rs` x3 (release build,
      # `--features ort`), takes the median, and feeds the result to
      # `release_gate_checker.py --benchmark-gates cold_start`. Runner
      # / noise-suppression discipline mirrors #2693 / #2772 /
      # #2922 (ubuntu-latest, median-of-3, default cache shared-key).
      workflow: ".github/workflows/performance_dashboard.yml"
      issue: 2919
      triggered_by: "PR + push to main + workflow_dispatch"

    - job: "Hybrid Perf Gate (Issue #2922)"
      # PR-blocking ABSOLUTE HybridThermalModel floor (≥ 80 cfg/s single-
      # zone, pop_100; ≥ 8 cfg/s 10-zone, pop_1000; `HybridRouting::default()`).
      # The #2693 Absolute Perf Gate and #2772 Multi-Zone Perf Gate both
      # measure the pure-physics path (`ThermalModel<VectorField>` /
      # `BatchOracle::evaluate_population`); neither exercises
      # HybridThermalModel with `HybridRouting::default()` (the production-
      # recommended default routing). Same runner / noise-suppression
      # discipline as #2693 (ubuntu-latest, median-of-3).
      workflow: ".github/workflows/performance_dashboard.yml"
      issue: 2922
      triggered_by: "PR + push to main + workflow_dispatch"

    - job: "MSRV Check (Issue #2934)"
      # Minimum Supported Rust Version gate. Runs `cargo +1.81 build
      # --workspace --locked` on every PR + push to develop/main that
      # touches any `**/Cargo.toml`, `**/Cargo.lock`, or the workflow
      # itself; fails the merge when the build breaks against the pinned
      # stable. The `package.rust-version = "1.81"` declaration (root
      # Cargo.toml + 10 workspace members) is what `cargo install` /
      # crates.io / `cargo update --precise` users see — this job is the
      # enforcement side, closing the #1 release-readiness gap that #2934
      # identified.
      workflow: ".github/workflows/msrv.yml"
      issue: 2934
      triggered_by: "PR + push to develop/main"

    - job: "Crate Size Gate (Issue #2930)"
      # PR-blocking crate-size gate (Goal #10: <10 MB published). Runs
      # `cargo package --allow-dirty --no-verify` against the root crate
      # and measures `target/package/fluxion-*.crate`; fails the build when
      # the artifact exceeds `crate_size.max_mb: 10` (10 MiB =
      # 10_485_760 bytes). Triggers on PR + push to develop + push to main
      # for paths that could affect the packaged artifact (Cargo.toml,
      # .cargoignore, the workflow itself, the gate-checker, and the
      # release-gates config). Closes the long-standing gap where Goal #10
      # was enforced only by declarative discipline (Cargo.toml `exclude`
      # block + `.cargoignore`) with no CI-side measurement, so any
      # regression slipped through silently.
      workflow: ".github/workflows/crate-size.yml"
      issue: 2930
      triggered_by: "PR + push to develop/main"

    - job: "Audit Ignore Freshness (Issue #2912)"
      # Audit-ignore freshness gate. Parses `.cargo/audit.toml`, extracts
      # each advisory ignore entry's `>>> REMOVE` block, and surfaces
      # when at least one documented removal condition is met. The job
      # runs `scripts/check_audit_ignores_fresh.py` and exits non-zero
      # (fails the PR) when any `>>> REMOVE` block's verification
      # condition is satisfied. Companion to the `Cargo Deny` and
      # `Cargo Audit` jobs in the same workflow; this gate enforces the
      # *freshness* of the ignore list rather than the correctness of
      # the active advisories. Triggers on PR + push to develop/main
      # for paths that touch the audit config, the lock file, or the
      # gate script.
      workflow: ".github/workflows/security.yml"
      issue: 2912
      triggered_by: "PR + push to develop/main"

    - job: "WASM Build Verification (Issue #2914)"
      # Cross-platform WASM build verification matrix for `fluxion-wasm`.
      # Companion to the `Crate Size Gate (Issue #2930)` above — that
      # gate measures the root crate's `cargo package` artifact; this
      # gate measures the WASM artifact (`pkg/fluxion_wasm_bg.wasm`)
      # produced by `wasm-pack build --release --target web`. Two jobs:
      #   1. `wasm-build` (matrix: ubuntu/macos/windows) — installs
      #      wasm-pack, runs the release build, asserts the .wasm size
      #      ≤ 10 MiB, computes a wasm-bindgen interface hash over the
      #      generated `*.d.ts` files + `package.json`, uploads pkg/ as
      #      a per-OS artifact.
      #   2. `interface-stability` — depends on all three matrix rows,
      #      re-hashes the three artifacts, and asserts the three
      #      interface hashes are byte-identical. A mismatch means a
      #      platform-specific build flag / env var leaked into the JS
      #      surface — a silent consumer-facing regression that would
      #      otherwise only show up at npm-publish time.
      # Triggers on PR + push to develop/main for paths that could
      # affect the WASM output (fluxion-wasm/**, its fluxion-fluid /
      # fluxion-core transitive deps, any Cargo.toml/Cargo.lock in the
      # workspace, the workflow file itself, and release_gates.yaml).
      # Closes the gap where WASM artifact quality was implicit (build
      # once, ship everywhere). Not added to `required_checks` above —
      # the size assertion mirrors #2930 (PR-blocking) but the cross-
      # platform interface-stability check is a regression guard that
      # maintainers can opt into branch protection separately.
      workflow: ".github/workflows/wasm-build.yml"
      issue: 2914
      triggered_by: "PR + push to develop/main"
