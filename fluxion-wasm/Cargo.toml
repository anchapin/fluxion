[package]
name = "fluxion-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "WebAssembly bindings for fluxion-core and fluxion-fluid"
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[dependencies]
wasm-bindgen = "0.2"
serde.workspace = true
serde_json = "1.0"
serde_yaml = "0.9"

fluxion-fluid = { path = "../fluxion-fluid" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fluxion-core = { path = "../fluxion-core" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
