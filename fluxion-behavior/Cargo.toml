[package]
name = "fluxion-behavior"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Behavioral and thermal comfort models for fluxion — Fanger PMV/PPD, adaptive comfort, and occupant triggers"
license = "Apache-2.0"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
repository = "https://github.com/anchapin/fluxion"

[dependencies]
# ONNX Runtime bindings. RC pin (issue #2691) — see root Cargo.toml for rationale;
# opt-in here so the release-candidate is not pulled into every consumer.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
thiserror.workspace = true
anyhow = "1.0"
tracing.workspace = true
serde.workspace = true
ndarray = { workspace = true, default-features = false, features = ["std", "serde"] }
uom = { version = "0.38", features = ["serde"] }
statrs = "0.19"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
fluxion-toon = { path = "../crates/fluxion-toon" }

[features]
# `ort` (ONNX Runtime RC) is OPT-IN (issue #2691) so the release-candidate is not
# pulled into every consumer. Enable with --features ort.
default = []
ort = ["dep:ort"]
# CI matrix passthrough features (Issue #2909). The root crate's `rust-tests.yml`
# workflow runs `cargo test -p fluxion-behavior --features wiring-tracing,multi-zone`
# to keep the test invocation matrix-uniform; fluxion-behavior does not gate code
# behind these flags, so they are accepted as no-ops here.
wiring-tracing = []
multi-zone = []

[dev-dependencies]
criterion = "0.8"
serial_test = "4"
