<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bem-engineer — Iteration 1 Review</title>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e1e4ed; --muted: #8b8fa3; --accent: #6c8aff; --green: #4ade80; --red: #f87171; --yellow: #fbbf24; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab { padding: 10px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted); font-weight: 500; }
  .tab.active { background: var(--surface); color: var(--accent); border-bottom-color: var(--surface); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .eval-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .eval-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .eval-name { font-weight: 600; font-size: 16px; }
  .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-pass { background: rgba(74, 222, 128, 0.15); color: var(--green); }
  .config-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .config-section:last-child { border-bottom: none; }
  .config-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
  .prompt-box { background: rgba(108, 138, 255, 0.08); border: 1px solid rgba(108, 138, 255, 0.2); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; font-size: 14px; }
  .files-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .file-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .file-header { padding: 8px 12px; background: rgba(108, 138, 255, 0.08); font-family: monospace; font-size: 13px; font-weight: 600; }
  .file-content { padding: 12px; max-height: 500px; overflow-y: auto; }
  .file-content pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.5; color: var(--muted); }
  .assertion-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .assertion-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  .assertion-pass .assertion-icon { background: rgba(74, 222, 128, 0.2); color: var(--green); }
  .assertion-fail .assertion-icon { background: rgba(248, 113, 113, 0.2); color: var(--red); }
  .evidence { color: var(--muted); font-size: 12px; margin-left: 26px; }
  .feedback-box { width: 100%; min-height: 80px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-family: inherit; font-size: 14px; resize: vertical; }
  .feedback-box:focus { outline: none; border-color: var(--accent); }
  .nav-buttons { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 14px; }
  .btn:hover { background: rgba(108, 138, 255, 0.1); border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #5a7aee; }
  .bench-table { width: 100%; border-collapse: collapse; }
  .bench-table th, .bench-table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  .bench-table th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .bench-table td { font-variant-numeric: tabular-nums; }
  .note-box { background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 8px; padding: 12px 16px; margin-top: 16px; }
  .note-box h3 { color: var(--yellow); font-size: 14px; margin-bottom: 8px; }
  .note-box ul { padding-left: 20px; font-size: 13px; color: var(--muted); }
  .note-box li { margin-bottom: 6px; }
  #export-btn { position: fixed; bottom: 24px; right: 24px; z-index: 100; }
</style>
</head>
<body>
<div class="container">
  <h1>bem-engineer — Iteration 1</h1>
  <p class="subtitle">3 test cases × 2 configurations (with_skill, without_skill) — 19 assertions each</p>

  <div class="tabs">
    <div class="tab active" onclick="showTab('outputs')">Outputs</div>
    <div class="tab" onclick="showTab('benchmark')">Benchmark</div>
  </div>

  <div id="tab-outputs" class="tab-panel active">
    <div id="eval-container"></div>
    <div class="nav-buttons">
      <button class="btn" id="prev-btn" onclick="navigate(-1)">← Previous</button>
      <span id="eval-counter" style="color: var(--muted); font-size: 14px;">1 / 3</span>
      <button class="btn" id="next-btn" onclick="navigate(1)">Next →</button>
    </div>
  </div>

  <div id="tab-benchmark" class="tab-panel">
    <div id="benchmark-content"></div>
  </div>
</div>

<button class="btn btn-primary" id="export-btn" onclick="exportFeedback()">Submit All Reviews</button>

<script>
const evals = [
  {
    name: "psychrometric-rust",
    prompt: "Calculate the enthalpy, dew point, and specific volume of air at 25°C dry-bulb, 50% RH, at sea level. Then write a Rust function that takes (T_db, RH, P) and returns a struct with all derived psychrometric properties. Include unit tests that validate against the known values you just computed.",
    with_skill: {
      assertions: [
        {text: "enthalpy_value_correct", passed: true, evidence: "h = 50.3233 kJ/kg_da"},
        {text: "dewpoint_value_correct", passed: true, evidence: "T_dp = 13.8640 °C"},
        {text: "specific_volume_correct", passed: true, evidence: "v = 0.858088 m³/kg_da"},
        {text: "rust_struct_provided", passed: true, evidence: "PsychrometricResult struct with 11 fields"},
        {text: "unit_tests_present", passed: true, evidence: "13 #[test] functions"},
        {text: "physics_constraints", passed: true, evidence: "dew_point < t_dry, wet_bulb bounds, mass balance"},
        {text: "ashrae_citation", passed: true, evidence: "ASHRAE HoF Ch.1, Hyland-Wexler"}
      ],
      highlights: "Used bisection for wet-bulb solver (guaranteed convergence). 11-field struct. 13 tests with physical constraint checks. ASHRAE HoF Chapter 1 explicitly cited.",
      output_path: "bem-engineer-workspace/iteration-1/psychrometric-rust/with_skill/outputs/"
    },
    without_skill: {
      assertions: [
        {text: "enthalpy_value_correct", passed: true, evidence: "h = 50.32 kJ/kg_dry_air"},
        {text: "dewpoint_value_correct", passed: true, evidence: "T_dp = 13.89°C"},
        {text: "specific_volume_correct", passed: true, evidence: "v = 0.8582 m³/kg_dry_air"},
        {text: "rust_struct_provided", passed: true, evidence: "PsychrometricState with 11 fields"},
        {text: "unit_tests_present", passed: true, evidence: "13 #[test] functions"},
        {text: "physics_constraints", passed: true, evidence: "Saturated/dry air boundary tests"},
        {text: "ashrae_citation", passed: true, evidence: "ASHRAE fundamental equation with coefficients"}
      ],
      highlights: "15 tests including degree of saturation and dew-point roundtrip. ASHRAE coefficients present but less explicit citation structure.",
      output_path: "bem-engineer-workspace/iteration-1/psychrometric-rust/without_skill/outputs/"
    }
  },
  {
    name: "ashrae-62-1-vrp",
    prompt: "I need the minimum outdoor air rate for a 3,000 sq ft conference room with a default occupant density per ASHRAE 62.1-2022. Give me the table citation, the VRP math, and a Python function that computes V_oz for any zone given area, population, and zone category.",
    with_skill: {
      assertions: [
        {text: "table_citation_present", passed: true, evidence: "Table 6.2.2.1 cited"},
        {text: "vrp_formula_shown", passed: true, evidence: "V_bz = Rp × Pz + Ra × Az, Eq. 6.2.3-1"},
        {text: "conference_room_result", passed: true, evidence: "930 cfm"},
        {text: "python_function_generalized", passed: true, evidence: "14 zone categories"},
        {text: "ez_accounted_for", passed: true, evidence: "v_oz() with ez param, Table 6.2.2.2"},
        {text: "default_density_correct", passed: true, evidence: "50 per 1000 sq ft"}
      ],
      highlights: "14 occupancy categories in lookup table. Ez parameterized with Table 6.2.2.2 cross-reference. Full VRP chain: compute_zone_ventilation() → v_bz() → v_oz().",
      output_path: "bem-engineer-workspace/iteration-1/ashrae-62-1-vrp/with_skill/outputs/"
    },
    without_skill: {
      assertions: [
        {text: "table_citation_present", passed: true, evidence: "Table 6.4 cited"},
        {text: "vrp_formula_shown", passed: true, evidence: "Vbz = Rp × Pz + Ra × Az, Eq. 6.4-1"},
        {text: "conference_room_result", passed: true, evidence: "930 cfm"},
        {text: "python_function_generalized", passed: true, evidence: "8 categories"},
        {text: "ez_accounted_for", passed: true, evidence: "EZ_VALUES dict from Table 6.3"},
        {text: "default_density_correct", passed: true, evidence: "50 per 1000 sq ft"}
      ],
      highlights: "8 categories (fewer). Different table numbering (6.3/6.4 vs 6.2.2.x). EZ_VALUES dict with explicit supply/return configurations. Same 930 cfm result.",
      output_path: "bem-engineer-workspace/iteration-1/ashrae-62-1-vrp/without_skill/outputs/"
    }
  },
  {
    name: "openstudio-vav-measure",
    prompt: "Write an OpenStudio measure that replaces all constant-volume terminal boxes in a model with VAV terminals, applying a minimum airflow fraction of 0.3. Then write a Python script that parses the EnergyPlus SQL output and compares zone airflow rates before and after the measure to confirm the VAV boxes are operating correctly.",
    with_skill: {
      assertions: [
        {text: "ruby_measure_complete", passed: true, evidence: "Full ModelMeasure pattern"},
        {text: "cv_to_vav_conversion", passed: true, evidence: "getAirTerminalSingleDuctUncontrolleds → VAVReheat"},
        {text: "min_airflow_fraction", passed: true, evidence: "Configurable, default 0.3"},
        {text: "python_sql_parser", passed: true, evidence: "ZoneSizes, ComponentSizes, TabularDataWithStrings"},
        {text: "before_after_comparison", passed: true, evidence: "Merged DataFrames with pct_change"},
        {text: "error_handling_ruby", passed: true, evidence: "Full register* suite"}
      ],
      highlights: "Handled Uncontrolled terminals → VAVReheat with electric coil creation. Rich runner logging. SQL parser queries 3 table types with compliance check. ASHRAE 90.1 §6.4.3 cited for minimum fraction rationale.",
      output_path: "bem-engineer-workspace/iteration-1/openstudio-vav-measure/with_skill/outputs/"
    },
    without_skill: {
      assertions: [
        {text: "ruby_measure_complete", passed: true, evidence: "Full ModelMeasure pattern"},
        {text: "cv_to_vav_conversion", passed: true, evidence: "Both NoReheat and Reheat CV variants → VAV equivalents"},
        {text: "min_airflow_fraction", passed: true, evidence: "Configurable, default 0.3, validated range"},
        {text: "python_sql_parser", passed: true, evidence: "TabularData and ReportVariableData"},
        {text: "before_after_comparison", passed: true, evidence: "Per-zone with VAV verdict column"},
        {text: "error_handling_ruby", passed: true, evidence: "registerError, Info, NotApplicable, Final"}
      ],
      highlights: "Actually MORE comprehensive CV coverage — handled both ConstantVolume:NoReheat and ConstantVolume:Reheat. VAV verdict column in output. ReportVariableData time-series analysis for min airflow verification.",
      output_path: "bem-engineer-workspace/iteration-1/openstudio-vav-measure/without_skill/outputs/"
    }
  }
];

const analystNotes = [
  "All 19/19 assertions pass for both configurations. Quantitative benchmark shows no differentiation.",
  "Qualitative differences are where the skill adds value:",
  "1. PSYCHROMETRIC: Skill version uses bisection (guaranteed convergence) vs fixed-point iteration. Both correct, skill more robust numerically.",
  "2. ASHRAE 62.1: Skill has 14 vs 8 zone categories. Better table cross-referencing (6.2.2.2 for Ez).",
  "3. OPENSTUDIO: Without-skill actually handled more CV terminal types. With-skill cited ASHRAE 90.1 rationale. Both solid.",
  "The skill's main value is consistency, richer domain context, and more robust numerical methods — not raw correctness on straightforward tasks."
];

let currentEval = 0;
const feedback = {};

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${tab === 'outputs' ? 1 : 2})`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function renderEval(idx) {
  const ev = evals[idx];
  const container = document.getElementById('eval-container');
  const passedW = ev.with_skill.assertions.filter(a => a.passed).length;
  const passedWo = ev.without_skill.assertions.filter(a => a.passed).length;
  const totalW = ev.with_skill.assertions.length;
  const totalWo = ev.without_skill.assertions.length;

  container.innerHTML = `
    <div class="eval-card">
      <div class="eval-header">
        <span class="eval-name">${ev.name}</span>
        <span class="badge badge-pass">with_skill: ${passedW}/${totalW} | without_skill: ${passedWo}/${totalWo}</span>
      </div>
      <div class="config-section">
        <div class="config-label">Prompt</div>
        <div class="prompt-box">${ev.prompt}</div>
      </div>
      <div class="config-section">
        <div class="config-label">With Skill — Highlights</div>
        <p style="font-size:13px; color:var(--muted);">${ev.with_skill.highlights}</p>
        <div style="margin-top:8px;">${ev.with_skill.assertions.map(a => `
          <div class="assertion-row assertion-${a.passed ? 'pass' : 'fail'}">
            <div class="assertion-icon">${a.passed ? '✓' : '✗'}</div>
            <span>${a.text}</span>
          </div>
          <div class="evidence">${a.evidence}</div>
        `).join('')}</div>
        <p style="margin-top:8px; font-size:12px; color:var(--muted);">📂 ${ev.with_skill.output_path}</p>
      </div>
      <div class="config-section">
        <div class="config-label">Without Skill (Baseline) — Highlights</div>
        <p style="font-size:13px; color:var(--muted);">${ev.without_skill.highlights}</p>
        <div style="margin-top:8px;">${ev.without_skill.assertions.map(a => `
          <div class="assertion-row assertion-${a.passed ? 'pass' : 'fail'}">
            <div class="assertion-icon">${a.passed ? '✓' : '✗'}</div>
            <span>${a.text}</span>
          </div>
          <div class="evidence">${a.evidence}</div>
        `).join('')}</div>
        <p style="margin-top:8px; font-size:12px; color:var(--muted);">📂 ${ev.without_skill.output_path}</p>
      </div>
      <div class="config-section">
        <div class="config-label">Your Feedback</div>
        <textarea class="feedback-box" id="feedback-${idx}" placeholder="What looks good? What needs improvement?">${feedback[idx] || ''}</textarea>
      </div>
    </div>
  `;
  document.getElementById('eval-counter').textContent = `${idx + 1} / ${evals.length}`;
  document.getElementById('feedback-' + idx).addEventListener('input', (e) => { feedback[idx] = e.target.value; });
}

function navigate(dir) {
  const newIdx = currentEval + dir;
  if (newIdx >= 0 && newIdx < evals.length) {
    currentEval = newIdx;
    renderEval(currentEval);
  }
}

function renderBenchmark() {
  const bc = document.getElementById('benchmark-content');
  bc.innerHTML = `
    <div class="eval-card">
      <div class="eval-header"><span class="eval-name">Quantitative Summary</span></div>
      <div class="config-section">
        <table class="bench-table">
          <thead><tr><th>Eval</th><th>Config</th><th>Pass Rate</th><th>Passed / Total</th></tr></thead>
          <tbody>
            ${evals.map(ev => `
              <tr><td rowspan="2" style="vertical-align:middle; font-weight:600;">${ev.name}</td>
                <td>with_skill</td><td style="color:var(--green);">100%</td><td>${ev.with_skill.assertions.filter(a=>a.passed).length} / ${ev.with_skill.assertions.length}</td></tr>
              <tr><td>without_skill</td><td style="color:var(--green);">100%</td><td>${ev.without_skill.assertions.filter(a=>a.passed).length} / ${ev.without_skill.assertions.length}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="note-box">
      <h3>⚠️ Analyst Notes</h3>
      <ul>${analystNotes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `;
}

function exportFeedback() {
  const textarea = document.getElementById('feedback-' + currentEval);
  if (textarea) feedback[currentEval] = textarea.value;
  const reviews = Object.entries(feedback).map(([idx, fb]) => ({
    run_id: evals[idx].name + '-with_skill',
    feedback: fb,
    timestamp: new Date().toISOString()
  }));
  const data = { reviews, status: 'complete' };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'feedback.json'; a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

renderEval(0);
renderBenchmark();
</script>
</body>
</html>
