[package]
name = "fluxion-toon"
version = "0.1.0"
edition = "2021"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]
description = "Token-Oriented Object Notation (TOON) — a compact, tabular serialization format for LLM-optimized MCP tool responses."
repository = "https://github.com/anchapin/fluxion"
license = "Apache-2.0"

[lib]
name = "fluxion_toon"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parsing
winnow = "0.6"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
proptest = "1.5"
