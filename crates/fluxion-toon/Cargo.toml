[package]
name = "fluxion-toon"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Token-Oriented Object Notation (TOON) serializer/deserializer for compact LLM-friendly serialization"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]

[dependencies]
serde.workspace = true
serde_json = "1.0"
thiserror.workspace = true
winnow = "0.7"

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
std = []