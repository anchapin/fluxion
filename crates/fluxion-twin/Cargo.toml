[package]
name = "fluxion-twin"
version = "0.1.0"
edition = "2021"
description = "Digital twin core — Unscented Kalman Filter for non-linear state estimation in thermal systems"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
nalgebra = { version = "0.33", features = ["serde"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
approx = "0.5"
rand = "0.8"
rand_distr = "0.4"
