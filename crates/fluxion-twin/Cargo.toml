[package]
name = "fluxion-twin"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Digital twin core — Unscented Kalman Filter for non-linear state estimation in thermal systems"
license = "Apache-2.0"
repository = "https://github.com/anchapin/fluxion"
authors = ["Dr. Aris Thorne <aris.thorne@fluxion.org>"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1.0"
nalgebra = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
rumqttc = "0.25"
# rustls is used directly to build a permissive verifier for the opt-in
# FLUXION_MQTT_INSECURE self-signed-cert escape hatch. Provider + std come via
# feature unification with rumqttc's default `use-rustls` feature; we enable
# `aws-lc-rs` explicitly so this crate is self-contained.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "aws-lc-rs"] }
bytes = "1.0"
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
# Structured logging / observability (Issue #2519). `tracing` provides spans
# and `#[instrument]`; `metrics` provides counters/histograms/gauges. Versions
# match the main `fluxion` crate (root Cargo.toml) so the workspace shares one
# major version of each. (`log` is no longer a direct dependency — all
# fluxion-twin logging goes through `tracing`. rumqttc still pulls `log`
# transitively for its own internals.)
tracing.workspace = true
metrics.workspace = true

[dev-dependencies]
approx = "0.5"
rand = "0.9"
rand_distr = "0.5"
mockito = "1.7"
# `DebuggingRecorder` + `metrics::with_local_recorder` lets tests assert on
# emitted observations without polluting the process-global Prometheus
# recorder (same pattern as the main crate, Issue #2498).
metrics-util = "0.20"
